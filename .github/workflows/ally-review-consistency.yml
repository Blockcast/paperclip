name: Ally Review Consistency Guard

# Asserts three things about every open PR: that it carries at most one
# operative Ally review at its current head — except for the exact current-head
# App/User approval pair required by protected merge, which must carry two
# *distinct* bodies, since one body under both credentials is a single verdict
# posted twice (BLO-22916); that no standing APPROVED masks a Critical/Important
# finding; and that a review's body-attested head matches the commit GitHub
# recorded it against.
# See scripts/check-ally-review-consistency.mjs and BLO-19778 for the incident
# this guards.
#
# Findings are ratcheted: every open PR is still audited and every violation is
# still printed, but the run fails only on violations absent from
# scripts/ally-review-consistency-baseline.json. Without that, one abandoned PR
# holding a duplicate review pins the run red forever and a new violation moves
# it from red to red — an auditor whose output is a constant carries no more
# information than no auditor. A baseline entry is keyed on the head SHA and
# review IDs, so it expires as soon as the PR is pushed to. See PEN-2847.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/name to audit"
        required: false
        default: "Blockcast/paperclip"

permissions:
  contents: read
  pull-requests: read

jobs:
  one-verdict-per-head:
    runs-on: default
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Assert the allowed operative Ally review shape per PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLY_REVIEW_REPO: ${{ inputs.repo || 'Blockcast/paperclip' }}
        run: node scripts/check-ally-review-consistency.mjs
