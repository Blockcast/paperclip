name: Ally Review Consistency Guard

# Asserts four things about every open PR: that it carries at most one
# operative Ally review per lane at its current head; that no operative review
# is submitted from the User seat at all, which R4 (BLO-24056) retired because
# the seat shares a login with the authoring App and so cannot be an independent
# verdict; that no standing APPROVED masks a Critical/Important finding, omits
# its `Reviewed head:` attestation, or lets a seat approval stand over a
# blocking App review; and that a review's body-attested head matches the commit
# GitHub recorded it against, unless a later App review has since attested that
# head (a push re-anchors an approval onto a head it never read; once Ally
# reviews the new head, the re-anchored one is reported as a notice).
#
# The seat-lane and cross-credential arms of the first check, and the
# seat-approval-over-a-blocker arm of the third, can only fire where the seat
# prohibition already fires. They are retained for the detail they add to a seat
# violation, not as independent policy.
#
# The seat prohibition subsumes BLO-22916, whose two defects were one verdict
# submitted under both credentials and five content-free seat approvals that
# attested no head at all. An earlier revision of this guard treated the
# App/User pair as the required protected-merge shape and asked only that the
# two bodies differ, which is why the second defect was invisible to it.
# See scripts/check-ally-review-consistency.mjs and BLO-19778 for the incident
# this guards.
#
# Findings are ratcheted: every open PR is still audited and every violation is
# still printed, but the run fails only on violations absent from
# scripts/ally-review-consistency-baseline.json. Without that, one abandoned PR
# holding a duplicate review pins the run red forever and a new violation moves
# it from red to red — an auditor whose output is a constant carries no more
# information than no auditor. A baseline entry is keyed on the head SHA and
# review IDs, so it expires as soon as the PR is pushed to. See PEN-2847.
#
# Findings are additionally scoped to PRs GitHub would still merge from. A
# finding on a draft or conflicting PR is printed as a warning and does not fail
# the run, because such a PR cannot reach master without first changing state —
# a transition this hourly run re-observes, at which point the finding fails
# again. An "untouched for N days" window applies ONLY where GitHub reported no
# usable merge state: staleness is not a state GitHub enforces anything
# against, so a clean month-old PR merges on a click with no transition and no
# run in between, and CLEAN/BEHIND/UNSTABLE therefore stay fatal at any age.
# See prDormancy() in the script for the three tiers and the measurement.
#
# Since PEN-5793 this run also carries a second, independent check: the
# unattested-head strand detector. Everything above audits the SHAPE of the
# reviews a head already has, so a head carrying ZERO reviews passes vacuously —
# the gap PR #3452 fell through when it sat unreviewed for 3h23m53s with this
# guard green throughout. The detector reports any non-draft open head that has
# been unattested for longer than the threshold (30 minutes by default; see
# parseStrandThresholdMinutes for the measured band behind that number), clocked
# from the head's check-suite created_at rather than its client-set committer
# date, and classifies each by K — how many other heads the reviewer attested in
# the same window — to separate a single-PR strand from a reviewer-wide stall.
#
# It REPORTS and does not fail the run. A strand is a latency condition that
# resolves itself, it carries no stable fingerprint, and it must not enter the
# baseline ratchet above. More to the point, the pr_review dispatch backlog this
# detector observes is currently saturated (PEN-5793 done-when #3: a floor of 2
# and a 72-hour high of 11 unresolved terminal failures as of 2026-11-12), so a
# failing detector would go red most hours and carry no more information than no
# detector — the same argument the ratchet paragraph above makes. Set
# ALLY_STRAND_FAIL=1 to promote it to a hard failure once that backlog is
# drained, which is the sequencing PEN-5793 itself records.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/name to audit"
        required: false
        default: "Blockcast/paperclip"

permissions:
  contents: read
  pull-requests: read
  # The strand detector clocks an unattested head from its check-suite
  # created_at. Without checks:read that read 403s and EVERY unattested head
  # reports `unclocked` — the detector stays loud but stops discriminating.
  checks: read

jobs:
  one-verdict-per-head:
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Assert the allowed operative Ally review shape per PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLY_REVIEW_REPO: ${{ inputs.repo || 'Blockcast/paperclip' }}
        run: node scripts/check-ally-review-consistency.mjs
