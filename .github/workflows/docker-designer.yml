name: Docker (designer)

# Builds + pushes the paperclip-designer image (vendored @pro-vi/designer
# that drives claude.ai/design). Does NOT auto-deploy — the cluster yaml
# that consumes this image pins a specific sha-tag and bumping it is a
# separate operator step.
#
# Trigger: any change under packages/services/designer/. Master and tags
# only; no PR builds (HARBOR_PASSWORD org secret isn't available to forks).
# Pre-build gate runs `npm run check` (tsc --noEmit) so a broken upstream
# sync fails CI before the Docker layer wastes runner time.
#
# Security: this workflow does NOT interpolate any untrusted event input
# (github.event.*, github.head_ref, etc.) into run: commands — only
# repository secrets via env. Same posture as docker-webflow-bot.yml.

on:
  push:
    branches:
      - "master"
    paths:
      - "packages/services/designer/**"
      - ".github/workflows/docker-designer.yml"
    tags:
      - "designer-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # npm ci + check + build, no Docker. BLO-46675: off org group 1 (arc-dind);
    # the general pool, not light, because a cold npm build can exceed 4 GiB.
    runs-on: arc-paperclip-general
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Use setup-node@v4 to match the sibling workflows (pr.yml, release.yml).
      # @v5 auto-detects the package manager from any lockfile it can find by
      # walking up the workspace tree; with this repo's `pnpm-lock.yaml` at the
      # root, it tries to invoke pnpm — which is not installed on the
      # self-hosted runners that don't pre-run `pnpm/action-setup`. The
      # designer subdir is npm-only, so we just stay on @v4 to skip the
      # auto-detect.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/services/designer/package-lock.json

      - name: Install dependencies
        working-directory: packages/services/designer
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: packages/services/designer
        run: npm run check

      - name: Build
        working-directory: packages/services/designer
        run: npm run build

  build-and-push:
    needs: test
    # A BuildKit client only, against the shared remote BuildKit (same as
    # docker.yml). BLO-46675: off org group 1 (arc-dind) so tag pushes
    # (refs/tags/designer-v*) keep a runner once group 1 is scoped to
    # master-pinned workflows (BLO-40782).
    # PEN-6677: group pinned so this cannot land on the tools-cluster twin,
    # which reaches a different BuildKit. Full rationale in docker.yml.
    runs-on:
      group: arc-paperclip-buildkit
      labels: arc-paperclip-buildkit
    timeout-minutes: 30
    concurrency:
      group: docker-designer-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Clean stale node_modules from runner workspace
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name node_modules -type l -exec rm -f {} + 2>/dev/null || true

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Same endpoint selection as docker-agent.yml: side images use ordinal 1
      # so they do not evict the main paperclip image's cache on ordinal 0.
      - name: Select BuildKit endpoint
        id: buildkit-endpoint
        env:
          PREFERRED_ORDINAL: "1"
        run: |
          set -euo pipefail
          if [[ ! "${PREFERRED_ORDINAL}" =~ ^[01]$ ]]; then
            echo "Invalid BuildKit ordinal: ${PREFERRED_ORDINAL}" >&2
            exit 1
          fi

          probe_buildkit() {
            local host="$1"
            local timeout_seconds="$2"
            timeout "${timeout_seconds}" nc -z -w "${timeout_seconds}" "${host}" 1234
          }

          preferred="buildkit-amd64-${PREFERRED_ORDINAL}.buildkit-amd64-headless.ci.svc.cluster.local"
          fallback="buildkit-amd64.ci.svc.cluster.local"
          host="${preferred}"
          if ! probe_buildkit "${preferred}" 5; then
            echo "::warning::Preferred BuildKit ${preferred} is unavailable; using the healthy service endpoint"
            host="${fallback}"
            probe_buildkit "${fallback}" 10
          fi
          echo "endpoint=tcp://${host}:1234" >> "$GITHUB_OUTPUT"
          echo "Using BuildKit endpoint tcp://${host}:1234"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit-endpoint.outputs.endpoint }}

      # Name the base by digest instead of letting the build date decide it
      # (PEN-5927). Fails the build when the base cannot be resolved — see
      # scripts/resolve-base-digest.sh for why that is the cheap failure.
      - name: Resolve base image digest
        id: base
        run: |
          set -euo pipefail
          resolved="$(scripts/resolve-base-digest.sh 'node:24-bookworm-slim')"
          echo "image=${resolved}" >> "$GITHUB_OUTPUT"
          echo "Base pinned to ${resolved}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            harbor.blockcast.net/paperclip-designer/designer
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        # PEN-6683. STRICTLY BELOW the job's `timeout-minutes: 30`, so an
        # overrun here concludes `failure` ON THE STEP instead of `cancelled`
        # on the job. That distinction is the whole point: this job's own
        # `cancel-in-progress: true` produces `cancelled` on every routine
        # supersede, so a ceiling kill recorded that way is indistinguishable
        # from one, and the alert arm below would have to guess.
        #
        # Sized off the SUCCESSFUL population, never the killed runs, because a
        # kill's elapsed time measures the CEILING and not the build. Measured
        # first-party against the Actions API on 2026-11-14 over all 19 runs
        # this workflow has ever had: 15 builds succeeded. Nine retain step
        # detail -- 11.33 min (#15), 7.62 (#20), 6.45 (#16), 2.63 (#24), 2.38
        # (#22), 2.03 (#21), 1.77 (#23), 1.72 (#25), 1.43 (#26) -- and six are
        # old enough that GitHub has aged their step array out, so their JOB
        # durations bound the step from above at 21.48 (#8), 14.98 (#6), 9.08
        # (#10), 6.52 (#5), 4.67 (#7) and 1.88 (#9).
        #
        # 21.48 is therefore an UPPER BOUND on the longest build that can have
        # completed here. The budget clears it anyway: that run SUCCEEDED, and
        # a budget that would have killed it is a budget that kills healthy
        # builds. 26 clears it by 21% and leaves 4 min under the ceiling.
        timeout-minutes: 26
        uses: docker/build-push-action@v7
        with:
          context: packages/services/designer
          file: packages/services/designer/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            BASE=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=harbor.blockcast.net/paperclip-designer/designer:buildcache-v1
            type=gha,scope=paperclip-designer
          cache-to: |
            ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=registry,ref=harbor.blockcast.net/paperclip-designer/designer:buildcache-v1,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true' || '' }}
            ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=gha,scope=paperclip-designer,mode=min,ignore-error=true' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}

  # PEN-6683. A `master` push that publishes no image must reach somebody.
  #
  # This is the last of the seven image lanes with no arm at all, and the
  # quietest -- which is the argument FOR covering it. Measured first-party on
  # 2026-11-14 over all 19 runs this workflow has ever had, `build-and-push`
  # has FAILED on a master push three times (#4 and #3 on 2026-07-09, #2 on
  # 2026-05-24) and not one reached anybody.
  #
  # Those were `failure` rather than `cancelled`, so this lane has not itself
  # exercised the PEN-6034 shape -- but its siblings have: webflow-bot #81 and
  # figma-bot #98 were both ceiling-killed on a master push on 2026-11-14,
  # recorded `cancelled`, and silent. This workflow carries the identical
  # `timeout-minutes: 30`, the identical `cancel-in-progress: true` and the
  # same runner group, so the arm fires on `failure` OR `cancelled`.
  #
  # Nothing else covers this lane, checked rather than assumed on 2026-11-14:
  # `master-health.yml` censuses runs filtered on
  # `.path == ".github/workflows/pr.yml"` and so cannot see a `docker-*` run;
  # `scheduled_workflow_last_verdict_failed` carries no `docker-*` series and
  # keys on the CRON verdict, so it cannot see a push build; and this workflow
  # has no outcome job of its own.
  alert-on-failure:
    needs: [build-and-push]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      (needs.build-and-push.result == 'failure' || needs.build-and-push.result == 'cancelled')
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    # actions: read + checks: read are what let the script tell a timeout kill
    # from a concurrency supersede and from a human cancel. All three report
    # `cancelled`; only the annotations separate them, and without these scopes
    # every cancellation classifies `unknown` and pages (fail-closed, but
    # uselessly noisy - and a noisy alert gets muted, which is the silence this
    # row exists to end).
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Report the unpublished image to Alertmanager
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: firing
          GH_REPO: ${{ github.repository }}
          # Collapsed to a single value for tags so the label set stays bounded:
          # the fingerprint hashes every label, and one identity per tag would
          # fragment the alert the bridge dedupes on (BLO-28616).
          BRANCH: ${{ github.ref_type == 'tag' && 'tags' || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/post-designer-image-alert.mjs

  # The other half of an honest alert: without it `endsAt` is the only thing
  # retiring the firing alert, so the lane goes quiet on a TIMER rather than on
  # a fix. Pushing the identical label set with a past `endsAt` makes
  # Alertmanager send `resolved`, which cancels the issue.
  #
  # It is also the continuous capability probe. This lane is sparse - 15
  # successful builds across the 19 runs it has ever had - so a channel that
  # rotted here would otherwise be discovered by the next outage.
  #
  # A separate job rather than a step inside build-and-push, deliberately: a
  # delivery failure here must not flip `build-and-push.result` to `failure`
  # and fire a spurious "the build is failing" alert about itself.
  resolve-on-success:
    needs: [build-and-push]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      needs.build-and-push.result == 'success'
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Resolve the image-delivery alert (and prove the channel still works)
        env:
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: resolved
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_type == 'tag' && 'tags' || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/post-designer-image-alert.mjs
