name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

# Always runs from base branch context — never executes PR or merge-queue
# code. pull_request_target gives access to secrets for untrusted fork PRs,
# so the "Checkout base branch" step below deliberately checks out `master`
# rather than the PR head, regardless of trigger. That same checkout also
# covers the merge_group case: this workflow never runs the diff itself (the
# steps below only call the GitHub API to *read* PR/file data, they don't
# execute anything the diff added), so the only thing "checking out the
# right commit" would buy is running this workflow's own scripts from the
# queue candidate instead of from master — which is exactly the thing this
# guards against, since the diff under review could itself be the one
# trying to weaken these scripts. All secret-bearing steps below always run
# the master copy.
#
# What DOES vary with `merge_group` is which commit these checks are *about*:
# the PR/dependency-review diff and the security-review check-run report
# against the queue's rebased candidate commit (github.event.merge_group.*),
# not the PR's original head, mirroring the PR_BASE_SHA/PR_HEAD_SHA pattern
# in pr.yml. See BLO-22300.

permissions:
  pull-requests: write
  security-events: write
  checks: write
  contents: read

env:
  # pull_request_target and merge_group carry the base/head commits under
  # different event fields; fall back the same way pr.yml does so every
  # step below can read one pair of names regardless of trigger.
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  review:
    runs-on: arc-light
    # ARC runners have no warm toolcache, so setup-node's download plus
    # Dependency Review can exceed a tight 5-min cap and cancel the job (the
    # cancelled job surfaces as a red `review` check). 10 min gives headroom
    # without letting a genuinely hung job drain a runner.
    timeout-minutes: 10
    env:
      # Blockcast does not provision the upstream commitperclip bot key. Skip
      # the bot steps (token + quality/security gates) when it is absent so
      # Dependency Review still gates every PR instead of the whole job
      # failing at token generation.
      COMMITPERCLIP_ENABLED: ${{ secrets.COMMITPERCLIP_KEY != '' }}
    steps:
      - name: Checkout base branch (never PR or queue-candidate code)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: master

      # merge_group events have no github.event.pull_request context, so the
      # PR number (needed by the scripts below to call the GitHub API) has to
      # be recovered from the queue entry's branch name, which GitHub always
      # formats as refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>.
      # Skipped entirely on pull_request_target runs, where the PR number is
      # already available directly from the event.
      - name: Resolve PR context for merge-queue runs
        id: pr_context
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_ref="${{ github.event.merge_group.head_ref }}"
          pr_number="${head_ref##*/pr-}"
          pr_number="${pr_number%-*}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse a PR number out of merge_group.head_ref: $head_ref"
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

          pr_json="$(gh api "repos/${{ github.repository }}/pulls/$pr_number")"
          echo "author=$(jq -r .user.login <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .head.ref <<<"$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ env.PR_BASE_SHA }}
          head-ref: ${{ env.PR_HEAD_SHA }}

      # Only the commitperclip bot steps below use Node. On Blockcast the bot
      # key is absent (COMMITPERCLIP_ENABLED=false), so setting up Node here
      # would download the toolcache purely to leave it unused — the main cost
      # that pushes this job past its cap. Gate it behind the same flag as its
      # consumers: upstream (key present) still installs Node, Blockcast skips.
      # Dependency Review runs as a JS action on the runner's own node20, so it
      # does not depend on this step.
      - name: Set up Node
        if: env.COMMITPERCLIP_ENABLED == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Generate commitperclip token
        id: token
        if: env.COMMITPERCLIP_ENABLED == 'true'
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
          COMMITPERCLIP_APP_ID: ${{ vars.COMMITPERCLIP_APP_ID }}

      - name: Run quality gates
        id: quality
        if: >-
          env.COMMITPERCLIP_ENABLED == 'true' &&
          (github.event.pull_request.user.login || steps.pr_context.outputs.author) != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr_context.outputs.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || steps.pr_context.outputs.author }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref || steps.pr_context.outputs.branch }}

      - name: Run security gates
        if: env.COMMITPERCLIP_ENABLED == 'true'
        run: node .github/scripts/check-pr-security.mjs
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr_context.outputs.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || steps.pr_context.outputs.author }}
          # The commit this check-run reports against. For pull_request_target
          # this is the PR head (same as pr.head.sha, which the script would
          # otherwise fetch itself). For merge_group it is the queue's rebased
          # candidate commit — the one that actually lands on master — so the
          # security-review check-run stops being scoped to a SHA that never
          # merges. See resolveTargetSha() in check-pr-security.mjs.
          PR_HEAD_SHA: ${{ env.PR_HEAD_SHA }}

      - name: Fail if quality gates failed
        if: >-
          (github.event.pull_request.user.login || steps.pr_context.outputs.author) != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
