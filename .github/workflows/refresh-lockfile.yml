name: Refresh Lockfile

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-master
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: default
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Resolve pnpm store cache
        id: pnpm-cache
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm-cache.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Populate pnpm store
        run: pnpm fetch --frozen-lockfile

      - name: Save populated pnpm store
        if: success() && steps.pnpm-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm-cache.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-lockfile"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml"
          git push --force origin "$BRANCH"

          # Only reuse an open PR from this repository owner, not a fork with the same branch name.
          pr_url="$(
            gh pr list --state open --head "$BRANCH" --json url,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"$REPO_OWNER\") | .url" |
            head -n 1
          )"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --head "$BRANCH" \
              --title "chore(lockfile): refresh pnpm-lock.yaml" \
              --body "Auto-generated lockfile refresh after dependencies changed on master. This PR only updates pnpm-lock.yaml.")"
            echo "Created new PR: $pr_url"
          else
            echo "PR already exists: $pr_url"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Merge lockfile PR
        if: steps.upsert-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The merge queue owns the eventual merge and rejects --delete-branch
          # because it is asynchronous. Keep the refresh branch: the next run
          # deliberately force-updates it before reusing its PR.
          gh pr merge --squash "${{ steps.upsert-pr.outputs.pr_url }}" \
            || gh pr merge --auto --squash "${{ steps.upsert-pr.outputs.pr_url }}"

      # BLO-24150: the direct squash above sometimes falls through to --auto,
      # which then waits on this PR's own required checks. If those checks'
      # *workflow runs* are sitting in `action_required` (observed 2026-07-21
      # and 2026-08-10, ~2.5h before a human happened to notice and click
      # "Approve and run"), --auto silently waits forever with no signal
      # anywhere that a human is needed — during which every frozen install
      # on master (PRs and merge-queue entries alike) keeps failing. Make
      # that stall loud instead of silent.
      - name: Alert if the merge stalled on an unapproved workflow run
        if: steps.upsert-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="${{ steps.upsert-pr.outputs.pr_url }}"
          state="$(gh pr view "$pr_url" --json state --jq .state)"
          if [ "$state" = "MERGED" ]; then
            echo "Lockfile PR merged cleanly, nothing to alert on."
            exit 0
          fi

          head_sha="$(gh pr view "$pr_url" --json headRefOid --jq .headRefOid)"
          action_required_count="$(
            gh api "repos/${{ github.repository }}/actions/runs?head_sha=$head_sha&per_page=50" \
              --jq '[.workflow_runs[] | select(.status == "action_required")] | length'
          )"

          if [ "${action_required_count:-0}" -gt 0 ]; then
            gh pr comment "$pr_url" --body "🚨 **Self-heal stalled on a human approval gate (BLO-24150).** \`$action_required_count\` workflow run(s) on this commit are sitting in \`action_required\` — CI cannot start until someone clicks *Approve and run* on this PR's checks (Actions tab → this PR → pending runs). Until then \`--auto\` merge will wait indefinitely while every \`pnpm install --frozen-lockfile\` job on \`master\`, every PR, and every merge-queue entry keeps failing with \`ERR_PNPM_LOCKFILE_CONFIG_MISMATCH\`-style install errors. See https://paperclip.blockcast.net/BLO/issues/BLO-24150 for the known mechanism and prior occurrences (2026-07-21, 2026-08-10)."
            echo "Posted stall alert: $action_required_count run(s) awaiting approval."
          else
            echo "PR not yet merged but no action_required runs found (state=$state) — likely still mid-flight, not stalled."
          fi
