name: review-gate-sweep

# Reconciler for BLO-22892, ported to this repo by BLO-28203.
#
# A reviewer wake fired by `pull_request.opened` is event-driven and can be
# silently declined or starved (busy agent, capacity gate, k8s dispatch hang)
# with no retry and no alert -- Ally "does not patrol the issue board", so a
# lost wake stays lost forever and the PR simply sits there, unreviewed and
# indistinguishable from one merely waiting its turn. This repo is the one
# that carried the ~13-PR loss set measured on BLO-22892 (2026-08-15/16), so
# it has demonstrated exposure, not theoretical exposure.
#
# This runs on a SCHEDULE, not an event, precisely so it does not depend on
# the same wake-delivery path it exists to backstop.
#
# PREDICATE_MODE=status-free is deliberate and is the decision recorded on
# BLO-28203. Unlike trafficcontrol and pim-multicast-gateway, this repo has
# NO `review/ally-complete` producer: measured 2026-08-20, **0 of 100** open
# PRs carried that status. A status-keyed sweep here would classify every PR
# as "not pending" and silently do nothing forever -- the very failure this
# reconciler exists to prevent, reintroduced one layer up. So the sweep keys
# on the load-bearing half instead: non-draft, open, and no Ally consolidated
# report at the exact head, for longer than STALL_THRESHOLD_SECONDS.
#
# Standing up the `review/ally-complete` gate here first was the considered
# alternative and was rejected: it would add a new commit status to a repo
# with a merge queue, changing merge behaviour for a reconciler that is meant
# to be observe-and-re-fire only -- a strictly larger blast radius for no gain
# in detection.
#
# AC4 (BLO-22892): the stranded condition must surface without a human
# noticing by hand. If a re-fire ALSO goes unserviced past
# ALARM_THRESHOLD_SECONDS, this job exits non-zero -- turning the schedule
# persistently red on this repo's Actions tab.

on:
  schedule:
    # Hourly, NOT every 30 minutes, and that is a rate-limit decision.
    #
    # In status-free mode each non-draft PR costs 3 requests (head commit +
    # comments page + reviews page). Measured 2026-08-21 on this repo: 147
    # open PRs, 119 non-draft and unlocked -> ~359 requests per run. At
    # `9,39` that is ~718/hour from this job alone, against `github.token`'s
    # documented 1,000/hour/repository budget shared with the 26 other
    # workflows here -- exhaustion would be the steady state, not an edge
    # case. Hourly halves it to ~359/hour and leaves real headroom.
    #
    # The cheap predicate-level cut (skipping PRs younger than the stall
    # threshold, which cannot be stranded) was measured too and saves only
    # 3 of those 359 calls on this repo -- almost every open PR here is
    # older than 90 minutes. It is kept because it is free and correct, but
    # cadence is the lever that actually moves the number.
    #
    # ALARM_THRESHOLD_SECONDS is raised to 5.5h in the script to absorb the
    # coarser polling granularity -- see the comment on that constant. Off
    # the hour to avoid clustering with every other cron in the org, and
    # offset from trafficcontrol (7,37) and pim-multicast-gateway (8,38) so
    # the repos' sweeps do not fire their re-requests at Ally at once.
    - cron: '9 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # write, not read: re-firing POSTs a native review request
  # (.../pulls/{n}/requested_reviewers), not just the marker comment.
  pull-requests: write
  statuses: read

# No `concurrency` block, deliberately -- BLO-31818. There used to be one
# (`group: review-gate-sweep`, `cancel-in-progress: false`), added to stop a
# backlog of sweeps piling up on top of each other. It could not deliver that:
# GitHub holds at most ONE pending run per concurrency group, so a group cannot
# serialise a backlog of N -- when a new run arrives and the slot is occupied it
# EVICTS the run sitting there. `cancel-in-progress: false` means "do not cancel
# a RUNNING job", not "never cancel". So the only thing the group could actually
# do for a starved backlog was discard it.
#
# That is not theoretical. Measured 2026-09-04 on this repo, with the `default`
# runner pool wedged from ~13:52Z (nothing on that label executed for 5h, while
# `arc-light`/`arc-paperclip-general` PR runs started instantly):
#
#   33877561971  13:20Z  success  -- last sweep that actually ran
#   33883204083  14:20Z  queued 5h22m, zero jobs AT MEASUREMENT -- held the slot,
#                        never evicted; a runner finally took it 19:43Z and it
#                        ran (and failed) at 19:45Z, so re-querying it today
#                        shows `jobs: 1`. The queue time and the non-eviction
#                        are the load-bearing halves and both still hold.
#   33888968885  15:21Z  cancelled, zero jobs   -- evicted at 16:22:56 by its successor
#   33894806243  16:22Z  cancelled, zero jobs   -- evicted at 17:17:57
#   33899818405  17:17Z  cancelled, zero jobs   -- evicted at 18:23:58
#
# The three CANCELLED rows are the evidence for eviction and they are stable --
# re-querying them still returns `cancelled` with `jobs: 0`.
# Each cancelled run's `updated_at` is exactly its successor's `created_at`, and
# each reports `jobs: []` -- evicted while pending, never a timeout and never a
# runner failure. This is worse than a late reconciler: the AC4 alarm (below)
# surfaces a stranded PR by exiting non-zero, and a job that never starts cannot
# exit non-zero, while `cancelled` is not `failure` -- so the Actions tab stays
# clean. The backstop and the alarm on the backstop shared a single point of
# failure.
#
# `cancel-in-progress: true` was the first candidate and is REJECTED: it does not
# stop runs being cancelled, it only changes WHICH run dies -- the newest evicts
# the oldest instead of the reverse. Cancelled-with-zero-jobs runs would still
# appear every hour, so it fails the census this fix is verified by. It is also
# actively worse under a dead pool, because runner allocation here is NOT FIFO by
# creation and each new run re-enters the queue from the back.
#
# With no group, runs accumulate instead of evicting -- exactly what the sibling
# guards on this label already do (`lockfile-drift-monitor`, `codeowners-guard`,
# `relay-ssl-multicert-guard`, `ally-review-consistency` carry no `concurrency`
# block and were merely late through the same window, never lost). The first run
# to get a runner reconciles from live API state and re-fires whatever it finds
# stalled, so a queued backlog costs latency, not correctness.
#
# RESIDUAL, stated rather than implied (BLO-31818 AC3): when capacity returns,
# every queued sweep runs. At 90 open PRs that is ~270 reads each against the
# 1,000/hour/repository `github.token` budget, so a long starvation window can
# exhaust it. That degrades LOUDLY -- the script detects rate-limit exhaustion
# explicitly and reports it, and writes stay capped by MAX_REFIRES_PER_RUN -- so
# it turns the tab red rather than going quiet, which is the failure direction
# this reconciler must never have.
#
# SECOND RESIDUAL, likewise stated rather than implied: two sweeps that execute
# CONCURRENTLY can both re-fire the same PR. The per-PR cooldown is derived from
# the marker comments already on the PR (`existing_marker_epochs`), i.e. from
# GitHub state rather than run-local state -- but that check was check-then-act:
# the comments were read during the scan and the write happened later with no
# re-read, so two runs interleaved inside that window both observed
# `since_last >= REFIRE_COOLDOWN_SECONDS` and both fired. It is worse than a
# duplicate comment: `request_review` deliberately DELETEs before it POSTs, to
# force a fresh `review_requested` event that a bare POST would no-op, so the
# interleaving also leaves a window with no pending request at all.
#
# Dropping the group is what newly exposed this -- it was the one thing the
# group did deliver correctly (mutual exclusion of RUNNING jobs), even though it
# could not serialise a queued backlog. Reachability is narrow: cadence is
# hourly, a healthy run takes ~2min, and REFIRE_COOLDOWN_SECONDS is 2h, so runs
# never overlap in normal operation -- it needs a starvation backlog released
# together, which is the scenario dropping the group creates by preserving the
# backlog instead of discarding it.
#
# NARROWED, NOT CLOSED, by BLO-31908: the script now re-reads the marker
# comments and re-applies the cooldown immediately before the write
# (sweep-stalled-ally-reviews.py, `refire_still_permitted`, called from
# `_consider_pr`), withholding BOTH writes -- the reviewer re-request and the
# marker comment -- if a marker landed in between. That shrinks the window from
# the whole scan (minutes, one request per open PR) to the gap between the
# re-read and the POST (~a second). It does NOT eliminate the race: there is no
# compare-and-set on the GitHub comment API, so a second run entering after the
# re-read and before the POST still fires. Do not read either the guard or the
# absent group as making overlapping writes safe.

jobs:
  sweep:
    name: Sweep stalled Ally reviews
    runs-on: default
    # WHAT THIS BOUND COVERS: a job that has STARTED and then hangs -- one
    # stalled socket cannot hold it to the Actions 6-hour ceiling. Matches the
    # sibling `ally-review-consistency.yml` (10m); slightly higher because this
    # sweep makes one request per open PR. The script also bounds each
    # individual request (REQUEST_TIMEOUT_SECONDS).
    #
    # WHAT IT DOES NOT COVER, and cannot: a run starved in `queued` before a
    # runner is ever assigned. `timeout-minutes` is a JOB-level bound and only
    # engages once the job starts, so a run with `jobs: []` is not bounded by it
    # at any value. Measured 2026-09-04 (BLO-31818): run 33883204083 sat queued
    # 5h22m -- 21x this 15-minute ceiling -- with `jobs: []` and this bound
    # never engaged. (It was eventually given a runner at 19:43Z and ran for
    # 2m16s, so a re-query now reports `jobs: 1`; the 5h22m of unbounded queue
    # time is the part that matters here.)
    # There is no workflow-level equivalent -- GitHub exposes no queue-time
    # bound -- so do not try to raise or lower this number to address a starved
    # queue. That failure mode is a runner-capacity problem, and the thing this
    # workflow does about it is refuse to lose runs to it (see the note on the
    # absent `concurrency` block above).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unit tests for the sweep's pure decision logic
        run: python3 -m unittest discover -s .github/scripts -p 'test_sweep_*.py' -v

      - name: Sweep and re-fire stalled review requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # See the header comment: this repo has no `review/ally-complete`
          # producer, so there is no pending status to key on.
          PREDICATE_MODE: status-free
          # Which logins' reviews count as an Ally signal for a head. Note
          # `claude[bot]` (id 209825114) is deliberately absent -- counting it
          # is the exact false negative that hid trafficcontrol#1448.
          ALLY_REVIEWER_LOGINS: allyblockcast[bot],app/allyblockcast,allyblockcast
          # The distinct User identity to request a formal review from when
          # re-firing (see sweep-stalled-ally-reviews.py's comment on this
          # constant for why the User, not the App, login is used here).
          ALLY_REQUEST_REVIEWER_LOGIN: allyblockcast
        run: python3 .github/scripts/sweep-stalled-ally-reviews.py
