name: Docker (mcp-external)

# Builds + pushes the Node @paperclipai/mcp-external image — the external MCP
# server that backs https://paperclip.blockcast.net/mcp (the `server` container
# of the paperclip-mcp deployment, behind the bun auth-proxy sidecar). Replaces
# the retired Python kkroo/paperclip-mcp fork (Workstream B cutover).
#
# Does NOT auto-deploy: onprem-k8s has no GitOps, so re-pinning the manifest
# (onprem-k8s paperclip/paperclip-mcp.yaml server image) to a fresh sha- tag is a
# separate manual step. Pushes to harbor.blockcast.net/library/* — the same
# project the live deployment already pulls from.
#
# Trigger: any change under packages/mcp-external/. Master + tags only; no PR
# builds (the HARBOR_PASSWORD org secret isn't available to forks, so a PR build
# would 401 on push). Mirrors docker-mcp-gateway.yml.
#
# BLO-54798: also weekly + on demand, so base-OS fixes (the Dockerfile runs
# apt-get upgrade) reach a fresh digest when the package itself is quiet. Those
# builds re-pull the base and skip the runtime-stage cache, else the upgrade
# layer is a cache hit and the digest carries the same CVEs. Re-pinning stays manual.

on:
  push:
    branches:
      - "master"
    paths:
      - "packages/mcp-external/**"
      - ".github/workflows/docker-mcp-external.yml"
    tags:
      - "mcp-external-v*"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    # A BuildKit client only, against the shared remote BuildKit (same as
    # docker.yml). BLO-46675: off org group 1 (arc-dind) so tag pushes
    # (refs/tags/mcp-external-v*) keep a runner once group 1 is scoped to
    # master-pinned workflows (BLO-40782).
    # PEN-6677: group pinned so this cannot land on the tools-cluster twin,
    # which reaches a different BuildKit. Full rationale in docker.yml.
    runs-on:
      group: arc-paperclip-buildkit
      labels: arc-paperclip-buildkit
    timeout-minutes: 15
    concurrency:
      group: docker-mcp-external-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Clean stale node_modules from runner workspace
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name node_modules -type l -exec rm -f {} + 2>/dev/null || true

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Same endpoint selection as docker-agent.yml: side images use ordinal 1
      # so they do not evict the main paperclip image's cache on ordinal 0.
      - name: Select BuildKit endpoint
        id: buildkit-endpoint
        env:
          PREFERRED_ORDINAL: "1"
        run: |
          set -euo pipefail
          if [[ ! "${PREFERRED_ORDINAL}" =~ ^[01]$ ]]; then
            echo "Invalid BuildKit ordinal: ${PREFERRED_ORDINAL}" >&2
            exit 1
          fi

          probe_buildkit() {
            local host="$1"
            local timeout_seconds="$2"
            timeout "${timeout_seconds}" nc -z -w "${timeout_seconds}" "${host}" 1234
          }

          preferred="buildkit-amd64-${PREFERRED_ORDINAL}.buildkit-amd64-headless.ci.svc.cluster.local"
          fallback="buildkit-amd64.ci.svc.cluster.local"
          host="${preferred}"
          if ! probe_buildkit "${preferred}" 5; then
            echo "::warning::Preferred BuildKit ${preferred} is unavailable; using the healthy service endpoint"
            host="${fallback}"
            probe_buildkit "${fallback}" 10
          fi
          echo "endpoint=tcp://${host}:1234" >> "$GITHUB_OUTPUT"
          echo "Using BuildKit endpoint tcp://${host}:1234"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit-endpoint.outputs.endpoint }}

      # Name the base by digest instead of letting the build date decide it
      # (PEN-5927). Fails the build when the base cannot be resolved — see
      # scripts/resolve-base-digest.sh for why that is the cheap failure.
      - name: Resolve base image digest
        id: base
        run: |
          set -euo pipefail
          resolved="$(scripts/resolve-base-digest.sh 'harbor.blockcast.net/paperclip/node:lts-trixie-slim')"
          echo "image=${resolved}" >> "$GITHUB_OUTPUT"
          echo "Base pinned to ${resolved}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            harbor.blockcast.net/library/paperclip-mcp-external
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
            # Rebuilds get their own tag: the manifest pins by sha- tag, so re-pushing one would redeploy silently.
            type=raw,value=rebuild-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name != 'push' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        # PEN-6676. STRICTLY BELOW the job's `timeout-minutes: 15`, so an
        # overrun here concludes `failure` ON THE STEP instead of `cancelled`
        # on the job. That distinction is the whole point: this job's own
        # `cancel-in-progress: true` produces `cancelled` on every routine
        # supersede, so a ceiling kill recorded that way is indistinguishable
        # from one, and the alert arm below would have to guess.
        #
        # Sized off the SUCCESSFUL population, never the killed runs. 9 builds
        # completed between 2026-06-21 and 2026-11-14: max 7.42 min (run #13),
        # median 3.95, most recent 4.88 (run #17). 12 min is ~62% above the
        # longest build that has ever finished.
        #
        # Deliberately NOT sized to clear the longest KILLED attempt, which is
        # the sibling gateway lane's rule. Run #18 emitted its last BuildKit
        # progress line at 14:53:43.78Z and nothing for the following 14m39s
        # before the ceiling cut it, so its demand is unbounded — no budget can
        # clear a hang, and bounding it loudly is the remedy.
        timeout-minutes: 12
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/mcp-external/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          pull: ${{ github.event_name != 'push' }}
          no-cache-filters: ${{ github.event_name != 'push' && 'runtime' || '' }}
          build-args: |
            BASE=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=harbor.blockcast.net/library/paperclip-mcp-external:buildcache-v1
            type=gha,scope=paperclip-mcp-external
          cache-to: |
            ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'type=registry,ref=harbor.blockcast.net/library/paperclip-mcp-external:buildcache-v1,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true' || '' }}
            ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'type=gha,scope=paperclip-mcp-external,mode=min,ignore-error=true' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}

  # PEN-6676. A `master` push that publishes no image must reach somebody.
  #
  # On 2026-11-14 run #18 hit the job ceiling after 14m39s with no BuildKit
  # progress, published nothing, and notified nobody. Nothing covers this lane:
  # measured that day, `scheduled_workflow_last_verdict_failed` carries 20
  # series for this repo and NONE for any `docker-*` workflow, and its alert
  # keys on the CRON verdict so it cannot see a push build at all. All 13
  # BuildKit rules were `inactive` throughout.
  #
  # Same shape as docker-mcp-gateway.yml and docker-agent.yml: a separate job,
  # firing on `failure` OR `cancelled`, routed to Alertmanager (NOT GitHub
  # Issues, which are disabled on this repo - BLO-33382) and fanned to the
  # paperclip-plugin-alertmanager webhook, which dedupes on the alert
  # fingerprint and refreshes one issue in place.
  alert-on-failure:
    needs: [build-and-push]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      (needs.build-and-push.result == 'failure' || needs.build-and-push.result == 'cancelled')
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    # actions: read + checks: read are what let the script tell a timeout kill
    # from a concurrency supersede and from a human cancel. All three report
    # `cancelled`; only the annotations separate them, and without these scopes
    # every cancellation classifies `unknown` and pages (fail-closed, but
    # uselessly noisy - and a noisy alert gets muted, which is the silence this
    # row exists to end).
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Report the unpublished image to Alertmanager
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: firing
          GH_REPO: ${{ github.repository }}
          # Collapsed to a single value for tags so the label set stays bounded:
          # the fingerprint hashes every label, and one identity per tag would
          # fragment the alert the bridge dedupes on (BLO-28616).
          BRANCH: ${{ github.ref_type == 'tag' && 'tags' || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/post-mcp-external-image-alert.mjs

  # The other half of an honest alert: without it `endsAt` is the only thing
  # retiring the firing alert, so the lane goes quiet on a TIMER rather than on
  # a fix. Pushing the identical label set with a past `endsAt` makes
  # Alertmanager send `resolved`, which cancels the issue.
  #
  # It is also the continuous capability probe. This lane is sparse - 9
  # successful builds in the ~5 months to 2026-11-14 - so a channel that rotted
  # here would otherwise be discovered by the next outage. Every green build
  # exercises the exact delivery path the failure path depends on.
  #
  # A separate job rather than a step inside build-and-push, deliberately: a
  # delivery failure here must not flip `build-and-push.result` to `failure`
  # and fire a spurious "the build is failing" alert about itself.
  resolve-on-success:
    needs: [build-and-push]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      needs.build-and-push.result == 'success'
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Resolve the image-delivery alert (and prove the channel still works)
        env:
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: resolved
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_type == 'tag' && 'tags' || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/post-mcp-external-image-alert.mjs
