name: Docker (mcp-external)

# Builds + pushes the Node @paperclipai/mcp-external image — the external MCP
# server that backs https://paperclip.blockcast.net/mcp (the `server` container
# of the paperclip-mcp deployment, behind the bun auth-proxy sidecar). Replaces
# the retired Python kkroo/paperclip-mcp fork (Workstream B cutover).
#
# Does NOT auto-deploy: onprem-k8s has no GitOps, so re-pinning the manifest
# (onprem-k8s paperclip/paperclip-mcp.yaml server image) to a fresh sha- tag is a
# separate manual step. Pushes to harbor.blockcast.net/library/* — the same
# project the live deployment already pulls from.
#
# Trigger: any change under packages/mcp-external/. Master + tags only; no PR
# builds (the HARBOR_PASSWORD org secret isn't available to forks, so a PR build
# would 401 on push). Mirrors docker-mcp-gateway.yml.

on:
  push:
    branches:
      - "master"
    paths:
      - "packages/mcp-external/**"
      - ".github/workflows/docker-mcp-external.yml"
    tags:
      - "mcp-external-v*"

permissions:
  contents: read

jobs:
  build-and-push:
    # A BuildKit client only, against the shared remote BuildKit (same as
    # docker.yml). BLO-46675: off org group 1 (arc-dind) so tag pushes
    # (refs/tags/mcp-external-v*) keep a runner once group 1 is scoped to
    # master-pinned workflows (BLO-40782).
    runs-on: arc-paperclip-buildkit
    timeout-minutes: 15
    concurrency:
      group: docker-mcp-external-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean stale node_modules from runner workspace
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name node_modules -type l -exec rm -f {} + 2>/dev/null || true

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Same endpoint selection as docker-agent.yml: side images use ordinal 1
      # so they do not evict the main paperclip image's cache on ordinal 0.
      - name: Select BuildKit endpoint
        id: buildkit-endpoint
        env:
          PREFERRED_ORDINAL: "1"
        run: |
          set -euo pipefail
          if [[ ! "${PREFERRED_ORDINAL}" =~ ^[01]$ ]]; then
            echo "Invalid BuildKit ordinal: ${PREFERRED_ORDINAL}" >&2
            exit 1
          fi

          probe_buildkit() {
            local host="$1"
            local timeout_seconds="$2"
            timeout "${timeout_seconds}" nc -z -w "${timeout_seconds}" "${host}" 1234
          }

          preferred="buildkit-amd64-${PREFERRED_ORDINAL}.buildkit-amd64-headless.ci.svc.cluster.local"
          fallback="buildkit-amd64.ci.svc.cluster.local"
          host="${preferred}"
          if ! probe_buildkit "${preferred}" 5; then
            echo "::warning::Preferred BuildKit ${preferred} is unavailable; using the healthy service endpoint"
            host="${fallback}"
            probe_buildkit "${fallback}" 10
          fi
          echo "endpoint=tcp://${host}:1234" >> "$GITHUB_OUTPUT"
          echo "Using BuildKit endpoint tcp://${host}:1234"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit-endpoint.outputs.endpoint }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            harbor.blockcast.net/library/paperclip-mcp-external
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/mcp-external/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=harbor.blockcast.net/library/paperclip-mcp-external:buildcache-v1
            type=gha,scope=paperclip-mcp-external
          cache-to: |
            ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=registry,ref=harbor.blockcast.net/library/paperclip-mcp-external:buildcache-v1,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true' || '' }}
            ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=gha,scope=paperclip-mcp-external,mode=min,ignore-error=true' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
