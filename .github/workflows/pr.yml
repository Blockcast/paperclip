      # Deliberately unfiltered by path. The failure this catches is a source change
      # falsifying a security decision record the PR never opened -- `3e5ac86e0` moved
      # `job-manifest.ts` and invalidated nine citations across three sections. A
      # `paths:` filter on docs/security/** cannot see that (PEN-5091).
      #
      # --base is what keeps that from becoming a repo-wide tripwire. Drift already on
      # master is reported and not fatal; only drift this PR caused fails it. Without
      # it, one merged commit moving a cited file reds `policy` on every open PR until
      # someone lands a correction -- measured on this PR's own merge-queue ejection,
      # run 42209953505. This job checks out at fetch-depth: 0, so the base resolves.
      #
      # --head is the other half of that, and it is not optional. On `pull_request` this
      # job's worktree is `refs/pull/N/merge`, a merge of the PR head into current
      # master, and PR_BASE_SHA is an ancestor of it -- so a `base...HEAD` diff reports
      # every file MASTER moved since the base as one this PR touched, and the tripwire
      # is back by another door. Measured at head d9871cea3: master's edit to
      # scripts/gh-token-wrapper.sh made six anchors fatal on a PR that never opened
      # that file. Passing the PR's own head sha confines attribution to the PR.
      #
