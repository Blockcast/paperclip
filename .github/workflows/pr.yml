        timeout-minutes: 1

      - name: Test verify job cancelled/skipped-vs-failed lane outcome
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/pr-verify-lane-outcome.test.mjs
        timeout-minutes: 1

      - name: Test Ally-gated heavy CI wiring (ally-verdict, dispatcher, backstop)
        if: ${{ !cancelled() }}
