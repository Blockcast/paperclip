name: PR

on:
  pull_request:
    branches:
      - master
  merge_group:
    types:
      - checks_requested

concurrency:
  # Pull requests are stable by number. A merge-group head SHA changes every
  # time GitHub re-stages the queue, so key the sole active build for each
  # merge-queue base branch instead. The repository merge queue is configured
  # with maximumEntriesToBuild=1; a newer generation must replace the old one.
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.base_ref || github.run_id }}
  cancel-in-progress: true

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  policy:
    # A merge-group is the sole landing candidate and must not wait behind the
    # pull-request review backlog that saturates arc-light.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-light' }}
    # 10, not 5, because this is the tightest-budgeted job that sets up pnpm and
    # `./.github/actions/setup-pnpm` may spend a second attempt on a stalled
    # npm registry (BLO-28813). At 5 a degraded registry converted a fast red
    # into a job timeout, which ejects a merge-queue candidate just the same but
    # burns a runner for the full budget first. Worst case here is roughly
    # 2 x (bootstrap + 120s fetch) + backoff ~= 5m, so the real work needs the
    # headroom above it.
    timeout-minutes: 10
    outputs:
      lockfile_regenerated: ${{ steps.regen_lockfile.outputs.regenerated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Block manual lockfile edits
        # Exemptions: (1) the dedicated chore/refresh-lockfile branch that CI
        # itself uses to land refreshes; (2) any PR authored by the bot
        # automation, which opens upstream-merge PRs (e.g. BLO-6287) that
        # legitimately carry lockfile diffs picked up from the upstream
        # `chore(lockfile): refresh pnpm-lock.yaml` commits. Both paths are
        # bot-driven and trusted; human/agent PRs remain blocked.
        # Both bot logins are accepted across the blockcast-ci-packages →
        # allyblockcast rename (the `ally` app slug was globally taken) so the
        # guard holds before and after the identity cutover.
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'chore/refresh-lockfile' &&
          github.event.pull_request.user.login != 'blockcast-ci-packages[bot]' &&
          github.event.pull_request.user.login != 'allyblockcast[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          # Diff the PR branch against its merge base so recent base-branch commits
          # do not masquerade as changes made by the PR itself.
          changed="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup actionlint
        uses: ./.github/actions/setup-actionlint

      - name: Validate workflow files parse (BLO-23511)
        # Runs before the runner-label check on purpose: that checker scans
        # these same files line by line, which a structurally broken file
        # passes happily. An unparseable workflow emits zero jobs, so it
        # fails nothing and every required check stays green — this is the
        # step that turns that silence into a red.
        run: node ./scripts/check-workflows-parse.mjs

      - name: Test workflow-parse gate (BLO-23511)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-workflows-parse.test.mjs
        timeout-minutes: 1

      - name: Validate ARC runner labels
        if: ${{ !cancelled() }}
        run: node ./scripts/check-github-runner-labels.mjs

      - name: Validate Dockerfile deps stage
        if: ${{ !cancelled() }}
        run: |
          node ./scripts/check-docker-deps-stage.mjs
          node --test ./scripts/__tests__/docker-deps-stage.test.mjs
        timeout-minutes: 1

      - name: Validate Docker deploy timeout margin
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-docker-deploy-timeout.test.js
        timeout-minutes: 1

      # Asserts the pre-flight runs BEFORE helm upgrade and fails closed. Both
      # are load-bearing: running it after the rollout starts reports the
      # problem only once the 30-minute timeout has already burned, and an
      # inconclusive check that exits 0 hands back the blind rollout it exists
      # to prevent.
      - name: Validate pending-migration deploy pre-flight
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-pending-migration-preflight.test.js
        timeout-minutes: 1

      # BLO-29008: executes the two-tier convergence gate's shell against
      # recorded cluster states. The gate fails OPEN if its string accumulation
      # breaks, so a render-level test cannot cover it — the negative cases here
      # are the whole point.
      - name: Test two-tier deploy convergence gate (BLO-29008)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-docker-two-tier-convergence.test.js
        timeout-minutes: 1

      - name: Test approval admissibility-probe backoff (BLO-28471)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/approve-paperclip-api-digest.test.js
        timeout-minutes: 1

      - name: Test pnpm setup retry wrapper (BLO-28813)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/pnpm-setup-retry.test.mjs
        timeout-minutes: 1

      - name: Test CI cache and Docker runner routing
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/ci-cache-routing.test.mjs
        timeout-minutes: 1

      - name: Validate opencode_k8s adapter pin
        if: ${{ !cancelled() }}
        run: node --test ./scripts/opencode-k8s-runtime-cache-pin.test.js
        timeout-minutes: 1

      - name: Test merge-group concurrency key
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/merge-group-concurrency.test.mjs
        timeout-minutes: 1

      - name: Test policy node-test timeouts
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/policy-node-test-timeouts.test.mjs
        timeout-minutes: 1

      - name: Test @penstock publish-drift comparison
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/penstock-publish-drift.test.mjs
        timeout-minutes: 1

      - name: Test Ally agent instruction contract
        if: ${{ !cancelled() }}
        run: node --test ./scripts/ally-agent-idempotency-contract.test.mjs
        timeout-minutes: 1

      - name: Reject git push in adapter/runtime code
        if: ${{ !cancelled() }}
        run: node ./scripts/check-no-git-push.mjs

      - name: Test no-git-push check
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-no-git-push.test.mjs
        timeout-minutes: 1

      - name: Reject App-attributed commits on the PR (BLO-21416)
        if: ${{ !cancelled() }}
        # Non-merge commits stamped with the shared allyblockcast[bot] App
        # identity mean either the commit was created via the GitHub
        # REST/MCP write path (contents API, merge API,
        # `create_or_update_file`/`push_files`), OR it was made with `git
        # push` from a checkout whose local git config itself holds the App
        # identity — measured on 11 of 71 sampled checkouts (BLO-23894), so
        # `git push` is not a guaranteed fix. See AGENTS.md §9. Uses the
        # already-checked-out history (fetch-depth: 0 above), no new token.
        #
        # There is deliberately NO branch exemption. The graphify-reindex bot
        # commits via `git push` under its own git identity
        # (`allyblockcast[bot]@users.noreply.github.com`), which is not the
        # REST-path stamp this gate matches
        # (`290875700+allyblockcast[bot]@users.noreply.github.com`) — measured
        # by running this script over the real graphify PRs #789 and #944:
        # both pass. A `github.head_ref`-keyed exemption was therefore
        # protecting against a rejection that never happens, while being both
        # a fork bypass (any fork can name its branch `bot/graphify-reindex`,
        # and `head_ref` carries no repository identity) and a merge-queue
        # false-reject (`head_ref` is empty in `merge_group`). Pinned by the
        # graphify-identity case in check-commit-author-attribution.test.mjs —
        # if that test starts failing, the bot moved onto the REST write path
        # and the right fix is to move it back, not to re-add an exemption.
        run: node ./scripts/check-commit-author-attribution.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: Test commit-author-attribution check
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-commit-author-attribution.test.mjs
        timeout-minutes: 1

      - name: Test gh token wrapper
        if: ${{ !cancelled() }}
        run: node --test ./scripts/gh-token-wrapper.test.mjs
        timeout-minutes: 1

      - name: Test PR test-coverage gate
        if: ${{ !cancelled() }}
        run: node --test ./.github/scripts/tests/check-pr-test-coverage.test.mjs
        timeout-minutes: 1

      # Guards the one property of the BLO-28888 soak workflow that cannot be
      # re-checked after the fact: that it stays dispatch-only. Adding its
      # ~50-90 minutes to a per-PR trigger would be invisible until it was
      # already on every PR's critical path.
      - name: Test soak workflow stays dispatch-only
        if: ${{ !cancelled() }}
        run: node --test ./.github/scripts/tests/soak-workflow-triggers.test.mjs
        timeout-minutes: 1

      - name: Test ffmpeg muxer detection (BLO-23128)
        if: ${{ !cancelled() }}
        run: node --test ./.github/scripts/tests/check-ffmpeg-muxer.test.mjs
        timeout-minutes: 1

      - name: Test production environment protection guard (BLO-22329)
        if: ${{ !cancelled() }}
        run: |
          node --test \
            ./.github/scripts/tests/check-production-environment-protection.test.mjs \
            ./.github/scripts/tests/post-environment-protection-alert.test.mjs
        timeout-minutes: 1

      # The stuck-approval escalation only ever runs inside the scheduled
      # dispatcher, and only on the branch where a deploy is already pending —
      # so without this it could regress for weeks unnoticed, and the first
      # signal would be another silent no-op. The suite pins the two properties
      # that cannot be re-checked after the fact: that severity stays `critical`
      # (anything else routes to the paperclip webhook only, which is not a
      # human), and that queued/building runs never page the reviewers.
      - name: Test stuck production-approval escalation (PEN-2848)
        if: ${{ !cancelled() }}
        run: node --test ./.github/scripts/tests/post-pending-deploy-alert.test.mjs
        timeout-minutes: 1

      # BLO-28203. The stalled-Ally-review sweep's decision suite otherwise runs
      # ONLY inside the scheduled `review-gate-sweep` job, where a non-zero exit
      # is the deliberate stranded-PR alarm (EXIT_ALARM=1). That conflates two
      # unrelated signals -- a test regression would read as "a PR is stranded"
      # -- and lets a change to the reconciler merge without its 1013-line suite
      # ever running at PR time. Running it here separates "the code under
      # review is broken" from "a PR needs a human".
      #
      # `setup-python` explicitly rather than a bare `python3`: this job runs on
      # `arc-merge-queue` for merge_group events, that scale set is currently
      # at zero replicas, and its image's python is therefore unverifiable --
      # on a job every PR and every merge-queue candidate depends on, an
      # unproven `command not found` would be worse than the gap it closes.
      # setup-python is image-independent and is this repo's own pattern for
      # python (docker-figma-bot.yml / docker-webflow-bot.yml), verified green
      # on the ARC fleet. 3.10 matches those two; the suite uses no 3.11+
      # constructs.
      - name: Set up Python for the review-gate sweep suite
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test stalled-Ally-review sweep decision logic (BLO-28203)
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_sweep_*.py' -v

      - name: Validate Designer fast-uri security floor
        if: ${{ !cancelled() }}
        run: node ./scripts/designer-fast-uri-security.test.js

      - name: Test bounded PR-check polling skills
        # BLO-31075. .agents/skills/{check-pr,prcheckloop}/SKILL.md are executed
        # by agents, so they are code. Their first version passed `bash -n` and
        # still (a) polled a red PR for the full deadline before reporting a
        # timeout and (b) had no success exit at all. This suite runs the fenced
        # blocks against a stubbed `gh` and asserts the exit codes.
        if: ${{ !cancelled() }}
        run: node --test ./scripts/skill-bounded-pr-check-polling.test.mjs
        timeout-minutes: 1

      # BLO-31405: the chart render suite deliberately does NOT run here. It has
      # its own `helm_chart` job below; see the comment there before adding it
      # back.

      - name: Test Ally review-consistency guard
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-ally-review-consistency.test.mjs
        timeout-minutes: 1

      - name: Test comment-review-gate census
        if: ${{ !cancelled() }}
        # The census itself is not run here: it fails on 100% of sampled merges
        # today across paperclip, penstock, frr and NOP, so gating PRs on it
        # would block every merge. It becomes a runnable regression gate once
        # the gate context moves out of the review/ namespace (BLO-29711).
        run: node --test ./scripts/check-comment-review-gate-census.test.mjs
        timeout-minutes: 1

      - name: Test CODEOWNERS guard
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-codeowners.test.mjs
        timeout-minutes: 1

      - name: Test general-server shard partition
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/run-vitest-stable-shard.test.mjs
        timeout-minutes: 1

      # BLO-24241: unlike the step above (a hard-required, generous-floor
      # sanity check), this one asserts strict 100% manifest coverage and is
      # allowed to fail. A missing suite shows up as a real red X on this
      # step, naming the exact suites and the one-line fix, without failing
      # `policy` and skipping build/typecheck/e2e for the whole PR the way
      # the old bare >=90% assertion did.
      - name: Check shard duration manifest freshness (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node --test ./scripts/check-shard-manifest-freshness.test.mjs
        timeout-minutes: 1

      # BLO-24241: the weekly refresh path. These are required (not
      # continue-on-error) because a break here only surfaces on a Monday
      # schedule that nobody is watching -- the merge step used to clobber the
      # manifest's durable "$notes" prose, and the measurement runner used to
      # buffer vitest's stdout into an ENOBUFS kill.
      - name: Test shard duration measurement runner
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/measure-general-server-shard-durations.test.mjs
        timeout-minutes: 1

      - name: Test shard duration manifest merge
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/merge-shard-duration-manifest.test.mjs
        timeout-minutes: 1

      - name: Test shard duration refresh workflow
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/refresh-shard-manifest-workflow.test.mjs
        timeout-minutes: 1

      - name: Test vitest project coverage
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/vitest-project-coverage.test.mjs
        timeout-minutes: 1

      - name: Test release verify workflow wiring
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/release-verify-workflow.test.mjs
        timeout-minutes: 1

      - name: Test standalone package build concurrency
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/build-standalone-concurrency.test.mjs
        timeout-minutes: 1

      - name: Test devDependency install guard (NODE_ENV=production)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/npmrc-devdeps-guard.test.mjs
        timeout-minutes: 1

      - name: Test verify job cancelled/skipped-vs-failed lane outcome
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/pr-verify-lane-outcome.test.mjs
        timeout-minutes: 1

      - name: Test Playwright install-deps retry/backoff
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/playwright-install-deps-retry.test.mjs
        timeout-minutes: 1

      - name: Test PR server-shard folding
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/pr-ci-shard-folding.test.mjs
        timeout-minutes: 1

      - name: Validate release package manifest
        if: ${{ !cancelled() }}
        run: node ./scripts/release-package-map.mjs check

      - name: Test ip-address security override
        if: ${{ !cancelled() }}
        run: pnpm run test:ip-address-security-override

      - name: Test browserslist security override
        if: ${{ !cancelled() }}
        run: pnpm run test:browserslist-security-override

      - name: Verify release package bootstrap for changed manifests
        if: ${{ !cancelled() }}
        run: |
          mapfile -t changed_paths < <(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
          PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="$PR_BASE_SHA" \
            node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"

      # BLO-24169: this runs unconditionally (not gated on whether this PR's
      # own diff touches a manifest) because a merge-queue batch can land a
      # package.json bump next to a stale, already-committed pnpm-lock.yaml —
      # the diff that broke master touched neither file in *this* PR. The
      # "Validate dependency resolution when manifests change" step below
      # only regenerates an in-memory lockfile for jobs to consume; it never
      # asserts the committed lockfile itself is consistent, which is exactly
      # the gap that let 08b6f4491 take the whole queue down.
      - name: Check pnpm-lock.yaml overrides/patchedDependencies consistency
        if: ${{ !cancelled() }}
        run: node ./scripts/check-lockfile-overrides-consistency.mjs

      - name: Test lockfile overrides consistency guard
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-lockfile-overrides-consistency.test.mjs
        timeout-minutes: 1

      - name: Validate dependency resolution when manifests change
        id: regen_lockfile
        if: ${{ !cancelled() }}
        run: |
          changed="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          manifest_pattern='(^|/)package\.json$|^pnpm-workspace\.yaml$|^\.npmrc$|^pnpmfile\.(cjs|js|mjs)$'
          if printf '%s\n' "$changed" | grep -Eq "$manifest_pattern"; then
            pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
            echo "regenerated=1" >> "$GITHUB_OUTPUT"
          else
            echo "regenerated=0" >> "$GITHUB_OUTPUT"
          fi

      # Manifest-only PRs (where pnpm-lock.yaml stays at base because the policy
      # job above blocks committing it) need the regenerated lockfile for the
      # downstream `pnpm install --frozen-lockfile` steps. Upload it here so
      # every job consumes the same hash without recomputing.
      - name: Upload regenerated lockfile for downstream jobs
        if: ${{ !cancelled() && steps.regen_lockfile.outputs.regenerated == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error

  # The chart tests under deploy/helm/paperclip/tests/ were never wired into any
  # workflow -- 21 assertions about the manifests we actually ship (Penstock
  # routing, ServiceMonitor RBAC, runtime caches, probes) that no CI run has ever
  # executed. This job runs them, and gates the BLO-20733 approval-plan marker:
  # the release channel's completion check is bound to a marker computed from an
  # unstamped render, which is only sound while stamping perturbs nothing else.
  #
  # Deliberately its own job rather than a step in `policy`: it needs helm and
  # the runner image's pinned yq, and a tooling regression in provisioning those
  # should not take down the gate that every unrelated PR depends on.
  #
  # BLO-31405: a second copy of this suite had landed in parallel as a `policy`
  # step (#965 and #995 crossed, each believing the tests ran nowhere), which is
  # exactly the coupling the paragraph above rejects. It shelled out to `helm
  # template` once per test file, so under `policy`'s 60s step bound its p100 of
  # 73s failed 3 of 25 sampled runs on duration alone — each one skipping every
  # lane that `needs: policy`, on PRs that never touched the chart. Removed. Do
  # not re-add it here: this job is a `verify` lane (see its `needs:`), so a red
  # chart already fails the required check without any `policy` coupling.
  helm_chart:
    name: Helm chart
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-light' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Test Helm chart renders
        run: node --test ./deploy/helm/paperclip/tests/*.test.mjs
        # BLO-29182 observed THIS invocation hang: `node --test` has no default
        # per-test timeout and these tests shell out to `helm`, which does
        # network I/O, so a stalled fetch has no upper bound below the job cap.
        # That was fixed by bounding the `policy` copy, and BLO-31405 has now
        # removed that copy as a duplicate — so the bound has to live here, or
        # deleting the duplicate would leave the one invocation known to hang
        # unbounded again. 4 min is 3.3x the suite's measured p100 of 73s (25
        # sampled pr.yml runs) and well inside the 10-minute job cap, so a hang
        # fails this step attributably instead of burning the whole budget.
        timeout-minutes: 4

  typecheck_release_registry:
    name: Typecheck + Release Registry
    needs: [policy]
    # BLO-22428: merge_group traffic on this heavy label starves behind a
    # pull_request backlog on the shared `default` pool (merge-queue check
    # concurrency is 1, so a deep PR queue blocks the one queue that lands
    # code without itself needing proportional capacity). Route merge_group
    # runs to the dedicated arc-merge-queue pool instead; pull_request uses
    # its own lightweight, repository-scoped pool so other repositories retain
    # bounded capacity on the shared default label.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # ARC setup plus the sequential build-gap typechecks exceeded the previous
    # 20-minute ceiling while the final UI typecheck was still making progress.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

      - name: Check server tests for undefined identifiers
        run: pnpm run check:test-undefined-symbols

      - name: Test undefined-identifier guard failure modes
        run: node --test scripts/check-test-undefined-symbols.test.mjs

      - name: Verify release registry test coverage
        run: pnpm run test:release-registry

  worktree_install:
    name: Worktree install (NODE_ENV=production)
    needs: [policy]
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    timeout-minutes: 20
    # Regression guard for BLO-19064. pnpm treats NODE_ENV=production as an
    # implicit `--prod` and silently skips every devDependency while still
    # exiting 0. The agent toolchain image inherits NODE_ENV=production from the
    # paperclip-runtime base, so without `production=false` in .npmrc a fresh
    # install leaves no vitest/typescript/tsx and no test, typecheck or build
    # entrypoint can run. This job pins NODE_ENV=production on purpose so that
    # removing that .npmrc line fails CI instead of silently disarming the fleet.
    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Create a scratch git worktree at the checked-out commit
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/worktree-install-check" HEAD
          # The worktree materializes files from git HEAD, so it would miss a
          # lockfile the policy job regenerated and uploaded. Carry that one over
          # or --frozen-lockfile fails on ERR_PNPM_OUTDATED_LOCKFILE.
          cp pnpm-lock.yaml "$RUNNER_TEMP/worktree-install-check/pnpm-lock.yaml"

      - name: Install into the worktree
        working-directory: ${{ runner.temp }}/worktree-install-check
        run: pnpm install --frozen-lockfile

      - name: Assert the install is complete
        working-directory: ${{ runner.temp }}/worktree-install-check
        run: |
          set -euo pipefail
          echo "NODE_ENV=${NODE_ENV:-<unset>}"

          missing=0
          for dep in vitest typescript esbuild cross-env @playwright/test; do
            if [ -e "node_modules/$dep" ]; then
              echo "  ok       node_modules/$dep"
            else
              echo "  MISSING  node_modules/$dep"
              missing=1
            fi
          done

          if [ ! -x node_modules/.bin/vitest ]; then
            echo "  MISSING  node_modules/.bin/vitest"
            missing=1
          else
            echo "  ok       node_modules/.bin/vitest"
          fi

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Root devDependencies were not installed. pnpm most likely pruned them"
            echo "because NODE_ENV=production; check that .npmrc still sets production=false."
            exit 1
          fi

          pnpm exec vitest --version

      - name: Remove the scratch worktree
        if: always()
        run: git worktree remove --force "$RUNNER_TEMP/worktree-install-check" || true

  opencode_responses_replay:
    name: OpenCode Responses replay
    needs: [policy]
    # Keep this merge_group dependency off the shared default pool too; leaving
    # even one required lane there would preserve the starvation path.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the pinned OpenCode release
        run: |
          set -euo pipefail
          version="$(node -e '
            const source = require("node:fs").readFileSync("Dockerfile.runtime", "utf8");
            const match = source.match(/^ARG OPENCODE_AI_VERSION=(\S+)$/m);
            if (!match) process.exit(1);
            process.stdout.write(match[1]);
          ')"
          npm install --prefix "$RUNNER_TEMP/opencode-replay" --omit=dev "opencode-ai@$version"
          binary="$RUNNER_TEMP/opencode-replay/node_modules/.bin/opencode"
          test "$("$binary" --version)" = "$version"
          echo "OPENCODE_REPLAY_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Replay framed and malformed Responses streams
        run: node scripts/smoke/opencode-responses-replay.mjs

  opencode_k8s_seed_cold_start:
    name: k8s-ro seed transport cold start
    needs: [policy]
    # BLO-23422: the general-server shard already runs this suite once. This lane
    # exists to prove the cold-start property specifically — OpenCode migrates its
    # SQLite store once per state home, and the suite creates a fresh one per run,
    # so each iteration below is a genuine cold start rather than a warmed repeat.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # Must cover the suite's own worst case, not the observed ~25s: each iteration
    # allows 270s for the beforeAll migration (MIGRATION_TIMEOUT_MS + 30s) plus 150s
    # for the test (TEST_TIMEOUT_MS), so three iterations can reach 21 minutes before
    # checkout, setup, and install. A 20-minute cap would have GitHub kill the job in
    # precisely the slow-cold-migration case this lane exists to catch, discarding the
    # diagnostics the watchdog is meant to preserve. Keep this above 3 * (270s + 150s)
    # plus setup margin if either budget in the suite changes.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Match the sibling test lanes, which reach vitest through `pnpm test:run:*`
      # and so always relink stale workspace packages first. This lane invokes
      # vitest directly, so it has to run the preflight itself.
      - name: Ensure workspace package links
        run: pnpm run preflight:workspace-links

      - name: Run the focused regression three times from a clean OpenCode home
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::k8s-ro seed transport cold start ${attempt}/3"
            pnpm vitest run server/src/__tests__/opencode-k8s-seed-transport.test.ts
            echo "::endgroup::"
          done

  general_tests:
    name: General tests (${{ matrix.group_label }})
    needs: [policy]
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # Embedded Postgres can spend tens of seconds per suite waiting on shared
    # ARC node storage. A server shard reached the previous 60-minute ceiling
    # while still advancing through passing suites, so retain a bounded margin
    # without treating runner I/O contention as a test failure.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Every matrix entry gets an isolated ARC pod/database. Serializing this
      # matrix only lengthens the critical path and leaves on-prem capacity
      # unused when it is available.
      max-parallel: 6
      matrix:
        include:
          - group: general-server
            group_label: server 1/4
            shard_index: 0
            shard_count: 4
          - group: general-server
            group_label: server 2/4
            shard_index: 1
            shard_count: 4
          - group: general-server
            group_label: server 3/4
            shard_index: 2
            shard_count: 4
          - group: general-server
            group_label: server 4/4
            shard_index: 3
            shard_count: 4
          - group: general-workspaces-a
            group_label: workspaces-a
            shard_index: ''
            shard_count: ''
          - group: general-workspaces-b
            group_label: workspaces-b
            shard_index: ''
            shard_count: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run grouped general test suites
        run: |
          args=(--group '${{ matrix.group }}')
          if [ -n '${{ matrix.shard_count }}' ]; then
            args+=(--shard-index '${{ matrix.shard_index }}' --shard-count '${{ matrix.shard_count }}')
          fi
          pnpm test:run:general -- "${args[@]}"

      # Reuse the checkout, dependency install, cache restore, and embedded
      # Postgres setup already paid for by each server shard. This removes four
      # ARC pod cold starts without reducing serialized-suite coverage.
      - name: Run serialized server test shard
        if: matrix.group == 'general-server'
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

  vendor_claude_k8s:
    # BLO-17980 / BLO-22506: the claude_k8s adapter templates every agent Job
    # pod. It used to live in kkroo/paperclip-adapter-claude-k8s, outside our
    # GitHub App installation, so a critical credential-injection finding sat
    # there unreviewable by our CI for days. The source is now vendored at
    # vendor/paperclip-adapter-claude-k8s/ and this job is what makes it
    # reviewable: it runs the adapter's own suite, which contains the
    # fail-closed guard rejecting any pod spec that carries a sensitive-named
    # env var (/TOKEN|SECRET|PASSWORD|KEY|CREDENTIAL|AUTH/i) as a literal
    # `value` instead of a secretKeyRef.
    #
    # This package is deliberately outside the pnpm workspace and the root
    # tsconfig project references (see pnpm-workspace.yaml), so nothing else
    # in CI compiles or exercises it. Without this job it is dead-lettered.
    name: Vendored claude_k8s adapter
    runs-on: arc-light
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vendor/paperclip-adapter-claude-k8s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/paperclip-adapter-claude-k8s/package-lock.json

      # --include=dev is explicit: some runner images set `npm config omit=dev`,
      # which silently skips typescript/vitest and turns this job into a no-op
      # that still reports green.
      - name: Install
        run: npm ci --include=dev

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Test
        run: npm test

      # Guards the PROVENANCE.md integrity manifest. If someone edits the
      # vendored source, this hash changes and PROVENANCE.md must be updated
      # in the same PR — otherwise the recorded provenance silently drifts
      # from what is actually in the tree.
      - name: Verify provenance manifest
        run: |
          set -euo pipefail
          actual=$(git ls-files \
            | grep -vxE 'LICENSE|PROVENANCE\.md' \
            | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          recorded=$(grep -oE '^[0-9a-f]{64}$' PROVENANCE.md | head -1)
          echo "actual:   $actual"
          echo "recorded: $recorded"
          if [ -z "$recorded" ]; then
            echo "::error::No 64-hex integrity hash found in PROVENANCE.md."
            exit 1
          fi
          if [ "$actual" != "$recorded" ]; then
            echo "::error::Vendored source changed but PROVENANCE.md integrity hash was not updated."
            echo "Update the hash in vendor/paperclip-adapter-claude-k8s/PROVENANCE.md to: $actual"
            exit 1
          fi

  verify:
    # Preserve the legacy required-check name while the underlying work runs in parallel.
    # Serialized server suites run inside the four general-server matrix jobs,
    # so general_tests remains the required aggregate for both test families.
    name: verify
    if: ${{ always() && !cancelled() }}
    needs:
      [
        helm_chart,
        typecheck_release_registry,
        general_tests,
        worktree_install,
        opencode_responses_replay,
        opencode_k8s_seed_cold_start,
        build,
        vendor_claude_k8s,
      ]
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-light' }}
    # BLO-28999: the failure path below adds checkout + Node setup + up to N+1
    # API round trips, and it runs precisely when the pool is saturated. At the
    # previous 5 minutes a slow classify step could time `verify` out and lose
    # the annotation entirely — the one thing this job exists to emit. The
    # classify step carries its own tighter bound, so this ceiling only has to
    # cover the setup around it. Same headroom reasoning as `policy` above.
    timeout-minutes: 10
    # BLO-28999: the classify step below is this workflow's first GITHUB_TOKEN
    # consumer, and `pr.yml` declares no workflow-level `permissions:`. Under a
    # restricted default-permissions preset every scope is `none`, the API calls
    # 403, and the classifier degrades silently to the pre-existing wording —
    # indistinguishable from "nothing was killed", which is the exact bug this
    # job now exists to fix. Declared explicitly, as `master-health.yml` and
    # `refresh-lockfile.yml` already do for the same reason.
    permissions:
      # A job-level block REPLACES the workflow-level one rather than merging
      # into it (see the same note in `docker.yml`), so `contents: read` is
      # listed deliberately — without it `actions/checkout` below loses repo
      # access and the classify step cannot even find the script.
      contents: read
      # `/actions/runs/{id}/jobs` — the per-job detail and step conclusions.
      actions: read
      # `/check-runs/{id}/annotations` — a DIFFERENT scope from `actions: read`,
      # and the source of the runner-loss annotation that is signal 1.
      checks: read

    steps:
      # BLO-28999: `needs.<lane>.result` cannot distinguish an ARC mid-job
      # runner kill from a real lane failure — GitHub records both as
      # `failure`. Go back to the Actions API for the per-job detail the
      # aggregation step below cannot see, and hand it the subset of failed
      # lanes that were actually killed.
      #
      # All three steps are gated on there being a failure at all, so the
      # overwhelmingly common all-green run pays nothing: no checkout, no
      # toolchain setup, no API calls. That also keeps `verify` light enough
      # not to become a victim of the same pool saturation it now reports on.
      - name: Checkout repository
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: actions/checkout@v6

      # `arc-light` does not ship a usable Node by default — the `policy` job
      # on the same pool sets one up explicitly before its `node --test` steps.
      - name: Setup Node
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Classify failed lanes as infrastructure kills or real failures
        id: classify_lanes
        if: ${{ contains(needs.*.result, 'failure') }}
        # This step decides only which WORDING explains the failure, never
        # whether `verify` passes. If it errors, the aggregation step below
        # still runs (`if: always()`) and falls back to the pre-existing
        # failure wording.
        continue-on-error: true
        # Bounded well inside the job ceiling: this step makes N+1 API calls on
        # a saturated pool, and if it hangs the job timeout would kill `verify`
        # before the aggregation step could emit any annotation at all.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_CHART_RESULT: ${{ needs.helm_chart.result }}
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          WORKTREE_INSTALL_RESULT: ${{ needs.worktree_install.result }}
          OPENCODE_RESPONSES_REPLAY_RESULT: ${{ needs.opencode_responses_replay.result }}
          OPENCODE_K8S_SEED_COLD_START_RESULT: ${{ needs.opencode_k8s_seed_cold_start.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VENDOR_CLAUDE_K8S_RESULT: ${{ needs.vendor_claude_k8s.result }}
        run: |
          # Keep these three arrays in the same order — scripts/__tests__/
          # pr-verify-lane-outcome.test.mjs asserts the pairing, and also
          # asserts each lane_job_names entry matches that job's `name:`.
          lane_names=(
            helm_chart
            typecheck_release_registry
            general_tests
            worktree_install
            opencode_responses_replay
            opencode_k8s_seed_cold_start
            build
            vendor_claude_k8s
          )
          lane_results=(
            "$HELM_CHART_RESULT"
            "$TYPECHECK_RELEASE_REGISTRY_RESULT"
            "$GENERAL_TESTS_RESULT"
            "$WORKTREE_INSTALL_RESULT"
            "$OPENCODE_RESPONSES_REPLAY_RESULT"
            "$OPENCODE_K8S_SEED_COLD_START_RESULT"
            "$BUILD_RESULT"
            "$VENDOR_CLAUDE_K8S_RESULT"
          )
          lane_job_names=(
            "Helm chart"
            "Typecheck + Release Registry"
            "General tests"
            "Worktree install (NODE_ENV=production)"
            "OpenCode Responses replay"
            "k8s-ro seed transport cold start"
            "Build"
            "Vendored claude_k8s adapter"
          )

          # `failed` and `job_names` are built in lockstep so the Nth failed
          # lane's job name is the Nth entry — the script pairs them by index.
          # Appending to `job_names` outside this branch would map every lane
          # onto the wrong job and silently disable the classifier.
          failed=()
          job_names=()
          for i in "${!lane_names[@]}"; do
            case "${lane_results[$i]}" in
              success | cancelled | skipped) ;;
              *)
                failed+=("${lane_names[$i]}")
                job_names+=("${lane_job_names[$i]}")
                ;;
            esac
          done

          infra=""
          if [ "${#failed[@]}" -gt 0 ]; then
            # The script degrades to an empty set on any error, so a
            # classification problem can never change the gate — only the
            # wording the aggregation step picks. That degradation is silent by
            # design on stdout (which carries the lane list), so surface the
            # script's stderr as a warning annotation: a 403 from a missing
            # token scope would otherwise be indistinguishable from a clean
            # "nothing was killed", and could rot back to silence unnoticed.
            classify_err="$(mktemp)"
            infra="$(LANE_JOB_NAMES="$(printf '%s\n' "${job_names[@]}")" \
              node scripts/classify-lane-failures.mjs "${failed[@]}" 2>"$classify_err" | tail -n 1)"
            if [ -s "$classify_err" ]; then
              echo "::warning title=verify: lane classifier degraded::Runner-kill detection did not produce a verdict, so any killed lane below is reported with the ordinary failure wording. Cause: $(tr '\n' ' ' <"$classify_err")"
            fi
          fi
          echo "infra_lanes=$infra" >>"$GITHUB_OUTPUT"

      # BLO-20867: an upstream lane can end up `cancelled` or `skipped` rather
      # than `failure`. A plain `test "$X" = "success"` makes every one of
      # these look like an identical failing required check, so authors
      # misattribute the outcome to their own diff. Separate them here so the
      # annotation on this job says which ones actually happened — a run can
      # have more than one non-success category at once (e.g. one lane
      # genuinely failed while another was evicted), so every category with
      # at least one lane in it gets its own annotation instead of only the
      # first one checked:
      #   - failure:   the lane ran and reported a result other than success.
      #     Often a real problem with the diff, but a lane can also report
      #     failure due to its own setup/runner trouble — check that lane's
      #     logs rather than assuming the diff is at fault.
      #   - cancelled: the lane was interrupted before it produced a result —
      #     possibly a CI infrastructure interruption (see BLO-20867), but
      #     also possibly a manual cancellation or another cause this job
      #     cannot distinguish from here. Not evidence of a diff problem.
      #   - skipped:   the lane never ran because a dependency it needs
      #     (typically `policy`) did not succeed. The defect, if any, is in
      #     that dependency, not in this lane.
      #   - infrastructure (BLO-28999): the lane's job was killed mid-run by
      #     the runner pool. GitHub reports this as `failure`, so without the
      #     classify step above it is indistinguishable from the first case
      #     and reads as a defect in the diff. Split out here so the killed
      #     lane gets the "not your diff, re-run it" wording that already
      #     existed for `cancelled` but could never fire for a kill.
      - name: Fail if any split verify lane failed
        # Must run even when the classify step above was skipped or errored —
        # this step IS the gate, and its verdict may never depend on the
        # classifier being available.
        if: always()
        env:
          INFRA_LANES: ${{ steps.classify_lanes.outputs.infra_lanes }}
          HELM_CHART_RESULT: ${{ needs.helm_chart.result }}
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          WORKTREE_INSTALL_RESULT: ${{ needs.worktree_install.result }}
          OPENCODE_RESPONSES_REPLAY_RESULT: ${{ needs.opencode_responses_replay.result }}
          OPENCODE_K8S_SEED_COLD_START_RESULT: ${{ needs.opencode_k8s_seed_cold_start.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VENDOR_CLAUDE_K8S_RESULT: ${{ needs.vendor_claude_k8s.result }}
        run: |
          lane_names=(
            helm_chart
            typecheck_release_registry
            general_tests
            worktree_install
            opencode_responses_replay
            opencode_k8s_seed_cold_start
            build
            vendor_claude_k8s
          )
          lane_results=(
            "$HELM_CHART_RESULT"
            "$TYPECHECK_RELEASE_REGISTRY_RESULT"
            "$GENERAL_TESTS_RESULT"
            "$WORKTREE_INSTALL_RESULT"
            "$OPENCODE_RESPONSES_REPLAY_RESULT"
            "$OPENCODE_K8S_SEED_COLD_START_RESULT"
            "$BUILD_RESULT"
            "$VENDOR_CLAUDE_K8S_RESULT"
          )

          cancelled_lanes=()
          skipped_lanes=()
          failed_lanes=()
          infra_lanes=()
          for i in "${!lane_names[@]}"; do
            lane="${lane_names[$i]}"
            case "${lane_results[$i]}" in
              success) ;;
              cancelled) cancelled_lanes+=("$lane") ;;
              skipped) skipped_lanes+=("$lane") ;;
              *)
                # BLO-28999: a lane the classifier proved was killed mid-job
                # by the runner pool is reported as infrastructure, not as a
                # failure. Anything it could not prove stays a failure — the
                # fallback is the pre-existing wording, so an unavailable or
                # erroring classifier degrades to today's behaviour rather
                # than excusing a real defect.
                is_infra=0
                for infra_lane in $INFRA_LANES; do
                  if [ "$infra_lane" = "$lane" ]; then
                    is_infra=1
                    break
                  fi
                done
                if [ "$is_infra" -eq 1 ]; then
                  infra_lanes+=("$lane")
                else
                  failed_lanes+=("$lane")
                fi
                ;;
            esac
          done

          any_non_success=0

          if [ "${#failed_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane failure::Upstream lane(s) reported failure: ${failed_lanes[*]}. This may reflect a real problem with the PR diff, but a lane can also fail due to its own setup or runner trouble — check that lane's own logs before assuming the diff is at fault."
            any_non_success=1
          fi

          if [ "${#skipped_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane skipped::Upstream lane(s) did not run: ${skipped_lanes[*]}. GitHub Actions skips a lane when a job it needs (typically 'policy') did not succeed — check that dependency's logs, not this lane's."
            any_non_success=1
          fi

          if [ "${#cancelled_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane cancelled::Upstream lane(s) were CANCELLED, not failed: ${cancelled_lanes[*]}. This is not a report of a defect in this PR's diff — the lane was interrupted before it could produce a result (possible causes include a CI infrastructure interruption, see BLO-20867, or a manual cancellation). Re-run the job to get a real result."
            any_non_success=1
          fi

          if [ "${#infra_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane infrastructure kill::Upstream lane(s) were KILLED MID-JOB by the CI runner pool, not failed: ${infra_lanes[*]}. This is not a report of a defect in this PR's diff — the runner hosting the lane was terminated before it could produce a result (see BLO-28999). Re-run the job to get a real result."
            any_non_success=1
          fi

          if [ "$any_non_success" -eq 1 ]; then
            exit 1
          fi

  build:
    name: Build
    needs: [policy]
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  canary_dry_run:
    name: Canary Dry Run
    needs: [policy]
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # ARC setup/cache restore plus release.sh's mandatory workspace build hit
    # the previous 20-minute ceiling while the build was still progressing.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `release.sh` always executes its Step 2/7 workspace build, even when
      # `--skip-verify` bypasses the initial verification gate. release.sh
      # also requires a clean working tree, so any in-place lockfile churn
      # from `pnpm install --frozen-lockfile` must be reverted first — unless
      # the policy job uploaded a regenerated lockfile (manifest-changing
      # PRs), in which case we stage the artifact-restored copy into an
      # ephemeral local commit so release.sh sees a clean tree and its
      # workspace build sees a lockfile that matches the manifest.
      - name: Release canary dry run via release.sh internal build
        env:
          USED_ARTIFACT_LOCKFILE: ${{ needs.policy.outputs.lockfile_regenerated || '0' }}
        run: |
          git checkout -B master HEAD
          if [ "$USED_ARTIFACT_LOCKFILE" = "1" ]; then
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git -c user.email=ci@paperclip.local -c user.name=CI \
                commit --no-verify -m "ci(canary): stage regenerated lockfile"
            fi
          else
            git checkout -- pnpm-lock.yaml
          fi
          ./scripts/release.sh canary --skip-verify --dry-run

  e2e:
    needs: [policy]
    # Keep PR browser suites off the org-wide default pool. Merge groups use
    # the queue's reserved capacity so unrelated repos cannot delay admission.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-e2e' }}
    # The serial browser suite now covers 43 flows and remained active through
    # test 42 when ARC enforced the previous 30-minute job ceiling.
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}

      # BLO-27699 (BLO-22675 residue): apt's upstream mirrors (e.g.
      # security.ubuntu.com) fail with a transient "Mirror sync in progress?"
      # size mismatch often enough to take out a merge_group run on their own —
      # run 31107120860 died here and forced PR #1038 to be admin-merged.
      # Retry with backoff before failing the job.
      - name: Install Playwright system dependencies
        run: |
          attempts=3
          delay="${PLAYWRIGHT_INSTALL_DEPS_RETRY_DELAY_SECONDS:-15}"
          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            if pnpm exec playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Playwright system dependency install failed (attempt $attempt/$attempts); retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
            attempt=$((attempt + 1))
          done
          echo "Playwright system dependency install failed after $attempts attempts" >&2
          exit 1

      - name: Install Playwright browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
        run: pnpm run test:e2e

      # Diagnostic-only artifact (retention-days: 1). `if: always()` controls
      # whether this step RUNS, not whether its failure counts -- so a flaky
      # upload fails the step, fails the job, fails the merge-group run, and
      # ejects the PR. That is not hypothetical: it ejected #1512 and #1516 on
      # 2026-08-27 with every e2e test green (41 passed / 0 failed on #1512).
      # Nothing downstream consumes this report, so its failure must not gate a
      # merge. The lockfile upload in `policy` is deliberately left blocking --
      # downstream jobs install from it. BLO-29023.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 1
