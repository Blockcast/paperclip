name: PR

on:
  pull_request:
    branches:
      - master
  merge_group:
    types:
      - checks_requested

concurrency:
  # Pull requests are stable by number. Merge groups key on `head_ref`, which is
  # unique per queue entry AND per generation (`pr-1778-2ace7b68` vs
  # `pr-1778-e34a14b0` after a re-stage). `base_ref` is a constant
  # (`refs/heads/master`), so it collapses every merge-group build into one slot
  # and, with cancel-in-progress, the newer entry kills the older one. That is
  # invisible at maximumEntriesToBuild=1 but silently defeats any raise above 1:
  # the head's build would be cancelled by the entry queued behind it (BLO-22902).
  #
  # Superseding a destroyed generation does not depend on this key either -- but
  # nothing else reliably does it, so do NOT read that as "handled". An earlier
  # revision of this comment claimed GitHub cancels a destroyed merge group's
  # runs itself, on one observation (run 08:48:57Z, pr-1770-2ace7b68, cancelled
  # 09:05:23Z, 73s before any successor run existed, 2026-09-13). That
  # generalisation is FALSIFIED: run 37722816166 (pr-2272-69a141cf) sat `queued`
  # with 18 of its 19 jobs already executed for 1h34m after its branch was
  # deleted, and 17 such orphans saturated all 12 `arc-merge-queue` runners on
  # 2026-10-07 (BLO-41174, BLO-33021). GitHub's own cancellation is best-effort
  # at most. The backstop is merge-queue-orphan-sweeper.yml.
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  policy:
    # A merge-group is the sole landing candidate and must not wait behind the
    # pull-request review backlog that saturates arc-light.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-light' }}
    # THIS IS A HANG DETECTOR, NOT A PERFORMANCE BUDGET.
    # Sized by the BLO-35615 rule. Do NOT re-tune it from observed durations.
    #
    #   timeout-minutes = ceil( W95 / (F * 60) ),  floored at 6 x T_best
    #
    #   W95    = 364 CPU-seconds. p95 counter delta of
    #            container_cpu_usage_seconds_total{container="runner"} over the
    #            job's own start..end, n=33 successful runs, 2026-09-19..09-24.
    #            CPU-seconds measures WORK and is invariant to supply.
    #   F      = 0.21 cores -- arc-light worst-case supply floor, republished by
    #            BLO-35615 rev 3 (2026-09-28) after CTO review. arc-light requests
    #            250m with NO cpu limit; measured single-pod ceiling 11.0 cores,
    #            so the spread is 52x. Taken from arc-light, not arc-merge-queue,
    #            because one scalar must cover the worse of the two pools this job
    #            runs on.
    #
    #            RETRACTED: F = 0.32 / 0.3175. That was p05 of a series filtered
    #            to `rate > 0.25`, so it was >= 0.25 BY CONSTRUCTION -- a readout
    #            of the filter, not a supply floor. arc-light is one ephemeral pod
    #            per job, so the filter dropped low-CPU JOBS, not idle runners. F
    #            is in the denominator, so an overstated F UNDERSTATES every cap,
    #            which is the defect this rule exists to end.
    #            Independent re-measurement 2026-10-01 (BLO-35886) as pure supply,
    #            0.25/node_requests * allocatable across all 9 uncordoned runner
    #            nodes: worst case 0.265, median 0.285 -- below 0.32, above 0.21.
    #            The lower published value governs per the issue's own tie-break:
    #            a stale-LOW F only makes the detector weaker, a stale-HIGH F
    #            kills healthy jobs.
    #   T_best = 217s, fastest observed healthy run.
    #
    #   ceil( 364 / 12.6 ) = 29   and   ceil( 6 * 217 / 60 ) = 22   => 29
    #
    # Both forms are LOWER bounds on a hang detector, so where they disagree the
    # larger wins -- under the corrected F the primary form now binds. Measured
    # headroom at the old 22: longest HEALTHY policy job 20.8m = 94.3% of cap,
    # i.e. 1.06x -- the cap was about to truncate healthy work again.
    # Rule: BLO-35615. This pass: BLO-35886.
    #
    # Why 10 was not survivable: healthy successful runs measured p50 371s /
    # p95 555s / max 600s -- the max IS the old cap, i.e. the cap was already
    # truncating healthy work, which is exactly what BLO-31690 filed. The
    # pnpm-retry reasoning below remains true and is now subsumed: a second
    # registry attempt is work, and work is what W95 already counts.
    #
    # PRESERVED -- previous basis: "10, not 5 ... `./.github/actions/setup-pnpm`
    # may spend a second attempt on a stalled npm registry (BLO-28813). Worst
    # case here is roughly 2 x (bootstrap + 120s fetch) + backoff ~= 5m."
    timeout-minutes: 29
    # BLO-32682: the step-kill classifier at the end of this job reads the run's
    # own step conclusions and annotations back off the Actions API, and
    # `pr.yml` declares no workflow-level `permissions:`. Under a restricted
    # default-permissions preset every scope is `none`, both calls 403, and the
    # classifier degrades to a warning on every red run.
    permissions:
      # A job-level block REPLACES the workflow-level one rather than merging
      # into it (see the same note on `verify` below), so `contents: read` is
      # listed deliberately and FIRST — without it the `actions/checkout` step
      # immediately below loses repo access and every step in this job fails,
      # which would turn a legibility fix into an outage on the gate every
      # other job `needs:`. scripts/__tests__/policy-step-kill-classifier.test.mjs
      # pins all three entries against exactly that mistake.
      contents: read
      # `/actions/runs/{id}/jobs` — this job's own step conclusions and their
      # start/finish timestamps. Also read by the merge-group trim step below
      # (the PR head's own pull_request pr.yml jobs).
      actions: read
      # `/check-runs/{id}/annotations` — a DIFFERENT scope from `actions: read`,
      # and the only source of the "has timed out after N minutes" line that
      # says a step was killed by the clock rather than by an assertion.
      checks: read
      # `/pulls/{n}` — the merge-group trim step reads the queued PR's head SHA.
      # Read-only; without it the step 403s and fails open to the full suite.
      pull-requests: read
    outputs:
      lockfile_regenerated: ${{ steps.regen_lockfile.outputs.regenerated }}
      # Path-scoped suite selection (scripts/select-ci-suites.mjs). Consumers
      # compare against the literal 'false' and treat everything else -- 'true',
      # empty, or an output that was never written because this step did not
      # run -- as "run the suite", so a selector fault can only over-run.
      server_tests_needed: ${{ steps.select_suites.outputs.server_tests_needed }}
      workspaces_a_tests_needed: ${{ steps.select_suites.outputs.workspaces_a_tests_needed }}
      workspaces_b_tests_needed: ${{ steps.select_suites.outputs.workspaces_b_tests_needed }}
      ui_e2e_needed: ${{ steps.select_suites.outputs.ui_e2e_needed }}
      release_dry_run_needed: ${{ steps.select_suites.outputs.release_dry_run_needed }}
      # Merge-group heavy-lane trim (scripts/merge-group-trim.mjs). Consumers
      # skip a heavy lane ONLY on the literal 'true', ONLY on merge_group, and
      # ONLY while the PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE kill switch is unset,
      # so an empty output, a script fault or a pull_request run all run it.
      merge_group_trim_general_server: ${{ steps.merge_group_trim.outputs.merge_group_trim_general_server }}
      merge_group_trim_worktree_install: ${{ steps.merge_group_trim.outputs.merge_group_trim_worktree_install }}
      merge_group_trim_opencode_responses_replay: ${{ steps.merge_group_trim.outputs.merge_group_trim_opencode_responses_replay }}
      merge_group_trim_opencode_k8s_seed_cold_start: ${{ steps.merge_group_trim.outputs.merge_group_trim_opencode_k8s_seed_cold_start }}
      merge_group_trim_e2e: ${{ steps.merge_group_trim.outputs.merge_group_trim_e2e }}
      merge_group_trim_canary_dry_run: ${{ steps.merge_group_trim.outputs.merge_group_trim_canary_dry_run }}
      # Pull-request heavy-lane carry-forward (scripts/pr-carry-forward.mjs,
      # BLO-51600). general_tests skips a group ONLY on the literal 'true', ONLY
      # on pull_request, and ONLY while PAPERCLIP_CI_PR_FULL_SUITE is unset.
      carry_forward_general_server: ${{ steps.pr_carry_forward.outputs.carry_forward_general_server }}
      carry_forward_workspaces_a: ${{ steps.pr_carry_forward.outputs.carry_forward_workspaces_a }}
      carry_forward_workspaces_b: ${{ steps.pr_carry_forward.outputs.carry_forward_workspaces_b }}

    steps:
      - name: Checkout repository
        # `fetch-depth: 0` is load-bearing -- the lockfile guard below diffs
        # PR_BASE_SHA...PR_HEAD_SHA and needs the merge base on disk -- and it
        # makes this the dominant setup term (p100 9.07m, p50 2.08m). It
        # previously carried no bound, so a wedged fetch could only ever surface
        # as an unattributable job-cap cancellation.
        #
        # This is a HANG DETECTOR, like the job cap above: its only job is to
        # make a wedged fetch fail as ITSELF rather than as an anonymous cap
        # kill. Do not re-tune it down towards the observed p100 -- this bound
        # has already been overtaken TWICE by its own p100 (6m by the 6.63m
        # window, then 9m by this one, where run 35675464291 attempt 2 spent
        # 9m04s here and the step still reported `conclusion: success`). A 9m
        # bound would have truncated a step that was working, which the
        # BLO-35615 rule calls strictly worse than the failure it prevents.
        #
        # Be precise about what that costs, because this term is CENSORED and
        # the censoring cuts both ways: that job was cancelled at the old 10m
        # cap (10.22m step-time) regardless, and every checkout above 6.52m in
        # the window sits in a job that cap then killed. So no COMPLETED run
        # was at stake -- the bound governs the step, and 9m04s is what the
        # step took. The reason to size above it is that now the cap is 29m and
        # no longer truncates this distribution, the same draw lands in a run
        # that would otherwise finish.
        #
        # So do not read 12m as a safety factor over p100. `fetch-depth: 0`
        # cost grows with history, this term was censored by the old cap, and
        # the 29m cap is what will let its real tail appear for the first time.
        # Re-measure once it has; if a ratio is wanted against something that
        # does not move on one observation, p99 is 8.07m.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
        timeout-minutes: 12

      - name: Block manual lockfile edits
        # Exemptions: (1) the dedicated chore/refresh-lockfile branch that CI
        # itself uses to land refreshes; (2) any PR authored by the bot
        # automation, which opens upstream-merge PRs (e.g. BLO-6287) that
        # legitimately carry lockfile diffs picked up from the upstream
        # `chore(lockfile): refresh pnpm-lock.yaml` commits. Both paths are
        # bot-driven and trusted; human/agent PRs remain blocked.
        # Both bot logins are accepted across the blockcast-ci-packages →
        # allyblockcast rename (the `ally` app slug was globally taken) so the
        # guard holds before and after the identity cutover.
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'chore/refresh-lockfile' &&
          github.event.pull_request.user.login != 'blockcast-ci-packages[bot]' &&
          github.event.pull_request.user.login != 'allyblockcast[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          # Diff the PR branch against its merge base so recent base-branch commits
          # do not masquerade as changes made by the PR itself.
          changed="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            # A patch-file edit must change the lockfile's patch hashes, and
            # regen_lockfile only fires on manifest changes, so such a PR has
            # to commit them. Allow a lockfile that differs from the merge base
            # ONLY in patch hashes: the overrides-consistency check below
            # proves each one matches its committed patch file.
            hashless() {
              git show "$1:pnpm-lock.yaml" |
                sed -E 's/patch_hash=[a-z0-9]+/patch_hash=/g; s/^(    hash: )[a-z0-9]+$/\1/'
            }
            set -o pipefail
            base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            before="$(hashless "$base")"
            after="$(hashless "$PR_HEAD_SHA")"
            if [ "$before" = "$after" ]; then
              echo "pnpm-lock.yaml differs from the merge base only in patch hashes; allowed."
            else
              echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        # 15 is the BLO-28813 retry floor, NOT a multiple of a p100. Two guards
        # pin this value from both sides and it has to satisfy both:
        # BLO-31690 (`policy-node-test-timeouts.test.mjs`) requires a step bound
        # strictly under the 29m job cap, so a wedged setup is an attributable
        # step kill rather than an unattributable job-cap `cancelled`; BLO-28813
        # (`pnpm-setup-retry.test.mjs`) requires it to clear MIN_TIMEOUT_MINUTES_
        # FOR_RETRY, because a bound under the ~10.8m retry path does not bound
        # the step, it deletes the wrapper's second attempt. Deleting the line is
        # therefore not available here; 15 <= x < 29 is.
        #
        # This carried `timeout-minutes: 3` -- ~2.9x the 1.05m p100 -- on the
        # premise that baking the pinned pnpm into the ARC image had retired the
        # registry round-trip. PEN-6181: that premise does not hold on every
        # runner. merge_group run 42503915820 landed on one with no baked pnpm,
        # took the self-installer path, and was killed at 177287ms; the backoff
        # got 89ms and the retry logged `conclusion=skipped`. #3520 was evicted
        # from the queue for a failing required check. A baked-image percentile
        # measures how OFTEN the slow path is taken, never how long it takes.
        timeout-minutes: 15

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Decides which of the expensive suites (server/workspaces test shards,
      # Playwright e2e, release canary dry run) the diff can reach. FAIL OPEN: the
      # script never exits non-zero on its own faults (it reports every suite as
      # needed), and the consumers below only skip on the literal 'false'. For a
      # merge_group this is the cumulative diff of every queued PR, because
      # PR_BASE_SHA/PR_HEAD_SHA come from the merge_group event.
      - name: Select suites reachable from this diff
        id: select_suites
        continue-on-error: true
        run: node ./scripts/select-ci-suites.mjs
        timeout-minutes: 3

      # Owner directives 2026-10-07 / 2026-10-09 (CI CPU waste). arc-merge-queue
      # burned 293.7 core-h in the 26 h ending 2026-10-09T13:28Z; 70% of it was
      # the lanes below (Prometheus per-pod CPU joined to this file's jobs). In
      # merge_group, skip a HEAVY lane (server test shards, e2e, Canary Dry Run,
      # worktree install, the two OpenCode lanes) when the queued PR's own head
      # already passed it in pull_request CI and the queue applies exactly the
      # change set that CI tested (patch-id AND merge-tree identity). Build,
      # typecheck and the workspaces unit tests always run on the merged tree.
      # Fails open: see scripts/merge-group-trim.mjs. Kill switch: set the
      # repository variable PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE=true and the next
      # merge-group run is the full suite (runbooks/merge-group-heavy-lane-trim.md).
      # master-health.yml re-runs the server suites post-merge on any landed head
      # whose merge-group build did not run them. e2e and Canary Dry Run have no
      # post-merge backstop (runbooks/merge-group-heavy-lane-trim.md).
      - name: Decide merge-group heavy-lane trim
        id: merge_group_trim
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_GROUP_FULL_SUITE: ${{ vars.PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The merge group BASE's copy of the script decides (design section 3.3:
        # identity checks run as trusted code), never the queued PR's copy: a PR
        # that edits scripts/merge-group-trim.mjs, by mistake or on purpose,
        # must not ship its own CI_CONTROL_PATHS / decideTrim and decide its own
        # trim. No copy at the base (this file's first landing) emits no outputs,
        # which every consumer reads as "run the lane". The PR can still edit
        # this step itself, but pr.yml is a CI-control path, so the base copy
        # refuses to trim that landing.
        run: |
          trusted="${RUNNER_TEMP}/merge-group-trim.base.mjs"
          if ! git show "${MERGE_GROUP_BASE_SHA}:scripts/merge-group-trim.mjs" > "$trusted"; then
            echo "::warning title=merge-group trim fell back to the full suite::no scripts/merge-group-trim.mjs at merge group base ${MERGE_GROUP_BASE_SHA}"
            exit 0
          fi
          MERGE_GROUP_TRIM_REPO_ROOT="$PWD" node "$trusted"
        timeout-minutes: 3

      # BLO-51600 (CTO ruling 2026-11-10). On a pull_request push, skip a General
      # tests group when an earlier head of the same PR passed it and
      # select-ci-suites on the earlier->this-head diff says the group is
      # unreachable: the nit/doc push after a green run. Same trust model as the
      # trim above: the PR BASE's copies of the decider and the two scripts it
      # imports run, never the PR's. No copy at the base emits no outputs, which
      # every consumer reads as "run". Fails open: see scripts/pr-carry-forward.mjs.
      # Kill switch: repository variable PAPERCLIP_CI_PR_FULL_SUITE=true.
      - name: Decide pull-request heavy-lane carry-forward
        id: pr_carry_forward
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FULL_SUITE: ${{ vars.PAPERCLIP_CI_PR_FULL_SUITE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          trusted="${RUNNER_TEMP}/pr-carry-forward"
          mkdir -p "$trusted"
          for f in pr-carry-forward.mjs merge-group-trim.mjs select-ci-suites.mjs; do
            if ! git show "${PR_BASE_SHA}:scripts/$f" > "$trusted/$f"; then
              echo "::warning title=carry-forward fell back to the full suite::no scripts/$f at PR base ${PR_BASE_SHA}"
              exit 0
            fi
          done
          PR_CARRY_FORWARD_REPO_ROOT="$PWD" node "$trusted/pr-carry-forward.mjs"
        timeout-minutes: 3

      - name: Setup actionlint
        uses: ./.github/actions/setup-actionlint

      - name: Validate workflow files parse (BLO-23511)
        # Runs before the runner-label check on purpose: that checker scans
        # these same files line by line, which a structurally broken file
        # passes happily. An unparseable workflow emits zero jobs, so it
        # fails nothing and every required check stays green — this is the
        # step that turns that silence into a red.
        run: node ./scripts/check-workflows-parse.mjs

      - name: Test workflow-parse gate (BLO-23511)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-workflows-parse.test.mjs
        timeout-minutes: 1

      - name: Validate ARC runner labels
        if: ${{ !cancelled() }}
        run: node ./scripts/check-github-runner-labels.mjs

      - name: Ban inline transaction-handle re-derivations (BLO-34812)
        # BLO-34656 swept 21 copies of this alias out of 20 files and left a
        # comment as the only thing holding it at zero. Those 21 copies are
        # the evidence that a comment does not hold.
        if: ${{ !cancelled() }}
        run: node ./scripts/check-db-transaction-alias.mjs

      - name: Test transaction-handle alias ban (BLO-34812)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-db-transaction-alias.test.mjs
        timeout-minutes: 1

      - name: Test issue-activity comment-coverage probe (PEN-5158)
        # The probe reports how much of the comment stream the issue activity
        # log actually records. Its load-bearing property is that it CANNOT
        # answer "clean" when it had nothing to measure: the failure it tracks
        # only ever presents as an absence, so an empty sample scored as a pass
        # would be indistinguishable from the probe not running. These tests pin
        # that, plus the two documented contract violations it must still catch.
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-issue-activity-comment-coverage.test.mjs
        timeout-minutes: 1

      - name: Test heap-snapshot analysis redaction (PEN-3631)
        # tools/heap-analysis/ reads a file that holds the worker's secrets in
        # plaintext, and its summariser once wrote them straight back out: the
        # redaction contract was applied at display time, so the derived
        # summary.json kept every string payload. Those summaries live outside
        # the snapshot directory, which is the only thing the worker's retention
        # sweep governs, so they outlived the snapshots they came from — 101MB
        # across three files, carrying 45 JWTs and 3 credentialed postgres URIs.
        #
        # The test this runs drives summarize.mjs over a real fixture and greps
        # its bytes. That distinction is the point: a unit test of the redaction
        # helper passes against the shipped defect, because the helper was never
        # wrong — the call site was missing.
        if: ${{ !cancelled() }}
        run: node --test ./tools/heap-analysis/redact.test.mjs
        timeout-minutes: 1

      - name: Test cgroup residual/teardown fit (PEN-3692)
        # PEN-3692 closes on the slope of cgroup residual against measured
        # teardown work. That slope can only be fitted in the ~7 days after an
        # unscheduled failure storm (Prometheus retention), and every naive way
        # of computing it still yields a confident-looking number: fitting
        # across a container restart regresses a sawtooth, and an integral keyed
        # on `method` alone drops `inspect_safety`, which is 85.6% of it.
        #
        # The tests this runs are regression pins on exactly those traps, not
        # coverage of the arithmetic — they assert that the whole-window fit
        # collapses against the segmented one, that the teardown query carries
        # no `by (...)` clause but DOES carry the same `pod` selector as the
        # residual it is regressed against (the worker runs 2 replicas and the
        # collector migrates between them), and that a sign-unstable window is
        # reported as a non-result rather than averaged into one slope.
        if: ${{ !cancelled() }}
        run: node --test ./scripts/cgroup-residual-teardown-fit.test.mjs
        timeout-minutes: 1

      - name: Guard migration-number collision with base (BLO-39490)
        # The one migration check that cannot be made from a single tree.
        # packages/db/src/check-migration-numbering.ts (BLO-27927) covers
        # everything visible in one tree; it cannot see a collision that does
        # not exist yet. Three open PRs each appended `idx: 248` and all three
        # were green, because each tree is individually consistent -- the
        # collision only arrives when the second branch meets the first, as a
        # merge-queue conflict that ejects the PR (BLO-26675) rather than a
        # red the author can act on. Needs PR_BASE_SHA; also runs on
        # merge_group, which is where the second claimant is rejected.
        if: ${{ !cancelled() }}
        run: node ./scripts/check-migration-journal-base.mjs "$PR_BASE_SHA"

      - name: Test migration-number base guard (BLO-39490)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-migration-journal-base.test.mjs
        timeout-minutes: 1

      - name: Guard the server-test typecheck allowlist (PEN-4186)
        # `server/tsconfig.json` excludes `src/__tests__`, and `typecheck` and
        # `build` share it, so the ONLY thing that typechecks a server test is
        # the gated allowlist in `server/tsconfig.tests.json` (BLO-38582).
        # Nothing compared the two sets: at master 6b4d6a1d that was 6 entries
        # against 726 test files, so a new test file landed outside the gate by
        # default and `pnpm typecheck` still exited 0 on it. PEN-3889's author
        # reported "typecheck passed" on a new file, injected a deliberate type
        # error, and typecheck still exited 0. The pass was vacuous and read
        # exactly like a real one.
        #
        # Scoped to files ADDED in this diff. It never asks for the ~720-file
        # backlog -- that is the reason the ratchet is incremental, and widening
        # this to existing files would demand the whole backlog at once.
        #
        # Lives in this job, not in typecheck_release_registry beside
        # `typecheck:tests`, because two of its four arms are base-relative and
        # that job checks out at depth 1 and cannot resolve $PR_BASE_SHA. This
        # job already has fetch-depth: 0. Also runs on merge_group, where a
        # branch cut before a sibling landed meets it for the first time.
        if: ${{ !cancelled() }}
        run: node ./scripts/check-test-typecheck-allowlist.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA"
        timeout-minutes: 1

      - name: Test server-test typecheck allowlist guard (PEN-4186)
