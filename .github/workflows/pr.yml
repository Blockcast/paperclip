        timeout-minutes: 1

      - name: Test proxy-addr security override
        if: ${{ !cancelled() }}
        run: pnpm run test:proxy-addr-security-override
        timeout-minutes: 1

      - name: Test @hono/node-server security override
        if: ${{ !cancelled() }}
        run: pnpm run test:hono-node-server-security-override
        timeout-minutes: 1

      # PEN-5272: the two members of this family that had neither an npm script
      # nor a step. The seven above were registered; these read as covered by
      # association and were not.
      - name: Test brace-expansion security override
        if: ${{ !cancelled() }}
        run: pnpm run test:brace-expansion-security-override
        # PEN-5561. At 1m this killed 6 of 285 executed runs over 2026-11-02..04
        # -- 5 of 105 on arc-merge-queue, every one of those a queue eviction
        # (#3341 and #3377 among them) -- while the worst HEALTHY run cleared
        # the same wall by 2s.
        #
        # Both BLO-35615 forms floor at 1 here, and neither can see why:
        #   primary: ceil( W95 / (F * 60) ) = ceil( 10.0 / 12.6 ) = 1
        #            W95 = 10.0 CPU-seconds, the max of n=7 invocations of the
        #                  npm script (user+sys, post-fix).
        #            F   = 0.21 cores, the arc-light supply floor this job's own
        #                  cap is derived from -- the worse of its two pools.
        #   floor:   ceil( 6 * T_best / 60 ) = ceil( 6 * 7 / 60 ) = 1
        #            T_best = 7s, fastest healthy CI run of this step, n=285.
        #
        # Both forms weigh CPU work against CPU supply, and this step never
        # overran on CPU -- it overran on WAIT: disk I/O for the fixture copy,
        # then a cold npm-registry resolve. CPU-seconds is invariant to supply
        # by construction, which is precisely what makes it blind here. Both
        # forms are LOWER bounds on a hang detector (see the job cap above), so
        # 4m sits above the floor on the wait term they do not count:
        #   - 17x the post-fix p100 measured off-runner (13.5s), so it reads as
        #     a hang detector rather than a performance budget;
        #   - 4.1x the worst healthy PRE-fix run (58s), so it still absorbs the
        #     entire observed distribution if the fixture change in
        #     scripts/brace-expansion-security-override.test.js turns out to buy
        #     less on a runner than it does off one.
        # Held at or above the floor by CONTENTION_SENSITIVE_STEPS in
        # policy-node-test-timeouts.test.mjs.
        timeout-minutes: 4

      - name: Test postcss security override
        if: ${{ !cancelled() }}
        run: pnpm run test:postcss-security-override
        # PEN-5561 measured this the same way, on the suspicion it shared the
        # shape of the step above. It does not: it reads package.json and
        # pnpm-lock.yaml in place and regexes them -- no fixture copy, no
        # registry. n=284 executed runs over the same window: p50 1s, p95 3s,
        # p100 4s, zero overruns on either pool. 1m is 15x its p100; left as is.
        timeout-minutes: 1

      # Named "smoke" but it reaches no network: it extracts shell functions
      # from scripts/smoke/*.sh and docker/hermes-gateway-smoke/entrypoint.sh
      # and asserts them offline -- including the loopback-vs-remote plain-HTTP
      # split that decides whether the gateway will talk cleartext to a remote
      # host. The name is why nobody registered it (PEN-5272).
      - name: Test hermes-gateway smoke shell helpers (PEN-5272)
        if: ${{ !cancelled() }}
        run: pnpm run test:hermes-gateway-smoke
        timeout-minutes: 2

      - name: Test agent-health preflight fixtures
        if: ${{ !cancelled() }}
        run: pnpm run test:agent-health-preflight
        timeout-minutes: 1

      - name: Test cancelled-monitor recovery measurement predicates (PEN-5346)
        if: ${{ !cancelled() }}
        run: pnpm run test:measure-cancelled-monitor-recovery
        timeout-minutes: 1

      # PEN-5828. Pins the per-shape residual reporting in
      # scripts/residual-report.mjs: that the group-count bins cannot collapse
      # back to a family average, and that a 0/0 rate ("the detector never
      # fired") stays distinguishable from a measured 0 ("it fired and the
      # conjunct held"). Both are live in isGitRefName's own grid.
      - name: Test residual per-shape reporting (PEN-5828)
        if: ${{ !cancelled() }}
        run: pnpm run test:residual-report
        timeout-minutes: 1

      # The base-digest resolver fails image builds closed, so its failure modes
      # are the thing to keep honest (PEN-5927).
      - name: Test base-image digest resolver (PEN-5927)
        if: ${{ !cancelled() }}
        run: pnpm run test:resolve-base-digest
        timeout-minutes: 1

      # The ratchet: fails the PR that adds the next image whose base is decided
      # by its build date rather than by the build (PEN-5927).
      - name: Check CI-published images pin their base (PEN-5927)
        if: ${{ !cancelled() }}
        run: pnpm run test:image-base-pinning
        timeout-minutes: 1

      - name: Verify release package bootstrap for changed manifests
        if: ${{ !cancelled() }}
        run: |
          mapfile -t changed_paths < <(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
          PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="$PR_BASE_SHA" \
            node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"

      # BLO-24169: this runs unconditionally (not gated on whether this PR's
      # own diff touches a manifest) because a merge-queue batch can land a
      # package.json bump next to a stale, already-committed pnpm-lock.yaml —
      # the diff that broke master touched neither file in *this* PR. The
      # "Validate dependency resolution when manifests change" step below
      # only regenerates an in-memory lockfile for jobs to consume; it never
      # asserts the committed lockfile itself is consistent, which is exactly
      # the gap that let 08b6f4491 take the whole queue down.
      - name: Check pnpm-lock.yaml overrides/patchedDependencies consistency
        if: ${{ !cancelled() }}
        run: node ./scripts/check-lockfile-overrides-consistency.mjs

      - name: Test lockfile overrides consistency guard
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-lockfile-overrides-consistency.test.mjs
        timeout-minutes: 1

      # PEN-5285. The COMPARISON LOGIC of the scheduled dependency-audit lane.
      # The lane itself is scheduled, never a PR gate, because its input is the
      # live advisory feed and a PR gate on that goes red for reasons no PR
      # caused. But the baseline-vs-feed comparison is pure and offline, and it
      # is where the fail-open shapes live — in particular that the baseline is
      # keyed on (advisory, package) rather than advisory alone, because one
      # GHSA id is reported under two packages in this very tree, so the
      # weaker key would let one entry silently suppress the other's finding.
      # These tests inject their own clock; nothing here reads the real date,
      # so an entry's review-by passing can never turn the merge gate red.
      - name: Test dependency audit baseline comparison
        if: ${{ !cancelled() }}
        run: node --test ./scripts/check-dependency-audit.test.mjs
        timeout-minutes: 1

      # The escalation half, same reasoning as the lockfile drift alert below:
      # the delivery path runs only inside the scheduled job and only on a day
      # master is already carrying an unaccounted advisory, so a regression in
      # it is invisible until the one run that needed it.
      - name: Test dependency audit alert payload
        if: ${{ !cancelled() }}
        run: node --test ./.github/scripts/tests/post-dependency-audit-alert.test.mjs
        timeout-minutes: 1

      # BLO-27611. The escalation half of the guard above: the hourly drift
      # monitor's only recipient. Its delivery path runs exclusively inside the
      # scheduled job, and only on the branch where master is ALREADY drifted,
      # so a regression there is invisible until the one run that needed it —
      # and the failure mode is silence, which is what the issue is about.
      - name: Test lockfile drift alert delivery (BLO-27611)
        if: ${{ !cancelled() }}
        run: node --test ./.github/scripts/tests/post-lockfile-drift-alert.test.mjs
        timeout-minutes: 1

      # BLO-26675. Same shape as the drift alert above: the only thing this
      # reporter does is speak up after a merge-group run has already failed,
      # so its failure mode is silence on a path that by definition only runs
      # when something else broke. The PR-number extraction is the load-bearing
      # part -- it decides WHICH pull request gets commented on.
      - name: Test merge-queue ejection reporter (BLO-26675)
        if: ${{ !cancelled() }}
        run: node --test ./.github/scripts/tests/report-merge-queue-ejection.test.mjs
        timeout-minutes: 1

      # BLO-28886 AC3. Same silence-shaped failure mode one step earlier: the
      # flake ledger is fed by an artifact, and every way of breaking it
      # (dropping `if: always()`, dropping the env var, colliding the report
      # filenames) produces NO artifact rather than a red run. Every assertion
      # in here has been mutation-tested -- revert any one guard and this fails.
      - name: Test vitest flake-report wiring (BLO-28886)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/vitest-flake-report.test.mjs
        timeout-minutes: 1

      # The aggregator the step above feeds. Unregistered it would be a comment:
      # the guards pass locally and nothing enforces them on the next edit.
      - name: Test vitest flake ledger (BLO-28886)
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/vitest-flake-ledger.test.mjs
        timeout-minutes: 1

      - name: Validate dependency resolution when manifests change
        id: regen_lockfile
        if: ${{ !cancelled() }}
        run: |
          changed="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          manifest_pattern='(^|/)package\.json$|^pnpm-workspace\.yaml$|^\.npmrc$|^pnpmfile\.(cjs|js|mjs)$'
          if printf '%s\n' "$changed" | grep -Eq "$manifest_pattern"; then
            pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
            echo "regenerated=1" >> "$GITHUB_OUTPUT"
          else
            echo "regenerated=0" >> "$GITHUB_OUTPUT"
          fi

      # Manifest-only PRs (where pnpm-lock.yaml stays at base because the policy
      # job above blocks committing it) need the regenerated lockfile for the
      # downstream `pnpm install --frozen-lockfile` steps. Upload it here so
      # every job consumes the same hash without recomputing.
      - name: Upload regenerated lockfile for downstream jobs
        if: ${{ !cancelled() && steps.regen_lockfile.outputs.regenerated == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error

      # BLO-32682: when a step above is killed by its `timeout-minutes`, GitHub
      # emits only `##[error]The action '<step>' has timed out after 1 minutes.`
      # — no test output, no elapsed time, nothing saying the kill was a
      # DURATION kill. In the checks UI that is indistinguishable from "your
      # diff broke this test", which is what sent the author of #1707 hunting in
      # the wrong file. BLO-32670 re-budgeted the three steps most likely to
      # trip it; it did not make the remaining case legible, and any step can
      # still be killed under sufficient load.
      #
      # Last step in the job on purpose: it reads the step conclusions back off
      # the API, so it can only classify steps that have already finished.
      #
      # Gated on `failure()` so the overwhelmingly common green run pays
      # nothing — no API calls at all. Written `!cancelled() && failure()`
      # rather than a bare `failure()` because every policy step after the first
      # bounded test step must continue past a test failure, which
      # scripts/__tests__/policy-node-test-timeouts.test.mjs asserts by matching
      # the leading `!cancelled()`.
      #
      # Keep the phrase "node<space>--test" out of this comment block: that
      # suite splits the job on `- name:`, so a trailing comment lands in the
      # PREVIOUS step's slice, and it selects test steps by substring — a
      # comment mentioning the runner would make the upload step above look
      # like an unbounded test step.
      - name: Classify step-timeout kills as duration kills, not test failures
        if: ${{ !cancelled() && failure() }}
        # Annotations only. This step decides which WORDING explains a red that
        # has already happened, and must never be able to change the outcome —
        # `policy` fails on the step conclusions themselves either way.
        continue-on-error: true
        # Bounded well inside the 10-minute job ceiling: it makes a handful of
        # API calls on a pool that is, by construction, busy enough to have just
        # killed a step.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `github.job` is the YAML key, which is the job's DISPLAY name only
          # while this job declares no `name:`. The test pins that pairing.
          POLICY_JOB_NAME: ${{ github.job }}
        run: node ./scripts/classify-policy-step-kills.mjs

  # The chart tests under deploy/helm/paperclip/tests/ were never wired into any
  # workflow -- 21 assertions about the manifests we actually ship (Penstock
  # routing, ServiceMonitor RBAC, runtime caches, probes) that no CI run has ever
  # executed. This job runs them, and gates the BLO-20733 approval-plan marker:
  # the release channel's completion check is bound to a marker computed from an
  # unstamped render, which is only sound while stamping perturbs nothing else.
  #
  # Deliberately its own job rather than a step in `policy`: it needs helm and
  # the runner image's pinned yq, and a tooling regression in provisioning those
  # should not take down the gate that every unrelated PR depends on.
  #
  # BLO-31405: a second copy of this suite had landed in parallel as a `policy`
  # step (#965 and #995 crossed, each believing the tests ran nowhere), which is
  # exactly the coupling the paragraph above rejects. It shelled out to `helm
  # template` once per test file, so under `policy`'s 60s step bound its p100 of
  # 73s failed 3 of 25 sampled runs on duration alone — each one skipping every
  # lane that `needs: policy`, on PRs that never touched the chart. Removed. Do
  # not re-add it here: this job is a `verify` lane (see its `needs:`), so a red
  # chart already fails the required check without any `policy` coupling.
  helm_chart:
    name: Helm chart
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-light' }}
    # HANG DETECTOR, NOT A PERFORMANCE BUDGET. BLO-35615 rule; do NOT re-tune
    # from observed durations. W95 = 277 CPU-seconds (p95 counter delta of
    # container_cpu_usage_seconds_total{container="runner"} over the job,
    # n=39 successful runs, 2026-09-19..09-24); F = 0.21 cores, the arc-light
    # worst-case supply floor republished by BLO-35615 rev 3 (2026-09-28). F is
    # taken from arc-light, not arc-merge-queue, because one scalar must cover
    # the worse of the two pools this job runs on.
    # RETRACTED: F = 0.32 / 0.3175 -- p05 of a series filtered to `rate > 0.25`,
    # so >= 0.25 by construction. See the `policy` block above for the full note.
    #   primary: ceil( 277 / (0.21 * 60) ) = ceil( 21.98 ) = 22   <- binds
    #   floor:   ceil( 6 * T_best / 60 )   = ceil( 6 * 35 / 60 ) = 4
    # Both forms are lower bounds; where they disagree the larger wins (see
    # `policy` above).
    # Not previously filed as a cap row -- swept in with BLO-35886 because it is
    # the same defect on the same runner class in the same file, and leaving it
    # at 10 guarantees a sixth row later.
    timeout-minutes: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install helm
        # Pinned: BLO-31405 removed the `policy` copy of the chart render and
        # with it the only pinned setup-helm in this file, leaving the render
        # that gates `verify` floating on whatever `@v4` resolved to that day.
        # A helm release that changes template output would fail every PR with
        # no version to point at.
        #
        # Bumped by hand: dependabot's github-actions ecosystem updates `uses:`
        # refs, not `with:` inputs, so nothing moves this line automatically.
        # BLO-31516.
        #
        # Drift checked 2026-09-20 — the load-bearing token here, because every
        # figure below decays from it. Stated so it stays measurable rather than
        # merely disclosed. Against helm/helm releases on that date: v3.16.3 was
        # published 2024-11-14, so this pin is ~22 months behind. The newest
        # release is v3.22.0 (2026-09-10) — NOT a 4.x, because helm maintains
        # both lines in parallel (v4.0.0 shipped 2025-11-12, newest 4.x is
        # v4.3.0, 2026-09-09, one day older than the 3.x tip). So the low-risk
        # bump is v3.22.0, staying on the pinned major; moving to 4.x is a
        # separate call. Either way a bump changes render output, so it belongs
        # in its own PR with its own green `Helm chart` rather than riding
        # along here. Re-run that comparison when you change the pin, or when
        # the date above is more than a quarter old: if the gap has grown, that
        # is the signal to bump. A prose reword does not need it — the previous
        # pass (2026-09-04, tip v3.21.4) moved only the tip, not the verdict.
        #
        # Prose rather than a soft assertion in the suite, chosen not defaulted:
        # asserting "the pin is within N releases of the tip" means querying the
        # helm/helm releases API from a policy test, and that trades a decaying
        # comment for a gate that goes red on GitHub rate limits and offline
        # runners. BLO-29182 was exactly that failure — network I/O inside this
        # job with no bound below the job cap. A stale date misleads a reader
        # who is already editing this line; a flaky assertion fails PRs that
        # never touched it. So the decay is accepted deliberately, and bounded
        # by pinning it to a date a reader can re-run in one API call:
        #
        #   gh api repos/helm/helm/releases \
        #     --jq '.[]|select(.prerelease|not)
        #           |"\(.tag_name)\t\(.published_at[:10])"' | head -6
        #
        # One page is enough and `--paginate` is wrong here: the 3.x and 4.x
        # tips interleave by date on page 1 (verified 2026-09-21 — v4.3.0
        # 2026-09-09, v3.22.0 2026-09-10, v4.2.4, v3.21.4 ...), and paginating
        # re-applies the filter per page, so later pages emit 2018-era tags.
        # Read the newest tag of EACH major, not just the newest tag.
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Test Helm chart renders
        run: node --test ./deploy/helm/paperclip/tests/*.test.mjs
        # BLO-29182 observed THIS invocation hang: `node --test` has no default
        # per-test timeout and these tests shell out to `helm`, which does
        # network I/O, so a stalled fetch has no upper bound below the job cap.
        # That was fixed by bounding the `policy` copy, and BLO-31405 has now
        # removed that copy as a duplicate — so the bound has to live here, or
        # deleting the duplicate would leave the one invocation known to hang
        # unbounded again. 4 min is 3.3x the suite's measured p100 of 73s (25
        # sampled pr.yml runs) and well inside the 10-minute job cap, so a hang
        # fails this step attributably instead of burning the whole budget.
        timeout-minutes: 4

  typecheck_release_registry:
    name: Typecheck + Release Registry
    needs: [policy, ally_verdict]
    # BLO-22428: merge_group traffic on this heavy label starves behind a
    # pull_request backlog on the shared `default` pool (merge-queue check
    # concurrency is 1, so a deep PR queue blocks the one queue that lands
    # code without itself needing proportional capacity). Route merge_group
    # runs to the dedicated arc-merge-queue pool instead; pull_request uses
    # its own lightweight, repository-scoped pool so other repositories retain
    # bounded capacity on the shared default label.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # ARC setup plus the sequential build-gap typechecks exceeded the previous
    # 20-minute ceiling while the final UI typecheck was still making progress.
    #
    # 50, not 40. BLO-33313 swept 598 pr.yml runs (2026-09-04..09-12): p100 of
    # 459 successful runs here was 38.2m, i.e. 96% of the old 40m cap,
    # with a cap-band kill to match (run 34286001265, cancelled at 40.3m while
    # sibling jobs ran on and succeeded for another 37m -- so the run was alive
    # and the cancel was job-scoped, not a push supersede). 45 would pass that
    # row's own "p100 <= 85% of cap" test by a tenth of a point, which is not a
    # margin; 50 puts p100 at 76%.
    #
    # POOL-OCCUPANCY MODEL, shared by every cap BLO-33313 raised (its AC4).
    # These jobs run on arc-paperclip-general (maxRunners 16, observed at 16/16
    # with runners pending -- BLO-22835) or, for merge_group, arc-merge-queue
    # (maxRunners 12). Raising a cap by D minutes costs nothing on a job that
    # finishes; only a job that HANGS to the ceiling burns the delta. So the
    # worst case is D runner-minutes per hang -- one slot, i.e. 1/16 of the
    # pull-request pool, held D minutes longer. Against that, every ceiling kill
    # the raise converts into a success returns the whole old cap AND the re-run
    # the kill forces, which nothing here counts. Cap-band kills are an upper
    # bound on hangs, so each raise below is at worst old_cap : D per kill --
    # 40:10 here. Re-derive if arc-paperclip-general shrinks (BLO-23434,
    # BLO-25404, BLO-30085).
    #
    # The whole-file trade, as a number. The window held 16 cap-band kills
    # across the four caps raised here (Build 7, General tests 6, Typecheck 2,
    # Canary 1) costing 800 dead runner-minutes. If EVERY one of them were a
    # true hang the raises would add 7*5 + 6*20 + 2*10 + 1*5 = 180 runner-
    # minutes per window and recover nothing; if every one were a ceiling kill
    # they recover all 800 plus the forced re-runs. Break-even is therefore a
    # 180/800 = 23% ceiling-kill share. The evidence says the real share is far
    # above that: the kill durations are CONTIGUOUS with the upper tail of the
    # successful distribution (successful Builds reach 20.0m and the kills land
    # at 20.0-20.8m; successful server shards reach 89.7m and the kills land at
    # 90.3-90.5m), which is the ceiling signature -- a genuinely hung job has no
    # reason to stop within half a minute of p100.
    #
    # Honest caveat: the kills are not uniform in time. 11 of the 16 fall on
    # 2026-09-06 alone, so a large share of this cost is one contention
    # episode rather than steady-state work growth (BLO-33313 lists that
    # separation as not verified, and this sweep does not settle it either).
    # That argues FOR the headroom rather than against it -- absorbing a bad
    # runner day instead of converting it into discarded work is what the
    # margin is for -- but do not read 800/window as a steady-state rate.
    timeout-minutes: 50

    steps:
      # Path-scoped on pull_request only. The job always runs and reports, so
      # `verify` sees this lane succeed; when policy's selector
      # (scripts/select-ci-suites.mjs) finds no changed path that can reach the
      # workspace build, every step below is skipped. That is its
      # `release_dry_run_needed` output, the one Canary Dry Run already skips
      # on: every workspace, every script, every root file that is not prose,
      # pr.yml, .github/actions, patches/, and every file a closure source
      # names. Over the 24 h to 2026-11-06, 7 of 45 pull_request runs ran this
      # lane and Build in full on such a diff (23,339 CPU-seconds). Only the
      # literal 'false' skips, so a selector fault or an empty output runs the
      # lane, and merge_group always runs it on the merged tree.
      - name: Resolve whether this diff can reach this lane
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRY_RUN_NEEDED: ${{ needs.policy.outputs.release_dry_run_needed }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$RELEASE_DRY_RUN_NEEDED" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Typecheck + Release Registry skipped::policy's path selector found no changed path that can reach the workspace build (release_dry_run_needed; see its 'Select suites reachable from this diff' step). The merge group runs this lane in full."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: steps.select.outputs.run == 'true' && needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Restore-only: no job in this workflow writes the pnpm store. See
      # .github/actions/restore-pnpm-store/action.yml for why setup-node's
      # `cache: pnpm` is gone.
      - name: Restore pnpm store
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/restore-pnpm-store

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspaces whose build scripts skip TypeScript
        if: steps.select.outputs.run == 'true'
        run: pnpm run typecheck:build-gaps

      - name: Check server tests for undefined identifiers
        if: steps.select.outputs.run == 'true'
        run: pnpm run check:test-undefined-symbols

      - name: Test undefined-identifier guard failure modes
        if: steps.select.outputs.run == 'true'
        run: node --test scripts/check-test-undefined-symbols.test.mjs

      # PEN-5272. This one is registered HERE, not in `policy`, because it
      # imports the `typescript` package and `policy` never runs `pnpm install`
      # -- registering it there would fail on ERR_MODULE_NOT_FOUND rather than
      # on anything about the extractor.
      - name: Test proposed-telemetry extractor (PEN-5272)
        if: steps.select.outputs.run == 'true'
        run: node --test scripts/extract-proposed-events.test.mjs

      # BLO-38582: server's `typecheck` script runs this config, but NOTHING on
      # pull_request or merge_group runs that script -- `typecheck:build-gaps`
      # filters server out (its build already contains `tsc`), and the only
      # `pnpm -r typecheck` lives in release-verify.yml, which is
      # workflow_call-only. Without this step the allowlist is enforced solely
      # at release, so a regression merges green. Sibling of the guard above:
      # same file class, same job.
      #
      # `ensure-build-deps` is NOT redundant with `typecheck:build-gaps`: that
      # script only runs it inside `if (buildGapPackages.length > 0)`
      # (scripts/run-typecheck-build-gaps.mjs:178-179), so the prerequisite is
      # contingent on an unrelated set being non-empty. It is declared inside
      # `typecheck:tests` rather than inlined here, so the invocation has ONE
      # definition that this step and server's own `typecheck` both reach.
      - name: Typecheck allowlisted server tests
        if: steps.select.outputs.run == 'true'
        run: pnpm --filter @paperclipai/server run typecheck:tests

      - name: Verify release registry test coverage
        if: steps.select.outputs.run == 'true'
        run: pnpm run test:release-registry

  worktree_install:
    name: Worktree install (NODE_ENV=production)
    needs: [policy, ally_verdict]
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    timeout-minutes: 20
    # Regression guard for BLO-19064. pnpm treats NODE_ENV=production as an
    # implicit `--prod` and silently skips every devDependency while still
    # exiting 0. The agent toolchain image inherits NODE_ENV=production from the
    # paperclip-runtime base, so without `production=false` in .npmrc a fresh
    # install leaves no vitest/typescript/tsx and no test, typecheck or build
    # entrypoint can run. This job pins NODE_ENV=production on purpose so that
    # removing that .npmrc line fails CI instead of silently disarming the fleet.
    env:
      NODE_ENV: production

    steps:
      # Merge-group trim (policy's `Decide merge-group heavy-lane trim`). The
      # job always runs and reports, so `verify`'s lane list and its
      # success/failure semantics are unchanged; when trimmed, every step below
      # is skipped and the job succeeds in seconds. Only the literal 'true',
      # only on merge_group, only with PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE unset.
      - name: Resolve merge-group trim for this lane
        id: trim
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_FULL_SUITE: ${{ vars.PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE }}
          LANE_TRIM: ${{ needs.policy.outputs.merge_group_trim_worktree_install }}
        run: |
          # Read the kill switch as decideTrim does (trim + lowercase), so TRUE or
          # " true" un-trims this lane too; interior whitespace only un-trims more.
          full_suite=$(printf '%s' "$MERGE_GROUP_FULL_SUITE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ "$EVENT_NAME" = "merge_group" ] && [ "$full_suite" != "true" ] && [ "$LANE_TRIM" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Worktree install trimmed in merge group::the queued PR's head already passed this lane in pull_request CI and the queue applies exactly that change set (see policy's 'Decide merge-group heavy-lane trim' step). Set PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE=true to restore the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.trim.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        if: steps.trim.outputs.run == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: steps.trim.outputs.run == 'true' && needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      # PEN-5032: deliberately NO `cache: pnpm` on this lane, and unlike the
      # other lanes no restore-only `Restore pnpm store` step either (see
      # below). The cache POST-step is what kills this job. `actions/setup-node`
      # saves the pnpm store in a post-step and exposes no timeout on it, so
      # there is nothing to bound in place.
      #
      # Measured on merge-queue head c9021a88 (PR #3105, run 40897060922, job
      # 123533129683): every substantive step passed -- including `Assert the
      # install is complete`, the BLO-19064 guard this lane exists for -- and
      # then `Post Setup Node.js` hung 15:17:35Z -> 15:27:37Z until the job hit
      # its `timeout-minutes: 20` at 20m08s. GitHub reports a timeout kill as
      # `conclusion: cancelled`, `verify` fails closed on a cancelled lane
      # (correctly -- see scripts/__tests__/pr-verify-lane-outcome.test.mjs),
      # and the merge queue ejected a PR whose diff was fine.
      #
      # Giving the restore up costs this lane nothing: it took 27s and MISSED,
      # and the install it guards measured 6m51s cold -- well inside the
      # ceiling.
      #
      # The `NODE_ENV: production` pin in the `env:` block above is NOT part of
      # this reasoning, and the store this lane would save is NOT a thin
      # `--prod` one: `.npmrc` sets `production=false`, which overrides
      # NODE_ENV, and `Assert the install is complete` below fails the job if
      # that ever stops holding. This lane's store is the same dev-inclusive
      # set as every other lane's, so there is no shared-cache-key hazard here
      # to re-derive.
      #
      # Asserted by scripts/__tests__/npmrc-devdeps-guard.test.mjs so the line
      # cannot come back silently.
      - name: Setup Node.js
        if: steps.trim.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create a scratch git worktree at the checked-out commit
        if: steps.trim.outputs.run == 'true'
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/worktree-install-check" HEAD
          # The worktree materializes files from git HEAD, so it would miss a
          # lockfile the policy job regenerated and uploaded. Carry that one over
          # or --frozen-lockfile fails on ERR_PNPM_OUTDATED_LOCKFILE.
          cp pnpm-lock.yaml "$RUNNER_TEMP/worktree-install-check/pnpm-lock.yaml"

      - name: Install into the worktree
        if: steps.trim.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/worktree-install-check
        run: pnpm install --frozen-lockfile

      - name: Assert the install is complete
        if: steps.trim.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/worktree-install-check
        run: |
          set -euo pipefail
          echo "NODE_ENV=${NODE_ENV:-<unset>}"

          missing=0
          for dep in vitest typescript esbuild cross-env @playwright/test; do
            if [ -e "node_modules/$dep" ]; then
              echo "  ok       node_modules/$dep"
            else
              echo "  MISSING  node_modules/$dep"
              missing=1
            fi
          done

          if [ ! -x node_modules/.bin/vitest ]; then
            echo "  MISSING  node_modules/.bin/vitest"
            missing=1
          else
            echo "  ok       node_modules/.bin/vitest"
          fi

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Root devDependencies were not installed. pnpm most likely pruned them"
            echo "because NODE_ENV=production; check that .npmrc still sets production=false."
            exit 1
          fi

          pnpm exec vitest --version

      - name: Remove the scratch worktree
        if: always() && steps.trim.outputs.run == 'true'
        run: git worktree remove --force "$RUNNER_TEMP/worktree-install-check" || true

  opencode_responses_replay:
    name: OpenCode Responses replay
    needs: [policy, ally_verdict]
    # Keep this merge_group dependency off the shared default pool too; leaving
    # even one required lane there would preserve the starvation path.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    timeout-minutes: 15

    steps:
      # Merge-group trim (policy's `Decide merge-group heavy-lane trim`). The
      # job always runs and reports, so `verify`'s lane list and its
      # success/failure semantics are unchanged; when trimmed, every step below
      # is skipped and the job succeeds in seconds. Only the literal 'true',
      # only on merge_group, only with PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE unset.
      - name: Resolve merge-group trim for this lane
        id: trim
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_FULL_SUITE: ${{ vars.PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE }}
          LANE_TRIM: ${{ needs.policy.outputs.merge_group_trim_opencode_responses_replay }}
        run: |
          # Read the kill switch as decideTrim does (trim + lowercase), so TRUE or
          # " true" un-trims this lane too; interior whitespace only un-trims more.
          full_suite=$(printf '%s' "$MERGE_GROUP_FULL_SUITE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ "$EVENT_NAME" = "merge_group" ] && [ "$full_suite" != "true" ] && [ "$LANE_TRIM" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=OpenCode Responses replay trimmed in merge group::the queued PR's head already passed this lane in pull_request CI and the queue applies exactly that change set (see policy's 'Decide merge-group heavy-lane trim' step). Set PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE=true to restore the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.trim.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        if: steps.trim.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the pinned OpenCode release
        if: steps.trim.outputs.run == 'true'
        run: |
          set -euo pipefail
          version="$(node -e '
            const source = require("node:fs").readFileSync("Dockerfile.runtime", "utf8");
            const match = source.match(/^ARG OPENCODE_AI_VERSION=(\S+)$/m);
            if (!match) process.exit(1);
            process.stdout.write(match[1]);
          ')"
          npm install --prefix "$RUNNER_TEMP/opencode-replay" --omit=dev "opencode-ai@$version"
          binary="$RUNNER_TEMP/opencode-replay/node_modules/.bin/opencode"
          test "$("$binary" --version)" = "$version"
          echo "OPENCODE_REPLAY_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Replay framed and malformed Responses streams
        if: steps.trim.outputs.run == 'true'
        run: node scripts/smoke/opencode-responses-replay.mjs

  opencode_k8s_seed_cold_start:
    name: k8s-ro seed transport cold start
    needs: [policy, ally_verdict]
    # BLO-23422: the general-server shard already runs this suite once. This lane
    # exists to prove the cold-start property specifically — OpenCode migrates its
    # SQLite store once per state home, and the suite creates a fresh one per run,
    # so each iteration below is a genuine cold start rather than a warmed repeat.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # Must cover the suite's own worst case, not the observed ~25s: each iteration
    # allows 270s for the beforeAll migration (MIGRATION_TIMEOUT_MS + 30s) plus 150s
    # for the test (TEST_TIMEOUT_MS), so three iterations can reach 21 minutes before
    # checkout, setup, and install. A 20-minute cap would have GitHub kill the job in
    # precisely the slow-cold-migration case this lane exists to catch, discarding the
    # diagnostics the watchdog is meant to preserve. Keep this above 3 * (270s + 150s)
    # plus setup margin if either budget in the suite changes.
    #
    # BLO-33313 AC3 audited this cap and deliberately LEFT it at 30. p100 of
    # 486 successful runs is 27.3m = 91% of the cap, which fails that
    # row's "p100 <= 85% of cap" test -- but that test is the wrong instrument
    # here, because this cap is derived from the suite's own declared budget
    # (the 3 * (270s + 150s) above) rather than fitted to an observed
    # distribution. p50 is 5.3m and p90 8.9m, so the outlier is one run
    # that spent most of the budget the suite declares for itself: the cap
    # working as designed, not a cap running out of room. Zero cap-band
    # kills in 598 runs. Re-derive this number when MIGRATION_TIMEOUT_MS,
    # TEST_TIMEOUT_MS, or the iteration count changes -- NOT when p100/cap moves.
    timeout-minutes: 30

    steps:
      # Merge-group trim (policy's `Decide merge-group heavy-lane trim`). The
      # job always runs and reports, so `verify`'s lane list and its
      # success/failure semantics are unchanged; when trimmed, every step below
      # is skipped and the job succeeds in seconds. Only the literal 'true',
      # only on merge_group, only with PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE unset.
      - name: Resolve merge-group trim for this lane
        id: trim
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_FULL_SUITE: ${{ vars.PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE }}
          LANE_TRIM: ${{ needs.policy.outputs.merge_group_trim_opencode_k8s_seed_cold_start }}
        run: |
          # Read the kill switch as decideTrim does (trim + lowercase), so TRUE or
          # " true" un-trims this lane too; interior whitespace only un-trims more.
          full_suite=$(printf '%s' "$MERGE_GROUP_FULL_SUITE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ "$EVENT_NAME" = "merge_group" ] && [ "$full_suite" != "true" ] && [ "$LANE_TRIM" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=k8s-ro seed transport cold start trimmed in merge group::the queued PR's head already passed this lane in pull_request CI and the queue applies exactly that change set (see policy's 'Decide merge-group heavy-lane trim' step). Set PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE=true to restore the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.trim.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        if: steps.trim.outputs.run == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: steps.trim.outputs.run == 'true' && needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        if: steps.trim.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore pnpm store
        if: steps.trim.outputs.run == 'true'
        uses: ./.github/actions/restore-pnpm-store

      - name: Install dependencies
        if: steps.trim.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # Match the sibling test lanes, which reach vitest through `pnpm test:run:*`
      # and so always relink stale workspace packages first. This lane invokes
      # vitest directly, so it has to run the preflight itself.
      - name: Ensure workspace package links
        if: steps.trim.outputs.run == 'true'
        run: pnpm run preflight:workspace-links

      - name: Run the focused regression three times from a clean OpenCode home
        if: steps.trim.outputs.run == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::k8s-ro seed transport cold start ${attempt}/3"
            pnpm vitest run server/src/__tests__/opencode-k8s-seed-transport.test.ts
            echo "::endgroup::"
          done

  general_tests:
    name: General tests (${{ matrix.group_label }})
    needs: [policy, ally_verdict]
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # Embedded Postgres can spend tens of seconds per suite waiting on shared
    # ARC node storage. A server shard reached the previous 60-minute ceiling
    # while still advancing through passing suites, so retain a bounded margin
    # without treating runner I/O contention as a test failure.
    #
    # PER-VARIANT, not matrix-wide -- BLO-33313 AC2. One cap across six jobs of
    # very different size was simultaneously too tight for one half of the
    # matrix and roughly 3x too loose for the other. p100 of successful runs
    # against the old single 90m cap: server 4/4 89.7m (100%), server 2/4
    # 89.3m (99%), server 1/4 88.3m (98%), server 3/4 81.4m (90%),
    # workspaces-a 55.9m (62%), workspaces-b 25.7m (29%). All SIX cap-band
    # kills in the window were server shards -- 4/4 x3, 2/4 x2, 1/4 x1, and
    # ZERO on either workspaces shard. Run 34023045937 is the clean instance:
    # three cancels spread over 2h06m (Build 09:51Z, server 1/4 11:29Z, server
    # 4/4 11:57Z) with Canary, Typecheck and k8s-ro all SUCCEEDING in between.
    # A push supersede cancels every in-flight job at once, so a multi-hour
    # spread rules it out; across the whole window the two populations separate
    # cleanly, every supersede landing within 29s and every kill either alone in
    # its run or 116s-7561s from the next cancel.
    #
    # 110 puts the server shards at 82%. 75 and 45 put workspaces-a/-b at
    # 75% and 57% while LOWERING the ceiling a hung workspaces job
    # can burn -- by 15 and 45 minutes respectively -- which a single
    # matrix-wide 110 would instead have raised for them. See
    # typecheck_release_registry above for the pool-occupancy model.
    #
    # 110 is a ceiling raise and not the durable fix for the server shards.
    # BLO-28956 (the serialized route/authz imbalance across those four
    # shards) is the fix that LOWERS their p100 instead of raising the
    # ceiling, and it has now landed: phase 2 is partitioned by recorded
    # duration like phase 1, and both phases write their own row to the job
    # summary so a regression in either is legible without opening the log.
    #
    # These caps are deliberately UNCHANGED by that landing. The predicted
    # balance is 1.00x on both lanes, but predicted is not measured -- the
    # manifest models per-file test time, not the fixed import/setup cost or
    # runner-to-runner speed, and a shard that is well-packed can still be
    # slow. Lower these only against observed `Vitest phase durations` rows
    # from three consecutive master-based runs, not against the prediction.
    #
    # BLO-36439: every percentage above was measured at shard_count=4 and is
    # now HISTORICAL -- the matrix is 6. Measured critical shard falls ~68.5m
    # -> ~48.5m, so 110 is looser than the 82% it describes, not tighter. Left
    # deliberately: per BLO-35615 this cap is a hang detector, not a
    # performance budget, and is not re-tuned from observed durations. Re-derive
    # it by that rule -- do not scale these numbers by 4/6.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # BLO-28886 AC3. Read by vitest.config.ts, which only registers the JSON
    # reporter when this is set -- so a local `pnpm test` is unchanged. A
    # literal /tmp path, not `${{ runner.temp }}`: the `runner` context is not
    # available in a job-level `env:` block. Matches refresh-shard-manifest.yml.
    env:
      PAPERCLIP_VITEST_REPORT_DIR: /tmp/vitest-reports
    strategy:
      # BLO-33021: fail-fast is right for `pull_request` (one push, show the
      # author every red at once) and wrong for `merge_group`, where there is
      # exactly one landing candidate under maximumEntriesToBuild=1 and the
      # only question is pass/fail. Measured on merge group
      # gh-readonly-queue/master/pr-1393-7cf49b59 (run 34759050138): the
      # `workspaces-b` leg failed at 13:34:05Z -- 18 minutes in -- and the four
      # 110-minute `server n/4` legs kept running for another 40+ minutes,
      # because the merge queue cannot evict a candidate until the required
      # check reports. Six of the 22 merge-group attempts in the preceding 26h
      # failed that way, each burning a full group duration (server-shard p100
      # is 89.7m per the timeout table below) on a verdict already decided.
      # Queue depth was 28 and the head had waited 26.3h.
      #
      # Cancelling the siblings does not soften the gate: `needs.general_tests
      # .result` is `failure` whenever any leg failed regardless of cancelled
      # peers, so the `verify` lane's `success | cancelled | skipped` pass-case
      # is not reachable through this change. A cancelled leg can only reach
      # `scripts/classify-lane-failures.mjs`, which by its own contract may
      # change the wording of a red run and never the gate.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      # Every matrix entry gets an isolated ARC pod/database. Serializing this
      # matrix only lengthens the critical path and leaves on-prem capacity
      # unused when it is available.
      # BLO-36439: 8 = the whole matrix (6 server + 2 workspaces). This MUST
      # track the matrix size -- at 6 it would hold two server shards back
      # behind a full shard duration and make the critical path WORSE than the
      # four-shard layout it replaces, which is the one way this change loses.
      max-parallel: 8
      matrix:
        include:
          - group: general-server
            group_label: server 1/6
            shard_index: 0
            shard_count: 6
            timeout_minutes: 110
          - group: general-server
            group_label: server 2/6
            shard_index: 1
            shard_count: 6
            timeout_minutes: 110
          - group: general-server
            group_label: server 3/6
            shard_index: 2
            shard_count: 6
            timeout_minutes: 110
          - group: general-server
            group_label: server 4/6
            shard_index: 3
            shard_count: 6
            timeout_minutes: 110
          - group: general-server
            group_label: server 5/6
            shard_index: 4
            shard_count: 6
            timeout_minutes: 110
          - group: general-server
            group_label: server 6/6
            shard_index: 5
            shard_count: 6
            timeout_minutes: 110
          - group: general-workspaces-a
            group_label: workspaces-a
            shard_index: ''
            shard_count: ''
            timeout_minutes: 75
          - group: general-workspaces-b
            group_label: workspaces-b
            shard_index: ''
            shard_count: ''
            timeout_minutes: 45

    steps:
      # Path-scoped selection. The job (and so its required-check name and the
      # `verify` aggregation) always exists and always reports; when the diff
      # cannot reach this group every heavy step below is skipped and the job
      # succeeds in seconds. Only the literal 'false' skips, so a selector fault,
      # an empty output or a policy fault runs the suite. A suite that runs and
      # fails fails this job exactly as before: nothing here converts a failure
      # into a skip.
      # The merge-group trim (policy's `Decide merge-group heavy-lane trim`)
      # reaches ONLY the server shards: workspaces-a/-b are the fast unit tests
      # that always run against the merged tree. Same contract as the selector:
      # only the literal 'true', only on merge_group, only with the
      # PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE kill switch unset.
      - name: Resolve whether this diff can reach this suite group
        id: select
        env:
          GROUP: ${{ matrix.group }}
          SERVER_TESTS_NEEDED: ${{ needs.policy.outputs.server_tests_needed }}
          WORKSPACES_A_TESTS_NEEDED: ${{ needs.policy.outputs.workspaces_a_tests_needed }}
          WORKSPACES_B_TESTS_NEEDED: ${{ needs.policy.outputs.workspaces_b_tests_needed }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_FULL_SUITE: ${{ vars.PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE }}
          MERGE_GROUP_TRIM_SERVER: ${{ needs.policy.outputs.merge_group_trim_general_server }}
          PR_FULL_SUITE: ${{ vars.PAPERCLIP_CI_PR_FULL_SUITE }}
          CARRY_GENERAL_SERVER: ${{ needs.policy.outputs.carry_forward_general_server }}
          CARRY_WORKSPACES_A: ${{ needs.policy.outputs.carry_forward_workspaces_a }}
          CARRY_WORKSPACES_B: ${{ needs.policy.outputs.carry_forward_workspaces_b }}
        run: |
          case "$GROUP" in
            general-server) needed="$SERVER_TESTS_NEEDED"; carry="$CARRY_GENERAL_SERVER" ;;
            general-workspaces-a) needed="$WORKSPACES_A_TESTS_NEEDED"; carry="$CARRY_WORKSPACES_A" ;;
            general-workspaces-b) needed="$WORKSPACES_B_TESTS_NEEDED"; carry="$CARRY_WORKSPACES_B" ;;
            *) needed=true; carry=false ;;
          esac
          pr_full_suite=$(printf '%s' "$PR_FULL_SUITE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          # Read the kill switch as decideTrim does (trim + lowercase), so TRUE or
          # " true" un-trims this lane too; interior whitespace only un-trims more.
          full_suite=$(printf '%s' "$MERGE_GROUP_FULL_SUITE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ "$needed" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=General tests skipped::policy's path selector found no changed path that can reach $GROUP (see its 'Select suites reachable from this diff' step)."
          elif [ "$GROUP" = "general-server" ] && [ "$EVENT_NAME" = "merge_group" ] \
            && [ "$full_suite" != "true" ] && [ "$MERGE_GROUP_TRIM_SERVER" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=General tests trimmed in merge group::the queued PR's head already passed every server shard in pull_request CI and the queue applies exactly that change set (see policy's 'Decide merge-group heavy-lane trim' step). Set PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE=true to restore the full suite."
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$pr_full_suite" != "true" ] && [ "$carry" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=General tests carried forward::an earlier head of this PR passed $GROUP and the diff since then cannot reach it (see policy's 'Decide pull-request heavy-lane carry-forward' step). Set PAPERCLIP_CI_PR_FULL_SUITE=true to restore the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: steps.select.outputs.run == 'true' && needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore pnpm store
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/restore-pnpm-store

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The suite scripts compile @paperclipai/shared and plugin-sdk first
      # (ensure-build-deps, 41-57 s per leg). master-health.yml seeds that
      # output on master; a hit makes the compile a 0.5 s freshness check.
      - name: Restore plugin build deps
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/plugin-build-deps

      - name: Run grouped general test suites
        if: steps.select.outputs.run == 'true'
        run: |
          mkdir -p "$PAPERCLIP_VITEST_REPORT_DIR"
          args=(--group '${{ matrix.group }}')
          if [ -n '${{ matrix.shard_count }}' ]; then
            args+=(--shard-index '${{ matrix.shard_index }}' --shard-count '${{ matrix.shard_count }}')
          fi
          pnpm test:run:general -- "${args[@]}"

      # Reuse the checkout, dependency install, cache restore, and embedded
      # Postgres setup already paid for by each server shard. This removes four
      # ARC pod cold starts without reducing serialized-suite coverage.
      - name: Run serialized server test shard
        if: matrix.group == 'general-server' && steps.select.outputs.run == 'true'
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

      # BLO-28886 AC3. `if: always()` is the whole point and is guarded by
      # scripts/__tests__/vitest-flake-report.test.mjs: a flake ledger is built
      # from the runs that FAILED, so an upload that only fires on success
      # collects exactly the reports nobody needs. This lane is ~29% red on
      # `merge_group`, and which shard goes red moves run to run.
      #
      # `if-no-files-found: ignore`, deliberately, NOT `error`: a shard killed
      # at its timeout cap or evicted mid-run writes no report, and this step
      # must never be able to turn an otherwise-green run red. Losing a report
      # costs one row in the ledger; failing the job re-creates the blameless
      # ejection this issue exists to stop.
      #
      # The name carries `github.run_attempt` because a re-run of a failed job
      # is a new attempt of the SAME run, so the same leg would otherwise
      # re-upload a name that already exists and collide. Absorbing that
      # collision is not enough: the re-run is the single most informative
      # event for a flake ledger -- fail->pass across attempts IS the flake
      # signature, and fail->fail is the "genuinely broken" signature. Dropping
      # attempt 2 removes the discriminator, silently, on the ~29%-red lane
      # where re-running is the common path. Uniqueness per attempt keeps both.
      # (`overwrite: true` also clears the collision, but it REPLACES attempt 1
      # with attempt 2 -- the same lost discriminator.)
      #
      # `continue-on-error` then covers what a name cannot: a transient failure
      # in the artifact service itself. Same pattern as the playwright-report
      # upload below, though that step is on @v7 -- this one does not rest on
      # any version's duplicate-name behaviour, because it never submits a
      # duplicate name.
      - name: Upload vitest JSON reports (flake ledger)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ matrix.group }}-${{ matrix.shard_count == '' && 'all' || matrix.shard_index }}-${{ github.run_attempt }}
          path: ${{ env.PAPERCLIP_VITEST_REPORT_DIR }}/*.json
          retention-days: 14
          if-no-files-found: ignore

  vendor_claude_k8s:
    # BLO-17980 / BLO-22506: the claude_k8s adapter templates every agent Job
    # pod. It used to live in kkroo/paperclip-adapter-claude-k8s, outside our
    # GitHub App installation, so a critical credential-injection finding sat
    # there unreviewable by our CI for days. The source is now vendored at
    # vendor/paperclip-adapter-claude-k8s/ and this job is what makes it
    # reviewable: it runs the adapter's own suite, which contains the
    # fail-closed guard rejecting any pod spec that carries a sensitive-named
    # env var (/TOKEN|SECRET|PASSWORD|KEY|CREDENTIAL|AUTH/i) as a literal
    # `value` instead of a secretKeyRef.
    #
    # This package is deliberately outside the pnpm workspace and the root
    # tsconfig project references (see pnpm-workspace.yaml), so nothing else
    # in CI compiles or exercises it. Without this job it is dead-lettered.
    name: Vendored claude_k8s adapter
    runs-on: arc-paperclip-light
    # HANG DETECTOR, NOT A PERFORMANCE BUDGET. BLO-35615 rule; do NOT re-tune
    # from observed durations. W95 = 210 CPU-seconds (p95 counter delta of
    # container_cpu_usage_seconds_total{container="runner"} over the job,
    # n=50 successful runs, 2026-09-19..09-24); F = 0.21 cores, the arc-light
    # worst-case supply floor republished by BLO-35615 rev 3 (2026-09-28).
    # RETRACTED: F = 0.32 / 0.3175 -- p05 of a series filtered to `rate > 0.25`,
    # so >= 0.25 by construction. See the `policy` block above for the full note.
    #   primary: ceil( 210 / (0.21 * 60) ) = ceil( 16.67 ) = 17   <- binds
    #   floor:   ceil( 6 * T_best / 60 )   = ceil( 6 * 62 / 60 ) = 7
    # Both forms are lower bounds; where they disagree the larger wins (see
    # `policy` above).
    # Not previously filed as a cap row -- swept in with BLO-35886 for the same
    # reason as helm_chart above. 10 sat 0.9m under the floor requirement.
    timeout-minutes: 17
    defaults:
      run:
        working-directory: vendor/paperclip-adapter-claude-k8s

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/paperclip-adapter-claude-k8s/package-lock.json

      # --include=dev is explicit: some runner images set `npm config omit=dev`,
      # which silently skips typescript/vitest and turns this job into a no-op
      # that still reports green.
      - name: Install
        run: npm ci --include=dev

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Test
        run: npm test

      # The stored 64-hex integrity manifest that used to be verified here was
      # removed under BLO-35109: it was single-valued, so every pair of
      # concurrent vendored PRs conflicted on it, and it could not tell a bad
      # merge from two good ones (it failed on every combination of two
      # correctly-merged changes). The property it existed for -- vendored
      # source does not change without a provenance row -- is now asserted off
      # the diff by the `Require vendored-adapter source changes to be logged`
      # step in the `policy` job, which stores nothing and so cannot conflict.

      # PEN-3223: the vendored version is recorded in two hand-maintained
      # places — package.json `version` and PROVENANCE.md's Origin table
      # `Current version` — and nothing else compares them. That pair drifted on
      # PR#1862 and survived three heads. Since BLO-35109 withdrew the stored
      # integrity hash, this step is the ONLY machine-checked link between
      # PROVENANCE.md and the tree beside it; the `policy` job's provenance-log
      # check asserts that vendored source carries a log row, not that the
      # recorded version is true. The failure is quiet and lands later: the next
      # vendored change reads the stale table field and bumps from there.
      # BLO-21857 widens it to the lockfile's two copies, which drifted the same
      # way on #1459 (doc said -blockcast.2, package said .3).
      - name: Verify vendored version is recorded consistently
        run: |
          set -euo pipefail
          # `{p;q}` rather than `| head -1`: under `set -o pipefail` a sed that
          # keeps writing after head exits fails the step on SIGPIPE. Safe today
          # only because there is exactly one matching row — a property of the
          # document, not of the pipeline.
          doc=$(sed -n '/^| Current version |/{s/^| Current version | `\([^`]*\)`.*/\1/p;q}' PROVENANCE.md)
          if [ -z "$doc" ]; then
            echo "::error::No 'Current version' row found in PROVENANCE.md's Origin table."
            exit 1
          fi
          # The lockfile carries the version twice and npm ci does not compare
          # either copy against package.json, so both are checked explicitly.
          pkg=$(node -p 'require("./package.json").version')
          lock=$(node -p 'require("./package-lock.json").version')
          lock_self=$(node -p 'require("./package-lock.json").packages[""].version')
          echo "PROVENANCE.md:              $doc"
          echo "package.json:               $pkg"
          echo "package-lock.json:          $lock"
          echo "package-lock.json packages: $lock_self"
          for found in "$pkg" "$lock" "$lock_self"; do
            if [ "$found" != "$doc" ]; then
              echo "::error::Version drift in the vendored tree: PROVENANCE.md records $doc but a manifest says $found."
              echo "Set the same version in package.json, package-lock.json (both copies), and the 'Current version' row of PROVENANCE.md."
              exit 1
            fi
          done

  vendor_opencode_k8s:
    # PEN-3916, mirroring vendor_claude_k8s above. The opencode_k8s adapter
    # renders every opencode_k8s Job spec, INCLUDING ITS PATH, which is a
    # security control (PEN-2527 / PEN-3152 / PEN-3156 route all GitHub egress
    # through wrapper binaries; PEN-3713 makes them win by putting the
    # root-owned image directory first on PATH). It used to be cloned from
    # kkroo/paperclip-adapter-opencode-k8s at a pinned SHA — a personal account
    # no agent seat can push to, measured 2026-10-09 — so a change to that
    # control could be made by one person and nothing here reviewed it. The
    # source is now vendored at vendor/paperclip-adapter-opencode-k8s/ and this
    # job is what makes it reviewable.
    #
    # Without this job the vendored tree is dead-lettered: like its claude
    # sibling it is deliberately outside the pnpm workspace and the root
    # tsconfig project references, so nothing else in CI compiles or exercises
    # it. Vendoring without this job would REMOVE review coverage rather than
    # add it — the in-stage `npm test` in the Dockerfile runs two files.
    name: Vendored opencode_k8s adapter
    runs-on: arc-paperclip-light
    # HANG DETECTOR, NOT A PERFORMANCE BUDGET. BLO-35615 rule. No W95 series
    # exists for this job yet — it is new — so this is NOT derived from the
    # primary form. It is set equal to its claude sibling, which runs the same
    # npm ci + tsc + vitest shape over a tree of comparable size (44 files /
    # 672 tests here against 36 / ~600 there). Re-measure W95 over n>=50
    # successful runs and apply the rule before tuning it, and do NOT lower it
    # from observed durations.
    timeout-minutes: 17
    defaults:
      run:
        working-directory: vendor/paperclip-adapter-opencode-k8s

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/paperclip-adapter-opencode-k8s/package-lock.json

      # --include=dev is explicit: some runner images set `npm config omit=dev`,
      # which silently skips typescript/vitest and turns this job into a no-op
      # that still reports green. Reproduced while vendoring (PEN-3916): on an
      # agent sandbox with `npm config omit=dev`, `npm ci --include=dev` STILL
      # omitted them and `npm test` died with `vitest: not found` — the flag
      # alone did not override the config. NPM_CONFIG_OMIT= is what did.
      - name: Install
        env:
          NPM_CONFIG_OMIT: ""
        run: npm ci --include=dev

      # Fail loudly if the install above did not actually produce the dev
      # toolchain, rather than discovering it as a confusing `tsc: not found`
      # three steps later. The whole job is a no-op without these two.
      - name: Assert the dev toolchain is present
        run: |
          set -euo pipefail
          test -x node_modules/.bin/tsc || { echo "::error::tsc missing — dev dependencies were omitted"; exit 1; }
          test -x node_modules/.bin/vitest || { echo "::error::vitest missing — dev dependencies were omitted"; exit 1; }

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Test
        run: npm test

      # PEN-3223, same failure as the claude sibling: the vendored version is
      # recorded in two hand-maintained places — package.json `version` and
      # PROVENANCE.md's Origin table `Current version` — and nothing else
      # compares them. That pair drifted on the claude tree for three heads.
      - name: Verify vendored version is recorded consistently
        run: |
          set -euo pipefail
          pkg=$(node -p 'require("./package.json").version')
          recorded=$(sed -n 's/^| Current version | `\([^`]*\)`.*/\1/p' PROVENANCE.md | head -1)
          echo "package.json:   $pkg"
          echo "PROVENANCE.md:  $recorded"
          if [ -z "$recorded" ]; then
            echo "::error::No 'Current version' row found in PROVENANCE.md's Origin table."
            exit 1
          fi
          if [ "$pkg" != "$recorded" ]; then
            echo "::error::PROVENANCE.md records version '$recorded' but package.json is '$pkg'."
            echo "Update the 'Current version' row in vendor/paperclip-adapter-opencode-k8s/PROVENANCE.md to: $pkg"
            exit 1
          fi
  # SECRET SCAN (PEN-6245), under the PEN-6170 item-1 ruling.
  #
  # WHY THIS IS A LANE IN `pr.yml` RATHER THAN ITS OWN REQUIRED CONTEXT.
  # Adding a required status check is a branch-protection write, and that route
  # is 403 to every agent identity in this fleet — so as originally filed this
  # control was blocked on a human with repo admin, for no benefit. `verify` is
  # ALREADY required on `master` (legacy protection surface) and is an
  # aggregate fan-in job whose own comment says it exists as that extension
  # point. A lane in `verify`'s verdict is merge-blocking the moment it lands,
  # with no admin and no second ask. It also inherits the merge queue's re-run
  # of the required set on the queue's own commit, so a secret introduced by a
  # merge resolution is scanned too.
  #
  # ⛔ WIRING IS FOUR POINTS, NOT ONE (PEN-6232). `verify` does NOT decide from
  # `needs.*` — it decides from hand-maintained bash arrays. A lane added to
  # `needs:` and nowhere else leaves `verify` GREEN while the lane is RED. This
  # lane is wired at: (1) `verify`'s `needs:`; (2) the classify step's `env:` +
  # `lane_names`/`lane_results`/`lane_job_names`; (3) the DECISION step's
  # `env:` + `lane_names`/`lane_results`; (4)
  # scripts/__tests__/pr-verify-lane-outcome.test.mjs, which now asserts every
  # `needs:` entry appears in BOTH steps' arrays. Point (3) is the one that
  # decides the gate; the test's mutation control removes exactly that and must
  # go red. PEN-6232 remains open and is not discharged by this lane — it is
  # the structural guard for the NEXT lane somebody adds; this is one correct
  # instance, not a guard.
  #
  # ⚠️ AND IT IS SIX POINTS IN THIS REPO, NOT FOUR. PEN-6245 enumerated the
  # four above from `verify` alone; running the suite found two more consumers
  # of `lane_job_names` — `MERGE_GROUP_GATING_JOBS` in
  # scripts/merge-queue-eviction-detector.mjs and `GATING_JOBS` in
  # .github/scripts/sweep-orphaned-merge-group-runs.sh, which decide whether a
  # cancelled merge-group run is scored as a check failure and whether an
  # orphaned run may be cancelled. Both are already pinned to pr.yml by their
  # own tests, so they fail LOUDLY rather than silently — which is why they are
  # a note here and not a second defect. A third list, the lane-result defaults
  # in scripts/__tests__/ally-verdict-gate.test.mjs, is the same shape.
  #
  # ⛔ THIS LANE DOES NOT CLOSE PEN-6170. Measured first-party against this
  # repo's own .gitleaks.toml on 2026-11-09, and previously against bare
  # defaults and both sibling repos' configs in six combinations: gitleaks
  # 8.28.0 MISSES an opaque, non-vendor-prefixed value under an unremarkable
  # name (`signingMaterial`, `nonce`, a k8s `stringData` key), while HITTING
  # the same value under a keyword-bearing name. `generic-api-key` is anchored
  # on the same keyword family as .github/scripts/check-pr-security.mjs, so the
  # two controls share that blind spot rather than covering for each other.
  # What this lane DOES buy over the push-time egress door is spacing and
  # operator insensitivity — a SPACED `=` (PEN-6162) and a `:` binding
  # including YAML/JSON and Kubernetes `stringData` (PEN-6167). See
  # .gitleaks.toml's header for the full measurement.
  #
  # DIFF-AWARE, NOT WHOLE-TREE, AND THAT IS THE WHOLE ADOPTION ARGUMENT.
  # Measured at master 556fd2c0 on 2026-11-09 with the pinned 8.28.0 and this
  # repo's config, over the 250 most recent master commit ranges: 0 fired, 0
  # errors, ~2.1 s per scan. So this gate lands with NO remediation backlog and
  # needed no allowlist sweep. The same invocation over three commits that
  # demonstrably introduced a matching line exits 2 every time (c4af9273,
  # 3fc061c2, ea1d2267) — that positive control is why the 0 is a real zero
  # rather than a mute instrument. A whole-tree scan of the same tree returns
  # 74 findings, all documented false positives and zero credentials; none of
  # them reach this lane, because this lane never scans the tree.
  #
  # `needs: [policy]`, deliberately NOT `ally_verdict`. A secret gate must not
  # sit behind review scheduling: it has to be able to go red on the first push
  # of a PR nobody has looked at yet. It is also light (a blobless checkout and
  # a seconds-long scan), so it does not belong to the CPU waste the Ally hold
  # exists to prevent. Fail-closed either way — if `policy` fails this lane is
  # `skipped`, and the decision step below treats `skipped` as non-success.
  #
  # NO `paths:` FILTER, and do not add one. A credential can arrive in any
  # file, so the trigger must be a superset of the scan. A filter here would
  # make the gate silent on exactly the PR that introduces a secret in a file
  # class nobody predicted.
  secret_scan:
    name: Secret scan
    needs: [policy]
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-light' }}
    # HANG DETECTOR, NOT A PERFORMANCE BUDGET (BLO-35615 rule). This job has no
    # run history of its own, so there is no W95 and no T_best to put in the
    # formula, and inventing one would be worse than borrowing a measured
    # neighbour. BORROWED AND DATED 2026-11-08/09, NOT MEASURED ON THIS JOB:
    # penstock-llm-proxy-core's byte-adjacent `secret-scan` is 20 (PEN-4058,
    # sized against a 1063 s observed max on the same arc-light class), and
    # Blockcast/onprem-k8s#8493 took the same 20 for the same reason. The work
    # here is I/O-bound by inspection — one blobless full-history checkout, one
    # release download, and a scan measured at ~2.1 s over 250 ranges — so the
    # CPU-seconds term does not bound its wall clock and the rule's I/O-bound
    # branch applies. Re-size against this job's own runs once it has ~50.
    timeout-minutes: 20
    # A job-level block REPLACES the workflow-level one rather than merging
    # into it (same note as `policy` and `verify`), and pr.yml declares no
    # workflow-level `permissions:`. `contents: read` is what lets checkout
    # read the repo AND what the one-shot http.extraheader below authenticates
    # the scan's lazy blob fetches with. Nothing here writes.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # fetch-depth: 0 — the scan's range is `<base>..HEAD`, so both ends
          # and everything between them have to be in the object store. A
          # shallow checkout would silently truncate the range at the graft
          # boundary, which is the PEN-4087 failure mode wearing a different
          # hat: fewer commits scanned, still exit 0.
          fetch-depth: 0
          # filter: blob:none is what makes fetch-depth: 0 affordable here —
          # this repo is 9,593 commits and a blobless full clone measured ~8 s
          # on 2026-11-09. The commit graph is complete and exact; the blobs
          # `git log -p` names are fetched on demand.
          #
          # ⚠️ Lazy blob fetching costs ONE fetch PER COMMIT, so it is fine for
          # a PR range (a handful of commits) and PATHOLOGICAL for a wide one:
          # measured 2026-11-09 on this repo, a 239-commit range over a
          # blobless clone had not finished after 8 minutes, against 15.7 s to
          # bulk-fetch all blobs once and 7 s to then scan. If a future arm
          # ever scans a wide range, bulk-fetch first — do NOT "fix" it by
          # narrowing the range, which is PEN-4087 again.
          filter: blob:none
          # Keep checkout from writing the token into .git/config: the scan
          # step injects a one-shot http.extraheader through Git's environment
          # config instead, so no credential is left on disk for anything else
          # in the job to read.
          persist-credentials: false

      - name: Install pinned gitleaks
        id: install_gitleaks
        timeout-minutes: 5
        env:
          # VERSION and SHA256 are held adjacent so a bump has to move both or
          # it fails loudly. 8.28.0 is the version penstock-llm-proxy-core and
          # Blockcast/onprem-k8s both pin.
          #
          # The digest is upstream's own published
          # `gitleaks_8.28.0_checksums.txt` value for linux_x64, independently
          # re-derived by two seats downloading and hashing the artifact
          # (@Devops on #8493 and this seat, 2026-11-08/09 — both agree).
          #
          # Why the checksum is load-bearing rather than hygiene: this binary
          # is put on the runner PATH and executed, so an unverified download
          # is an arbitrary-code path on arc-light. `curl --fail` rejects an
          # HTTP error, not a served-but-wrong artifact.
          VERSION: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail

          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$bin_dir"

          curl --fail --location --silent --show-error \
            --output "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"

          echo "${SHA256}  ${tarball}" | sha256sum --check --strict -

          tar -xzf "$tarball" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"

          # Asserted, not printed: a version that does not match the pin means
          # the PATH entry above lost to something else on the runner, and the
          # scan would then be an unpinned scanner wearing a pinned version
          # number in the logs.
          test "$("$bin_dir/gitleaks" version)" = "$VERSION"

      # Behavioural self-test of the two choices in the scan step that LOOK
      # correct while inert if mis-edited — `--diff-merges=remerge` and the
      # `^{commit}` peel in the range guard. Ported from onprem-k8s#8493, where
      # stripping the peel passed every assertion that existed at the time
      # (PEN-6227). It runs here, inside the lane, against the same pinned
      # binary the scan uses, so it cannot drift away from what it pins.
      - name: Test the scan's merge-diff and range-guard contracts
        timeout-minutes: 3
        run: bash scripts/test-secret-scan-merge-diff.sh "$RUNNER_TEMP/gitleaks-bin/gitleaks"

      - name: gitleaks
        id: gitleaks
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(detect --source . --config .gitleaks.toml --redact --verbose --no-banner)

          # `--verbose` is NOT noise and must not be dropped: without it
          # gitleaks 8.28.0 prints only `leaks found: N` and NO file, line or
          # rule, so a red lane would be unactionable. `--redact` keeps the
          # matched value out of the log while the location is still reported
          # (verified against the pinned binary, 2026-11-09).
          #
          # `--diff-merges=remerge` makes `git log` show a merge commit's
          # CONFLICT-RESOLUTION changes. Plain `git log -p` omits merges
          # entirely; raw `-m` also emits the second-parent/base-side diff,
          # which is outside this PR's range. On a pull_request the checked-out
          # HEAD is GitHub's merge ref, so without this a secret introduced by
          # a merge resolution is scanned by nothing.
          #
          # Every revision the range names is collected rather than re-derived,
          # so the assertion below cannot drift from the range it guards.
          refs=()

          case "$GITHUB_EVENT_NAME" in
            pull_request | merge_group)
              # pull_request: HEAD is refs/pull/N/merge, whose first parent is
              # the base tip, and `base.sha` is that tip — so `base..HEAD` is
              # exactly this PR's own commits plus the merge resolution.
              # merge_group: `base_sha..head_sha` is exactly what the queue
              # entry proposes to land.
              #
              # Asserted rather than defaulted: an empty base here would be an
              # event-payload contract change, and defaulting it to anything
              # would silently rescan either all history — which fires on the
              # 74 documented whole-tree false positives — or nothing at all.
              # PR_BASE_SHA is the workflow-level `env:` above — inherited,
              # not re-declared, the same way every other consumer in this
              # file reads it. It resolves to `pull_request.base.sha` on a
              # PR and to `merge_group.base_sha` in the queue.
              test -n "$PR_BASE_SHA"
              refs+=("$PR_BASE_SHA" HEAD)
              args+=(--log-opts "--diff-merges=remerge ${PR_BASE_SHA}..HEAD")
              ;;
            *)
              echo "::error title=Secret scan has no range for this event::\`${GITHUB_EVENT_NAME}\` is not an event this job knows how to scope a commit range for. Refusing rather than scanning an unintended range."
              exit 1
              ;;
          esac

          # PEN-4087, reproduced first-party against the pinned 8.28.0: a
          # `--log-opts` range naming a ref that does not resolve logs
          # `error="stderr is not empty"` at ERR and then EXITS 0 reporting `0
          # commits scanned` and `no leaks found`. `--exit-code 2` does not
          # change that — it changes the code for a FINDING. So the gate's one
          # dangerous failure is also its silent one, and nothing downstream
          # can recover it: the summary step below would see a step that exited
          # 0 and truthfully report that the scan passed. It did pass. It never
          # looked at a commit.
          #
          # Keyed on whether each revision RESOLVES, deliberately not on the
          # commit count gitleaks reports: an empty range is legitimately zero
          # commits, so a count-based guard would fail those for no reason
          # while this one passes them.
          #
          # `^{commit}` is load-bearing, not decoration. `git rev-parse
          # --verify` accepts a well-formed object NAME without checking the
          # object exists, so an ABSENT 40-hex sha — exactly the shape of
          # `base.sha` — exits 0 unpeeled and 1 peeled. Drop the peel and this
          # guard is inert while still reading correct; the step above pins it.
          for ref in "${refs[@]}"; do
            if ! git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null 2>&1; then
              echo "::error title=Secret scan could not read its commit range::\`${ref}\` does not resolve to a commit in this checkout, so the ${GITHUB_EVENT_NAME} range would have scanned 0 commits and reported no leaks found. Nothing was scanned; this range is UNVERIFIED, not clean."
              exit 1
            fi
          done

          test -n "$GITHUB_TOKEN"
          token_b64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"

          # PEN-4072. `--exit-code 2` is what lets the summary step tell "found
          # a secret" from "could not scan": against the pinned 8.28.0 a
          # finding exits 2, a config that will not load exits 1, an unknown
          # flag 126, a missing binary 127. The branch below tests `== 2`
          # rather than `!= 0` because 1 is not exclusively "gitleaks errored"
          # — the `test -n` assertions above also exit 1 under `set -e` — but
          # nothing except a finding can exit 2.
          #
          # `set +e` starts here, deliberately AFTER those assertions so they
          # stay fatal. The code is published as a step output AND re-raised,
          # so a finding still fails the step and the lane still goes red.
          set +e
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${token_b64}" \
            gitleaks "${args[@]}" --exit-code 2
          code=$?
          unset token_b64
          # Published while `set -e` is still off, deliberately. Re-armed
          # first, a failed output write on a real finding would abort the step
          # before publishing, the summary step would read `none`, and it would
          # announce "not a secret" over a live credential.
          echo "code=$code" >> "$GITHUB_OUTPUT"
          set -e
          exit "$code"

      # ⛔ WARN-ONLY STAGING STEP — PEN-6280. NO FINDING HERE GATES ANYTHING.
      #
      # `continue-on-error: true` means a FINDING here cannot fail this step's
      # job, so no FINDING here can move `needs.secret_scan.result`, and so no
      # FINDING here can reach SECRET_SCAN_RESULT or the `verify` aggregate.
      # That is deliberate: the
      # `opaque-high-entropy-token` rule is being MEASURED here, not enforced.
      #
      # ⚠️ NARROWED 2026-11-09 (PEN-6280) — the unqualified form was false on
      # one path, and is re-quoted here on its own marked line so a `grep`
      # arrival meets the retraction rather than the claim:
      #   WITHDRAWN 2026-11-09: "THIS STEP GATES NOTHING" (unqualified)
      # `continue-on-error` is a STEP property and does NOT cover this JOB's
      # `timeout-minutes: 20` budget, against which this step's 10 minutes are
      # charged. Measured on this job: the capped steps sum to 28 (5 + 3 + 10
      # + 10) against a budget of 20, and `Checkout repository` and `Explain
      # how this lane ended` carry NO cap, so the arithmetic cannot bound the
      # job's wall clock. A job over budget ends `conclusion: cancelled`,
      # which DOES reach SECRET_SCAN_RESULT and fails `verify` CLOSED — the
      # path this same file already records end-to-end at merge-queue head
      # `c9021a88` (20m08s, cancelled, a clean PR ejected from the queue).
      # ⇒ no FINDING here can block a merge; this step's RUNTIME can.
      # ⛔ Sizing the step caps to sum under 20 does NOT close this while two
      # steps are uncapped, and raising the budget trades away a bound whose
      # own header calls it a hang detector, not a performance budget.
      # .gitleaks-staging.toml carries the promotion and withdrawal criteria
      # this step ships with, and the measured reason it is a SECOND
      # INVOCATION against a SECOND CONFIG.
      #
      # TWO MECHANISMS, DIFFERENT JOBS, NEITHER REDUNDANT — stated because the
      # obvious review note is "one of these is belt-and-braces, drop it":
      #   the explicit `exit` codes below set this step's OUTCOME, which is
      #     what a reader and `steps.gitleaks_staging.outcome` see — failure
      #     means "open the summary", success means "scanned, found nothing".
      #   `continue-on-error: true` decides what the JOB sees, and it also
      #     covers the paths the exits below do NOT enumerate — the 10-minute
      #     timeout, an unwritable $GITHUB_STEP_SUMMARY, an OOM-killed scan.
      # Drop the exits and the step is a silent success forever. Drop
      # `continue-on-error` and an unanticipated failure turns a warn-only
      # measurement into a merge blocker.
      #
      # ⛔ DO NOT BUILD ANY CONSUMER ON THIS STEP'S *CONCLUSION*. A
      # `continue-on-error` step that fails reports OUTCOME failure and
      # CONCLUSION success, and the checks API exposes only the latter —
      # measured first-party 2026-11-09 on this repo's own `review` job, n=3
      # (PRs #3589, #3590, #3547): `Run quality gates` carries
      # `continue-on-error: true`, its outcome was failure in all three (its
      # consumer `Fail if quality gates failed` is gated on
      # `steps.quality.outcome == 'failure'` and fired), and the API reports
      # that step as `conclusion: SUCCESS` every time. Control: on the same
      # PRs' passing runs the consumer reads SKIPPED and the job is SUCCESS.
      # ⇒ read `steps.gitleaks_staging.outputs.code` (0 clean / 2 findings /
      # anything else not-scanned), never the step's conclusion.
      # ⛔ DO NOT "simplify" this by moving the rule into .gitleaks.toml and
      # deleting this step. gitleaks' exit code is per-RUN, not per-RULE:
      # measured first-party 2026-11-09, a single config carrying both
      # `useDefault = true` and that rule exits 2 on a finding from the entropy
      # rule ALONE. There is no per-rule severity — `severity = "WARN"` is
      # silently accepted and has no effect. One config can therefore block on
      # BOTH or warn on BOTH, and warning on both silently de-fangs the default
      # rules that PEN-6245 exists to make blocking.
      #
      # ⛔ A FAILED OUTCOME HERE IS NOT A FAILED CHECK AND MUST NOT BE "FIXED"
      # BY ALLOWLISTING. It is this step working, and it did not block a thing
      # — the job's own conclusion is unaffected BY A FINDING, measured below
      # (its RUNTIME is a separate path; see the job-budget note above).
      # Triage the finding; if it is a
      # false positive, that is a DATA POINT FOR THE WINDOW and belongs on
      # PEN-6280, not in an allowlist.
      - name: Secret scan (staging, warn-only)
        id: gitleaks_staging
        # Runs even when the blocking scan above went red, so both readings are
        # always taken at the same head. Gated on the install step because
        # without the binary this step has nothing to say, and it must not
        # report its own absence as a clean scan.
        if: always() && steps.install_gitleaks.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          summary() { echo "$@" >> "$GITHUB_STEP_SUMMARY"; }

          # The range guard is REPEATED here rather than shared with the
          # blocking step, deliberately. A value computed in that step is
          # unavailable when that step fails — which is exactly when this step
          # still has to run — and a staging step that silently scanned nothing
          # is the one failure this whole design is written against.
          if [ -z "${PR_BASE_SHA:-}" ] \
             || ! git rev-parse --verify --quiet "${PR_BASE_SHA}^{commit}" >/dev/null 2>&1 \
             || ! git rev-parse --verify --quiet "HEAD^{commit}" >/dev/null 2>&1; then
            summary "### Secret scan (staging, warn-only) — NOT SCANNED"
            summary ""
            summary "The commit range was unreadable, so **nothing was scanned**. This is"
            summary "UNVERIFIED, not clean. It blocks nothing — this step is warn-only —"
            summary "but do NOT count this PR in the PEN-6280 staging window."
            exit 1
          fi

          token_b64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${token_b64}" \
            gitleaks detect --source . --config .gitleaks-staging.toml \
              --redact --verbose --no-banner --exit-code 2 \
              --log-opts "--diff-merges=remerge ${PR_BASE_SHA}..HEAD" \
              >"$RUNNER_TEMP/staging.out" 2>&1
          code=$?
          unset token_b64

          echo "code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" = 0 ]; then
            summary "### Secret scan (staging, warn-only) — no staging findings"
            summary ""
            summary "The \`opaque-high-entropy-token\` rule scanned this PR's own commit"
            summary "range and matched nothing. **Count this PR in the PEN-6280 window.**"
            exit 0
          fi

          if [ "$code" != 2 ]; then
            summary "### Secret scan (staging, warn-only) — SCAN ERRORED (exit ${code})"
            summary ""
            summary "Nothing was scanned; this is UNVERIFIED, not clean. Do NOT count this"
            summary "PR in the PEN-6280 staging window. This blocks nothing."
            summary ""
            summary '```'
            sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/staging.out" | tail -40 >> "$GITHUB_STEP_SUMMARY"
            summary '```'
            exit "$code"
          fi

          summary "### Secret scan (staging, warn-only) — findings to TRIAGE"
          summary ""
          summary "⛔ **This blocked nothing and is not a verdict.** The"
          summary "\`opaque-high-entropy-token\` rule is in a measurement window"
          summary "(PEN-6280); it is warn-only until promoted or withdrawn. The red mark"
          summary "on this step is the step working, not a failed check."
          summary ""
          summary "Matched values are redacted; file and line are reported so each"
          summary "finding can be triaged. **If one is a real credential, ROTATE IT"
          summary "FIRST** — the commit is already on a remote branch, so dropping it"
          summary "does not un-disclose it. A real finding also means this rule has"
          summary "earned promotion: say so on PEN-6280."
          summary ""
          summary "Expect false positives from long paths, URLs and long camelCase"
          summary "identifiers — that population is what the window is measuring. Triage"
          summary "them onto PEN-6280; do not allowlist them."
          summary ""
          summary '```'
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/staging.out" >> "$GITHUB_STEP_SUMMARY"
          summary '```'
          exit "$code"

      # Diagnostics only. `if: always()` plus `continue-on-error` is
      # load-bearing: this step must never be the reason the lane passes or
      # fails, and it must still run when the scan failed — which is the only
      # time anyone reads it.
      - name: Explain how this lane ended
        if: always()
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.install_gitleaks.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          GITLEAKS_CODE: ${{ steps.gitleaks.outputs.code }}
        run: |
          set -euo pipefail
          code="${GITLEAKS_CODE:-none}"
          {
            if [ "$GITLEAKS_OUTCOME" = success ]; then
              echo "### Secret scan passed"
              echo
              echo "gitleaks 8.28.0 scanned this PR's own commit range — every revision of"
              echo "which was asserted readable before the scan — and found nothing."
              echo
              echo "This is DIFF-AWARE and says nothing about the rest of the tree, and it"
              echo "is name-anchored: it does not see an opaque value under an unremarkable"
              echo "name (PEN-6170). See \`.gitleaks.toml\`'s header."
            elif [ "$GITLEAKS_OUTCOME" = failure ] && [ "$code" = 2 ]; then
              echo "### Secret scan found a secret"
              echo
              echo "**Verdict: this is a gitleaks FINDING, not infrastructure.** Exit code 2"
              echo "is reachable only from a finding (PEN-4072), and the range was asserted"
              echo "readable before the scan ran (PEN-4087)."
              echo
              echo "Read the redacted finding — file, line and rule — in the \`gitleaks\` step."
              echo
              echo "**If it is real: ROTATE THE CREDENTIAL FIRST.** It is already pushed to a"
              echo "remote branch on GitHub, so rewriting or dropping the commit does not"
              echo "un-disclose it. Rotation is the remedy; the history edit is cleanup."
              echo
              echo "**If it is a false positive: add a documented entry to \`.gitleaks.toml\`"
              echo "in THIS PR** and it will go green — gitleaks resolves the config from the"
              echo "WORKING TREE, not from the scanned commits, so the allowlist in force is"
              echo "the one at this PR's own head."
              echo
              echo "> **WARNING — that is also why the PR that trips this scanner can silence it.**"
              echo "> \`.gitleaks.toml\`'s own header states the policy — *\"NO real secret is ever"
              echo "> allowlisted ... documented false positives only\"* — and NOTHING IN THE TOOL"
              echo "> ENFORCES IT. It is enforceable only by review of the \`.gitleaks.toml\` diff."
              echo "> Reviewer: if this PR adds an allowlist entry, that entry IS the change under"
              echo "> review. Author: say in the PR body what the matched value actually is and"
              echo "> why it is not a credential."
            else
              echo "### Secret scan did NOT reach a verdict"
              echo
              echo "**This is not an all-clear and it is not a finding.** The scan did not"
              echo "complete, so this range is UNVERIFIED."
              echo
              echo "| step | outcome |"
              echo "|---|---|"
              echo "| install gitleaks | ${INSTALL_OUTCOME:-not-reached} |"
              echo "| gitleaks | ${GITLEAKS_OUTCOME:-not-reached} |"
              echo "| gitleaks exit code | ${code} |"
              echo
              echo "An exit code of \`none\` means the step failed before the scanner returned"
              echo "— a failed download, a checksum mismatch, or the commit-range assertion"
              echo "refusing a range it could not read. A \`skipped\` outcome means \`policy\`"
              echo "did not succeed; check that job, not this one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ALLY-GATED HEAVY CI (R1). Owner directive 2026-10-07 (~01:55Z): "also
  # actively work to reduce and isolate CPU waste from CI. CI is suboptimal
  # across the org as you saw in this conversation, with jobs running without
  # new signal on each PR, or before ally approved resulting in CI runs that
  # are unecessary." Rolled out at once per the owner, 2026-10-09 (~11:34Z).
  #
  # The heavy lanes (every job on arc-paperclip-general or arc-paperclip-e2e) `needs:`
  # this job, so on a pull_request they wait for a typed, head-bound Ally
  # verdict at the exact head. This job decides WHEN they run, never WHETHER
  # they are required: `verify` still needs every lane and turns a failed or
  # skipped one into a red, so a missing, late or forged verdict can only cost
  # CPU or latency, never let a PR merge without its heavy lanes.
  #
  # Red here is a SCHEDULE STATE, not a finding (AGENTS.md "Heavy CI waits for
  # Ally"). Once Ally posts a clean verdict at this head,
  # dispatch-ally-verdict-ci.yml re-runs this run's failed jobs (this job, the
  # heavy lanes and `verify`) as attempt 2 on the same check suite; the hourly
  # backstop in review-gate-sweep.yml re-tries a lost event.
  #
  # Fail closed, deliberately: it never skips (a skipped job would pass
  # `verify`'s needs), and a missing signal is "not eligible". In this repo
  # B (gate/ally-comment-findings), S (ci/ally-head-attested), or a trusted
  # human /test can release CPU; there is no review/ally-complete producer here.
  #
  # Not held: a PR its own reviewer opened. The server never reports B
  # `success` on one (BLO-34316 withholds a self-attested clean, so B is
  # `neutral`), and nothing publishes S yet, so holding it would hold it for
  # good without S or a human /test. Such a PR runs heavy CI per push until
  # the owner sets ALLY_GATED_CI_HOLD_SELF_AUTHORED=true after a live manual
  # release canary succeeds (see AGENTS.md).
  # Not held either: a fork head. The shared predicate refuses a head outside
  # this repository and both release paths skip one, so it could never be
  # released; it runs heavy CI on every push, as before this gate.
  # ALLY_GATED_CI_BYPASS is the lever for any Ally or Paperclip outage.
  ally_verdict:
    name: ally-verdict
    # BLO-22428: merge_group traffic must not wait behind the pull_request
    # backlog that saturates arc-light; same routing as `policy` and `verify`.
    # The merge_group path is a bare `exit 0`.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-light' }}
    # Measured nowhere yet (new job); a hang detector, not a budget. The work
    # is a Node setup plus three paginated reads, each bounded by the action's
    # own 20s timeout and 3 attempts.
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      checks: read
    steps:
      - name: Decide whether this run waits for an Ally verdict
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          BYPASS: ${{ vars.ALLY_GATED_CI_BYPASS }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HOLD_SELF_AUTHORED: ${{ vars.ALLY_GATED_CI_HOLD_SELF_AUTHORED }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          lower() { printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]'; }
          # The merge queue's landing candidate always builds in full: it is
          # unchanged by this gate (ALLGREEN, `verify` required).
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "merge_group: heavy lanes run in full; no Ally wait."
            echo "evaluate=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Kill switch. Compared case-insensitively, as an Actions expression
          # and the shared predicate compare it. It restores per-push heavy CI
          # outright (drafts included, as before this gate); enforcement is
          # unchanged because `verify` still needs every lane.
          if [ "$(lower "${BYPASS:-}")" = "true" ]; then
            echo "::notice title=ally-verdict bypassed::ALLY_GATED_CI_BYPASS=true: heavy CI runs per push; enforcement is unchanged."
            echo "evaluate=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error title=ally-verdict::Unexpected event '$EVENT_NAME'; refusing to release heavy lanes."
            exit 1
          fi
          # A fork head can never be released: the shared predicate refuses a
          # head outside this repository, and both release paths (the
          # dispatcher's check_run arm and the hourly backstop) skip one before
          # deciding. Holding it would hold it for good, so it is not held: it
          # runs heavy CI on every push, as before this gate, and `verify` still
          # needs every lane. HEAD_REPO comes from GitHub's event payload; a
          # deleted fork reads empty and is treated as a fork.
          if [ "$(lower "${HEAD_REPO:-}")" != "$(lower "${REPOSITORY:-}")" ]; then
            echo "::notice title=ally-verdict: fork PR::The head is in ${HEAD_REPO:-a deleted fork}, not $REPOSITORY, and no Ally release path acts on a fork head: heavy CI runs per push."
            echo "evaluate=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Self-authored heads need S or an independent human /test. Keep
          # the old exemption until the owner verifies the manual recovery route.
          case "$(lower "${PR_AUTHOR:-}")" in
            allyblockcast|allyblockcast\[bot\]|app/allyblockcast)
              if [ "$(lower "${HOLD_SELF_AUTHORED:-}")" != "true" ]; then
                echo "::notice title=ally-verdict: self-authored PR::$PR_AUTHOR opened this PR, so Ally's verdict cannot be B success here (BLO-34316) and ci/ally-head-attested is not published yet: heavy CI runs per push. The owner sets ALLY_GATED_CI_HOLD_SELF_AUTHORED=true after the human /test recovery route is verified."
                echo "evaluate=false" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          echo "evaluate=true" >>"$GITHUB_OUTPUT"

      # The shared predicate, vendored byte-for-byte from
      # Blockcast/review-gate-action (see its PROVENANCE.json): that repository
      # is private and this one is public, so it cannot be pinned by `uses:`.
      - name: Check out the vendored predicate
        if: ${{ steps.mode.outputs.evaluate == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            .github/actions/verdict-dispatch
            scripts/pr-test-request.mjs
          persist-credentials: false

      - name: Set up Node for the manual request check
        if: ${{ steps.mode.outputs.evaluate == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Check the trusted human test request at this head
        id: manual
        if: ${{ steps.mode.outputs.evaluate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-test-request.mjs check

      - name: Evaluate the Ally verdict at this head
        id: verdict
        if: ${{ steps.mode.outputs.evaluate == 'true' && steps.manual.outputs.manual != 'true' }}
        # Same predicate the dispatcher evaluates, so the job that holds the
        # lanes and the job that releases them agree. No carry-forward input:
        # it stays off with this copy (PROVENANCE.json).
        uses: ./.github/actions/verdict-dispatch
        with:
          github-token: ${{ github.token }}
          pull-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          bypass: ${{ vars.ALLY_GATED_CI_BYPASS }}

      - name: Hold heavy lanes until Ally's verdict
        # Runs after an evaluation ERROR too, so the red always carries the
        # annotation; anything but eligible=true holds the lanes.
        if: ${{ !cancelled() && steps.mode.outputs.evaluate == 'true' }}
        env:
          ELIGIBLE: ${{ steps.manual.outputs.manual == 'true' && 'true' || steps.verdict.outputs.eligible }}
          BASIS: ${{ steps.verdict.outputs.basis }}
          REASON: ${{ steps.verdict.outputs.reason }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$ELIGIBLE" = "true" ]; then
            echo "Heavy lanes released at $HEAD_SHA ($BASIS): $REASON"
            exit 0
          fi
          # The automatic release re-runs attempt 1 only (exactly once per
          # head), so a run someone re-ran by hand must not promise it.
          if [ "${RUN_ATTEMPT:-}" = "1" ]; then
            release="it then reruns automatically."
          else
            release="this run is attempt ${RUN_ATTEMPT:-?}, re-run by hand, so it will not rerun automatically: once that verdict lands, re-run its failed jobs by hand."
          fi
          echo "::error title=awaiting-ally-verdict::Heavy CI waits for a clean Ally verdict at $HEAD_SHA (gate/ally-comment-findings or ci/ally-head-attested success); $release This is a schedule state, not a finding: do not push a fix for it. (${REASON:-no reason reported})"
          exit 1

  verify:
    # Preserve the legacy required-check name while the underlying work runs in parallel.
    # Serialized server suites run inside the general-server matrix jobs,
    # so general_tests remains the required aggregate for both test families.
    name: verify
    if: ${{ always() && !cancelled() }}
    # ⛔ THIS LIST IS NOT THE VERDICT (PEN-6232). `verify` does not decide from
    # `needs.*`. The `Fail if any split verify lane failed` step below IS the
    # gate, and it decides from hand-maintained bash arrays — `lane_names` and
    # `lane_results`, fed by an explicitly enumerated `env:` block — setting
    # `any_non_success` from that loop alone. Every
    # `contains(needs.*.result, 'failure')` expression in this job is an `if:`
    # gate on a classify-path step, and those steps choose the WORDING of the
    # failure annotation, never whether `verify` passes; the classify step says
    # so in its own comment.
    #
    # ⇒ A JOB ADDED HERE AND NOWHERE ELSE IS INVISIBLE TO THE VERDICT. GitHub
    # waits for it, the job fails, the aggregation loop never looks at it, and
    # `verify` reports success — the required context is green and the gate did
    # not run.
    #
    # Adding a lane means wiring it at EVERY one of these, not only here:
    #   1. this `needs:` list;
    #   2. `Classify failed lanes as infrastructure kills or real failures` —
    #      its `env:` block, plus `lane_names`, `lane_results`, `lane_job_names`;
    #   3. `Fail if any split verify lane failed`, THE DECISION STEP — its
    #      `env:` block, plus `lane_names` and `lane_results`. This is the point
    #      that decides the gate: 2 can be wired perfectly and `verify` still
    #      goes green while the lane is red;
    #   4. scripts/__tests__/pr-verify-lane-outcome.test.mjs, the suite that
    #      pins this wiring. Run it after any change here.
    # `lane_job_names` also has consumers OUTSIDE this file, which score whether
    # a cancelled or orphaned merge-group run counts as a check failure:
    # `MERGE_GROUP_GATING_JOBS` in scripts/merge-queue-eviction-detector.mjs and
    # `GATING_JOBS` in .github/scripts/sweep-orphaned-merge-group-runs.sh. Both
    # are pinned to this file by their own tests, so they fail loudly rather
    # than silently.
    #
    # `ally_verdict` is deliberately NOT a lane: it has its own branch in the
    # decision step (`ALLY_VERDICT_RESULT`) and is kept out of the lane arrays
    # so the classifier never reads a schedule hold as a runner kill.
    needs:
      [
        helm_chart,
        typecheck_release_registry,
        general_tests,
        worktree_install,
        opencode_responses_replay,
        opencode_k8s_seed_cold_start,
        build,
        vendor_claude_k8s,
        vendor_opencode_k8s,
        secret_scan,
        ally_verdict,
      ]
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-light' }}
    # BLO-28999: the failure path below adds checkout + Node setup + up to N+1
    # API round trips, and it runs precisely when the pool is saturated. At the
    # previous 5 minutes a slow classify step could time `verify` out and lose
    # the annotation entirely — the one thing this job exists to emit. The
    # classify step carries its own tighter bound, so this ceiling only has to
    # cover the setup around it. This 10 is NOT derived by the BLO-35615 rule
    # that sizes `policy` above: W95 = 27 CPU-seconds, but over only n=3 runs
    # (2026-09-19..09-24), which is too few to be a usable p95. It is far below
    # the 600 x 0.21 = 126 CPU-seconds this cap supplies at that rule's F = 0.21
    # floor -- ~4.7x headroom -- so 10 cannot fire on a healthy run.
    # RETRACTED: F = 0.32 / 0.3175 -- p05 of a series filtered to `rate > 0.25`,
    # so >= 0.25 by construction. See the `policy` block above for the full note.
    # Re-measure W95 and apply the rule before lowering it; do not tune it from
    # observed durations.
    timeout-minutes: 10
    # BLO-28999: the classify step below is this workflow's first GITHUB_TOKEN
    # consumer, and `pr.yml` declares no workflow-level `permissions:`. Under a
    # restricted default-permissions preset every scope is `none`, the API calls
    # 403, and the classifier degrades silently to the pre-existing wording —
    # indistinguishable from "nothing was killed", which is the exact bug this
    # job now exists to fix. Declared explicitly, as `master-health.yml` and
    # `refresh-lockfile.yml` already do for the same reason.
    permissions:
      # A job-level block REPLACES the workflow-level one rather than merging
      # into it (see the same note in `docker.yml`), so `contents: read` is
      # listed deliberately — without it `actions/checkout` below loses repo
      # access and the classify step cannot even find the script.
      contents: read
      # `/actions/runs/{id}/jobs` — the per-job detail and step conclusions.
      actions: read
      # `/check-runs/{id}/annotations` — a DIFFERENT scope from `actions: read`,
      # and the source of the runner-loss annotation that is signal 1.
      checks: read

    steps:
      # BLO-28999: `needs.<lane>.result` cannot distinguish an ARC mid-job
      # runner kill from a real lane failure — GitHub records both as
      # `failure`. Go back to the Actions API for the per-job detail the
      # aggregation step below cannot see, and hand it the subset of failed
      # lanes that were actually killed.
      #
      # All three steps are gated on there being a failure at all, so the
      # overwhelmingly common all-green run pays nothing: no checkout, no
      # toolchain setup, no API calls. That also keeps `verify` light enough
      # not to become a victim of the same pool saturation it now reports on.
      #
      # Not while `ally_verdict` failed: then the heavy lanes did not run, so
      # there is nothing to classify, and a held run is the common pre-verdict
      # state -- these three steps would otherwise cost a checkout and a Node
      # setup on every push. Wording only: the gate below decides either way.
      - name: Checkout repository
        if: ${{ contains(needs.*.result, 'failure') && needs.ally_verdict.result != 'failure' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # `arc-light` does not ship a usable Node by default — the `policy` job
      # on the same pool sets one up explicitly before its `node --test` steps.
      - name: Setup Node
        if: ${{ contains(needs.*.result, 'failure') && needs.ally_verdict.result != 'failure' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Classify failed lanes as infrastructure kills or real failures
        id: classify_lanes
        if: ${{ contains(needs.*.result, 'failure') && needs.ally_verdict.result != 'failure' }}
        # This step decides only which WORDING explains the failure, never
        # whether `verify` passes. If it errors, the aggregation step below
        # still runs (`if: always()`) and falls back to the pre-existing
        # failure wording.
        continue-on-error: true
        # Bounded well inside the job ceiling: this step makes N+1 API calls on
        # a saturated pool, and if it hangs the job timeout would kill `verify`
        # before the aggregation step could emit any annotation at all.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_CHART_RESULT: ${{ needs.helm_chart.result }}
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          WORKTREE_INSTALL_RESULT: ${{ needs.worktree_install.result }}
          OPENCODE_RESPONSES_REPLAY_RESULT: ${{ needs.opencode_responses_replay.result }}
          OPENCODE_K8S_SEED_COLD_START_RESULT: ${{ needs.opencode_k8s_seed_cold_start.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VENDOR_CLAUDE_K8S_RESULT: ${{ needs.vendor_claude_k8s.result }}
          VENDOR_OPENCODE_K8S_RESULT: ${{ needs.vendor_opencode_k8s.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
        run: |
          # Keep these three arrays in the same order — scripts/__tests__/
          # pr-verify-lane-outcome.test.mjs asserts the pairing, and also
          # asserts each lane_job_names entry matches that job's `name:`.
          lane_names=(
            helm_chart
            typecheck_release_registry
            general_tests
            worktree_install
            opencode_responses_replay
            opencode_k8s_seed_cold_start
            build
            vendor_claude_k8s
            vendor_opencode_k8s
            secret_scan
          )
          lane_results=(
            "$HELM_CHART_RESULT"
            "$TYPECHECK_RELEASE_REGISTRY_RESULT"
            "$GENERAL_TESTS_RESULT"
            "$WORKTREE_INSTALL_RESULT"
            "$OPENCODE_RESPONSES_REPLAY_RESULT"
            "$OPENCODE_K8S_SEED_COLD_START_RESULT"
            "$BUILD_RESULT"
            "$VENDOR_CLAUDE_K8S_RESULT"
            "$VENDOR_OPENCODE_K8S_RESULT"
            "$SECRET_SCAN_RESULT"
          )
          lane_job_names=(
            "Helm chart"
            "Typecheck + Release Registry"
            "General tests"
            "Worktree install (NODE_ENV=production)"
            "OpenCode Responses replay"
            "k8s-ro seed transport cold start"
            "Build"
            "Vendored claude_k8s adapter"
            "Vendored opencode_k8s adapter"
            "Secret scan"
          )

          # `failed` and `job_names` are built in lockstep so the Nth failed
          # lane's job name is the Nth entry — the script pairs them by index.
          # Appending to `job_names` outside this branch would map every lane
          # onto the wrong job and silently disable the classifier.
          failed=()
          job_names=()
          for i in "${!lane_names[@]}"; do
            case "${lane_results[$i]}" in
              success | cancelled | skipped) ;;
              *)
                failed+=("${lane_names[$i]}")
                job_names+=("${lane_job_names[$i]}")
                ;;
            esac
          done

          infra=""
          if [ "${#failed[@]}" -gt 0 ]; then
            # The script degrades to an empty set on any error, so a
            # classification problem can never change the gate — only the
            # wording the aggregation step picks. That degradation is silent by
            # design on stdout (which carries the lane list), so surface the
            # script's stderr as a warning annotation: a 403 from a missing
            # token scope would otherwise be indistinguishable from a clean
            # "nothing was killed", and could rot back to silence unnoticed.
            classify_err="$(mktemp)"
            infra="$(LANE_JOB_NAMES="$(printf '%s\n' "${job_names[@]}")" \
              node scripts/classify-lane-failures.mjs "${failed[@]}" 2>"$classify_err" | tail -n 1)"
            if [ -s "$classify_err" ]; then
              echo "::warning title=verify: lane classifier degraded::Runner-kill detection did not produce a verdict, so any killed lane below is reported with the ordinary failure wording. Cause: $(tr '\n' ' ' <"$classify_err")"
            fi
          fi
          echo "infra_lanes=$infra" >>"$GITHUB_OUTPUT"

      # BLO-20867: an upstream lane can end up `cancelled` or `skipped` rather
      # than `failure`. A plain `test "$X" = "success"` makes every one of
      # these look like an identical failing required check, so authors
      # misattribute the outcome to their own diff. Separate them here so the
      # annotation on this job says which ones actually happened — a run can
      # have more than one non-success category at once (e.g. one lane
      # genuinely failed while another was evicted), so every category with
      # at least one lane in it gets its own annotation instead of only the
      # first one checked:
      #   - failure:   the lane ran and reported a result other than success.
      #     Often a real problem with the diff, but a lane can also report
      #     failure due to its own setup/runner trouble — check that lane's
      #     logs rather than assuming the diff is at fault.
      #   - cancelled: the lane was interrupted before it produced a result —
      #     possibly the lane hitting its own `timeout-minutes` cap, possibly
      #     a CI infrastructure interruption (see BLO-20867), possibly a
      #     manual cancellation, and this job cannot distinguish them from
      #     here. Not evidence of a diff problem.
      #     PEN-6599: the cap case was missing from the wording and is the one
      #     that matters, because the advice differs. This file already models
      #     the split — see the PEN-6034 note on the mcp-gateway alert-channel
      #     step in `policy`: "a step timeout reports `failure`, a job timeout
      #     reports `cancelled`". So a STEP cap expiry lands in the `failure`
      #     branch and reaches `classifyJobFailure`, which already calls it a
      #     REAL failure on the stated ground that announcing it as a pool kill
      #     "would invite re-running a hung test forever" — while a JOB cap
      #     expiry lands HERE, never reaches that classifier, and used to be
      #     told to re-run. Two branches, one cause, opposite advice. They now
      #     agree. Wording only: the gate below is unchanged and still fails on
      #     a cancelled lane.
      #   - skipped:   the lane never ran because a dependency it needs
      #     (typically `policy`) did not succeed. The defect, if any, is in
      #     that dependency, not in this lane.
      #   - infrastructure (BLO-28999): the lane's job was killed mid-run by
      #     the runner pool. GitHub reports this as `failure`, so without the
      #     classify step above it is indistinguishable from the first case
      #     and reads as a defect in the diff. Split out here so the killed
      #     lane gets the "not your diff, re-run it" wording that already
      #     existed for `cancelled` but could never fire for a kill.
      - name: Fail if any split verify lane failed
        # Must run even when the classify step above was skipped or errored —
        # this step IS the gate, and its verdict may never depend on the
        # classifier being available.
        if: always()
        env:
          INFRA_LANES: ${{ steps.classify_lanes.outputs.infra_lanes }}
          # Not a lane: the Ally-gated schedule hold (see `ally_verdict`). Kept
          # out of the lane arrays so the classifier never reads it as a kill.
          ALLY_VERDICT_RESULT: ${{ needs.ally_verdict.result }}
          # Wording only: the automatic release re-runs attempt 1 only.
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HELM_CHART_RESULT: ${{ needs.helm_chart.result }}
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          WORKTREE_INSTALL_RESULT: ${{ needs.worktree_install.result }}
          OPENCODE_RESPONSES_REPLAY_RESULT: ${{ needs.opencode_responses_replay.result }}
          OPENCODE_K8S_SEED_COLD_START_RESULT: ${{ needs.opencode_k8s_seed_cold_start.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VENDOR_CLAUDE_K8S_RESULT: ${{ needs.vendor_claude_k8s.result }}
          VENDOR_OPENCODE_K8S_RESULT: ${{ needs.vendor_opencode_k8s.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
        run: |
          lane_names=(
            helm_chart
            typecheck_release_registry
            general_tests
            worktree_install
            opencode_responses_replay
            opencode_k8s_seed_cold_start
            build
            vendor_claude_k8s
            vendor_opencode_k8s
            secret_scan
          )
          lane_results=(
            "$HELM_CHART_RESULT"
            "$TYPECHECK_RELEASE_REGISTRY_RESULT"
            "$GENERAL_TESTS_RESULT"
            "$WORKTREE_INSTALL_RESULT"
            "$OPENCODE_RESPONSES_REPLAY_RESULT"
            "$OPENCODE_K8S_SEED_COLD_START_RESULT"
            "$BUILD_RESULT"
            "$VENDOR_CLAUDE_K8S_RESULT"
            "$VENDOR_OPENCODE_K8S_RESULT"
            "$SECRET_SCAN_RESULT"
          )

          cancelled_lanes=()
          skipped_lanes=()
          deferred_lanes=()
          failed_lanes=()
          infra_lanes=()
          # Ally-gated heavy CI: anything but success means the heavy lanes were
          # held (or the hold itself errored). Either way this gate fails; a
          # lane skipped under that hold is reported as deferred, not as a
          # broken dependency, and the hold names itself below.
          ally_held=0
          if [ "$ALLY_VERDICT_RESULT" != "success" ]; then
            ally_held=1
          fi
          for i in "${!lane_names[@]}"; do
            lane="${lane_names[$i]}"
            case "${lane_results[$i]}" in
              success) ;;
              cancelled) cancelled_lanes+=("$lane") ;;
              skipped) skipped_lanes+=("$lane") ;;
              *)
                # BLO-28999: a lane the classifier proved was killed mid-job
                # by the runner pool is reported as infrastructure, not as a
                # failure. Anything it could not prove stays a failure — the
                # fallback is the pre-existing wording, so an unavailable or
                # erroring classifier degrades to today's behaviour rather
                # than excusing a real defect.
                is_infra=0
                for infra_lane in $INFRA_LANES; do
                  if [ "$infra_lane" = "$lane" ]; then
                    is_infra=1
                    break
                  fi
                done
                if [ "$is_infra" -eq 1 ]; then
                  infra_lanes+=("$lane")
                else
                  failed_lanes+=("$lane")
                fi
                ;;
            esac
          done

          # Under the hold, a skipped lane was deferred, not broken: report it
          # with the hold below instead of as an unmet dependency. Still not a
          # pass -- the hold itself sets any_non_success.
          if [ "$ally_held" -eq 1 ]; then
            deferred_lanes=("${skipped_lanes[@]}")
            skipped_lanes=()
          fi

          any_non_success=0

          if [ "$ally_held" -eq 1 ]; then
            # The automatic release re-runs attempt 1 only (exactly once per
            # head), so a run someone re-ran by hand must not promise it.
            if [ "${RUN_ATTEMPT:-}" = "1" ]; then
              release="once Ally posts a clean verdict, dispatch-ally-verdict-ci.yml re-runs this run's failed jobs automatically."
            else
              release="this run is attempt ${RUN_ATTEMPT:-?}, re-run by hand, so it is not released automatically: once Ally posts a clean verdict, re-run its failed jobs by hand."
            fi
            echo "::error title=verify: awaiting-ally-verdict::ally-verdict is '${ALLY_VERDICT_RESULT:-unset}', so the heavy lanes wait for an Ally verdict at this head (deferred: ${deferred_lanes[*]:-none}). This is a schedule state, not a finding: $release A lane can also be skipped because 'policy' failed -- check 'policy' if it is red. See AGENTS.md \"Heavy CI waits for Ally\"."
            any_non_success=1
          fi

          if [ "${#failed_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane failure::Upstream lane(s) reported failure: ${failed_lanes[*]}. This may reflect a real problem with the PR diff, but a lane can also fail due to its own setup or runner trouble — check that lane's own logs before assuming the diff is at fault."
            any_non_success=1
          fi

          if [ "${#skipped_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane skipped::Upstream lane(s) did not run: ${skipped_lanes[*]}. GitHub Actions skips a lane when a job it needs (typically 'policy') did not succeed — check that dependency's logs, not this lane's."
            any_non_success=1
          fi

          if [ "${#cancelled_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane cancelled::Upstream lane(s) were CANCELLED, not failed: ${cancelled_lanes[*]}. This is not a report of a defect in this PR's diff — the lane was interrupted before it could produce a result. This job cannot tell the causes apart from here, so read the lane's own log and compare its elapsed time against its own 'timeout-minutes' cap FIRST: (1) the lane hit that cap — its log then carries 'has exceeded the maximum execution time of Nm0s', its elapsed matches the cap, and its post-steps still ran; (2) a CI infrastructure interruption (see BLO-20867); (3) a manual cancellation. Re-running gets a real result for (2) and (3). It does NOT for (1): a lane that blew its cap will usually blow it again, so a re-run costs a full cycle and returns the same outcome — fix the slow work or raise that lane's cap instead."
            any_non_success=1
          fi

          if [ "${#infra_lanes[@]}" -gt 0 ]; then
            echo "::error title=verify: lane infrastructure kill::Upstream lane(s) were KILLED MID-JOB by the CI runner pool, not failed: ${infra_lanes[*]}. This is not a report of a defect in this PR's diff — the runner hosting the lane was terminated before it could produce a result (see BLO-28999). Re-run the job to get a real result."
            any_non_success=1
          fi

          if [ "$any_non_success" -eq 1 ]; then
            exit 1
          fi

  build:
    name: Build
    needs: [policy, ally_verdict]
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # 25, not 20. BLO-33313 measured p100 of 471 successful Build jobs at
    # 20.0m against the old 20m cap -- 100%, the tightest ratio in this
    # file -- with cap-band kills to match (run 34175815206, cancelled at 20.1m
    # while 16 sibling jobs ran on for another 2.5h and most succeeded, so the
    # run was alive and the cancel was job-scoped, not a push supersede). 25
    # puts p100 at 80%. See typecheck_release_registry above for the
    # pool-occupancy model.
    timeout-minutes: 25

    steps:
      # The same pull_request-only path-scoped skip as
      # typecheck_release_registry above; merge_group always builds.
      - name: Resolve whether this diff can reach this lane
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRY_RUN_NEEDED: ${{ needs.policy.outputs.release_dry_run_needed }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$RELEASE_DRY_RUN_NEEDED" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::policy's path selector found no changed path that can reach the workspace build (release_dry_run_needed; see its 'Select suites reachable from this diff' step). The merge group runs this lane in full."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: steps.select.outputs.run == 'true' && needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore pnpm store
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/restore-pnpm-store

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.select.outputs.run == 'true'
        run: pnpm build

  canary_dry_run:
    name: Canary Dry Run
    needs: [policy, ally_verdict]
    # Path-scoped (scripts/select-ci-suites.mjs). Only the literal 'false' skips;
    # an empty/missing output runs the job. Neither this job nor its check name is
    # in `verify`'s needs, so a skip cannot read as a failed or absent lane.
    # Merge-group trim: a job-level skip is safe here for the reason above
    # (not in `verify`'s needs), and costs no runner. Only the literal 'true',
    # only on merge_group, only with PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE unset.
    if: >-
      ${{ needs.policy.outputs.release_dry_run_needed != 'false' &&
      !(github.event_name == 'merge_group' &&
        vars.PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE != 'true' &&
        needs.policy.outputs.merge_group_trim_canary_dry_run == 'true') }}
    # BLO-22428: route merge_group traffic to the dedicated arc-merge-queue
    # pool so pull_request and merge_group traffic cannot starve each other.
    # See typecheck_release_registry above.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-general' }}
    # ARC setup/cache restore plus release.sh's mandatory workspace build hit
    # the previous 20-minute ceiling while the build was still progressing.
    #
    # 45, not 40: BLO-33313 measured p100 of 463 successful runs at 37.0m =
    # 92% of the old cap, with a cap-band kill to match (run 34286001265,
    # cancelled at 40.3m while sibling jobs ran on and succeeded for another
    # 37m, so the run was alive and the cancel was job-scoped). 45 puts p100 at
    # 82%. See typecheck_release_registry above for the pool-occupancy
    # model.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore pnpm store
        uses: ./.github/actions/restore-pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `release.sh` always executes its Step 2/7 workspace build, even when
      # `--skip-verify` bypasses the initial verification gate. release.sh
      # also requires a clean working tree, so any in-place lockfile churn
      # from `pnpm install --frozen-lockfile` must be reverted first — unless
      # the policy job uploaded a regenerated lockfile (manifest-changing
      # PRs), in which case we stage the artifact-restored copy into an
      # ephemeral local commit so release.sh sees a clean tree and its
      # workspace build sees a lockfile that matches the manifest.
      - name: Release canary dry run via release.sh internal build
        env:
          USED_ARTIFACT_LOCKFILE: ${{ needs.policy.outputs.lockfile_regenerated || '0' }}
        run: |
          git checkout -B master HEAD
          if [ "$USED_ARTIFACT_LOCKFILE" = "1" ]; then
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git -c user.email=ci@paperclip.local -c user.name=CI \
                commit --no-verify -m "ci(canary): stage regenerated lockfile"
            fi
          else
            git checkout -- pnpm-lock.yaml
          fi
          ./scripts/release.sh canary --skip-verify --dry-run

  e2e:
    needs: [policy, ally_verdict]
    # Path-scoped (scripts/select-ci-suites.mjs). Only the literal 'false' skips;
    # an empty/missing output runs the job. Neither this job nor its check name is
    # in `verify`'s needs, so a skip cannot read as a failed or absent lane.
    # Merge-group trim: a job-level skip is safe here for the reason above
    # (not in `verify`'s needs), and costs no runner. Only the literal 'true',
    # only on merge_group, only with PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE unset.
    if: >-
      ${{ needs.policy.outputs.ui_e2e_needed != 'false' &&
      !(github.event_name == 'merge_group' &&
        vars.PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE != 'true' &&
        needs.policy.outputs.merge_group_trim_e2e == 'true') }}
    # Keep PR browser suites off the org-wide default pool. Merge groups use
    # the queue's reserved capacity so unrelated repos cannot delay admission.
    # BLO-46675: PR runs use the paperclip-only twin `arc-paperclip-e2e`
    # (onprem-k8s#5894, maxRunners 1), not the shared `arc-e2e`, so this job
    # keeps a runner once org runner group 1 is scoped. The `arc-e2e` figures
    # below are history measured on the shared pool.
    runs-on: ${{ github.event_name == 'merge_group' && 'arc-merge-queue' || 'arc-paperclip-e2e' }}
    # The serial browser suite covers 49 flows (43 before BLO-33282 split
    # smoke-lab into 7). 90, not 75, sized against the measured p100 of
    # SUCCESSFUL runs rather than the median. Every ratio here
    # is stated one way -- p100 as a percentage OF THE CAP -- so it can be
    # compared across jobs without inverting anything.
    #
    # CURRENT REGIME (2026-09-18 onwards). The suite level-shifted ~3.5x DOWN
    # between 09-17 and 09-18 and has held there. 337 e2e jobs over
    # 2026-09-16..09-19, split at that boundary:
    #
    #   09-16..09-17  n=157 success  job p50 31.7 / p90 48.3 / p100 74.4
    #                                suite p50 27.5 / p90 42.3 / p100 67.6  1 kill
    #   09-18..09-19  n=125 success  job p50 14.4 / p90 22.0 / p100 36.2
    #                                suite p50  7.8 / p90 14.7 / p100 32.2  0 kills
    #
    # p100 is now 40% of the cap, not 81%. The shift is NOT the BLO-33282
    # smoke-lab split (which merged 09-19, a day later, and whose file was 1.11m
    # of a 4.1m suite by then) and NOT the BLO-33478 built-bundle change: on
    # 09-18, branches whose head did NOT contain 23f5799e7 ran 9.2-20.1m,
    # i.e. as fast as those that did. The speedup tracks the DATE, not any
    # commit content. Cause UNKNOWN and unchased -- likely runner-side. Both
    # hypotheses above are recorded as FALSIFIED so nobody re-derives them.
    #
    # 90 is RETAINED, deliberately, and not re-sized down to this regime. It is
    # robust to the uncertainty in a way a tighter cap would not be: if the
    # improvement is durable, 90 costs nothing (a cap only bills when it fires,
    # and it has not fired in 146 jobs); if it reverts, 90 is exactly the value
    # the pre-shift window below sized. Sizing a cap tight against an
    # unexplained 2-day improvement is the mistake BLO-32794 was filed to
    # correct, in the other direction.
    #
    # PRIOR REGIME, and still the binding arithmetic if the shift reverts.
    # Measured over 600 pr.yml runs / 598 e2e jobs (2026-09-03..09-11), 434
    # successful: p50 36.0m, p90 52.6m, p100 73.2m. Against the old 75m that is
    # 98% of cap, i.e. 1.8m of margin; against 90 it is 81%, i.e. 16.8m.
    #
    # The two independently-observed tails have not yet co-occurred, and the
    # bound they imply is TIGHTER than an earlier revision of this comment
    # claimed. Worst suite 62.9m (job 103123856477, setup only 9.0m); worst
    # setup 21.0m (job 101223622109, suite only 51.4m). Their sum is 83.8m --
    # 93% of 90, not the 77.2m/86% stated before. That 77.2m came from a
    # 28-job step-level sample whose setup p100 was 14.3m; over all 434
    # successful jobs setup p100 is 21.0m. So 90 is defensible but holds only
    # ~6m against a combination whose parts have both already happened -- do
    # not read the 16.8m p100 margin as the real headroom.
    #
    # Setup is 13% of a MEDIAN job and 25% of that tail bound, so "setup cannot
    # move this" is true of the median only. The tail is driven by
    # `Install Playwright system dependencies` (up to 13.1m) and
    # `Install Playwright browser` (up to 6.2m) -- apt/download variance, not
    # the suite. Baking those into the runner image is the cheapest way to buy
    # tail margin back; nothing here depends on it.
    #
    # 9 jobs died on the clock in that window. The classification rule, stated
    # so it reproduces: a 75m cap cannot end a job BEFORE 75.0m, so a kill is
    # exactly `conclusion == cancelled && 75.0 <= duration <= 80`. All 9 land in
    # 75.6-76.1m -- that tight cluster IS the cap-kill signature. Deliberately
    # excluded: 117 cancels under 70m (push-supersedes), 3 cancels at 70.7/73.6/
    # 73.9m (long supersedes -- below the cap, so they cannot be kills), and 2
    # at 155m/653m (lost-runner orphans -- a 75m cap cannot produce those).
    # Rate = 9 / (434 success + 17 failure + 9 kills) = 9/460 = 2.0%.
    #
    # A cap kill is pure waste: it burns the full budget, produces no verdict,
    # and forces a re-run. Cost of 75 on a demand-bound pool: 9 x 75m nominal
    # = 675 dead runner-min / 9 days x 7 = 525/week (8.8h). That charges each
    # kill the NOMINAL cap, so 525 is a FLOOR -- measured time-to-kill ran
    # 75.6-76.1m, and re-run occupancy is NOT counted at all. Either refinement
    # only makes it worse, so raising the ceiling REDUCES expected arc-e2e
    # occupancy. Only worst-case single-job occupancy rises (+15m). How much 90
    # costs is NOT yet known -- nothing observes how long a killed job would
    # have taken, which is exactly what this change makes measurable.
    # Deliberately left below the ceiling Playwright's own limits can produce
    # (42 tests x 60s + 7 smoke-lab tests x 8m, all x `retries: 1`, plus the
    # 300s webServer boot and measured setup ~= 215m), so a genuinely wedged
    # suite is still killed rather than sitting on a runner. That figure read
    # ~107m before BLO-33282 split smoke-lab, and it was understated even then
    # -- it charged the old 30m `setTimeout` override as 60s.
    #
    # 90 is the DURABLE value, not a stop-gap. BLO-33282 evaluated cross-job
    # sharding as the alternative and ruled against it on measurement; do not
    # re-open it as "the fix nobody got round to".
    #
    # Why sharding does not help here. Per-file wall-times over 6 full runs:
    # `smoke-lab.spec.ts` took 18.6m median / 28.1m p100 -- 44% of a 42.1m
    # suite. Playwright balances shards by TEST COUNT, not duration
    # (testGroups.ts `filterForShard`: "Shards are still balanced by the number
    # of tests, not files"), and shards non-parallel files as whole groups. So
    # when that file was ONE test, `--shard=i/N` put it in a shard with ~half
    # the other 42 tests: simulated against the real algorithm the wall-time
    # miss vs `suite/N` was +34% (N=2), +91% (N=3), +100% (N=4) -- all failing
    # BLO-33282's own <=20% balance criterion. A `--grep @smoke-lab` /
    # `--grep-invert` split DID balance (+12%, wall 23.6m).
    #
    # BLO-33282 then took the OTHER branch of its own AC2 and split that one
    # test into 7 (one per P1-P7 scenario, plain `describe`, 8m each). That was
    # for retry blast radius, not for sharding -- a single hung scenario used to
    # cost 2 x 30m and kill the job by itself. But it also removes the 18.6m
    # irreducible floor the pre-split arithmetic above rests on, so the shard
    # simulation is STALE and must be re-run against the new 49-test shape
    # before anyone quotes those percentages again. It is not evidence that
    # sharding now works; nobody has measured it.
    #
    # The blocker is pool capacity, not suite structure: `arc-e2e` is
    # maxRunners 8 and was observed at 8/8 with 2 pending. Over this window 42%
    # of e2e jobs waited >1m for admission, 27% >5m, 15% >15m (queue p90 22.8m,
    # p99 406m). A 2-way split doubles e2e jobs per PR for +10% total
    # runner-minutes, and the ~18.5m of wall-time it saves is SMALLER than the
    # queue p90 it would worsen. Revisit only once arc-e2e maxRunners rises
    # (BLO-23434) -- then the tag split, not `--shard`, is the mechanism.
    #
    # This job is not special: the same 9-day sweep found 6 more job caps in
    # pr.yml at >=96% of their own p100 (Build 100%, General tests server 4/4
    # 100% and 2/4 99%, policy 99%, server 1/4 98%, Typecheck 96%) and 46 cap
    # kills file-wide costing ~25.7 runner-hours/week. See BLO-32794 for the
    # full per-job table before sizing any other cap here by eye.
    #
    # Setup gained a UI build step (1m44s) below, so the setup side of that
    # table is now understated by about that much. Headroom still grew, not
    # shrank -- like for like, one basis, both attempts green: job end to end
    # 22.3m -> 11.9m and the `Run e2e tests` step 19.6m -> 6.6m (34802954363
    # attempt 2 at pre-fix head fabf0e90b, against 35015220512). The build is
    # what buys that: it lets the suite skip dev middleware (BLO-33478). The
    # ~59m figure sometimes quoted for the same baseline is the suite step of
    # attempt 1 of that run, which FAILED -- that is the clearest evidence the
    # flake is real, but it is not a baseline. Re-measure before trimming this
    # cap.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        if: needs.policy.outputs.lockfile_regenerated == '1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore pnpm store
        uses: ./.github/actions/restore-pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restore-only. playwright-cache-prime.yml saves this key on master, which
      # every scope reads; a save from here would land in a refs/pull/N/merge
      # or single-use gh-readonly-queue/* scope that no later run reads.
      - name: Cache Playwright browser
        id: playwright_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}

      # BLO-27699 (BLO-22675 residue): apt's upstream mirrors (e.g.
      # security.ubuntu.com) fail with a transient "Mirror sync in progress?"
      # size mismatch often enough to take out a merge_group run on their own —
      # run 31107120860 died here and forced PR #1038 to be admin-merged.
      # Retry with backoff before failing the job.
      - name: Install Playwright system dependencies
        run: |
          attempts=3
          delay="${PLAYWRIGHT_INSTALL_DEPS_RETRY_DELAY_SECONDS:-15}"
          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            if pnpm exec playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Playwright system dependency install failed (attempt $attempt/$attempts); retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
            attempt=$((attempt + 1))
          done
          echo "Playwright system dependency install failed after $attempts attempts" >&2
          exit 1

      - name: Install Playwright browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      # Without a built bundle the e2e server falls back to Vite dev middleware
      # and serves the UI as an unbundled module graph, costing 12-41s per
      # navigation (BLO-33478). Build once so the suite exercises the same
      # static bundle production serves.
      - name: Build UI bundle for e2e
        run: pnpm --filter @paperclipai/ui build

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
        run: pnpm run test:e2e

      # Diagnostic-only artifact (retention-days: 1). `if: always()` controls
      # whether this step RUNS, not whether its failure counts -- so a flaky
      # upload fails the step, fails the job, fails the merge-group run, and
      # ejects the PR. That is not hypothetical: it ejected #1512 and #1516 on
      # 2026-08-27 with every e2e test green (41 passed / 0 failed on #1512).
      # Nothing downstream consumes this report, so its failure must not gate a
      # merge. The lockfile upload in `policy` is deliberately left blocking --
      # downstream jobs install from it. BLO-29023.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 1
