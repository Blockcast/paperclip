        timeout-minutes: 1

      - name: Test CI suite selector
        if: ${{ !cancelled() }}
        run: node --test ./scripts/__tests__/select-ci-suites.test.mjs
        timeout-minutes: 3

      # PEN-4282. Cross-artifact string comparison between the k8s-ro coverage
      # register and the doc table that documents it. Deliberately here and not
      # in the mcp-gateway vitest suite: reading `docs/` from a selectable suite
