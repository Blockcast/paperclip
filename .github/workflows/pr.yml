      # queue head this job already checks out, so `--head` is a no-op there and the
      # diff still spans every entry queued ahead of this one -- same reason the
      # `Select suites reachable from this diff` step gives for its own cumulative diff:
      # both come from the merge_group event. (No line number here on purpose; that is
      # the failure mode this whole step exists to catch.)
      # Drift that an earlier entry caused is therefore attributed to -- and can eject
      # -- a later one that touched neither the source nor the document. That direction
      # is deliberate: it fails closed, never open. Read such an ejection as the queue
      # reporting a real anchor the combined tree broke, not as a regression of this
      # attribution fix; re-enqueue once the earlier entry's drift is corrected.
      #
      # `--base-kind queue` on merge_group says PR_BASE_SHA is the QUEUE's base -- master's
      # tip at the moment the entry was built -- and not the tree this head was written
      # against. It retires the "this PR touches the document and the anchor does not
      # resolve at the base either" rule, which has no premise left under such a base:
      # every line master moved between the fork and the enqueue fails it, so a
      # document's own PR is charged for drift that landed before it was queued. That
      # is what ejected #3151 on 11-06 and again on 11-07, spending a code-owner
      # sign-off each time. The cumulative-diff rule above is UNCHANGED by the flag --
      # if anything queued here moves a cited file, the anchor is still fatal.
      - name: Re-resolve docs/security source anchors (PEN-5091)
