name: Docker (agent base)

# Builds a thin per-commit paperclip-agent overlay. The expensive toolchain is
# published separately under a content-derived tag and reused until its inputs
# or the stable runtime beneath it change.
#
# Triggered after the main Docker workflow lands a server image with the
# matching sha — `workflow_run` ensures we always build paperclip-agent on
# top of a server image that actually exists in the registry.

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: arc-dind
    # Full agent-image rebuilds invalidate the heavy apt/toolchain layers when
    # the base paperclip server image changes. Keep enough room for that path;
    # Buildx still fails fast on real command errors.
    timeout-minutes: 90
    concurrency:
      group: docker-agent-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On workflow_run the default ref is the workflow file's branch,
          # not the head SHA of the triggering run. Pin to the SHA the
          # server build actually used so paperclip-agent's `sha-...` tag
          # tracks 1:1 with the matching paperclip-server tag.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Dockerfile.agent-toolchain's `COPY --from=registry.blockcast.net/blockcast/
      # pim-multicast-gateway/ffmpeg-publisher@sha256:...` (BLO-8717/BLO-8719)
      # pulls the moq_mmt ffmpeg build from the LAN-local cache registry. That
      # digest is published to registry.blockcast.net + Docker Hub but is NOT
      # replicated to harbor.blockcast.net, so the COPY would 404 without this
      # login. Same (HARBOR_USERNAME, HARBOR_PASSWORD) pair authenticates both
      # Harbor hostnames — mirrors pim-multicast-gateway e2e-codec-matrix.yml.
      - name: Login to registry.blockcast.net (LAN-local cache)
        uses: docker/login-action@v4
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Keep heavy agent layers on ordinal 1, separate from the server push
      # cache on ordinal 0. The local DinD daemon is still used for the fresh
      # ffmpeg smoke run below; only BuildKit execution moves to the persistent
      # remote cache owner.
      - name: Select BuildKit endpoint
        id: buildkit-endpoint
        env:
          PREFERRED_ORDINAL: "1"
        run: |
          set -euo pipefail
          if [[ ! "${PREFERRED_ORDINAL}" =~ ^[01]$ ]]; then
            echo "Invalid BuildKit ordinal: ${PREFERRED_ORDINAL}" >&2
            exit 1
          fi

          probe_buildkit() {
            local host="$1"
            local timeout_seconds="$2"
            timeout "${timeout_seconds}" nc -z -w "${timeout_seconds}" "${host}" 1234
          }

          preferred="buildkit-amd64-${PREFERRED_ORDINAL}.buildkit-amd64-headless.ci.svc.cluster.local"
          fallback="buildkit-amd64.ci.svc.cluster.local"
          host="${preferred}"
          if ! probe_buildkit "${preferred}" 5; then
            echo "::warning::Preferred BuildKit ${preferred} is unavailable; using the healthy service endpoint"
            host="${fallback}"
            probe_buildkit "${fallback}" 10
          fi
          echo "endpoint=tcp://${host}:1234" >> "$GITHUB_OUTPUT"
          echo "Using BuildKit endpoint tcp://${host}:1234"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit-endpoint.outputs.endpoint }}

      - name: Resolve build SHA
        id: sha
        env:
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          short=$(printf '%s' "$TRIGGERING_SHA" | cut -c1-7)
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      - name: Resolve stable base images
        id: bases
        run: |
          set -euo pipefail
          runtime_base_ref="harbor.blockcast.net/paperclip/node:lts-trixie-slim"
          runtime_base_digest=""
          for attempt in 1 2 3 4 5; do
            if runtime_base_digest="$(docker buildx imagetools inspect "$runtime_base_ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" \
              && [ -n "$runtime_base_digest" ]; then
              break
            fi
            echo "Runtime base manifest lookup attempt ${attempt}/5 failed" >&2
            sleep $((attempt * 2))
          done
          if [ -z "$runtime_base_digest" ]; then
            echo "Unable to resolve ${runtime_base_ref} from Harbor" >&2
            exit 1
          fi
          runtime_base_image="${runtime_base_ref%:*}@${runtime_base_digest}"
          runtime_tag="$(scripts/container-base-tag.sh runtime "$runtime_base_image")"
          runtime_image="harbor.blockcast.net/paperclip/paperclip-runtime:${runtime_tag}"
          ffmpeg_ref="registry.blockcast.net/blockcast/pim-multicast-gateway/ffmpeg-publisher:stable"
          ffmpeg_digest=""
          for attempt in 1 2 3 4 5; do
            if ffmpeg_digest="$(docker buildx imagetools inspect "$ffmpeg_ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" \
              && [ -n "$ffmpeg_digest" ]; then
              break
            fi
            echo "FFmpeg manifest lookup attempt ${attempt}/5 failed" >&2
            sleep $((attempt * 2))
          done
          if [ -z "$ffmpeg_digest" ]; then
            echo "Unable to resolve ${ffmpeg_ref} from the LAN registry" >&2
            exit 1
          fi
          ffmpeg_image="${ffmpeg_ref%:*}@${ffmpeg_digest}"
          # The publisher's moving stable tag can regress independently of
          # Paperclip. Validate it before deriving the toolchain identity and
          # fall back to the latest digest proven by a green agent-image build.
          ffmpeg_known_good_digest="sha256:be20fcc53b6ca777de62c004ea926bcbb044f766f942e0bbe0eac6ee419a06d1"
          set +e
          scripts/verify-agent-ffmpeg.sh "$ffmpeg_image"
          ffmpeg_probe_status=$?
          set -e
          if [ "$ffmpeg_probe_status" -eq 1 ]; then
            echo "::warning::${ffmpeg_image} lacks moq_mmt; using last known-good publisher digest"
            ffmpeg_image="${ffmpeg_ref%:*}@${ffmpeg_known_good_digest}"
            scripts/verify-agent-ffmpeg.sh "$ffmpeg_image"
          elif [ "$ffmpeg_probe_status" -ne 0 ]; then
            echo "::error::Unable to safely inspect ${ffmpeg_image}; refusing publisher fallback"
            exit "$ffmpeg_probe_status"
          fi
          toolchain_tag="$(scripts/container-base-tag.sh agent-toolchain "$runtime_image" "$ffmpeg_image")"
          toolchain_image="harbor.blockcast.net/paperclip-agent/paperclip-agent-toolchain:${toolchain_tag}"
          if docker buildx imagetools inspect "$runtime_image" >/dev/null 2>&1; then
            runtime_exists=true
          else
            runtime_exists=false
          fi
          if docker buildx imagetools inspect "$toolchain_image" >/dev/null 2>&1; then
            toolchain_exists=true
            echo "Using existing agent toolchain ${toolchain_image}"
          else
            toolchain_exists=false
            echo "Agent toolchain ${toolchain_image} is missing; it will be built"
          fi
          {
            echo "runtime_base_image=${runtime_base_image}"
            echo "runtime_image=${runtime_image}"
            echo "runtime_exists=${runtime_exists}"
            echo "ffmpeg_image=${ffmpeg_image}"
            echo "toolchain_image=${toolchain_image}"
            echo "toolchain_exists=${toolchain_exists}"
          } >> "$GITHUB_OUTPUT"

      # Normally the successful server workflow already created this exact
      # runtime. Keep workflow_dispatch self-contained for recovery/bootstrap.
      - name: Build and push stable runtime image
        if: steps.bases.outputs.runtime_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.bases.outputs.runtime_base_image }}
          cache-from: type=registry,ref=harbor.blockcast.net/paperclip/paperclip-runtime:latest
          cache-to: type=inline
          tags: |
            ${{ steps.bases.outputs.runtime_image }}
            harbor.blockcast.net/paperclip/paperclip-runtime:latest

      - name: Build and push stable agent toolchain
        if: steps.bases.outputs.toolchain_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent-toolchain
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            RUNTIME_IMAGE=${{ steps.bases.outputs.runtime_image }}
            FFMPEG_IMAGE=${{ steps.bases.outputs.ffmpeg_image }}
          # This Dockerfile is also linear. Inline cache metadata avoids
          # uploading the 7 GB toolchain through image and cache exporters at
          # the same time, while :latest remains usable as cache-from.
          cache-from: type=registry,ref=harbor.blockcast.net/paperclip-agent/paperclip-agent-toolchain:latest
          cache-to: type=inline
          tags: |
            ${{ steps.bases.outputs.toolchain_image }}
            harbor.blockcast.net/paperclip-agent/paperclip-agent-toolchain:latest

      # Publish only the immutable candidate tag here. The floating tag is
      # promoted to the verified digest after the restricted smoke passes.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            harbor.blockcast.net/paperclip-agent/paperclip-agent
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}-k8s-vendored

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: true
          # Copy /app from the just-built server image at this exact sha while
          # reusing the content-addressed toolchain beneath the final image.
          # Falling back to `latest` here would race with concurrent server
          # builds and produce drifted layers.
          #
          # Pulled from harbor (not zot) — the zot/Ceph RGW backend
          # truncates some small blobs (e.g. 32B FROM-layer descriptors)
          # to 0 bytes on GET, producing `short read: expected N bytes
          # but got 0: unexpected EOF` at FROM resolution. Harbor serves
          # the same blobs correctly. Phase B cutover (BLO-5717) already
          # parallel-pushes the server image to both registries, so the
          # sha tag exists on harbor when this workflow runs.
          build-args: |
            SERVER_IMAGE=harbor.blockcast.net/paperclip/paperclip:sha-${{ steps.sha.outputs.short }}-k8s-vendored
            TOOLCHAIN_IMAGE=${{ steps.bases.outputs.toolchain_image }}
          # Same containerd-EOF-on-attestation-manifest reasoning as the
          # server image's Docker workflow.
          provenance: false
          sbom: false
          # Registry-backed cache on harbor (was zot pre-2026-05-17;
          # moved alongside the server image so any small cache blob can't
          # trip the same Ceph RGW zero-byte truncation that the FROM
          # blob hit).
          cache-from: type=registry,ref=harbor.blockcast.net/paperclip-agent/paperclip-agent:buildcache-v7
          cache-to: type=registry,ref=harbor.blockcast.net/paperclip-agent/paperclip-agent:buildcache-v7,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test restricted headless screenshot
        env:
          AGENT_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$AGENT_IMAGE"
          docker run --rm \
            --user 1000:1000 \
            --read-only \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --tmpfs /paperclip:rw,nosuid,size=16m \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env HOME=/tmp \
            "$AGENT_IMAGE" \
            paperclip-browser-smoke

      - name: Promote verified agent image
        env:
          CANDIDATE_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
          FLOATING_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent:latest-k8s-vendored
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$FLOATING_IMAGE" "$CANDIDATE_IMAGE"
          # `imagetools create` re-assembles the manifest index around the
          # source image (buildx attaches provenance/SBOM attestations), so the
          # floating tag's INDEX digest is legitimately different from the
          # candidate IMAGE digest. Asserting equality therefore failed on
          # every promotion — verified 2026-08-08 on run 31250770598, where the
          # push itself reported DONE and `latest-k8s-vendored` correctly
          # resolved to an index referencing the expected digest, yet the step
          # still exited 1. Assert what actually matters: the tag we publish
          # must CONTAIN the image we just built and smoke-tested.
          if ! docker buildx imagetools inspect "$FLOATING_IMAGE" --raw \
               | grep -qF "$EXPECTED_DIGEST"; then
            echo "ERROR: $FLOATING_IMAGE does not reference the verified image $EXPECTED_DIGEST"
            echo "--- floating tag manifest ---"
            docker buildx imagetools inspect "$FLOATING_IMAGE" --raw || true
            exit 1
          fi

      # BLO-4141: Auto-bump per-agent adapter_config.image so the freshly
      # built tag actually lands on running agents. Without this, the new
      # image sits in harbor unused until an operator manually PATCHes each
      # agent — the gap that silently no-op'd the BLO-6151 wake-pre-flight
      # rollout for three days in May 2026.
      #
      # The server endpoint owns the policy (eligibility filter, in-flight
      # skip, audit-log write, retry-on-completion stashing); this step is
      # just a thin curl. Skipped on manual workflow_dispatch so an operator
      # can rebuild without bumping (e.g. testing image build changes).
      #
      # Security note: all values interpolated into the run block come from
      # GH-controlled sources only — `vars.PAPERCLIP_API_URL` (operator var),
      # `secrets.PAPERCLIP_BOARD_TOKEN` (secret), `steps.sha.outputs.short`
      # (7 hex chars from a commit SHA), and `github.event.workflow_run.head_sha`
      # (commit SHA, hex-only). No user-controlled strings (issue titles,
      # commit messages, refs, etc.) reach the shell, so workflow-injection
      # vectors don't apply here.
      #
      # Requires GH repo secret PAPERCLIP_BOARD_TOKEN — a board-tier token
      # with agents:create permission for the production company. If unset,
      # the step warns and exits 0 so a missing secret doesn't break the
      # build; the prior manual-bump workflow remains intact.
      - name: Bump agent image refs in cluster
        if: github.event_name != 'workflow_dispatch'
        env:
          PAPERCLIP_API: ${{ vars.PAPERCLIP_API_URL || 'https://paperclip.blockcast.net' }}
          # Must be a paperclip BOARD token (pcp_board_…) — /admin/agents/bump-agent-image
          # rejects anything whose actor.type != "board" with 403. This is a
          # DIFFERENT credential from PAPERCLIP_BOARD_TOKEN, which #294 repurposed
          # to a GitHub PAT for the private kkroo/* vendor clones in Dockerfile;
          # a GitHub PAT is not a valid paperclip bearer, so the two cannot share
          # one secret. Mint via POST /api/service-account-tokens (instance-admin).
          PAPERCLIP_BUMP_TOKEN: ${{ secrets.PAPERCLIP_AGENT_BUMP_TOKEN }}
          NEW_IMAGE_SHORT: ${{ steps.sha.outputs.short }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Space-separated list of production company ids to bump.
          # BLO-10409: added Penstock (b1d3f3d3-…) alongside Blockcast (aaced805-…)
          # so both companies' opencode_k8s agents stay in sync on every build.
          COMPANY_IDS: >-
            aaced805-3491-4ee5-9b14-cdf70cb81d47
            b1d3f3d3-adc9-48af-beb1-013a18368d84
        run: |
          set -euo pipefail
          if [ -z "${PAPERCLIP_BUMP_TOKEN:-}" ]; then
            echo "::warning::PAPERCLIP_AGENT_BUMP_TOKEN not set; skipping agent image bump (manual operator PATCH still required)"
            exit 0
          fi
          NEW_IMAGE="harbor.blockcast.net/paperclip-agent/paperclip-agent:sha-${NEW_IMAGE_SHORT}-k8s-vendored"
          total_bumped=0
          total_skipped=0
          total_unchanged=0
          failed=0

          # BLO-33382: this step used to issue ONE bare curl per company and
          # exit 1 on any non-200. On 2026-09-11 a ~30s paperclip-api replica
          # restart returned 503 and permanently dropped the image bump for
          # THREE consecutive commits (b5a8bd38, 3b38d96b, 28707d7d) — the
          # images were built, smoke-tested and promoted to Harbor, but the
          # cluster refs never advanced and `pending_image_bump` stayed null,
          # so nothing retried them either. This step is last in the chain,
          # so there is no later step to recover it.
          #
          # Retry only what a retry can fix: a connection failure or a 5xx.
          # A 4xx (bad token, bad company, malformed body) is deterministic —
          # retrying it just burns five minutes before failing anyway.
          post_bump() {
            local cid="$1" response="$2"
            local attempt=1 max_attempts=5 delay=5 http
            while :; do
              # `curl` exits non-zero on a connection failure and never writes
              # a status; force the empty-string case into a sentinel so the
              # classifier below has something to branch on.
              http=$(curl -sS -o "$response" -w "%{http_code}" \
                --connect-timeout 10 --max-time 60 \
                -X POST "${PAPERCLIP_API}/api/admin/agents/bump-agent-image" \
                -H "Authorization: Bearer ${PAPERCLIP_BUMP_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg image "$NEW_IMAGE" --arg sha "$BUILD_SHA" --arg cid "$cid" '
                  { companyId: $cid, image: $image, source: "ci:docker-agent.yml", buildSha: $sha }
                ')") || http="000"
              [ -n "$http" ] || http="000"

              case "$http" in
                200) echo "$http"; return 0 ;;
                000|5*)
                  if [ "$attempt" -ge "$max_attempts" ]; then
                    echo "$http"; return 0
                  fi
                  echo "::warning::bump-agent-image returned HTTP ${http} for ${cid} (attempt ${attempt}/${max_attempts}); retrying in ${delay}s" >&2
                  sleep "$delay"
                  attempt=$((attempt + 1))
                  delay=$((delay * 2))
                  ;;
                *) echo "$http"; return 0 ;;
              esac
            done
          }

          for cid in $COMPANY_IDS; do
            echo "--- Bumping company ${cid} ---"
            response=$(mktemp)
            http=$(post_bump "$cid" "$response")
            echo "HTTP $http"
            # A non-200 is frequently a proxy's PLAIN-TEXT body ("upstream
            # connect error ..."). Feeding that to `jq` first buried the real
            # cause under `jq: parse error: Invalid numeric literal`, so the
            # log's most prominent line described the parser rather than the
            # fault. Print the raw body whenever it is not valid JSON.
            if jq -e . "$response" >/dev/null 2>&1; then
              jq '.' "$response"
            else
              echo "--- non-JSON response body ---"
              cat "$response"
              echo
            fi
            if [ "$http" != "200" ]; then
              echo "::error::bump-agent-image returned HTTP $http for company ${cid}: $(head -c 500 "$response")"
              failed=$((failed + 1))
            else
              total_bumped=$((total_bumped + $(jq -r '.bumped | length' "$response")))
              total_skipped=$((total_skipped + $(jq -r '.skipped | length' "$response")))
              total_unchanged=$((total_unchanged + $(jq -r '.unchanged | length' "$response")))
            fi
          done
          echo "=== Totals across all companies ==="
          echo "Bumped: ${total_bumped} agents"
          echo "Skipped: ${total_skipped} agents (will auto-retry on next run completion)"
          echo "Already on target: ${total_unchanged} agents"
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} company bump(s) failed"
            exit 1
          fi

  # BLO-23128: this workflow runs strictly sequentially and is triggered by
  # `workflow_run`, after the merge gate — a red step here (build, smoke,
  # promote, or bump) previously just skipped every following step with no
  # required check or notification anywhere. The whole chain went dark for
  # ~6 days (2026-08-02 to 2026-08-07) with CI and the merge queue both
  # reporting green the entire time. File (or refresh) a tracking issue so a
  # dead delivery lane is loud instead of silent. Runs on ubuntu-latest, not
  # arc-dind — it only needs `gh`, not the self-hosted build toolchain.
  # BLO-33382: this job previously filed a GitHub issue, on a repository where
  # Issues are DISABLED (`gh api repos/Blockcast/paperclip --jq .has_issues` →
  # false). `gh issue list` exited non-zero under `set -euo pipefail`, so the
  # step died before reporting anything: the guardrail failed closed AND
  # silently, and its own failure was the thing it was meant to report. Every
  # triage surface showed a workflow that had alerting. 8 master failures in the
  # 27h to 2026-09-11 produced zero notifications.
  #
  # Alertmanager is the channel this org actually runs on, needs no credential
  # from the in-cluster `arc-*` pools, and its default route fans every alert to
  # the paperclip-plugin-alertmanager webhook — so this becomes a Paperclip issue
  # in the platform lane, deduped on the alert fingerprint and refreshed in place
  # when it re-fires. Same delivery path as the production-environment guard
  # (BLO-22329), which is proven in production.
  alert-on-failure:
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'failure' && github.event_name != 'workflow_dispatch'
    runs-on: arc-light
    steps:
      - uses: actions/checkout@v5
      - name: Report the failed build to Alertmanager
        env:
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: firing
          GH_REPO: ${{ github.repository }}
          BRANCH: master
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FAILED_JOB: build-and-push
        run: node .github/scripts/post-docker-agent-alert.mjs

  # The other half of an honest alert: without it, `endsAt` would be the only
  # thing retiring the firing alert, so the lane would go quiet on a TIMER
  # rather than on a fix. Pushing the identical label set with a past `endsAt`
  # makes Alertmanager send `resolved` (send_resolved: true on the paperclip
  # receiver), which cancels the issue.
  #
  # It is also the continuous capability probe this defect went undetected for
  # want of: every GREEN master build exercises the exact delivery path the
  # failure path depends on, so a channel that rots is caught by the next
  # successful build instead of by the next outage. That is why it is a separate
  # job rather than a step inside build-and-push — a delivery failure here must
  # not flip `build-and-push.result` to `failure` and fire a spurious
  # "the build is failing" alert.
  resolve-on-success:
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success' && github.event_name != 'workflow_dispatch'
    runs-on: arc-light
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the delivery-lane alert (and prove the channel still works)
        env:
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: resolved
          GH_REPO: ${{ github.repository }}
          BRANCH: master
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/post-docker-agent-alert.mjs
