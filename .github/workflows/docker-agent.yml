name: Docker (agent base)

# Builds a thin per-commit paperclip-agent overlay. The expensive toolchain is
# published separately under a content-derived tag and reused until its inputs
# or the stable runtime beneath it change.
#
# Triggered after the main Docker workflow lands a server image with the
# matching sha — `workflow_run` ensures we always build paperclip-agent on
# top of a server image that actually exists in the registry.

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image_short: ${{ steps.sha.outputs.short }}
      image_digest: ${{ steps.build.outputs.digest }}
    # BLO-48930: the paperclip-only `arc-paperclip-dind` lane (onprem-k8s#6708,
    # org group 28), a prod-cluster copy of arc-dind. Its group is
    # restrictedToWorkflows and pins exactly this file at refs/heads/master, so
    # renaming or moving this file makes the job wait until the pin follows.
    # Leaving org group `default` is what lets the group-1 flip (BLO-40782)
    # proceed. The group is still named here (BLO-33389): a bare label could
    # land on a tools-cluster twin, where `buildkit-amd64*.ci.svc.cluster.local`
    # does not resolve (run 39420733721, "Select BuildKit endpoint").
    runs-on:
      group: arc-paperclip-dind
      labels: arc-paperclip-dind
    # BLO-47194. Derived from the slowest run that still made progress, not
    # from a cold toolchain: over 2026-10-15T12Z..10-17T11Z every toolchain
    # rebuild (4, each triggered by a new ffmpeg-publisher:stable digest) took
    # <= 11 min. The tail is the per-commit overlay when buildkit-amd64-1's
    # node disk is saturated (~95-99% io_time): run 38838769599 reached the
    # end of "Build and push" 84.7 min after job start (healthy p50 ~13 min),
    # then lost to the 90 min cap inside the smoke test.
    #   84.7 (job start -> overlay pushed, worst observed)
    # + 25.6 (smoke test p100, n=22)
    # +  2.7 (promote + bump + post steps, worst observed)
    # +  3.0 (PEN-4541 git-config surface assertion + its 4 positive controls.
    #         An ESTIMATE, not a measurement -- there is no history for a step
    #         that has never run, and this budget is otherwise entirely
    #         observed. It is a `docker create`/`cp`/`rm` against an
    #         already-pulled image, plus four one-layer builds on a base that
    #         is already local. Re-derive it from observed durations once this
    #         lane has run a few times, the way every other term here was.)
    # = 116.0 -> 119
    # A wedged buildkitd (run 39003886559: zero BuildKit output for 89 min,
    # scheduler loop stuck on a cache import) is NOT covered by any timeout;
    # that is tracked as a daemon fault (BLO-47180), not budget.
    timeout-minutes: 119
    # BLO-43939. `github.ref` is constant here — the trigger is `workflow_run`
    # on master only — so this is ONE group for the whole of trunk, and
    # `cancel-in-progress: true` meant the next successful server build killed
    # whatever agent build was in flight. Measured over the 100 master runs in
    # 2026-10-08T03:28Z..2026-10-12T00:24Z: 17 died mid-build at a median 38
    # minutes each (~10.8 arc-dind hours that published nothing), and the
    # longest gap between two published agent images was 16.3h — the window in
    # which a merged fix cannot reach any agent pod. Nothing paged for it:
    # `alert-on-failure` below fires on `failure`, not `cancelled`.
    #
    # `false` does not serialize trunk. It moves supersession from the running
    # build to the queue: GitHub parks at most ONE run pending per group and
    # evicts the earlier pending run when a newer one arrives — the BLO-26972
    # mechanism documented at length above `guard-pending-deploy` in
    # docker.yml. That eviction is the behaviour we want here, because the run
    # it drops is a stale intermediate commit and the newest master commit
    # always takes the pending slot. It was harmful in docker.yml only because
    # the evicted run was a production deploy parked on a human approval gate;
    # this job has no gate, publishes an immutable per-SHA tag, and is
    # re-dispatchable. Max concurrency stays 1, so arc-dind — the tightest
    # elastic pool — gains no parallel builds and needs no capacity ruling.
    concurrency:
      group: docker-agent-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On workflow_run the default ref is the workflow file's branch,
          # not the head SHA of the triggering run. Pin to the SHA the
          # server build actually used so paperclip-agent's `sha-...` tag
          # tracks 1:1 with the matching paperclip-server tag.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Dockerfile.agent-toolchain's `COPY --from=registry.blockcast.net/blockcast/
      # pim-multicast-gateway/ffmpeg-publisher@sha256:...` (BLO-8717/BLO-8719)
      # pulls the moq_mmt ffmpeg build from the LAN-local cache registry. That
      # digest is published to registry.blockcast.net + Docker Hub but is NOT
      # replicated to harbor.blockcast.net, so the COPY would 404 without this
      # login. Same (HARBOR_USERNAME, HARBOR_PASSWORD) pair authenticates both
      # Harbor hostnames — mirrors pim-multicast-gateway e2e-codec-matrix.yml.
      - name: Login to registry.blockcast.net (LAN-local cache)
        uses: docker/login-action@v4
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Keep heavy agent layers on ordinal 1, separate from the server push
      # cache on ordinal 0. The local DinD daemon is still used for the fresh
      # ffmpeg smoke run below; only BuildKit execution moves to the persistent
      # remote cache owner.
      - name: Select BuildKit endpoint
        id: buildkit-endpoint
        env:
          PREFERRED_ORDINAL: "1"
        run: |
          set -euo pipefail
          if [[ ! "${PREFERRED_ORDINAL}" =~ ^[01]$ ]]; then
            echo "Invalid BuildKit ordinal: ${PREFERRED_ORDINAL}" >&2
            exit 1
          fi

          probe_buildkit() {
            local host="$1"
            local timeout_seconds="$2"
            timeout "${timeout_seconds}" nc -z -w "${timeout_seconds}" "${host}" 1234
          }

          preferred="buildkit-amd64-${PREFERRED_ORDINAL}.buildkit-amd64-headless.ci.svc.cluster.local"
          fallback="buildkit-amd64.ci.svc.cluster.local"
          host="${preferred}"
          if ! probe_buildkit "${preferred}" 5; then
            echo "::warning::Preferred BuildKit ${preferred} is unavailable; using the healthy service endpoint"
            host="${fallback}"
            probe_buildkit "${fallback}" 10
          fi
          echo "endpoint=tcp://${host}:1234" >> "$GITHUB_OUTPUT"
          echo "Using BuildKit endpoint tcp://${host}:1234"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit-endpoint.outputs.endpoint }}

      - name: Resolve build SHA
        id: sha
        env:
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          short=$(printf '%s' "$TRIGGERING_SHA" | cut -c1-7)
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      - name: Resolve stable base images
        id: bases
        run: |
          set -euo pipefail
          runtime_base_ref="harbor.blockcast.net/paperclip/node:lts-trixie-slim"
          runtime_base_digest=""
          for attempt in 1 2 3 4 5; do
            if runtime_base_digest="$(docker buildx imagetools inspect "$runtime_base_ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" \
              && [ -n "$runtime_base_digest" ]; then
              break
            fi
            echo "Runtime base manifest lookup attempt ${attempt}/5 failed" >&2
            sleep $((attempt * 2))
          done
          if [ -z "$runtime_base_digest" ]; then
            echo "Unable to resolve ${runtime_base_ref} from Harbor" >&2
            exit 1
          fi
          runtime_base_image="${runtime_base_ref%:*}@${runtime_base_digest}"
          runtime_tag="$(scripts/container-base-tag.sh runtime "$runtime_base_image")"
          runtime_image="harbor.blockcast.net/paperclip/paperclip-runtime:${runtime_tag}"
          ffmpeg_ref="registry.blockcast.net/blockcast/pim-multicast-gateway/ffmpeg-publisher:stable"
          ffmpeg_digest=""
          for attempt in 1 2 3 4 5; do
            if ffmpeg_digest="$(docker buildx imagetools inspect "$ffmpeg_ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" \
              && [ -n "$ffmpeg_digest" ]; then
              break
            fi
            echo "FFmpeg manifest lookup attempt ${attempt}/5 failed" >&2
            sleep $((attempt * 2))
          done
          if [ -z "$ffmpeg_digest" ]; then
            echo "Unable to resolve ${ffmpeg_ref} from the LAN registry" >&2
            exit 1
          fi
          ffmpeg_image="${ffmpeg_ref%:*}@${ffmpeg_digest}"
          # The publisher's moving stable tag can regress independently of
          # Paperclip. Validate it before deriving the toolchain identity and
          # fall back to the latest digest proven by a green agent-image build.
          ffmpeg_known_good_digest="sha256:be20fcc53b6ca777de62c004ea926bcbb044f766f942e0bbe0eac6ee419a06d1"
          set +e
          scripts/verify-agent-ffmpeg.sh "$ffmpeg_image"
          ffmpeg_probe_status=$?
          set -e
          if [ "$ffmpeg_probe_status" -eq 1 ]; then
            echo "::warning::${ffmpeg_image} lacks moq_mmt; using last known-good publisher digest"
            ffmpeg_image="${ffmpeg_ref%:*}@${ffmpeg_known_good_digest}"
            scripts/verify-agent-ffmpeg.sh "$ffmpeg_image"
          elif [ "$ffmpeg_probe_status" -ne 0 ]; then
            echo "::error::Unable to safely inspect ${ffmpeg_image}; refusing publisher fallback"
            exit "$ffmpeg_probe_status"
          fi
          toolchain_tag="$(scripts/container-base-tag.sh agent-toolchain "$runtime_image" "$ffmpeg_image")"
          toolchain_image="harbor.blockcast.net/paperclip-agent/paperclip-agent-toolchain:${toolchain_tag}"
          if docker buildx imagetools inspect "$runtime_image" >/dev/null 2>&1; then
            runtime_exists=true
          else
            runtime_exists=false
          fi
          if docker buildx imagetools inspect "$toolchain_image" >/dev/null 2>&1; then
            toolchain_exists=true
            echo "Using existing agent toolchain ${toolchain_image}"
          else
            toolchain_exists=false
            echo "Agent toolchain ${toolchain_image} is missing; it will be built"
          fi
          {
            echo "runtime_base_image=${runtime_base_image}"
            echo "runtime_image=${runtime_image}"
            echo "runtime_exists=${runtime_exists}"
            echo "ffmpeg_image=${ffmpeg_image}"
            echo "toolchain_image=${toolchain_image}"
            echo "toolchain_exists=${toolchain_exists}"
          } >> "$GITHUB_OUTPUT"

      # Normally the successful server workflow already created this exact
      # runtime. Keep workflow_dispatch self-contained for recovery/bootstrap.
      - name: Build and push stable runtime image
        if: steps.bases.outputs.runtime_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.bases.outputs.runtime_base_image }}
          cache-from: type=registry,ref=harbor.blockcast.net/paperclip/paperclip-runtime:latest
          cache-to: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) && 'type=inline' || '' }}
          tags: |
            ${{ steps.bases.outputs.runtime_image }}
            harbor.blockcast.net/paperclip/paperclip-runtime:latest

      - name: Build and push stable agent toolchain
        if: steps.bases.outputs.toolchain_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent-toolchain
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            RUNTIME_IMAGE=${{ steps.bases.outputs.runtime_image }}
            FFMPEG_IMAGE=${{ steps.bases.outputs.ffmpeg_image }}
          # This Dockerfile is also linear. Inline cache metadata avoids
          # uploading the 7 GB toolchain through image and cache exporters at
          # the same time, while :latest remains usable as cache-from.
          cache-from: type=registry,ref=harbor.blockcast.net/paperclip-agent/paperclip-agent-toolchain:latest
          cache-to: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) && 'type=inline' || '' }}
          tags: |
            ${{ steps.bases.outputs.toolchain_image }}
            harbor.blockcast.net/paperclip-agent/paperclip-agent-toolchain:latest

      # Publish only the immutable candidate tag here. The floating tag is
      # promoted to the verified digest after the restricted smoke passes.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            harbor.blockcast.net/paperclip-agent/paperclip-agent
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}-k8s-vendored

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: true
          # Copy /app from the just-built server image at this exact sha while
          # reusing the content-addressed toolchain beneath the final image.
          # Falling back to `latest` here would race with concurrent server
          # builds and produce drifted layers.
          #
          # Pulled from harbor (not zot) — the zot/Ceph RGW backend
          # truncates some small blobs (e.g. 32B FROM-layer descriptors)
          # to 0 bytes on GET, producing `short read: expected N bytes
          # but got 0: unexpected EOF` at FROM resolution. Harbor serves
          # the same blobs correctly. Phase B cutover (BLO-5717) already
          # parallel-pushes the server image to both registries, so the
          # sha tag exists on harbor when this workflow runs.
          build-args: |
            SERVER_IMAGE=harbor.blockcast.net/paperclip/paperclip:sha-${{ steps.sha.outputs.short }}-k8s-vendored
            TOOLCHAIN_IMAGE=${{ steps.bases.outputs.toolchain_image }}
          # Same containerd-EOF-on-attestation-manifest reasoning as the
          # server image's Docker workflow.
          provenance: false
          sbom: false
          # Registry-backed cache on harbor (was zot pre-2026-05-17;
          # moved alongside the server image so any small cache blob can't
          # trip the same Ceph RGW zero-byte truncation that the FROM
          # blob hit).
          cache-from: type=registry,ref=harbor.blockcast.net/paperclip-agent/paperclip-agent:buildcache-v7
          cache-to: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) && 'type=registry,ref=harbor.blockcast.net/paperclip-agent/paperclip-agent:buildcache-v7,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test restricted headless screenshot
        env:
          AGENT_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$AGENT_IMAGE"
          docker run --rm \
            --user 1000:1000 \
            --read-only \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --tmpfs /paperclip:rw,nosuid,size=16m \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env HOME=/tmp \
            "$AGENT_IMAGE" \
            paperclip-browser-smoke

      # The other half, in the shape PEN-4541 established for the git-config
      # checks: the assertion above gets an input that must RED it, so a green
      # verdict means something. A control that comes back green is a FAILURE.
      #
      # This reproduces PEN-4682 exactly. `/paperclip` is a PVC in a real agent
      # Job and `/paperclip/bin` precedes the image's own directories on the
      # agent PATH, so a browser left there outranks the pinned headless shell
      # by name. That is not hypothetical: a June-2026 symlink to an ad hoc
      # puppeteer Chrome 149 did exactly this on the live fleet, and that build
      # hangs under --user-data-dir rather than failing, so nothing noticed.
      #
      # The smoke step above cannot see it. It runs on the image's own PATH,
      # where no /paperclip/bin exists — which is the whole reason this control
      # plants one.
      - name: Prove a shadowing PVC browser cannot outrank the pinned one (PEN-4682 positive control)
        env:
          AGENT_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user 1000:1000 \
            --read-only \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --tmpfs /paperclip:rw,exec,nosuid,size=16m,mode=1777 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env HOME=/tmp \
            "$AGENT_IMAGE" \
            sh -eu -c '
              mkdir -p /paperclip/bin
              # Unlink before planting. The image ENTRYPOINT still runs ahead of
              # this command, and now that mode=1777 lets its own `mkdir -p` in
              # install_browser_link succeed, it seeds /paperclip/bin/google-chrome
              # as a symlink to $CHROME_BIN first. Shell `>` follows symlinks, so
              # without this the plant would write through to the real browser on
              # the --read-only rootfs and die here with EROFS -- and if it ever
              # did land, the "plant" would BE the pinned browser, so (b) would
              # pass and this step would print CONTROL FAILED against a good image.
              # Removing the link also makes the control faithful to PEN-4682: it
              # shadows exactly the link the entrypoint seeds in production.
              rm -f /paperclip/bin/google-chrome
              printf "#!/bin/sh\nexit 0\n" > /paperclip/bin/google-chrome
              chmod 0755 /paperclip/bin/google-chrome
              # The plant must be executable for this control to mean anything.
              # Docker mounts --tmpfs noexec unless `exec` is given, and bash
              # `command -v` skips a PATH match it cannot execute -- so on a
              # noexec /paperclip the canary skips the plant and resolves the
              # pinned $CHROME_BIN instead, passing in (b) where it must red.
              # This step would then report CONTROL FAILED and blame the image,
              # while the control itself was the broken thing. Fail at the plant
              # instead, where the message is true.
              test -x /paperclip/bin/google-chrome

              # (a) The agent-shaped PATH. Both adapters force the image wrapper
              # directory to PATH[0] off one IMAGE_WRAPPER_BIN_DIR constant, so
              # this ordering is the one claude_k8s and opencode_k8s both build.
              # The shim there must win over the planted browser.
              echo "control (a): image wrapper directory leads PATH -> shim must win"
              PATH=/usr/local/libexec/paperclip/bin:/paperclip/bin:$PATH \
                paperclip-browser-smoke

              # (b) Drop the wrapper directory and the planted browser is first.
              # The canary MUST red here. If it passes, it is not actually
              # resolving through PATH and (a) proved nothing.
              echo "control (b): wrapper directory absent -> canary must red"
              if PATH=/paperclip/bin:$PATH paperclip-browser-smoke >/dev/null 2>&1; then
                echo "CONTROL FAILED: the canary passed while a planted /paperclip/bin/google-chrome led PATH. It is not resolving by name, so the assertion in (a) is vacuous and PEN-4682 would recur unseen." >&2
                exit 1
              fi
              echo "control (b): reds as required"
            '

      # PEN-4541 assertion (b): the agent image's git-config surface, measured
      # on the artifact rather than on the sources, before it is promoted or
      # rolled out to any agent.
      #
      # WHY HERE AND NOT ONLY IN THE PR LANE. Its pair, assertion (a), runs on
      # every PR (`Helm chart` -> deploy/helm/paperclip/tests/
      # agent-egress-path.test.mjs) and asserts what THIS REPO DECLARES: the
      # `-c` flags in docker/github-wrappers/ and the single
      # `git config --system` line in Dockerfile.runtime. That check is
      # structurally blind to anything writing /etc/gitconfig from outside
      # those lines -- a SERVER_IMAGE or TOOLCHAIN_IMAGE bump, a toolchain
      # layer, a package postinst. Those reach the image with every
      # source-level assertion still green, and this is the only lane where a
      # built agent image exists to measure. Neither check is sufficient alone.
      #
      # WHERE THE GATE ACTUALLY BITES, stated so a green run is not over-read:
      # buildx has already pushed the immutable `sha-...` candidate tag by the
      # time this runs -- the same position as the smoke test above, and the
      # same bargain this workflow already documents ("Publish only the
      # immutable candidate tag here"). What a red step prevents is the
      # promotion to `latest-k8s-vendored` and the `bump-agent-image` rollout
      # below, so no agent pod receives the image. It does not unpublish the
      # candidate tag.
      #
      # ⛔ AND IT DOES NOT COVER: mutation of an ALREADY-published image (a
      # Harbor retag, or an overwrite of a tag that already passed this gate)
      # or drift of an already-running pod. Registry-side immutability is a
      # separate control and was deliberately NOT assigned with PEN-4541. If
      # you want it, file it -- do not assume this step grew to cover it.
      - name: Assert the agent image's git-config surface (PEN-4541)
        env:
          AGENT_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$AGENT_IMAGE"
          node scripts/check-agent-image-git-config.mjs "$AGENT_IMAGE"

      # The other half, and PEN-4541 makes it a requirement: each assertion
      # above gets an input that must RED it, so a green verdict on the real
      # image means something. A control that comes back green is a FAILURE --
      # see the script's header for the inversion and for which control proves
      # the checker reads the agent image and not this runner.
      - name: Prove the git-config assertion reds on a bad image (PEN-4541 positive controls)
        env:
          AGENT_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
        run: node scripts/prove-agent-image-git-config-controls.mjs "$AGENT_IMAGE"

      # PEN-4932 stage 3b-i. The publish guard is baked into the SERVER image by
      # a RUN in `Dockerfile` (which proves the bake) and carried here by a
      # `COPY --from=server` whose text is pinned in
      # deploy/helm/paperclip/tests/agent-egress-path.test.mjs. Neither proves
      # DELIVERY: a `--from` stage that resolved to an older server image, a path
      # that drifted on one side only, a later overlay layer shadowing the
      # directory — each of those reaches the built agent image with every
      # source-level assertion still green. This is the image agents actually
      # run, so this is the copy whose absence costs something.
      #
      # WHY HERE AND NOT AS A RUN IN Dockerfile.agent, which is the obvious place:
      #   - That file is asserted to be a pure COPY overlay carrying no RUN at all
      #     (packages/adapter-utils/src/agent-dockerfile.test.ts), and a second
      #     test's reasoning about the google-chrome shim rests on that invariant.
      #     Adding one RUN is not a local edit; it weakens that argument.
      #   - This lane is strictly stronger evidence anyway. A build-time RUN is
      #     root, and for root `test -x` is true of a 0700 file that uid 1000 can
      #     neither read nor run — the exact delivery defect worth catching. Here
      #     the check runs AS uid 1000, the uid git spawns the hook as, so it asks
      #     the question the agent asks rather than approximating it from root.
      #
      # The ENTRYPOINT is bypassed deliberately: it is a filesystem assertion
      # about the image as built, and scripts/docker-entrypoint.sh touches
      # neither /usr/local/libexec nor the hooks directory (verified), so running
      # through it would add failure modes without adding coverage.
      #
      # Same bargain as the steps above, stated so a green run is not over-read:
      # the immutable `sha-...` candidate tag is already pushed by the time this
      # runs. What a red step prevents is promotion to `latest-k8s-vendored` and
      # the rollout below, so no agent pod receives the image. It does not
      # unpublish the candidate tag, and it says nothing about an already-running
      # pod.
      - name: Assert the publish guard reached the agent image (PEN-4932)
        env:
          AGENT_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$AGENT_IMAGE"
          for mode in runtime ownership; do
            # runtime -> uid 1000 (what the agent can do); ownership -> uid 0
            # (what the agent must not be able to do). Neither uid can answer the
            # other's question; see the script header.
            user=1000:1000
            [ "$mode" = ownership ] && user=0:0
            docker run --rm -i \
              --user "$user" \
              --read-only \
              --security-opt no-new-privileges \
              --cap-drop ALL \
              --network none \
              --entrypoint sh \
              "$AGENT_IMAGE" -s -- "$mode" \
              < scripts/check-agent-image-publish-guard.sh
          done

      # The other half, in the shape PEN-4541 and PEN-4682 established above: each
      # assertion gets an input that must RED it, so a green verdict on the real
      # image means something. A control that comes back green is a FAILURE.
      #
      # Each mutation below is a delivery defect that has a plausible cause and
      # that the paired arm is the only thing standing between and the fleet:
      #   0700            a COPY that lost the mode, or a chmod in a later layer.
      #                   Root-only arms cannot see this one at all, which is why
      #                   the runtime arm runs as uid 1000.
      #   removed         a mistyped --exclude glob, or a COPY of the wrong stage.
      #                   Proves the existence check is not vacuous over an empty
      #                   directory.
      #   chown node      the PEN-3715 property inverted: the agent could rewrite
      #                   the guard it is supposed to be subject to.
      #   chmod o+w       the same, by mode rather than owner.
      #
      # `docker commit` rather than a one-layer `docker build`: the builder in
      # this job may be a remote BuildKit endpoint (see "Select BuildKit
      # endpoint"), and a control must not depend on `--load` round-tripping an
      # image back from it. Nothing here is pushed; the tags are local and
      # removed at the end.
      - name: Prove the publish-guard assertion reds on a bad image (PEN-4932 positive controls)
        env:
          AGENT_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          hooks=/usr/local/libexec/paperclip/hooks
          n=0
          while IFS='|' read -r mutation mode; do
            [ -n "$mutation" ] || continue
            n=$((n + 1))
            cname="pen4932-control-$n"
            tag="pen4932-control:$n"

            # Fail AT the mutation if it does not apply. A mutation that silently
            # no-ops would commit an unmutated image, the arm would pass, and this
            # step would print CONTROL FAILED against a good image -- blaming the
            # image for a broken control. Same lesson as the PEN-4682 plant above.
            docker rm -f "$cname" >/dev/null 2>&1 || true
            docker run --user 0:0 --network none --name "$cname" \
              --entrypoint sh "$AGENT_IMAGE" -ec "$mutation" ||
              { echo "CONTROL BROKEN: mutation '$mutation' did not apply to the image; nothing below was measured." >&2; exit 1; }
            docker commit "$cname" "$tag" >/dev/null
            docker rm -f "$cname" >/dev/null

            if docker run --rm -i --user 1000:1000 --read-only \
                 --security-opt no-new-privileges --cap-drop ALL --network none \
                 --entrypoint sh "$tag" -s -- "$mode" \
                 < scripts/check-agent-image-publish-guard.sh >/dev/null 2>&1; then
              echo "CONTROL FAILED: '$mutation' did not red the $mode arm, so that arm is vacuous and the assertion step above proves nothing about $hooks." >&2
              docker rmi -f "$tag" >/dev/null 2>&1 || true
              exit 1
            fi
            echo "control ok: '$mutation' reds the $mode arm"
            docker rmi -f "$tag" >/dev/null 2>&1 || true
          done <<EOF
          chmod 0700 $hooks/pre-push|runtime
          rm -f $hooks/pre-push|runtime
          chown node:node $hooks/pre-push|ownership
          chmod 0757 $hooks/pre-push|ownership
          EOF
          test "$n" -eq 4 ||
            { echo "CONTROL BROKEN: expected 4 controls, ran $n." >&2; exit 1; }

      - name: Promote verified agent image
        env:
          CANDIDATE_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent@${{ steps.build.outputs.digest }}
          FLOATING_IMAGE: harbor.blockcast.net/paperclip-agent/paperclip-agent:latest-k8s-vendored
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$FLOATING_IMAGE" "$CANDIDATE_IMAGE"
          # `imagetools create` re-assembles the manifest index around the
          # source image (buildx attaches provenance/SBOM attestations), so the
          # floating tag's INDEX digest is legitimately different from the
          # candidate IMAGE digest. Asserting equality therefore failed on
          # every promotion — verified 2026-08-08 on run 31250770598, where the
          # push itself reported DONE and `latest-k8s-vendored` correctly
          # resolved to an index referencing the expected digest, yet the step
          # still exited 1. Assert what actually matters: the tag we publish
          # must CONTAIN the image we just built and smoke-tested.
          if ! docker buildx imagetools inspect "$FLOATING_IMAGE" --raw \
               | grep -qF "$EXPECTED_DIGEST"; then
            echo "ERROR: $FLOATING_IMAGE does not reference the verified image $EXPECTED_DIGEST"
            echo "--- floating tag manifest ---"
            docker buildx imagetools inspect "$FLOATING_IMAGE" --raw || true
            exit 1
          fi

  # BLO-4141: Keep the cluster mutation out of the DinD build job. The build
  # publishes and smoke-tests the candidate; this separately protected job
  # performs the production agent-image bump only after the build succeeds.
  bump-agent-image:
    needs: build-and-push
    if: ${{ github.event_name != 'workflow_dispatch' && needs.build-and-push.result == 'success' }}
    runs-on: arc-paperclip-deploy
    environment: paperclip-production
    timeout-minutes: 10
    env:
      PAPERCLIP_API: ${{ vars.PAPERCLIP_API_URL || 'https://paperclip.blockcast.net' }}
      # Must be a paperclip BOARD token (pcp_board_…) — /admin/agents/bump-agent-image
      # rejects anything whose actor.type != "board" with 403. This is a
      # DIFFERENT credential from PAPERCLIP_BOARD_TOKEN, which #294 repurposed
      # to a GitHub PAT for the private kkroo/* vendor clones in Dockerfile;
      # a GitHub PAT is not a valid paperclip bearer, so the two cannot share
      # one secret. Mint via POST /api/service-account-tokens (instance-admin).
      PAPERCLIP_BUMP_TOKEN: ${{ secrets.PAPERCLIP_AGENT_BUMP_TOKEN }}
      NEW_IMAGE_SHORT: ${{ needs.build-and-push.outputs.image_short }}
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Space-separated list of production company ids to bump.
      # BLO-10409: added Penstock (b1d3f3d3-…) alongside Blockcast (aaced805-…)
      # so both companies' opencode_k8s agents stay in sync on every build.
      COMPANY_IDS: >-
        aaced805-3491-4ee5-9b14-cdf70cb81d47
        b1d3f3d3-adc9-48af-beb1-013a18368d84
    steps:
      - name: Bump agent image refs in cluster
        run: |
          set -euo pipefail
          if [ -z "${PAPERCLIP_BUMP_TOKEN:-}" ]; then
            echo "::warning::PAPERCLIP_AGENT_BUMP_TOKEN not set; skipping agent image bump (manual operator PATCH still required)"
            exit 0
          fi
          NEW_IMAGE="harbor.blockcast.net/paperclip-agent/paperclip-agent:sha-${NEW_IMAGE_SHORT}-k8s-vendored"
          total_bumped=0
          total_skipped=0
          total_unchanged=0
          failed=0

          # Retry only connection failures and 5xx responses. A 4xx is deterministic.
          post_bump() {
            local cid="$1" response="$2"
            local attempt=1 max_attempts=5 delay=5 http
            while :; do
              http=$(curl -sS -o "$response" -w "%{http_code}" \
                --connect-timeout 10 --max-time 60 \
                -X POST "${PAPERCLIP_API}/api/admin/agents/bump-agent-image" \
                -H "Authorization: Bearer ${PAPERCLIP_BUMP_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg image "$NEW_IMAGE" --arg sha "$BUILD_SHA" --arg cid "$cid" '
                  { companyId: $cid, image: $image, source: "ci:docker-agent.yml", buildSha: $sha }
                ')") || http="000"
              [ -n "$http" ] || http="000"
              case "$http" in
                200) echo "$http"; return 0 ;;
                000|5*)
                  if [ "$attempt" -ge "$max_attempts" ]; then echo "$http"; return 0; fi
                  echo "::warning::bump-agent-image returned HTTP ${http} for ${cid} (attempt ${attempt}/${max_attempts}); retrying in ${delay}s" >&2
                  sleep "$delay"; attempt=$((attempt + 1)); delay=$((delay * 2)) ;;
                *) echo "$http"; return 0 ;;
              esac
            done
          }

          for cid in $COMPANY_IDS; do
            echo "--- Bumping company ${cid} ---"
            response=$(mktemp)
            http=$(post_bump "$cid" "$response")
            echo "HTTP $http"
            if jq -e . "$response" >/dev/null 2>&1; then jq '.' "$response"; else cat "$response"; echo; fi
            if [ "$http" != "200" ]; then
              echo "::error::bump-agent-image returned HTTP $http for company ${cid}: $(head -c 500 "$response")"
              failed=$((failed + 1))
            else
              total_bumped=$((total_bumped + $(jq -r '.bumped | length' "$response")))
              total_skipped=$((total_skipped + $(jq -r '.skipped | length' "$response")))
              total_unchanged=$((total_unchanged + $(jq -r '.unchanged | length' "$response")))
            fi
            rm -f "$response"
          done
          echo "=== Totals across all companies ==="
          echo "Bumped: ${total_bumped} agents"
          echo "Skipped: ${total_skipped} agents (will auto-retry on next run completion)"
          echo "Already on target: ${total_unchanged} agents"
          if [ "$failed" -gt 0 ]; then echo "::error::${failed} company bump(s) failed"; exit 1; fi

  # BLO-23128: this workflow runs strictly sequentially and is triggered by
  # `workflow_run`, after the merge gate — a red step here (build, smoke,
  # promote, or bump) previously just skipped every following step with no
  # required check or notification anywhere. The whole chain went dark for
  # ~6 days (2026-08-02 to 2026-08-07) with CI and the merge queue both
  # reporting green the entire time. File (or refresh) a tracking issue so a
  # dead delivery lane is loud instead of silent. Runs on ubuntu-latest, not
  # arc-dind — it only needs `gh`, not the self-hosted build toolchain.
  # BLO-33382: this job previously filed a GitHub issue, on a repository where
  # Issues are DISABLED (`gh api repos/Blockcast/paperclip --jq .has_issues` →
  # false). `gh issue list` exited non-zero under `set -euo pipefail`, so the
  # step died before reporting anything: the guardrail failed closed AND
  # silently, and its own failure was the thing it was meant to report. Every
  # triage surface showed a workflow that had alerting. 8 master failures in the
  # 27h to 2026-09-11 produced zero notifications.
  #
  # Alertmanager is the channel this org actually runs on, needs no credential
  # from the in-cluster `arc-*` pools, and its default route fans every alert to
  # the paperclip-plugin-alertmanager webhook — so this becomes a Paperclip issue
  # in the platform lane, deduped on the alert fingerprint and refreshed in place
  # when it re-fires. Same delivery path as the production-environment guard
  # (BLO-22329), which is proven in production.
  alert-on-failure:
    needs: [build-and-push, bump-agent-image]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      (needs.build-and-push.result == 'failure' || needs.bump-agent-image.result == 'failure')
    runs-on: arc-paperclip-light
    steps:
      - uses: actions/checkout@v5
      - name: Report the failed build to Alertmanager
        env:
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: firing
          GH_REPO: ${{ github.repository }}
          BRANCH: master
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FAILED_JOB: ${{ needs.build-and-push.result == 'failure' && 'build-and-push' || 'bump-agent-image' }}
        run: node .github/scripts/post-docker-agent-alert.mjs

  # The other half of an honest alert: without it, `endsAt` would be the only
  # thing retiring the firing alert, so the lane would go quiet on a TIMER
  # rather than on a fix. Pushing the identical label set with a past `endsAt`
  # makes Alertmanager send `resolved` (send_resolved: true on the paperclip
  # receiver), which cancels the issue.
  #
  # It is also the continuous capability probe this defect went undetected for
  # want of: every GREEN master build exercises the exact delivery path the
  # failure path depends on, so a channel that rots is caught by the next
  # successful build instead of by the next outage. That is why it is a separate
  # job rather than a step inside build-and-push — a delivery failure here must
  # not flip `build-and-push.result` to `failure` and fire a spurious
  # "the build is failing" alert.
  resolve-on-success:
    needs: [build-and-push, bump-agent-image]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      needs.build-and-push.result == 'success' &&
      (needs.bump-agent-image.result == 'success' || needs.bump-agent-image.result == 'skipped')
    runs-on: arc-paperclip-light
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the delivery-lane alert (and prove the channel still works)
        env:
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: resolved
          GH_REPO: ${{ github.repository }}
          BRANCH: master
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/post-docker-agent-alert.mjs
