name: landing-sweep

# Reconciler for stranded LANDINGS (PEN-5263), the one-stage-later sibling of
# review-gate-sweep.yml.
#
# review-gate-sweep.yml backstops a lost REVIEW wake. Nothing backstopped a
# lost LANDING. A PR that is `CLEAN`, reviewed by Ally at its exact head with
# no blocking findings, and carrying no outstanding reviewer satisfies the
# review sweep's predicate — there is nothing stranded about its review — and
# is therefore invisible to it. It is also invisible to the landing routine's
# OWN report: `stalledHolds` enumerates reasons for inaction, and a PR the
# classifier said yes to has none. So an unheld, unlanded PR appeared in no
# report anywhere.
#
# Measured 2026-11-02 on this repo: #3241 and #3255 both classified `enqueue`,
# and the routine's stale-hold block printed 8 rows — neither of them. That
# invisibility is the defect this workflow closes.
#
# ⚠ CORRECTION (2026-11-03, PEN-5344). The version of this paragraph added in
# #3270 went further and said #3241's head "sat eligible" from Ally's clean
# verdict at 2026-11-02T00:05:01Z. That is wrong, and the mistake matters
# because it reads as landing latency when it is not. CI at that head
# (da94f2885) stayed RED until `General tests (workspaces-b)` went green at
# 04:45:06Z, `verify` following at 04:45:26Z — so the PR became LANDABLE
# there, not at the verdict. The next scheduled landing fire was at 08:45Z,
# it enqueued the PR at 08:48:41Z, and it merged at 09:28:08Z — 4h42m42s in
# total, decomposing as 3h59m34s of ordinary schedule wait, 3m41s of
# within-fire processing, and 39m27s in the merge queue. The ~9h23m from
# verdict to merge is NOT landing latency and must never be cited as such.
#
# The cost that remains real here is diagnostic rather than duration: PEN-5232
# was parked 48h on a diagnosis built around a human approver who was not in
# the path, because the stall had no stated reason to read.
#
# THIS IS A DETECTOR, NEVER A LANDER. It runs `--alarm`, which the script
# refuses to combine with `--apply`. Two reasons, and the second is the
# load-bearing one:
#
#   1. A second actor enqueuing PRs would race the routine's per-fire cap
#      (MAX_ENQUEUES_PER_FIRE), whose whole guarantee is that a classifier bug
#      costs at most N PRs per fire. Two independent spenders void it.
#   2. The thing being reported on must not be the thing doing the reporting.
#      That is exactly the defect this closes — the existing report lives
#      inside the landing routine, so a fire that never happens produces no
#      report either, and silence is indistinguishable from health. This
#      workflow is on GitHub's own cron precisely so it does not share a
#      failure domain with the routine it watches.
#
# AC4, inherited from review-gate-sweep.yml / BLO-22892: the stranded
# condition must surface without a human noticing by hand. `--alarm` exits
# non-zero when the cohort is non-empty, turning this schedule visibly red.
#
# Registered in WATCHED_GUARDS (scripts/check-scheduled-guard-liveness.mjs) at
# the hourly 2.75h bar, so this detector is itself watched for going dark.
#
# WHY A SCHEDULE AND NOT THE EVENT — a PERMANENT, accepted limitation
# (PEN-5341). The mechanism gap below was put to the owning side as a product
# decision on 2026-11-03 (PEN-5344, board card ee9063ab) and DECLINED that
# day. So this sweep is the permanent compensating control, not an interim
# measure, and the wait described below is the steady state rather than a gap
# awaiting a fix. PERMANENT here has a definition: the question is not
# reopened without new evidence, which would be repeated alarms from this
# sweep that a late or skipped landing-routine fire does not explain, or
# upstream shipping a trigger event filter.
#
# This sweep covers the CONSEQUENCE of a missed landing evaluation. It does
# not close the MECHANISM gap, and that gap is worth stating because the
# review side does not have it:
#
#   review:  a `synchronize` push is delivered to server/src/routes/
#            github-webhook.ts:1020 and re-evaluates the gate through the
#            first-party authority service (github-review-gate-authority.ts:21,
#            whose PR_ACTIONS set contains "synchronize"). Event-driven.
#   landing: fires only from the landing routine (BLO-32511). Nothing connects
#            a GitHub event to it — github-webhook.ts fires no routines at all.
#
# WHAT THAT COSTS, stated precisely, because the loose version of this
# paragraph is what produced the error corrected at the top of this file:
#
#   - Landing is evaluated on the landing routine's OWN schedule:
#     `45 */6 * * *`, America/Los_Angeles. FOUR FIRES A DAY, not hourly. The
#     schedule is recorded in the routine's `trigger` row in
#     docs/superpowers/plans/2026-09-05-track-a-landing-log.md, and matches
#     allyblockcast's observed 2026-11-02 enqueue batches at 08:48Z, 14:48Z
#     and 20:47Z.
#   - A newly landable PR therefore waits up to ONE 6-HOUR INTERVAL plus
#     dispatch lag, and longer still if a fire's MAX_ENQUEUES_PER_FIRE cap
#     defers it. Never state this as "an hour", and never as "≤1h end to
#     end": the hourly figure elsewhere in this file is THIS SWEEP's own
#     cadence, which is a different clock from the one a PR waits on.
#   - The wait starts when a PR becomes LANDABLE — CI completion or the Ally
#     verdict, whichever lands last — NOT at `synchronize`. At a head move
#     there is nothing for a landing evaluation to decide: the new head's
#     checks are queued and no verdict sits at it yet, so the classifier can
#     only skip (scripts/land-clean-prs.mjs:998-1019). That is why an
#     event-driven landing evaluation would not have landed #3241 any sooner,
#     and it is the substance of the 2026-11-03 decline.
#   - This sweep flags a PR still landable 6 hours after its newest check, at
#     its next hourly run. By design it does not see cap-deferred or
#     `mergestate:UNKNOWN` rows.
#
# THE OBVIOUS FIX DOES NOT EXIST, and this is the part that is easy to get
# wrong. "Add a `synchronize` trigger to the landing routine" is not a
# configuration anyone can apply, at any privilege level:
#
#   - The trigger kinds are ["schedule", "webhook", "api"]
#     (packages/shared/src/constants.ts:917), so a webhook trigger IS
#     available, and `github_hmac` signing alongside it. That much reads as
#     though the wiring is a config change away.
#   - But a trigger carries NO event filter. The `webhook` variant of
#     createRoutineTriggerSchema accepts `signingMode` and `replayWindowSec`
#     and nothing else (packages/shared/src/validators/routine.ts:132-146);
#     routine_triggers has no event, action, repo or payload-predicate column
#     (packages/db/src/schema/routines.ts:107-131); and firePublicTrigger
#     (server/src/services/routines.ts:3911) verifies the signature and fires.
#     That is the whole admission.
#   - GitHub delivers every subscribed event to one URL. So pointing a PR
#     webhook at a routine trigger fires the landing routine on EVERY PR
#     event on this repo, not on `synchronize` — many times the four-a-day
#     rate it would replace, spending MAX_ENQUEUES_PER_FIRE on each fire and
#     competing with Ally's reviews for the same capacity.
#
# Access is a real constraint too, but it is the SECOND one, and it is
# narrower than "board access required" (which is the company-LIST route,
# /companies — per-company routine reads succeed from an ordinary agent seat).
# The actual rule is assertCanManageCompanyRoutine / assertCanManageExisting-
# Routine (server/src/routes/routines.ts:106,115): an agent may manage a
# routine only where routine.assigneeAgentId is its own id; board actors are
# exempt. BLO-32511 additionally sits in a company this repo's agents are not
# members of. Neither of those would matter if the trigger were expressible.
#
# ACCEPTED, AND PERMANENTLY SO: the schedule wait set out above, with this
# sweep as the compensating control. Closing the mechanism would need a
# product change — either an event/action predicate on webhook triggers, or a
# first-party landing hook beside the review hook in github-webhook.ts. Both
# were named to the owning side on 2026-11-03 and DECLINED, so neither is
# pending and nobody is waiting on one. If that decision is ever revisited on
# new evidence, the second option must not become a second enqueuer, for the
# reason given under "DETECTOR, NEVER A LANDER" above. Do NOT close this by
# widening the detector's predicate or halving its cadence; neither touches
# the trigger, and the cadence arithmetic below does not admit the latter. If
# landing latency itself ever needs to shrink, the lever is the landing
# routine's own schedule — which needs no product change, and which is NOT
# ordered here.

on:
  schedule:
    # Hourly, and :27 is chosen rather than inherited.
    #
    # COST, counted rather than estimated. A dry run on this repo
    # 2026-11-02T09:3xZ, with every `gh` invocation logged through a counting
    # shim, made exactly 97 calls over 32 open PRs:
    #
    #     35  pr view (statusCheckRollup, plus resolveMergeState re-reads)
    #     26  pulls/{n}/reviews        --paginate
    #     26  issues/{n}/timeline      --paginate
    #      8  pulls/{n}/files          --paginate
    #      1  pr list
    #      1  contents/.github/CODEOWNERS
    #
    # So the shape is 1 list + 1 CODEOWNERS, then up to 4 calls per PR that
    # survives `classifyFromListing` (26 of 32 here) — `files` only where a
    # review request exists. It scales with the open set that reaches the
    # expensive path, NOT with any threshold, so unlike review-gate-sweep.yml
    # there is no predicate-level cut to claim.
    #
    # PEN-5442 adds one term to that floor: the merge states moved out of the
    # listing into their own paginated GraphQL read, so the `1 pr list` above
    # is now `1 pr list + ceil(open / MERGE_STATE_PAGE_SIZE)` — at 54 open PRs
    # on this repo, 3 extra requests. It buys a read that works at all on a
    # repo with >=100 open PRs, where the single combined call 502'd on 3 of 3
    # attempts (measured against Blockcast/penstock-llm-proxy-core at 153).
    #
    # ⚠ 97 is INVOCATIONS, which is a FLOOR on HTTP requests: 60 of them carry
    # `--paginate` and a long thread costs a request per page. The obvious
    # cross-check does not settle it either — the `rate_limit` delta over that
    # run was 770, but this installation token is shared, and its idle drift
    # measured ~51 requests per 20s from other consumers, which over the 203s
    # run accounts for ~520 of them. ~250 is the attributable estimate; 97 is
    # the number that reproduces.
    #
    # Against `github.token`'s documented 1,000/hour/repository budget, shared
    # with the other workflows here, hourly is ~10-25% of it depending on which
    # of those two figures you take. Half-hourly doubles that, which is not
    # affordable beside review-gate-sweep.yml's own ~315/hour (its header's
    # 2026-09-19 figure, likewise a floor). So: hourly, same cadence and same
    # arithmetic as its sibling. Re-measure rather than inherit — 97 is one
    # snapshot at 32 open PRs, and the shim that produced it is three lines.
    #
    # :27 is clear of every cron minute the watched guards already occupy
    # (:09 x2, :17, :23, :31, :41, :47), so this does not pile onto their
    # burst — the same spacing rule scheduled-guard-liveness.yml applies.
    - cron: "27 * * * *"
  workflow_dispatch: {}

# Read-only, deliberately and permanently. This job detects; it must never
# acquire the ability to land anything (see the header). `--alarm` makes no
# writes, so nothing here needs more than read.
#
# `checks: read` is LOAD-BEARING, not boilerplate. An explicit `permissions`
# block sets every unlisted scope to `none`, and the detector's whole clock
# (`judgeableAgeHours` -> `newestCheckStamp`) reads `statusCheckRollup`, which
# is a union: `CheckRun` nodes need `checks`, `StatusContext` nodes need
# `statuses`. Measured on #3270 itself, the rollup was 19 `CheckRun` to 2
# `StatusContext` — this repo publishes nearly all of its CI as check-runs.
# Omitting the scope does not fail loudly; the rollup comes back missing those
# 19 entries and the rows classify `checks:none`/`skip`, so nothing ever reads
# `enqueue` and the alarm stays green FOR STRUCTURAL REASONS. That is the
# silence-means-health failure this workflow exists to remove, reproduced
# inside the remedy. The sibling review-gate-sweep.yml grants it to its own
# rollup-reading job for the same reason.
permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

# No `concurrency` block, for the reason review-gate-sweep.yml records at
# length (BLO-31818): GitHub holds at most ONE pending run per group, so a
# group cannot serialise a starved backlog — it EVICTS it, and a run that
# never starts cannot exit non-zero, which would silence the AC4 alarm. Runs
# accumulating costs latency; runs evicting costs the alarm.

jobs:
  detect:
    name: Detect landable PRs that nothing has landed
    runs-on: arc-paperclip-light
    # A hang detector for a job that has STARTED. It cannot bound a run
    # starved in `queued` — that is what the liveness guard registration
    # above is for. The measured dry run took 203s at 32 open PRs.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unit tests for the detector's pure decision logic
        run: node --test ./scripts/land-clean-prs.test.mjs

      - name: Alarm on PRs that have been landable for hours and are still open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAND_CLEAN_PRS_REPO: ${{ github.repository }}
          # PEN-5430 deliberately does NOT set LAND_CLEAN_PRS_NOTIFY_REPO here,
          # and adding it would not work. The notify list exists so the
          # `--apply` landing routine can post CODEOWNER_REQUEST_MARKER in a
          # human-gated repo without acquiring the ability to land in it. This
          # arm runs on `secrets.GITHUB_TOKEN`, which GitHub scopes to the
          # workflow's own repository, so every sibling repo named in either
          # list 403s regardless of which list it is in. Widening the sweep
          # from Actions needs a cross-repo App credential first.
          #
          # It is also the wrong arm on purpose: this job is a DETECTOR and
          # makes no writes (see the header), while a notification IS a write.
        run: node scripts/land-clean-prs.mjs --alarm
