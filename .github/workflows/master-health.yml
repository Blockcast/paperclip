name: Master general tests

# BLO-27871: `master`'s head is never tested by anything.
#
# `pr.yml` triggers on `pull_request` and `merge_group` only. That is complete
# coverage *while every commit arrives through the merge queue*, because a
# merge_group build tests `master + PR` before it lands. It leaves a hole
# exactly when commits land OUTSIDE the queue — a direct merge, an admin
# bypass, or a force push.
#
# On 2026-08-16 a 12-PR direct-merge batch landed between 04:09:52Z and
# 04:12:53Z. #1353 and #1366 were each green against their own base but
# semantically conflicting together, so master went red at 04:12Z. Nothing
# reported it. The only signal was PRs being ejected from the queue one at a
# time — four of them (#1344, #1169, #1378, #1381), each burning a full
# ~30-minute merge_group build to rediscover the identical failure against
# `maximumEntriesToBuild: 1`. Master stayed red ~5.5h and the whole company's
# merge queue was blocked for ~7h. See BLO-27861 for the incident.
#
# This workflow closes the detection half. The prevention half — requiring the
# queue so nothing can land outside it — is a repo-admin ruleset change and is
# tracked separately; the two are complementary, and prevention deliberately
# removes a manual drain valve the operator may want to keep.
#
# SCOPE — read this before assuming a green run means master is healthy.
# This replicates ONLY pr.yml's `general_tests` matrix, not its full 12-job
# set. A commit that lands outside the queue and breaks typecheck, the build,
# the Helm chart, or e2e is still not caught here. That asymmetry is
# deliberate and cost-driven, not an oversight: 36.5% of landings bypass the
# queue (66 of 181 over the 7 days to 2026-08-16), so this already adds ~9.4
# full suite runs per day to a pool with documented eviction pressure
# (BLO-20369). Widening it to the full job set would multiply that. The name
# says "general tests" rather than "health" so the promise matches the
# coverage. Revisit if a future master-red lands outside general_tests.
#
# BLO-38228 — THE SECOND HOLE, AND IT IS NOT A LANDING HOLE AT ALL.
# Everything above assumes master goes red because something *landed*. A
# fixture can instead expire on the CLOCK, with no commit of any kind. On
# 2026-09-30 a test literal pinned to `2026-09-30T00:00:00.000Z` lapsed at
# midnight; master was green on the 22:34Z push and red on the 00:01Z
# merge_group build, with no push in between. Neither `push` nor
# `workflow_dispatch` can observe time passing, so the company's merge queue
# was blocked ~63h and the only symptom was, again, PRs being ejected.
#
# Worse, this workflow reported SUCCESS through it: run 36648202266 fired at
# 00:01:19Z on the very head that was already red, the gate below found a
# successful merge_group build at that SHA, and the matrix was SKIPPED. A
# skipped matrix still concludes `success`. The gate's premise -- "a green
# merge_group at this SHA means this tree is proven" -- is true about the TREE
# and false about the VERDICT, because the verdict depends on the clock. The
# proof expires; the commit does not change.
#
# So the schedule below MUST bypass the gate. A scheduled run that honoured it
# would hit the identical `pretested=1` skip every day and report green every
# day -- strictly worse than no schedule, because it manufactures confidence
# rather than merely lacking it.
#
# THE MERGE-GROUP TRIM (2026-10-10) NARROWS WHAT "PROVEN" MEANS. pr.yml no
# longer re-runs every heavy lane in merge_group: when the queued PR's own head
# already passed the general-server shards in pull_request CI and the queue
# applies exactly that change set, the merge group carries the result forward
# and skips the suite steps (scripts/merge-group-trim.mjs). That build is green
# without having run the server suites on the merged tree. So the gate counts a
# merge_group build as proof only when its server shards actually ran them, and
# for most queue landings this workflow is now where the server suites first
# run on the landed tree. Kill switch for the trim: the repository variable
# PAPERCLIP_CI_MERGE_GROUP_FULL_SUITE=true (runbooks/merge-group-heavy-lane-trim.md).

on:
  push:
    branches:
      - master
  # Lets an operator re-run the suite against the current master head on
  # demand — after a force push, or to confirm a red master has recovered
  # without waiting for the next commit.
  workflow_dispatch:
  # BLO-38228: the only trigger that observes time passing. Daily, not hourly:
  # this bypasses the gate (see the header) so it re-runs the full matrix
  # unconditionally, and the SCOPE block above budgets this pool deliberately.
  # One run/day against the ~9.4 already noted is ~11% more load, for a
  # worst-case detection latency of 24h against the unbounded latency that let
  # BLO-38228 run 63h.
  #
  # ON 00:37 SPECIFICALLY, and this is weaker than a first draft of this comment
  # claimed. n=1, not 2: BLO-38228's literal pinned midnight, but BLO-27861 was
  # a semantic conflict between two landings, not a clock expiry, so it is not
  # an instance of this class at all. The other live literal this PR removed
  # (issue-execution-policy-routes.test.ts:726) pinned NOON. So 00:37 catches a
  # midnight-pinned fixture in ~37 minutes and a noon-pinned one in ~12.6h, and
  # the honest promise is the 24h worst case above, not the 37 minutes.
  #
  # Minute :37 is deliberate: scheduled-guard-liveness.yml documents the
  # minutes this repo's recurring guards already occupy (:09 x2, :17, :23, :31,
  # :41, :47). Avoid :00 and :30 -- every cron on the planet lands there.
  #
  # Upgrade path if a noon-pinned literal ever bites: add a second entry near
  # 12:37, halving worst-case latency for one extra suite run per day.
  #
  # THIS CRON'S OWN LIVENESS IS WATCHED, and it has to be -- a guard that
  # silently stops while its header tells readers the hole is closed is worse
  # than no guard, which is this file's own argument about the gate bypass one
  # level up. scripts/check-scheduled-guard-liveness.mjs watches it with
  # `event: "schedule"`; that filter is load-bearing, because the push trigger
  # above would otherwise satisfy the freshness check every time master moves.
  schedule:
    - cron: "37 0 * * *"

concurrency:
  # A bulk direct-merge drain lands many commits in seconds (12 in ~3 minutes
  # on 2026-08-16). Without cancellation that is 12 full suites competing for
  # the same pool. Only the newest master head is worth testing: it is the one
  # every subsequent PR will be rebased onto, and a failure introduced by an
  # earlier commit in the batch still reproduces on the final head.
  #
  # Keyed on event_name too: `github.ref` is `refs/heads/master` for both push
  # and workflow_dispatch, so without it an operator's "has master recovered?"
  # dispatch could be cancelled by an unrelated push, or cancel one.
  #
  # A PUSH run is never cancelled in flight. Since the merge-group heavy-lane
  # trim (scripts/merge-group-trim.mjs) this workflow is the post-merge backstop
  # for every landing whose general-server shards were carried forward, which
  # is most of them, and landings arrive faster than one 54-69 min server run.
  # With cancel-in-progress the next landing killed the run in flight: in the
  # 2026-10-03..10-09 replay only 25 of 164 such runs would have finished, and
  # the other 139 burned arc-paperclip-general CPU and reported nothing.
  # Without it, GitHub keeps at most ONE pending run per concurrency group and
  # replaces it with each newer push (the superseded pending run is cancelled
  # before it takes a runner). So the run in flight always reports, the next one
  # tests the newest master head, and a burst of N landings still costs at most
  # two runs (the 2026-08-16 drain: one in flight plus the newest pending).
  # Every master head contains all earlier ones, so a superseded landing is
  # covered by the newer head's run. Dispatch and schedule keep cancelling: each
  # is a single explicit request whose newest instance is the one wanted.
  group: master-health-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  # Required by the gate below to list this repository's workflow runs.
  actions: read

jobs:
  gate:
    name: Was this commit already proven by the merge queue?
    # arc-light, never arc-merge-queue: this workflow must not contend with
    # merge_group builds for the queue pool, or detection would come at the
    # cost of merge latency — the thing it exists to protect.
    #
    # `gh` on arc-light has in-repo precedent: commitperclip-review.yml runs
    # `gh api` on arc-light with GH_TOKEN: ${{ github.token }} (its job at
    # `runs-on: arc-light`, querying `repos/.../pulls/<n>`).
    runs-on: arc-light
    timeout-minutes: 5
    outputs:
      pretested: ${{ steps.check.outputs.pretested }}
      pretested_workspaces: ${{ steps.check.outputs.pretested_workspaces }}
    steps:
      - name: Look for a successful merge_group build at this exact SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Merge-group heavy-lane trim (pr.yml's `Decide merge-group heavy-lane
          # trim`, scripts/merge-group-trim.mjs): a green merge_group build no
          # longer means its general-server shards RAN. In most queue entries
          # they are carried forward from the PR head's pull_request CI, and
          # their suite steps are skipped while the jobs still succeed. So a
          # build is proof only if every `General tests (server i/N)` job in it
          # ran BOTH server suite steps to success. A path-selector skip skips
          # the same steps and is not proof either; that costs one extra suite
          # run after a merge group whose diff could not reach the server suites
          # (7 of 240 measured merge_group builds, 2026-10-03..10-09).
          # scripts/__tests__/merge-group-trim.test.mjs drives this whole step
          # against fixtures and pins the step names to pr.yml.
          SERVER_SUITES_RAN: >-
            [.jobs[] | select(.name | startswith("General tests (server "))]
            | length > 0 and all(.[]; .conclusion == "success"
            and ([.steps[]? | select(.name == "Run grouped general test suites"
            or .name == "Run serialized server test shard") | .conclusion]
            == ["success", "success"]))
          # The trim never carries workspaces-a/-b forward, so a merge_group
          # build that ran them proved them on this exact tree: proof is per
          # group, and a landing whose server shards were carried forward
          # re-runs only the server legs (`pretested_workspaces` gates
          # workspaces_tests). Same positive-evidence rule as above: both jobs
          # succeeded AND ran their suite step; a path-selector skip is not proof.
          WORKSPACES_SUITES_RAN: >-
            [.jobs[] | select(.name == "General tests (workspaces-a)"
            or .name == "General tests (workspaces-b)")]
            | length == 2 and all(.[]; .conclusion == "success"
            and ([.steps[]? | select(.name == "Run grouped general test suites")
            | .conclusion] == ["success"]))
        run: |
          set -uo pipefail

          # A merge_group build's `head_sha` IS the commit that lands on
          # master. Verified empirically on the 2026-08-16 queue chain, where
          # each queue branch's base is the previous entry's landed commit:
          #   pr-1381 head_sha a9b48d9e -> landed as a9b48d9e
          #   pr-1385 base     a9b48d9e   head_sha 66465314 -> landed
          #   pr-1123 base     66465314   head_sha d4fb292f -> landed (master)
          # So a successful merge_group run at this SHA that RAN the server
          # suites (SERVER_SUITES_RAN above) means this exact tree has already
          # been through them, and re-running them would be pure duplicated
          # cost. A run that carried them forward from the PR head proves
          # nothing about this tree: the suite runs here instead. Push runs
          # coalesce without cancellation (see `concurrency:` above), so each
          # run that starts finishes and reports. The workspaces groups are
          # proven separately (WORKSPACES_SUITES_RAN above).
          #
          # Filter on the workflow PATH, not merely on a successful merge_group
          # run: `commitperclip-review.yml` also fires on merge_group, so
          # counting any green run here would let a passing review mask a
          # failing test suite — the guard would fail open in precisely the
          # case it exists to catch.
          if ! runs="$(gh api \
            "repos/${REPO}/actions/runs?event=merge_group&head_sha=${HEAD_SHA}&per_page=100" \
            --jq '.workflow_runs[]
                  | select(.path == ".github/workflows/pr.yml"
                           and .conclusion == "success")
                  | .id')"; then
            # Fail closed. An API error must cost us a redundant suite run, not
            # a silently skipped one — an unnoticed red master is what this
            # workflow exists to prevent.
            echo "Could not query merge_group runs; running the suite anyway."
            echo "pretested=0" >> "$GITHUB_OUTPUT"
            echo "pretested_workspaces=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$runs" ]; then
            echo "No successful pr.yml merge_group build for ${HEAD_SHA} (landed outside the queue); running the suite."
            echo "pretested=0" >> "$GITHUB_OUTPUT"
            echo "pretested_workspaces=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          server=0 workspaces=0
          for run_id in $runs; do
            # Fail closed per build and per group as well: a job list that
            # cannot be read is not proof that any suite ran.
            jobs_url="repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100"
            if [ "$server" = 0 ] && ran="$(gh api "$jobs_url" --jq "$SERVER_SUITES_RAN")" \
              && [ "$ran" = "true" ]; then
              echo "Commit ${HEAD_SHA} has successful pr.yml merge_group build ${run_id}, which ran every general-server shard; skipping the server legs."
              server=1
            fi
            if [ "$workspaces" = 0 ] && ran="$(gh api "$jobs_url" --jq "$WORKSPACES_SUITES_RAN")" \
              && [ "$ran" = "true" ]; then
              echo "Commit ${HEAD_SHA} has successful pr.yml merge_group build ${run_id}, which ran workspaces-a and workspaces-b; skipping the workspaces legs."
              workspaces=1
            fi
          done

          [ "$server" = 1 ] || echo "Commit ${HEAD_SHA} has a successful pr.yml merge_group build, but none ran the general-server suites (merge-group trim or path selector), or its jobs were unreadable; running the server legs."
          [ "$workspaces" = 1 ] || echo "Commit ${HEAD_SHA} has a successful pr.yml merge_group build, but none ran workspaces-a and workspaces-b, or its jobs were unreadable; running the workspaces legs."
          echo "pretested=${server}" >> "$GITHUB_OUTPUT"
          echo "pretested_workspaces=${workspaces}" >> "$GITHUB_OUTPUT"

  general_tests:
    name: Master tests (${{ matrix.group_label }})
    needs: [gate]
    # The status-check function here is load-bearing, not decoration. Without
    # one the `if:` carries an implicit `success()` on `needs`, so a gate JOB
    # failure — ARC pod unavailable, the 5-minute timeout firing on a network
    # stall, any runner-level fault — would SKIP the suite and leave the commit
    # untested. The in-step fallback below only covers `gh api` exiting
    # non-zero inside a step that is actually running. With the gate failed,
    # `needs.gate.outputs.pretested` is empty, `'' != '1'` is true, and the
    # suite runs — the fail-closed behaviour this workflow promises. Nothing
    # retries a skipped run; the next push's run tests a head that contains it.
    #
    # It is `!cancelled()` and NOT `always()`, which is a real distinction here
    # rather than style. `always()` is true even when the run has been
    # CANCELLED, and job-level `if:` is evaluated at dispatch time — so during
    # a bulk drain (12 commits in ~3 minutes on 2026-08-16, against a gate that
    # takes seconds) nearly every superseded run would still dispatch this
    # matrix after being cancelled. That is 6 legs at timeout-minutes: 90 each,
    # per cancelled run, onto the very pool the SCOPE block above budgets
    # against — and during precisely the event this workflow exists to watch.
    # `!cancelled()` keeps the fail-closed property (it excludes only
    # cancellation, not failure) without resurrecting superseded runs.
    #
    # The `${{ }}` wrapper is required: a YAML scalar beginning with `!` is a
    # tag indicator and will not parse as a bare token.
    #
    # workflow_dispatch is an explicit operator request, so it always runs.
    #
    # `schedule` bypasses the gate for the reason in the header: its purpose is
    # to re-test a tree whose merge_group proof has EXPIRED, and the gate
    # answers "was this tree ever proven?", not "is that proof still valid?".
    # Honouring it here would skip every scheduled run and report green -- the
    # exact false green (run 36648202266) that let BLO-38228 sit undetected for
    # 63h. This is the load-bearing half of that fix, not a detail.
    #
    # ⚠ DELETING THE `schedule` CLAUSE BELOW IS INVISIBLE AT RUNTIME. The
    # scheduled run still fires, `gate` still sets pretested=1, this matrix is
    # SKIPPED -- and a skipped job still concludes `success`, so the liveness
    # guard sees a fresh completed `schedule` run and reports ok forever. The
    # cron half of this fix fails loudly (no completion -> red in 48h); this half
    # fails silently. It is held instead by a source-text invariant in
    # `scripts/check-scheduled-guard-liveness.test.mjs` ("keeps the schedule
    # bypass on every pretested gate in a watched guard"), which carries its own
    # vacuity control. Deleting the clause fails that test -- including when the
    # `if:` below is rewrapped as a folded block scalar, which the scan joins
    # before reading. A gate the scan cannot locate at all is reported loudly
    # rather than passing clean, so reformatting this line cannot disarm it.
    if: ${{ !cancelled() && (needs.gate.outputs.pretested != '1' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: arc-paperclip-general
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      # Mirrors pr.yml's general_tests matrix (its server legs; workspaces-a/-b
      # are workspaces_tests below, gated on their own proof). The 2026-08-16
      # regression surfaced in `general-server` shard 1/4's serialized suite.
      matrix:
        include:
          - group: general-server
            group_label: server 1/4
            shard_index: 0
            shard_count: 4
          - group: general-server
            group_label: server 2/4
            shard_index: 1
            shard_count: 4
          - group: general-server
            group_label: server 3/4
            shard_index: 2
            shard_count: 4
          - group: general-server
            group_label: server 4/4
            shard_index: 3
            shard_count: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run grouped general test suites
        run: |
          args=(--group '${{ matrix.group }}')
          if [ -n '${{ matrix.shard_count }}' ]; then
            args+=(--shard-index '${{ matrix.shard_index }}' --shard-count '${{ matrix.shard_count }}')
          fi
          pnpm test:run:general -- "${args[@]}"

      - name: Run serialized server test shard
        if: matrix.group == 'general-server'
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

  workspaces_tests:
    name: Master tests (${{ matrix.group_label }})
    needs: [gate]
    # general_tests' workspaces-a/-b legs, split out so they are gated on their
    # own proof (`pretested_workspaces`): the merge-group trim carries only the
    # general-server shards forward, so a landing whose workspaces groups ran in
    # its merge_group build need not re-run them here. The `if:` keeps every
    # property argued at general_tests' `if:` above: `!cancelled()` (fail
    # closed on a gate failure, no resurrected superseded runs), the
    # workflow_dispatch bypass, and the load-bearing `schedule` bypass (held by
    # the same scan in scripts/check-scheduled-guard-liveness.test.mjs, which
    # audits every `if:` naming `needs.gate.outputs.pretested`).
    if: ${{ !cancelled() && (needs.gate.outputs.pretested_workspaces != '1' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: arc-paperclip-general
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: general-workspaces-a
            group_label: workspaces-a
          - group: general-workspaces-b
            group_label: workspaces-b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run grouped general test suites
        run: pnpm test:run:general -- --group '${{ matrix.group }}'
