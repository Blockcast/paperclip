name: Report merge-queue ejections

on:
  workflow_run:
    workflows: [PR]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: arc-light
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          sparse-checkout: .github/scripts/report-merge-queue-ejection.mjs
      - name: Report ejection to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node .github/scripts/report-merge-queue-ejection.mjs
