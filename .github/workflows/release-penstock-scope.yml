# Republish the fork's SDK packages under the Blockcast-owned @penstock/* scope to
# public npm via OIDC Trusted Publishing.
#
# WHY: Blockcast/paperclip is a fork of paperclipai/paperclip. It cannot publish
# under @paperclipai/* (upstream owns the scope) and the upstream release jobs are
# guarded `github.repository == 'paperclipai/paperclip'`, so they skip here. This
# workflow republishes @paperclipai/{plugin-sdk,shared} as @penstock/{plugin-sdk,
# shared} so consumers (e.g. @penstock/paperclip-plugin) can pin the fork's surface
# via a pnpm alias. See scripts/publish-penstock-scope.mjs.
#
# PREREQUISITE (one-time, npm UI): @penstock/plugin-sdk and @penstock/shared must
# already exist on npm AND have a Trusted Publisher configured for this repo +
# workflow. npm cannot do the *first* publish of a brand-new package over OIDC, so
# the initial version is published manually with 2FA. (Same bootstrap as
# @penstock/paperclip-plugin.)
#
# NOTE: the OIDC publish path below is currently NON-FUNCTIONAL on this repo's ARC
# runners — trusted publishing always mints provenance, and npm rejects provenance
# from self-hosted runners. See the note on the publish step. Every release today
# is a manual --bootstrap publish.
#
# MANUAL ONLY: workflow_dispatch — never runs on push. Defaults to dry_run.
name: Release @penstock-scoped SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, YYYY.MMDD.N (mirror upstream scheme), e.g. 2026.614.0"
        required: true
      dry_run:
        description: "Dry run (pack + validate, do NOT publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required: lets the runner mint the OIDC token npm exchanges

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CC: "sccache gcc"
  CXX: "sccache g++"

jobs:
  publish:
    runs-on: arc-deploy
    environment: npm-penstock-scope # optional manual-approval gate; configure in repo settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Set up GHA-backed sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Trusted publishing requires npm >= 11.5.1 (setup-node ships older).
      - name: Upgrade npm (trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore tracked install-time changes
        run: git checkout -- pnpm-lock.yaml || true

      - name: Build SDK packages
        run: |
          pnpm --filter @paperclipai/shared build
          pnpm --filter @paperclipai/plugin-sdk build

      # KNOWN BROKEN — this step cannot succeed on ARC. Verified twice, runs
      # 32295237299 (2026-08-19) and 32354111699 (2026-08-20). Do not "fix" it by
      # adjusting flags; the constraint is structural:
      #
      #   1. These packages have a Trusted Publisher configured on npm, so the CLI
      #      authenticates over OIDC whenever `id-token: write` is available.
      #   2. Trusted publishing mints a sigstore provenance attestation
      #      UNCONDITIONALLY. Dropping `--provenance` does NOT opt out — run
      #      32354111699 published `npm publish --access public` with no flag and
      #      npm still logged "Signed provenance statement with source and build
      #      information from GitHub Actions".
      #   3. npm refuses an attestation minted on a self-hosted runner:
      #      422 Unprocessable Entity - Error verifying sigstore provenance bundle:
      #      Unsupported GitHub Actions runner environment: "self-hosted".
      #      Only "github-hosted" runners are supported when publishing with provenance.
      #   4. A GitHub-hosted runner would violate scripts/check-github-runner-labels.mjs,
      #      whose ALLOWED_RUNNERS set is ARC-only with no exemption path.
      #
      # (2) is the load-bearing fact and the one an earlier fix got wrong: the flag
      # and the attestation are not the same switch.
      #
      # Until one of those changes, releases go out via the script's --bootstrap
      # path, run by hand by a maintainer with `npm login` + 2FA:
      #   node scripts/publish-penstock-scope.mjs --version YYYY.MMDD.N --bootstrap
      #
      # To make CI publishing work again, pick one and do it deliberately:
      #   a. Remove the Trusted Publisher on npm and publish from ARC with a
      #      granular access token in a repo secret (reintroduces a long-lived
      #      token, which npm is actively restricting for 2FA-bypass publishes).
      #   b. Add a GitHub-hosted label to ALLOWED_RUNNERS for this one job.
      - name: Publish under @penstock (OIDC — see note above, currently fails on ARC)
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/publish-penstock-scope.mjs --version "$VERSION" --publish

      - name: Dry run (pack + validate only)
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/publish-penstock-scope.mjs --version "$VERSION"
