# PEN-5781: run the BLO-29711 comment-review-gate census against the repo whose
# merge gate it describes.
#
# WHAT WAS WRONG
#
# `scripts/check-comment-review-gate-census.mjs` shipped as the guard against
# "a merged PR carrying a green status that admits nothing reviewed the head",
# and then was never invoked. Its only reference in .github/workflows was
# pr.yml running its *unit tests*. CI proved the census would detect the
# condition; nothing ever asked it to.
#
# PEN-3281's scheduled-guard liveness check cannot catch that, and the reason is
# structural rather than an oversight: it watches guards that STOP running, and
# this one never started. Hence step two below.
#
# WHY THE SCHEDULE WAS NOT THE WHOLE FIX — AND HAD TO COME SECOND
#
# The census filtered candidate statuses on `startsWith("review/")`. BLO-33657's
# mitigation for this very defect had already moved the live context OUT of that
# namespace, to `gate/ally-comment-findings` — which, measured 2026-11-06, is the
# SOLE ruleset-required status context on master (ruleset 25827389).
#
# So scheduling the census BEFORE widening its predicate would have been worse
# than leaving it idle. Measured over the 12 most recently merged PRs, the old
# predicate found 10 violations — every one of them the retired `review/ally-comment`
# mirror, which is required by nothing — and ZERO on the context that actually
# gates merge. A triager would have seen a working-looking detector producing
# findings, allowlisted the retirement, read `OK: N merged PRs ...`, and closed
# the class. Idle silence claims nothing; a blinded detector manufactures
# reassurance. The predicate was widened first, in the same PR.
#
# WHY THIS JOB DOES NOT RED ON THE VIOLATION COUNT
#
# It would be born permanently red and stay that way. The `required-gate` and
# `review-namespace` populations are a known, tracked, OPEN defect (PEN-5565,
# itself blocked on PEN-4275): 10 of the 12 most recently merged PRs are in it.
#
# This repo already carries that failure three times over and names it —
# scheduled-guard-liveness.yml records that `ally-review-consistency` has 0
# successes in its last 100 runs and `production-environment-protection-guard`
# is 61 failures out of 61, and cites PEN-2847: "a permanently-red auditor
# cannot signal a new violation." Adding a fourth knowingly would make a
# documented problem worse, and would bury the one signal here that IS
# actionable today.
#
# So the split is: the full verdict is always published (log + step summary, per
# surface, never summed), and the job reds only on conditions that can be acted
# on the day they appear —
#
#   1. `unclassified` is non-empty. A green carrying wording only this gate
#      emits, under a context in neither audited set. That means the gate was
#      RENAMED again and this census has been blinded a second time — the exact
#      event this PR exists to recover from, and the one it cannot self-heal.
#   2. The census could not be computed at all (crash, auth, no summary written).
#      A guard that fails to run must not look like a guard that ran and found
#      nothing — that is the whole thesis of PEN-3281.
#
# ⚠️ WHEN PEN-5565 LANDS, FLIP THIS TO A HARD RED — BUT NOT ON `violatingPrs`,
# AND NOT BEFORE THIS CENSUS IS RE-POINTED. The reporter posture is justified
# ONLY by that defect being open and tracked; left in place afterwards it
# becomes the thing it was built to replace, an instrument that watches a
# now-empty class and reports nothing either way. That much is unchanged.
#
# What changed is the predicate. This header first said "a hard red on
# `violatingPrs > 0`", and that flip would land on a detector the remedy itself
# blinds. Read at source 2026-11-08/09 (PEN-5565; CTO, verified first-party by
# DevOps), two independent blindnesses, either one sufficient:
#
#   a. This census reads the PR HEAD (`headRefOid`), never the commit that
#      merged. For a REBASE merge queue the commit that lands is the queue head.
#      Today that is harmless, because the gate writes its string at the PR head
#      and scripts/mirror-comment-review-gate-to-merge-group.mjs copies that
#      string verbatim onto the queue head. PEN-5565's remedy is "publish
#      nothing at the PR head" — after which `findPrViolations` opens
#      `if (status.state !== "success") continue` and admits nothing at all.
#   b. `NOT_EVALUATED_DESCRIPTION_PATTERN` is keyed to GATE-owned wording. The
#      mirror's own fail-open strings ("... passing open ...") match none of it,
#      so re-pointing at the merge commit ALONE still reads clean: the string on
#      the commit that merges names the MIRROR, not the review state.
#
# And `violatingPrs` is a distinct-PR count UNIONED across the buckets, so it
# cannot distinguish "the required-gate bucket is fixed" from "the required-gate
# bucket went blind while the review/ally-comment retirement row kept firing" —
# that retirement row is a third object, under a second context name, from the
# same publish path, and this predicate admits its wording too.
#
# So, in this order:
#
#   1. Re-point at `mergeCommit.oid` as well as `headRefOid`, reported as two
#      surfaces and never summed — the discipline this file already applies to
#      its two buckets.
#   2. Re-key admission off gate-owned wording and onto the structural claim:
#      a required name answered by a non-`failure` object with no independent
#      evaluation behind it.
#   3. Confirm the re-pointed census still reads NON-ZERO on today's population.
#   4. Only then flip — and flip on `surfaces["required-gate"].prs > 0`, which
#      `summarizeViolations` already publishes per surface, NOT on
#      `violatingPrs`.
#
#   5. ⛔ WITHDRAWN 2026-11-09 by its author (CTO) — do NOT re-arm the rename
#      tripwire, and do NOT widen this predicate. (PEN-5565 Done-when item 7.)
#      It read that `unclassifiedPrs != 0` goes blind under an outcome-scoped
#      remedy, since `unclassified` shares the one `state`+`wording` admission
#      gate — findPrViolations admits before classifyAuditedContext ever runs —
#      and so must be re-keyed onto the `clean` / `deferred_finding` wording
#      the remedy leaves standing. Both halves fail.
#      (a) PREMISE. `unclassified` is NOT an independent alarm whose subject is
#      a rename; it is a ROUTING LABEL on the violation predicate, firing on
#      (a violation exists) ∧ (its context name is in neither audited set). The
#      remedy removes the FIRST conjunct under every name, so a post-remedy 0
#      here is this arm reporting no violation anywhere — working, not blinded
#      — and it stays ARMED: a re-introduced not_evaluated green, a new
#      not_evaluated reason added without its alternative, or a second producer
#      is still SEEN, landing in `unclassified` if renamed or `required-gate`
#      if not. This file already says so twice, in its own voice: "Still a
#      violation (the row is real whatever it is called)" and "A future rename
#      changes which bucket a row lands in, never whether it is seen."
#      (b) REMEDY. NOT_EVALUATED_DESCRIPTION_PATTERN is documented as the
#      descriptions this gate emits WHEN IT ESTABLISHED NO REVIEW of the head;
#      item 7 asked it to admit the two it emits when it DID review the head.
#      Because admission is one shared gate applied BEFORE classification, that
#      widening admits every `clean` (:1430) and `deferred_finding` (:1353)
#      green and buckets it as `required-gate` — the exact surface item 4 above
#      keys the flip to. Measured by Security Engineer 2026-11-09T07:0xZ and
#      reproduced by CTO the same day against the real exported
#      findPrViolations, two negative controls refusing under both predicates.
#      The cost is the one this file already prices: "a false rename alarm on a
#      job that reds is worse than a missed row". ⇒ KEEP admitsNothingEvaluated
#      EXACTLY AS IT IS. The surviving-wording referent is correctly identified
#      and is NOT needed; bucket-aware admission (classify first, admit per
#      surface) would work but buys a capability this census never had, at the
#      price of amending the header invariant above — do not spend it. One
#      clause survives and is re-homed to step 2: a structural predicate has no
#      wording term, so applied to the WHOLE predicate it matches every green
#      in the repo and MUTES this alarm rather than blinding it.
#
#   6. Make 0 distinguishable from UNMEASURABLE on the flip arm — an
#      instrument-integrity term, never an admission term. (PEN-5565 Done-when
#      item 8; this is the real residual item 5 was reaching for.) Post-remedy
#      a rename produces no signal at all — there is no violation left to
#      mis-bucket — so DEFAULT_GATE_CONTEXTS can go stale silently, and step 4
#      keys the flip to `surfaces["required-gate"]`, which on a stale name
#      reads 0 because NOBODY PUBLISHES THAT NAME, not because the gate is
#      fixed. That belongs to the family this header already names as its
#      SECOND red condition — a census that could not run must never be
#      mistaken for a census that ran and found nothing (PEN-3281) — and NOT in
#      admitsNothingEvaluated, which is why no invariant above has to be
#      amended and clean/deferred greens stay out of every bucket.
#      NAMED REFERENT, NOT A VALIDATED REMEDY: have summarizeViolations also
#      emit `auditedContextObserved` — the count of merged PRs on which ANY
#      status under an audited gate context was observed at merge, IN ANY STATE
#      — computed from the rows statusesAsOfMerge already returns (no new API
#      call, no predicate change, no new permission), and make step 4's flip
#      `required-gate === 0 AND auditedContextObserved > 0`. Two limits, both
#      load-bearing: (i) nobody has implemented or run this; (ii) post-remedy
#      the audited context is ABSENT BY DESIGN on unevaluated heads, so the
#      signal rests on the window containing at least one EVALUATED head — on
#      this repo the human-authored population. A window with no evaluated head
#      must report UNMEASURABLE, never CLEAN; if that case is common the term
#      needs a floor, which is a measurement nobody has taken.
#
# A flip onto a blind detector converts a tracked open defect into a silently
# closed one. That is strictly worse than the reporter posture it replaces, and
# it is the failure this whole file exists to make impossible.
#
# Liveness of this workflow is watched by scheduled-guard-liveness.yml
# (WATCHED_GUARDS in scripts/check-scheduled-guard-liveness.mjs), so a census
# that stops running is itself detected. That entry is mandatory, not optional:
# check-scheduled-guard-liveness.test.mjs enumerates every scheduled workflow
# and fails the PR if one is neither watched nor exempted.
name: Comment Review Gate Census

on:
  schedule:
    # 06:37 UTC daily. Minute 37 is clear of every hourly guard on this repo
    # (:03/:09/:13/:17/:23/:27/:33/:41/:43/:47/:53/:58), with 4 minutes of
    # separation either side, so this does not pile onto their burst. Daily
    # rather than hourly because the cost is ~1 + CENSUS_PR_LIMIT API calls per
    # run and the subject — the merged-PR population — moves slowly (PEN-4427).
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      pr_limit:
        description: "how many recently merged PRs to examine"
        required: false
        default: ""

permissions:
  # Read-only throughout. `contents: read` is required because a workflow-level
  # permissions block sets every unlisted scope to none, and the checkout needs
  # it; `pull-requests: read` for `gh pr list`; `statuses: read` for the status
  # WRITE HISTORY, which is what the census reads instead of the collapsed
  # combined status (see the script header for why).
  contents: read
  pull-requests: read
  statuses: read

jobs:
  census:
    name: merged PRs carry no green status that admits nothing reviewed the head
    # Same read-only API pool the other `gh api` guards on this repo use.
    runs-on: arc-paperclip-light
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The census exits 1 whenever it finds ANY violation, which is the
      # expected state today. So its exit code is captured rather than allowed
      # to abort the job, and the verdict is read from the JSON summary below.
      # Nothing about detection is changed here — see the header for which
      # conditions this job then reds on.
      - name: Run the comment-review-gate census
        id: census
        env:
          GH_TOKEN: ${{ github.token }}
          # Explicit, and load-bearing: DEFAULT_REPO in the script points at
          # Blockcast/penstock-llm-proxy-core, so an unparameterised schedule
          # would run happily and silently measure the wrong repository.
          CENSUS_REPO: Blockcast/paperclip
          CENSUS_PR_LIMIT: ${{ inputs.pr_limit || '60' }}
          CENSUS_SUMMARY_PATH: ${{ runner.temp }}/census-summary.json
        run: |
          set +e
          node scripts/check-comment-review-gate-census.mjs 2>&1 | tee "${RUNNER_TEMP}/census.txt"
          echo "exit_code=${PIPESTATUS[0]}" >> "${GITHUB_OUTPUT}"
          exit 0

      # Publishing the verdict unconditionally is what makes the reporter
      # posture honest: the counts are visible on every run, so a reader can see
      # the population move even though the job is green.
      - name: Publish the verdict
        run: |
          {
            echo "## Comment review gate census — Blockcast/paperclip"
            echo
            if [ -f "${RUNNER_TEMP}/census-summary.json" ]; then
              echo '```json'
              cat "${RUNNER_TEMP}/census-summary.json"
              echo '```'
            else
              echo "No summary was written — the census did not complete."
            fi
            echo
            echo "<details><summary>Full census output</summary>"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/census.txt" || true
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Condition 2 first: a census that could not run must never be mistaken
      # for a census that ran and found nothing.
      - name: Fail if the census could not be computed
        if: ${{ steps.census.outputs.exit_code != '0' && steps.census.outputs.exit_code != '1' }}
        run: |
          echo "::error::The census did not complete (exit ${{ steps.census.outputs.exit_code }}); its verdict is UNKNOWN, not clean."
          exit 1

      # Condition 1: the rename tripwire. Also re-checks that the summary exists
      # even on an exit code that claims success, because a missing summary on a
      # 0/1 exit means the script changed shape under this job.
      - name: Fail if the gate was renamed out from under the census
        env:
          SUMMARY: ${{ runner.temp }}/census-summary.json
        run: |
          if [ ! -f "${SUMMARY}" ]; then
            echo "::error::The census wrote no summary; its verdict is UNKNOWN, not clean."
            exit 1
          fi
          unclassified="$(node -e 'process.stdout.write(String(require(process.argv[1]).unclassifiedPrs))' "${SUMMARY}")"
          if [ "${unclassified}" != "0" ]; then
            echo "::error::${unclassified} merged PR(s) carry this gate's not-evaluated wording under an UNRECOGNIZED context. The gate has almost certainly been renamed and this census is blind to it again (PEN-5781). Add the new context to DEFAULT_GATE_CONTEXTS in scripts/check-comment-review-gate-census.mjs."
            exit 1
          fi
          echo "No unrecognized context carries this gate's wording; the census is still pointed at the right contexts."
