name: Docker (figma-bot)

# Builds + pushes the paperclip-figma-bot image. Does NOT auto-deploy
# — the cluster yaml at onprem-k8s/paperclip/figma-designer-bot.yaml
# pins a specific sha-tag and updating it is a separate operator step.
#
# IMPORTANT: figma-bot's Dockerfile inherits FROM
# harbor.blockcast.net/paperclip-webflow-bot/webflow-bot:latest. The
# webflow-bot image MUST exist in Harbor before this workflow can
# succeed. PR 1 (BLO-6870) added the docker-webflow-bot.yml workflow
# that publishes that base image.
#
# Trigger: any change under packages/services/figma-bot/.
#
# - pull_request: runs ONLY the `test` job (ruff + pytest) so PRs get
#   gated before merge. Closes the gap that bit PR #173 on 2026-05-25:
#   PR-level CI did not include this workflow, so a ruff I001 violation
#   merged green but blocked the post-merge image rebuild in 1m3s.
#   build-and-push is gated on `github.event_name != pull_request`
#   so forks (which lack HARBOR_PASSWORD) cannot 401 attempting to push.
# - push to master or figma-bot-v* tags: runs both jobs.
# - workflow_dispatch: manually fires both jobs from any ref.
#
# Security: this workflow does NOT interpolate any untrusted event input
# (github.event.*, github.head_ref, etc.) into run: commands. The only
# secrets used are HARBOR_USERNAME/HARBOR_PASSWORD via env (build-and-push
# job only). Same posture as docker-webflow-bot.yml. Adding pull_request
# does NOT expose secrets to fork PRs because the `if:` gate on
# build-and-push prevents that job from running on pull_request events.

on:
  push:
    branches:
      - "master"
    paths:
      - "packages/services/figma-bot/**"
      - ".github/workflows/docker-figma-bot.yml"
    tags:
      - "figma-bot-v*"
  pull_request:
    paths:
      - "packages/services/figma-bot/**"
      - ".github/workflows/docker-figma-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # ruff + pytest only: no Docker. BLO-46675 moved it off org group 1
    # (arc-dind) onto the paperclip-only light lane.
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        working-directory: packages/services/figma-bot
        run: |
          python -m pip install --upgrade pip
          # Install only dev/test deps; structural + cold-boot regression
          # tests run via AST and don't actually import camoufox / playwright.
          python -m pip install pytest pytest-cov ruff mypy

      - name: Run ruff lint
        working-directory: packages/services/figma-bot
        run: ruff check src/ tests/

      - name: Run pytest
        working-directory: packages/services/figma-bot
        run: pytest tests/ -v

  build-and-push:
    # Skip the push step on pull_request events. Forks don't have
    # HARBOR_PASSWORD, and even same-repo PRs shouldn't push transient
    # sha tags pre-merge — `test` is the PR gate; push fires post-merge
    # on the master push event.
    if: github.event_name != 'pull_request'
    needs: test
    # A BuildKit client only, against the shared remote BuildKit (same as
    # docker.yml). BLO-46675: off org group 1 (arc-dind) so tag pushes
    # (refs/tags/figma-bot-v*) and non-master workflow_dispatch keep a runner once
    # group 1 is scoped to master-pinned workflows (BLO-40782).
    # PEN-6677: group pinned so this cannot land on the tools-cluster twin,
    # which reaches a different BuildKit. Full rationale in docker.yml.
    runs-on:
      group: arc-paperclip-buildkit
      labels: arc-paperclip-buildkit
    timeout-minutes: 30
    concurrency:
      group: docker-figma-bot-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Clean stale node_modules from runner workspace
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name node_modules -type l -exec rm -f {} + 2>/dev/null || true

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Same endpoint selection as docker-agent.yml: side images use ordinal 1
      # so they do not evict the main paperclip image's cache on ordinal 0.
      - name: Select BuildKit endpoint
        id: buildkit-endpoint
        env:
          PREFERRED_ORDINAL: "1"
        run: |
          set -euo pipefail
          if [[ ! "${PREFERRED_ORDINAL}" =~ ^[01]$ ]]; then
            echo "Invalid BuildKit ordinal: ${PREFERRED_ORDINAL}" >&2
            exit 1
          fi

          probe_buildkit() {
            local host="$1"
            local timeout_seconds="$2"
            timeout "${timeout_seconds}" nc -z -w "${timeout_seconds}" "${host}" 1234
          }

          preferred="buildkit-amd64-${PREFERRED_ORDINAL}.buildkit-amd64-headless.ci.svc.cluster.local"
          fallback="buildkit-amd64.ci.svc.cluster.local"
          host="${preferred}"
          if ! probe_buildkit "${preferred}" 5; then
            echo "::warning::Preferred BuildKit ${preferred} is unavailable; using the healthy service endpoint"
            host="${fallback}"
            probe_buildkit "${fallback}" 10
          fi
          echo "endpoint=tcp://${host}:1234" >> "$GITHUB_OUTPUT"
          echo "Using BuildKit endpoint tcp://${host}:1234"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit-endpoint.outputs.endpoint }}

      # Name the base by digest instead of letting the build date decide it
      # (PEN-5927). Fails the build when the base cannot be resolved — see
      # scripts/resolve-base-digest.sh for why that is the cheap failure.
      - name: Resolve base image digest
        id: base
        run: |
          set -euo pipefail
          resolved="$(scripts/resolve-base-digest.sh 'harbor.blockcast.net/paperclip-webflow-bot/webflow-bot:latest')"
          echo "image=${resolved}" >> "$GITHUB_OUTPUT"
          echo "Base pinned to ${resolved}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            harbor.blockcast.net/paperclip-figma-bot/figma-bot
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Stable cache carrier refreshed by master builds.
            type=raw,value=buildcache-inline,enable=${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

      - name: Build and push
        # PEN-6683. STRICTLY BELOW the job's `timeout-minutes: 30`, so an
        # overrun here concludes `failure` ON THE STEP instead of `cancelled`
        # on the job. That distinction is the whole point: this job's own
        # `cancel-in-progress: true` produces `cancelled` on every routine
        # supersede, so a ceiling kill recorded that way is indistinguishable
        # from one, and the alert arm below would have to guess.
        #
        # Sized off the SUCCESSFUL population, never the killed runs, because a
        # kill's elapsed time measures the CEILING and not the build. Measured
        # first-party against the Actions API on 2026-11-14 over the 60 most
        # recent runs of this workflow: 8 builds of `build-and-push` succeeded.
        # Five retain step detail -- 25.22 min (run #81, 2026-11-10,
        # workflow_dispatch), 9.08 (#101), 8.58 (#78), 1.57 (#96), 1.40 (#89) --
        # and three are old enough that GitHub has aged their step array out, so
        # their JOB durations bound the step from above at 5.88, 2.27 and 0.82.
        # The longest build that has ever actually COMPLETED here is therefore
        # 25.22 min.
        #
        # 27 is the honest value in a narrow window: it must clear 25.22 and it
        # must stay >= 2 min under the 30-minute ceiling. It clears the longest
        # completed build by 7% and leaves 3 min of headroom -- about 6x the
        # 0.51 min of non-build overhead that same run spent outside this step
        # (job 25.73 vs step 25.22).
        #
        # Run #81 is deliberately NOT discarded as a degraded-pool outlier even
        # though it landed on `arc-paperclip-buildkit-n7zlf` and the next
        # longest success is 9.08 min. It COMPLETED, so it is uncensored data,
        # and this budget binds `workflow_dispatch` builds exactly as it binds
        # pushes. Excluding it would mean sizing against a forecast that
        # PEN-6677's group pin holds.
        timeout-minutes: 27
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/services/figma-bot/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            WEBFLOW_BOT_IMAGE=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=harbor.blockcast.net/paperclip-figma-bot/figma-bot:buildcache-inline
            type=registry,ref=harbor.blockcast.net/paperclip-figma-bot/figma-bot:latest
            type=registry,ref=harbor.blockcast.net/paperclip-figma-bot/figma-bot:buildcache-v1
            type=gha,scope=paperclip-figma-bot
          # Refresh the primary Harbor cache inline with the image push instead
          # of blocking the release path on separate registry and GHA exports.
          # The old registry/GHA entries remain read-only migration fallbacks.
          cache-to: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=inline' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}

  # PEN-6683. A `master` push that publishes no image must reach somebody.
  #
  # This lane has been ceiling-killed on a master PUSH twice and told nobody
  # both times: run #98 (2026-11-14T14:53:16Z) ran 30.12 min against its own
  # 30-minute ceiling, and run #80 (2026-11-09T23:19:25Z) ran 30.10 min, both
  # on runner scale set `arc-paperclip-buildkit-n7zlf`. Each published nothing
  # and each was recorded `cancelled`, not `failure` -- the gap PEN-6034 named.
  #
  # Nothing else covers this lane, checked rather than assumed on 2026-11-14:
  # `master-health.yml` censuses runs filtered on
  # `.path == ".github/workflows/pr.yml"` and so cannot see a `docker-*` run;
  # `scheduled_workflow_last_verdict_failed` carries no `docker-*` series and
  # keys on the CRON verdict, so it cannot see a push build; and this workflow
  # has no outcome job of its own.
  #
  # Same shape as docker-mcp-external.yml, docker-mcp-gateway.yml and
  # docker-agent.yml: a separate job, firing on `failure` OR `cancelled`, routed
  # to Alertmanager (NOT GitHub Issues, which are disabled on this repo -
  # BLO-33382) and fanned to the paperclip-plugin-alertmanager webhook, which
  # dedupes on the alert fingerprint and refreshes one issue in place.
  alert-on-failure:
    # `test` is in `needs` because `build-and-push` is gated on it: when the test
    # job fails the build is SKIPPED, no image is published, and the build-result
    # arms below cannot see it. That silence is the PEN-6683 failure itself.
    # The pull_request exclusion keeps this to the push path, where a missing
    # image is a real outage; on a PR the build is skipped by design and `test`
    # is already the gate that reports to the author.
    needs: [test, build-and-push]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      github.event_name != 'pull_request' &&
      (needs.build-and-push.result == 'failure' || needs.build-and-push.result == 'cancelled' ||
       needs.test.result == 'failure' || needs.test.result == 'cancelled')
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    # actions: read + checks: read are what let the script tell a timeout kill
    # from a concurrency supersede and from a human cancel. All three report
    # `cancelled`; only the annotations separate them, and without these scopes
    # every cancellation classifies `unknown` and pages (fail-closed, but
    # uselessly noisy - and a noisy alert gets muted, which is the silence this
    # row exists to end).
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Report the unpublished image to Alertmanager
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: firing
          GH_REPO: ${{ github.repository }}
          # Collapsed to a single value for tags so the label set stays bounded:
          # the fingerprint hashes every label, and one identity per tag would
          # fragment the alert the bridge dedupes on (BLO-28616).
          BRANCH: ${{ github.ref_type == 'tag' && 'tags' || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/post-figma-bot-image-alert.mjs

  # The other half of an honest alert: without it `endsAt` is the only thing
  # retiring the firing alert, so the lane goes quiet on a TIMER rather than on
  # a fix. Pushing the identical label set with a past `endsAt` makes
  # Alertmanager send `resolved`, which cancels the issue.
  #
  # It is also the continuous capability probe. This lane is sparse - 8
  # successful builds across the 60 most recent runs - so a channel that rotted
  # here would otherwise be discovered by the next outage. Every green build
  # exercises the exact delivery path the failure path depends on.
  #
  # A separate job rather than a step inside build-and-push, deliberately: a
  # delivery failure here must not flip `build-and-push.result` to `failure`
  # and fire a spurious "the build is failing" alert about itself.
  resolve-on-success:
    needs: [build-and-push]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      needs.build-and-push.result == 'success'
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Resolve the image-delivery alert (and prove the channel still works)
        env:
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL || 'http://alertmanager.monitoring.svc.cluster.local:9093' }}
          STATE: resolved
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_type == 'tag' && 'tags' || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/post-figma-bot-image-alert.mjs
