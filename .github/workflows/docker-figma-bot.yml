name: Docker (figma-bot)

# Builds + pushes the paperclip-figma-bot image. Does NOT auto-deploy
# — the cluster yaml at onprem-k8s/paperclip/figma-designer-bot.yaml
# pins a specific sha-tag and updating it is a separate operator step.
#
# IMPORTANT: figma-bot's Dockerfile inherits FROM
# harbor.blockcast.net/paperclip-webflow-bot/webflow-bot:latest. The
# webflow-bot image MUST exist in Harbor before this workflow can
# succeed. PR 1 (BLO-6870) added the docker-webflow-bot.yml workflow
# that publishes that base image.
#
# Trigger: any change under packages/services/figma-bot/.
#
# - pull_request: runs ONLY the `test` job (ruff + pytest) so PRs get
#   gated before merge. Closes the gap that bit PR #173 on 2026-05-25:
#   PR-level CI did not include this workflow, so a ruff I001 violation
#   merged green but blocked the post-merge image rebuild in 1m3s.
#   build-and-push is gated on `github.event_name != pull_request`
#   so forks (which lack HARBOR_PASSWORD) cannot 401 attempting to push.
# - push to master or figma-bot-v* tags: runs both jobs.
# - workflow_dispatch: manually fires both jobs from any ref.
#
# Security: this workflow does NOT interpolate any untrusted event input
# (github.event.*, github.head_ref, etc.) into run: commands. The only
# secrets used are HARBOR_USERNAME/HARBOR_PASSWORD via env (build-and-push
# job only). Same posture as docker-webflow-bot.yml. Adding pull_request
# does NOT expose secrets to fork PRs because the `if:` gate on
# build-and-push prevents that job from running on pull_request events.

on:
  push:
    branches:
      - "master"
    paths:
      - "packages/services/figma-bot/**"
      - ".github/workflows/docker-figma-bot.yml"
    tags:
      - "figma-bot-v*"
  pull_request:
    paths:
      - "packages/services/figma-bot/**"
      - ".github/workflows/docker-figma-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # ruff + pytest only: no Docker. BLO-46675 moved it off org group 1
    # (arc-dind) onto the paperclip-only light lane.
    runs-on: arc-paperclip-light
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        working-directory: packages/services/figma-bot
        run: |
          python -m pip install --upgrade pip
          # Install only dev/test deps; structural + cold-boot regression
          # tests run via AST and don't actually import camoufox / playwright.
          python -m pip install pytest pytest-cov ruff mypy

      - name: Run ruff lint
        working-directory: packages/services/figma-bot
        run: ruff check src/ tests/

      - name: Run pytest
        working-directory: packages/services/figma-bot
        run: pytest tests/ -v

  build-and-push:
    # Skip the push step on pull_request events. Forks don't have
    # HARBOR_PASSWORD, and even same-repo PRs shouldn't push transient
    # sha tags pre-merge — `test` is the PR gate; push fires post-merge
    # on the master push event.
    if: github.event_name != 'pull_request'
    needs: test
    # A BuildKit client only, against the shared remote BuildKit (same as
    # docker.yml). BLO-46675: off org group 1 (arc-dind) so tag pushes
    # (refs/tags/figma-bot-v*) and non-master workflow_dispatch keep a runner once
    # group 1 is scoped to master-pinned workflows (BLO-40782).
    runs-on: arc-paperclip-buildkit
    timeout-minutes: 30
    concurrency:
      group: docker-figma-bot-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean stale node_modules from runner workspace
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name node_modules -type l -exec rm -f {} + 2>/dev/null || true

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Same endpoint selection as docker-agent.yml: side images use ordinal 1
      # so they do not evict the main paperclip image's cache on ordinal 0.
      - name: Select BuildKit endpoint
        id: buildkit-endpoint
        env:
          PREFERRED_ORDINAL: "1"
        run: |
          set -euo pipefail
          if [[ ! "${PREFERRED_ORDINAL}" =~ ^[01]$ ]]; then
            echo "Invalid BuildKit ordinal: ${PREFERRED_ORDINAL}" >&2
            exit 1
          fi

          probe_buildkit() {
            local host="$1"
            local timeout_seconds="$2"
            timeout "${timeout_seconds}" nc -z -w "${timeout_seconds}" "${host}" 1234
          }

          preferred="buildkit-amd64-${PREFERRED_ORDINAL}.buildkit-amd64-headless.ci.svc.cluster.local"
          fallback="buildkit-amd64.ci.svc.cluster.local"
          host="${preferred}"
          if ! probe_buildkit "${preferred}" 5; then
            echo "::warning::Preferred BuildKit ${preferred} is unavailable; using the healthy service endpoint"
            host="${fallback}"
            probe_buildkit "${fallback}" 10
          fi
          echo "endpoint=tcp://${host}:1234" >> "$GITHUB_OUTPUT"
          echo "Using BuildKit endpoint tcp://${host}:1234"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.buildkit-endpoint.outputs.endpoint }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            harbor.blockcast.net/paperclip-figma-bot/figma-bot
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Stable cache carrier refreshed by master builds.
            type=raw,value=buildcache-inline,enable=${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/services/figma-bot/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=harbor.blockcast.net/paperclip-figma-bot/figma-bot:buildcache-inline
            type=registry,ref=harbor.blockcast.net/paperclip-figma-bot/figma-bot:latest
            type=registry,ref=harbor.blockcast.net/paperclip-figma-bot/figma-bot:buildcache-v1
            type=gha,scope=paperclip-figma-bot
          # Refresh the primary Harbor cache inline with the image push instead
          # of blocking the release path on separate registry and GHA exports.
          # The old registry/GHA entries remain read-only migration fallbacks.
          cache-to: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'type=inline' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
