# ccrotate-auth-bot — long-lived Chromium session pool for refreshing
# claude.ai / chatgpt.com OAuth credentials per ccrotate-saved email.
#
# Mirrors the webflow-designer-bot pattern (port 7000 control plane, VNC
# port 6080, persistent profile PVC). One pod, multiple per-email Playwright
# persistent contexts under /data/profiles/.
#
# Apply order:
#   1. Ensure secret/paperclip-ccrotate-auth-bot-creds exists with keys:
#        - openai_password (shared password for all codex accounts)
#        - accounts.json   ({"claude":[...], "codex":[...]})
#      (control_token is no longer used — ingress is pinned via the
#      NetworkPolicy below to only paperclip-0.)
#   2. kubectl apply -f manifest.yaml
#   3. Port-forward to drive VNC for first login per account:
#        kubectl -n paperclip port-forward deploy/ccrotate-auth-bot 6080:6080
#        open http://localhost:6080/vnc.html
#      Then log in to claude.ai or chatgpt.com once per email; cookies
#      persist on the PVC so subsequent /relogin calls are no-ops.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ccrotate-auth-bot-data
  namespace: paperclip
  labels:
    app.kubernetes.io/name: ccrotate-auth-bot
    app.kubernetes.io/part-of: paperclip
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ccrotate-auth-bot-script
  namespace: paperclip
  labels:
    app.kubernetes.io/name: ccrotate-auth-bot
    app.kubernetes.io/part-of: paperclip
data:
  # The script content is loaded from services/ccrotate-auth-bot/bot.mjs at
  # build/deploy time. To regenerate this configmap from the file in the
  # repo, run:
  #   kubectl -n paperclip create configmap ccrotate-auth-bot-script \
  #     --from-file=script.mjs=services/ccrotate-auth-bot/bot.mjs \
  #     --dry-run=client -o yaml | kubectl apply -f -
  script.mjs: |
    // placeholder — overwritten at deploy. See services/ccrotate-auth-bot/bot.mjs.
    console.error("ccrotate-auth-bot: script not loaded from configmap");
    process.exit(1);
---
apiVersion: v1
kind: Service
metadata:
  name: ccrotate-auth-bot
  namespace: paperclip
  labels:
    app.kubernetes.io/name: ccrotate-auth-bot
    app.kubernetes.io/part-of: paperclip
spec:
  selector:
    app.kubernetes.io/name: ccrotate-auth-bot
  ports:
    - name: control
      port: 7000
      targetPort: 7000
    - name: novnc
      port: 6080
      targetPort: 6080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccrotate-auth-bot
  namespace: paperclip
  labels:
    app.kubernetes.io/name: ccrotate-auth-bot
    app.kubernetes.io/part-of: paperclip
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC is RWO, single-writer
  selector:
    matchLabels:
      app.kubernetes.io/name: ccrotate-auth-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ccrotate-auth-bot
        app.kubernetes.io/part-of: paperclip
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: paperclip
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: paperclip
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: mcr.microsoft.com/playwright:v1.49.1-jammy
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eo pipefail
              export DEBIAN_FRONTEND=noninteractive
              mkdir -p /data/profiles
              # Clear stale Chromium SingletonLocks left by the previous pod —
              # Chromium refuses to launch when it sees a SingletonLock from
              # a different hostname even if that pod is long gone.
              find /data/profiles -maxdepth 2 -name 'Singleton*' -delete 2>/dev/null || true
              # Redirect apt to /tmp (caps-dropped pod can't write to /var).
              mkdir -p /tmp/apt-cache/archives/partial /tmp/apt-state /tmp/apt-lists/partial
              APT_OPTS="-o APT::Sandbox::User=root -o Dir::Cache=/tmp/apt-cache -o Dir::State=/tmp/apt-state -o Dir::State::Lists=/tmp/apt-lists"
              apt-get $APT_OPTS update -qq \
                && apt-get $APT_OPTS install -y -qq --no-install-recommends \
                     xvfb x11vnc websockify novnc fluxbox curl ca-certificates >/dev/null
              # Install ccrotate + claude CLI + codex CLI from npm (the bot
              # spawns these to write the credential files ccrotate snap
              # then captures).
              cd /app && npm init -y >/dev/null 2>&1
              npm install --silent playwright@1.49.1 ccrotate@latest @anthropic-ai/claude-code@latest @openai/codex@latest 2>&1 | tail -3
              ln -sf /app/node_modules/.bin/ccrotate /usr/local/bin/ccrotate || true
              ln -sf /app/node_modules/.bin/claude /usr/local/bin/claude || true
              ln -sf /app/node_modules/.bin/codex /usr/local/bin/codex || true
              # Xvfb + window manager so Chromium has a display in non-headless
              # mode (operator VNC fallback). The bot itself runs HEADLESS=true
              # by default; flip via env to attach VNC for debugging.
              Xvfb :99 -screen 0 1920x1080x24 -ac &
              export DISPLAY=:99
              sleep 1
              fluxbox >/var/log/fluxbox.log 2>&1 &
              x11vnc -display :99 -forever -shared -localhost -rfbport 5900 -nopw -bg -o /var/log/x11vnc.log
              websockify --web=/usr/share/novnc/ localhost:6080 localhost:5900 >/var/log/websockify.log 2>&1 &
              exec node /app/script.mjs
          env:
            - name: HOME
              value: /data
            - name: PROFILE_ROOT
              value: /data/profiles
            - name: CONTROL_PORT
              value: "7000"
            - name: HEADLESS
              value: "true"
            - name: OPENAI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperclip-ccrotate-auth-bot-creds
                  key: openai_password
            - name: ACCOUNTS_JSON
              valueFrom:
                secretKeyRef:
                  name: paperclip-ccrotate-auth-bot-creds
                  key: accounts.json
          ports:
            - name: control
              containerPort: 7000
            - name: vnc
              containerPort: 5900
            - name: novnc
              containerPort: 6080
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "200m"
              memory: "1Gi"
          # We need runAsUser:0 because the playwright base image's pwuser
          # (UID 1000) cannot run dpkg postinst at boot (same gotcha as
          # webflow-designer-bot). All caps dropped except the boot-time
          # apt set; this is defense-in-depth, not a security boundary
          # against a compromised playwright image.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
                - SETPCAP
                - NET_BIND_SERVICE
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: script
              mountPath: /app/script.mjs
              subPath: script.mjs
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ccrotate-auth-bot-data
        - name: script
          configMap:
            name: ccrotate-auth-bot-script
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
# Lock down :7000 ingress to only paperclip-0 (the StatefulSet pod). VNC
# ports (5900 raw, 6080 noVNC) are bound to localhost inside the container
# (`x11vnc -localhost` and `websockify localhost:6080 localhost:5900`), so
# they're not reachable over the cluster pod network regardless of policy.
# `kubectl port-forward` traffic comes through the apiserver SPDY tunnel
# from the kubelet, which does NOT pass through pod-network NetworkPolicy
# enforcement — so there's no rule to add for operator VNC, port-forward
# Just Works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccrotate-auth-bot-ingress
  namespace: paperclip
  labels:
    app.kubernetes.io/name: ccrotate-auth-bot
    app.kubernetes.io/part-of: paperclip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ccrotate-auth-bot
  policyTypes: [Ingress]
  ingress:
    # Allow paperclip-0 → :7000 control plane.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paperclip
      ports:
        - protocol: TCP
          port: 7000
