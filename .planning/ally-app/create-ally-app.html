<!doctype html>
<!--
  One-click GitHub App creation via the manifest flow.

  HOW TO USE:
   1. Make sure you're logged into GitHub in this browser as a Blockcast org OWNER.
   2. Open this file in that browser (double-click, or `open create-ally-app.html`).
   3. Click the button. GitHub shows a confirmation page pre-filled with the
      "ally" app settings — review + "Create GitHub App".
   4. GitHub redirects to a URL containing `?code=XXXX`. The page may 404
      (paperclip has no callback route yet) — that's fine. COPY the `code`
      value from the browser address bar and hand it back to the assistant,
      OR run the exchange yourself (see ally-app-setup.md step 3).

  The manifest below mirrors the current `blockcast-ci-packages` app's
  permissions so the new app is a faithful drop-in (nothing the fleet/CI
  relies on breaks). Descope later if desired.
-->
<html>
  <head><meta charset="utf-8" /><title>Create the "ally" GitHub App</title></head>
  <body style="font-family: system-ui; max-width: 640px; margin: 4rem auto; line-height: 1.5">
    <h1>Create the &ldquo;ally&rdquo; GitHub App</h1>
    <p>Logged into GitHub as a <strong>Blockcast org owner</strong>? Click below.
       GitHub will show a pre-filled confirmation page.</p>
    <form id="f" action="https://github.com/organizations/Blockcast/settings/apps/new" method="post">
      <input type="hidden" name="manifest" id="manifest" />
      <button type="submit" style="font-size:1.1rem;padding:.6rem 1.2rem;cursor:pointer">
        Create &ldquo;ally&rdquo; on GitHub →
      </button>
    </form>
    <p style="color:#666;margin-top:2rem">After creating, copy <code>code</code> from the redirect URL.</p>
    <script>
      const manifest = {
        name: "ally",
        url: "https://paperclip.blockcast.net",
        description: "Blockcast automation bot identity (formerly 'Blockcast CI Packages'). Mints the installation token paperclip injects into agent run pods (commits, PRs, review comments) and drives CI automation. Renamed to 'ally'.",
        public: false,
        redirect_url: "https://paperclip.blockcast.net/api/github/app-manifest-callback",
        hook_attributes: { active: false },
        default_events: [],
        default_permissions: {
          actions: "write", checks: "write", contents: "write", deployments: "write",
          environments: "write", issues: "write", metadata: "read", packages: "write",
          pages: "write", pull_requests: "write", repository_hooks: "write",
          repository_projects: "write", secret_scanning_alerts: "write",
          security_events: "write", statuses: "write", vulnerability_alerts: "write",
          workflows: "write", organization_administration: "write",
          organization_self_hosted_runners: "write"
        }
      };
      document.getElementById("manifest").value = JSON.stringify(manifest);
    </script>
  </body>
</html>
