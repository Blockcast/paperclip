{{/*
  READ BEFORE ADDING AN ALERT HERE — this file does not deploy on Blockcast.

  `prometheusRule.enabled` is false in values.blockcast.yaml (BLO-14032 /
  BLO-14556): the paperclip-ci-deploy ServiceAccount running `helm upgrade` has
  no RBAC grant on prometheusrules.monitoring.coreos.com, so turning it on does
  not merely skip this resource — it 403s the whole release. A regression test
  (tests/prometheus-rule.test.mjs) fails CI if the flag flips back on.

  So a rule added ONLY here is dead code on the cluster it is meant to protect.
  The live alerting surface is Blockcast/onprem-k8s, and it is itself a pair:

    1. monitoring/prometheus-configmap.yaml, key `paperclip-runtime-alerts.rules.yml`
       — AUTHORITATIVE. The cluster runs a vanilla Prometheus StatefulSet that
       loads rules from this static ConfigMap. This is the copy that fires.
    2. paperclip/paperclip-runtime-alerts-prometheusrule.yaml
       — a documentation copy of the same rules as a PrometheusRule CRD. No
       prometheus-operator runs on this cluster, so the CRD is an orphaned
       no-op, kept so a future operator install picks it up.

  Those two are lockstep-enforced by onprem-k8s scripts/check-prometheus-rules-lockstep.sh
  (edit both or CI fails). Nothing enforces lockstep with THIS chart file.

  Groups below are therefore mirrors, kept so the chart stays coherent for a
  cluster that does grant the RBAC. When you change a rule here, change it in
  both onprem-k8s files too — see BLO-18859 for the review that caught an alert
  landing here and nowhere else.
*/}}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "paperclip.fullname" . }}-runtime-alerts
  {{- with .Values.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: paperclip-runtime
      rules:
        - alert: PaperclipAgentZeroTokenRunStreak
          expr: max by (agent_id, adapter) (paperclip_agent_zero_token_completed_run_streak) >= {{ .Values.prometheusRule.zeroTokenStreakThreshold }}
          for: {{ .Values.prometheusRule.zeroTokenFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent has {{ .Values.prometheusRule.zeroTokenStreakThreshold }}+ consecutive zero-token runs"
            description: "Agent {{`{{ $labels.agent_id }}`}} on adapter {{`{{ $labels.adapter }}`}} has completed {{ .Values.prometheusRule.zeroTokenStreakThreshold }} or more consecutive terminal runs with zero token usage. This catches poisoned-session/pre-model throttle loops like BLO-10866 within minutes."
        - alert: PaperclipAgentJobBackoffLimitExceeded
          expr: (sum by (namespace) (rate(kube_job_status_failed{job_name=~{{ .Values.prometheusRule.agentJobNameRegex | quote }},reason="BackoffLimitExceeded"}[{{ .Values.prometheusRule.backoffLimitExceededWindow }}])) or (sum by (namespace) (rate(kube_job_status_failed{job_name=~{{ .Values.prometheusRule.agentJobNameRegex | quote }}}[{{ .Values.prometheusRule.backoffLimitExceededWindow }}])) unless on (namespace) sum by (namespace) (kube_job_status_failed{job_name=~{{ .Values.prometheusRule.agentJobNameRegex | quote }},reason=~".+"}))) > 0
          for: {{ .Values.prometheusRule.backoffLimitExceededFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent Kubernetes Jobs are hitting BackoffLimitExceeded"
            description: "One or more ac-* Paperclip agent Jobs in namespace {{`{{ $labels.namespace }}`}} are failing with BackoffLimitExceeded, or this cluster's kube-state-metrics omits Job failure reason labels and an ac-* Job failed. Check the matching Job/Pod logs and the zero-token streak alert for poisoned-session loops."
        - alert: PaperclipAgentPodUnschedulable
          # BLO-16224: keys on kube_pod_status_scheduled{condition="false"} (PodScheduled=False
          # -- the scheduler has not placed the pod) rather than kube_pod_status_unschedulable,
          # which many kube-state-metrics builds/allowlists do NOT expose (confirmed absent on
          # the Blockcast cluster's KSM, 2026-07-15). scheduled{condition="false"} is a core,
          # always-emitted KSM series; with the `for` window it captures sustained node-pool
          # starvation while ignoring pods still mid-scheduling. Post-scheduling waits
          # (image pull, PVC bind) keep PodScheduled=True, so they do not false-fire this.
          expr: count(kube_pod_status_scheduled{condition="false",pod=~{{ .Values.prometheusRule.agentJobNameRegex | quote }}} == 1) > {{ .Values.prometheusRule.unschedulablePodThreshold }}
          for: {{ .Values.prometheusRule.unschedulableFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent pods stuck Unschedulable (node-pool scheduling starvation)"
            description: "More than {{ .Values.prometheusRule.unschedulablePodThreshold }} ac-* agent pod(s) have had PodScheduled=false (unschedulable) for {{ .Values.prometheusRule.unschedulableFor }} (BLO-16224). Agent-Job pods request 1 CPU each and affinity-pin to the shared arc-runner-host pool, which bin-packs on requests, so sustained unschedulable means the pool is requests-saturated (not usage-saturated). Remediate by adding pool capacity or right-sizing the agent-Job CPU request (observed usage runs well under the 1-core request). Transient blips self-resolve; this fires only on sustained starvation. Requires kube-state-metrics (kube_pod_status_scheduled)."
    - name: paperclip-process-lost
      rules:
        - alert: PaperclipProcessLostElevated
          expr: sum(increase(paperclip_process_lost_total[1d])) > {{ .Values.prometheusRule.processLostWarnPerDay }}
          for: {{ .Values.prometheusRule.processLostElevatedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip process_lost reaps elevated (>{{ .Values.prometheusRule.processLostWarnPerDay }}/day)"
            description: "More than {{ .Values.prometheusRule.processLostWarnPerDay }} heartbeat runs were reaped as process_lost over the last 24h (BLO-12292 fleet instability). Break the numerator down by (adapter, error_bucket, classification) on paperclip_process_lost_total. Before trusting a low/zero reading, cross-check the two denominators: paperclip_external_lifecycle_running_runs (run volume) and the PaperclipProcessLostSignalBlind alert (kube-null blindness)."
        - alert: PaperclipProcessLostSustained
          expr: sum(increase(paperclip_process_lost_total[1d])) > {{ .Values.prometheusRule.processLostPagePerDay }}
          for: {{ .Values.prometheusRule.processLostPageFor }}
          labels:
            severity: critical
          annotations:
            summary: "Paperclip process_lost reaps sustained-high (>{{ .Values.prometheusRule.processLostPagePerDay }}/day for {{ .Values.prometheusRule.processLostPageFor }})"
            description: "process_lost reaps exceeded {{ .Values.prometheusRule.processLostPagePerDay }}/day sustained for {{ .Values.prometheusRule.processLostPageFor }} (BLO-12292). If PaperclipProcessLostSignalBlind is also firing, the spike may be kube-API-outage-driven staleness reaping rather than genuine loss — check kube API / paperclip-0 health and recent deploys/restarts."
        - alert: PaperclipProcessLostSignalBlind
          expr: sum(increase(paperclip_process_lost_liveness_null_total[15m])) > {{ .Values.prometheusRule.processLostLivenessNullWindowCount }}
          for: {{ .Values.prometheusRule.processLostSignalBlindFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip reaper is blind to kube Job liveness"
            description: "The reaper hit more than {{ .Values.prometheusRule.processLostLivenessNullWindowCount }} null kube Job-status lists in 15m, so it is falling back to the staleness heuristic while blind (BLO-16184 denominator guard). Any concurrent LOW process_lost count is UNRELIABLE — a 0 means 'could not see', not 'healthy'; a spike may be kube-outage-driven. Check the K8s API and the paperclip ServiceAccount RBAC."
    - name: paperclip-github-delivery
      rules:
        - alert: PaperclipGithubReviewRequestDeadLettered
          # BLO-18859: keys on the dead_lettered state of the delivery funnel
          # counter, which is zero-initialized at process start — so an absent
          # series means a broken scrape, not a healthy fleet, and a 0 here is a
          # real 0. increase() over the window catches a single dead-letter
          # (threshold > 0) because one lost @ally review request is already a
          # user-visible failure: the PR sits with a posted trigger and no
          # review, which is the BLO-18847 symptom. Deliberately NOT rate()-per-
          # second — that rounds a lone event toward zero on a wide window.
          expr: sum(increase(paperclip_github_review_request_delivery_total{state="dead_lettered"}[{{ .Values.prometheusRule.githubDeliveryDeadLetterWindow }}])) > 0
          for: {{ .Values.prometheusRule.githubDeliveryDeadLetterFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip GitHub review-request delivery dead-lettered (an @ally review will never run)"
            description: "At least one GitHub review-request reviewer wake was dead-lettered in the last {{ .Values.prometheusRule.githubDeliveryDeadLetterWindow }} (BLO-18859). Dead-lettered is TERMINAL — the reconciler never re-arms it, so the affected PR has a posted review trigger and will never get a review until someone re-triggers it. Two paths reach this state: a durable agent_wakeup_requests row exhausted DISPATCH_RETRY_MAX_ATTEMPTS (query `select id, agent_id, reason, error from agent_wakeup_requests where status = 'dispatch_failed_exhausted' order by updated_at desc`), or wakeupWithDispatchRetry could not persist its safety-net row at all — the latter leaves NO row and is visible only in the logs ('dropping without a durable record' / 'failed to persist durable wake-dispatch-failed record'). Break down by the `reason` label to see which event type is failing. Read alongside the received/queued/retried states of the same counter: a rising `retried` with no dead-letters is dispatch flakiness absorbed by the retry chain, not loss."
    {{- with .Values.prometheusRule.additionalGroups }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
