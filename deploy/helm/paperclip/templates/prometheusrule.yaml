{{/*
  READ BEFORE ADDING AN ALERT HERE — this file does not deploy on Blockcast.

  `prometheusRule.enabled` is false in values.blockcast.yaml (BLO-14032 /
  BLO-14556): the paperclip-ci-deploy ServiceAccount running `helm upgrade` has
  no RBAC grant on prometheusrules.monitoring.coreos.com, so turning it on does
  not merely skip this resource — it 403s the whole release. A regression test
  (tests/prometheus-rule.test.mjs) fails CI if the flag flips back on.

  So a rule added ONLY here is dead code on the cluster it is meant to protect.
  The live alerting surface is Blockcast/onprem-k8s, and it is itself a pair:

    1. monitoring/prometheus-configmap.yaml, key `paperclip-runtime-alerts.rules.yml`
       — AUTHORITATIVE. The cluster runs a vanilla Prometheus StatefulSet that
       loads rules from this static ConfigMap. This is the copy that fires.
    2. paperclip/paperclip-runtime-alerts-prometheusrule.yaml
       — a documentation copy of the same rules as a PrometheusRule CRD. No
       prometheus-operator runs on this cluster, so the CRD is an orphaned
       no-op, kept so a future operator install picks it up.

  Those two are lockstep-enforced by onprem-k8s scripts/check-prometheus-rules-lockstep.sh
  (edit both or CI fails). Nothing enforces lockstep with THIS chart file.

  Groups below are therefore mirrors, kept so the chart stays coherent for a
  cluster that does grant the RBAC. When you change a rule here, change it in
  both onprem-k8s files too — see BLO-18859 for the review that caught an alert
  landing here and nowhere else.

  STATUS of the BLO-18859 dead-letter alert, so this head is auditable on its
  own (a reviewer cannot see the other repo from here):

    - Landed on both authoritative onprem-k8s files by Blockcast/onprem-k8s#1784,
      merged 2026-07-30T13:01:18Z as 423e32bc76c1bcdfa88c02bfce722a2ee71c22ef.
      Verify:
        gh api repos/Blockcast/onprem-k8s/contents/monitoring/prometheus-configmap.yaml \
          --jq '.content' | base64 -d | grep PaperclipGithubReviewRequestDeadLettered

    - LIVE as of 2026-07-31T01:10Z after manually syncing the monitoring-rules
      Argo app to onprem-k8s revision 942d8154ebdda34ccdd61255d0ac891becfc5b9d.
      The live monitoring/prometheus-config ConfigMap and Prometheus /api/v1/rules
      both include PaperclipGithubReviewRequestDeadLettered and
      PaperclipGithubReviewRequestSuppressionOutage.

      The cluster ConfigMap monitoring/prometheus-config is still Argo-tracked
      (argocd.argoproj.io/tracking-id: monitoring-rules:/ConfigMap:monitoring/prometheus-config)
      and the `monitoring-rules` app syncs manually, so a merge does not deploy.
      That sync gate is a standing repo-wide hazard — it once sat 8 days and
      stranded 15 merged alerts — and is tracked on BLO-19095, not here. Merging
      an alert is not deploying it; confirm the live ConfigMap before treating
      any rule in this family as production observability.

  STATUS of the BLO-20255 terminal-failed wake alert, same auditability rule:

    - Added to both authoritative onprem-k8s files by Blockcast/onprem-k8s#1946
      (branch cto/blo-20255-terminal-failed-wake-alert). Verify:
        gh api repos/Blockcast/onprem-k8s/contents/monitoring/prometheus-configmap.yaml \
          --jq '.content' | base64 -d | grep PaperclipPrReviewWakeTerminalFailed

    - NOT yet merged and NOT yet live as of 2026-08-02. It reads a metric this
      PR adds, so it is inert until both land. Same manual `monitoring-rules`
      Argo sync gate as above applies afterwards.
*/}}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "paperclip.fullname" . }}-runtime-alerts
  {{- with .Values.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: paperclip-runtime
      rules:
        - alert: PaperclipAgentZeroTokenRunStreak
          expr: max by (agent_id, adapter) (paperclip_agent_zero_token_completed_run_streak) >= {{ .Values.prometheusRule.zeroTokenStreakThreshold }}
          for: {{ .Values.prometheusRule.zeroTokenFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent has {{ .Values.prometheusRule.zeroTokenStreakThreshold }}+ consecutive zero-token runs"
            description: "Agent {{`{{ $labels.agent_id }}`}} on adapter {{`{{ $labels.adapter }}`}} has completed {{ .Values.prometheusRule.zeroTokenStreakThreshold }} or more consecutive terminal runs with zero token usage. This catches poisoned-session/pre-model throttle loops like BLO-10866 within minutes."
        - alert: PaperclipAgentJobBackoffLimitExceeded
          expr: (sum by (namespace) (rate(kube_job_status_failed{job_name=~{{ .Values.prometheusRule.agentJobNameRegex | quote }},reason="BackoffLimitExceeded"}[{{ .Values.prometheusRule.backoffLimitExceededWindow }}])) or (sum by (namespace) (rate(kube_job_status_failed{job_name=~{{ .Values.prometheusRule.agentJobNameRegex | quote }}}[{{ .Values.prometheusRule.backoffLimitExceededWindow }}])) unless on (namespace) sum by (namespace) (kube_job_status_failed{job_name=~{{ .Values.prometheusRule.agentJobNameRegex | quote }},reason=~".+"}))) > 0
          for: {{ .Values.prometheusRule.backoffLimitExceededFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent Kubernetes Jobs are hitting BackoffLimitExceeded"
            description: "One or more ac-* Paperclip agent Jobs in namespace {{`{{ $labels.namespace }}`}} are failing with BackoffLimitExceeded, or this cluster's kube-state-metrics omits Job failure reason labels and an ac-* Job failed. Check the matching Job/Pod logs and the zero-token streak alert for poisoned-session loops."
        - alert: PaperclipAgentPodUnschedulable
          # BLO-16224: keys on kube_pod_status_scheduled{condition="false"} (PodScheduled=False
          # -- the scheduler has not placed the pod) rather than kube_pod_status_unschedulable,
          # which many kube-state-metrics builds/allowlists do NOT expose (confirmed absent on
          # the Blockcast cluster's KSM, 2026-07-15). scheduled{condition="false"} is a core,
          # always-emitted KSM series; with the `for` window it captures sustained node-pool
          # starvation while ignoring pods still mid-scheduling. Post-scheduling waits
          # (image pull, PVC bind) keep PodScheduled=True, so they do not false-fire this.
          expr: count(kube_pod_status_scheduled{condition="false",pod=~{{ .Values.prometheusRule.agentJobNameRegex | quote }}} == 1) > {{ .Values.prometheusRule.unschedulablePodThreshold }}
          for: {{ .Values.prometheusRule.unschedulableFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent pods stuck Unschedulable (node-pool scheduling starvation)"
            description: "More than {{ .Values.prometheusRule.unschedulablePodThreshold }} ac-* agent pod(s) have had PodScheduled=false (unschedulable) for {{ .Values.prometheusRule.unschedulableFor }} (BLO-16224). Agent-Job pods request 1 CPU each and affinity-pin to the shared arc-runner-host pool, which bin-packs on requests, so sustained unschedulable means the pool is requests-saturated (not usage-saturated). Remediate by adding pool capacity or right-sizing the agent-Job CPU request (observed usage runs well under the 1-core request). Transient blips self-resolve; this fires only on sustained starvation. Requires kube-state-metrics (kube_pod_status_scheduled)."
    - name: paperclip-process-lost
      rules:
        - alert: PaperclipProcessLostElevated
          expr: sum(increase(paperclip_process_lost_total[1d])) > {{ .Values.prometheusRule.processLostWarnPerDay }}
          for: {{ .Values.prometheusRule.processLostElevatedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip process_lost reaps elevated (>{{ .Values.prometheusRule.processLostWarnPerDay }}/day)"
            description: "More than {{ .Values.prometheusRule.processLostWarnPerDay }} heartbeat runs were reaped as process_lost over the last 24h (BLO-12292 fleet instability). Break the numerator down by (adapter, error_bucket, classification) on paperclip_process_lost_total. Before trusting a low/zero reading, cross-check the two denominators: paperclip_external_lifecycle_running_runs (run volume) and the PaperclipProcessLostSignalBlind alert (kube-null blindness)."
        - alert: PaperclipProcessLostSustained
          expr: sum(increase(paperclip_process_lost_total[1d])) > {{ .Values.prometheusRule.processLostPagePerDay }}
          for: {{ .Values.prometheusRule.processLostPageFor }}
          labels:
            severity: critical
          annotations:
            summary: "Paperclip process_lost reaps sustained-high (>{{ .Values.prometheusRule.processLostPagePerDay }}/day for {{ .Values.prometheusRule.processLostPageFor }})"
            description: "process_lost reaps exceeded {{ .Values.prometheusRule.processLostPagePerDay }}/day sustained for {{ .Values.prometheusRule.processLostPageFor }} (BLO-12292). If PaperclipProcessLostSignalBlind is also firing, the spike may be kube-API-outage-driven staleness reaping rather than genuine loss — check kube API / paperclip-0 health and recent deploys/restarts."
        - alert: PaperclipProcessLostSignalBlind
          expr: sum(increase(paperclip_process_lost_liveness_null_total[15m])) > {{ .Values.prometheusRule.processLostLivenessNullWindowCount }}
          for: {{ .Values.prometheusRule.processLostSignalBlindFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip reaper is blind to kube Job liveness"
            description: "The reaper hit more than {{ .Values.prometheusRule.processLostLivenessNullWindowCount }} null kube Job-status lists in 15m, so it is falling back to the staleness heuristic while blind (BLO-16184 denominator guard). Any concurrent LOW process_lost count is UNRELIABLE — a 0 means 'could not see', not 'healthy'; a spike may be kube-outage-driven. Check the K8s API and the paperclip ServiceAccount RBAC."
    - name: paperclip-github-delivery
      rules:
        - alert: PaperclipGithubReviewRequestDeadLettered
          # BLO-18859: keys on the dead_lettered state of the delivery funnel
          # counter, which is zero-initialized at process start — so an absent
          # series means a broken scrape, not a healthy fleet, and a 0 here is a
          # real 0. increase() over the window catches a single dead-letter
          # (threshold > 0) because one lost @ally review request is already a
          # user-visible failure: the PR sits with a posted trigger and no
          # review, which is the BLO-18847 symptom. Deliberately NOT rate()-per-
          # second — that rounds a lone event toward zero on a wide window.
          #
          # BLO-18859 review follow-up: the counter arm alone has two blind
          # spots, both of which hide a REAL terminal loss:
          #   1. First scrape. increase() needs two samples in the window. A
          #      dead letter recorded before the process is first scraped has no
          #      pre-increment baseline, so its step is never measured.
          #   2. Pod replacement. sum() aggregates the instance label away, but
          #      the underlying per-pod series still retires when the pod goes.
          #      Once the old series falls out of the lookback it contributes
          #      nothing, and the replacement starts at 0 — so a dead letter can
          #      vanish from the range before this rule's `for` has elapsed.
          # The gauge arm closes both: it is recomputed from committed
          # agent_wakeup_requests rows on every wake-dispatch reconcile pass, so
          # it is republished by whatever process is alive and does not depend on
          # a delta between two samples. It is an OR rather than a replacement
          # because the gauge cannot see the one dead-letter path that leaves no
          # row at all (the durable safety-net insert itself failing) — that path
          # is counter-only, and it is the more alarming of the two.
          expr: >-
            (sum(increase(paperclip_github_review_request_delivery_total{state="dead_lettered"}[{{ .Values.prometheusRule.githubDeliveryDeadLetterWindow }}])) > 0)
            or (sum(paperclip_github_review_request_dead_letter_unresolved) > 0)
          for: {{ .Values.prometheusRule.githubDeliveryDeadLetterFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip GitHub review-request delivery dead-lettered (an @ally review will never run)"
            description: "At least one GitHub review-request reviewer wake was dead-lettered in the last {{ .Values.prometheusRule.githubDeliveryDeadLetterWindow }}, or is still sitting unresolved in the durable dispatch_failed_exhausted state (BLO-18859). Dead-lettered is TERMINAL — the reconciler never re-arms it, so the affected PR has a posted review trigger and will never get a review until someone re-triggers it. Two paths reach this state: a durable agent_wakeup_requests row exhausted DISPATCH_RETRY_MAX_ATTEMPTS (query `select id, agent_id, reason, error from agent_wakeup_requests where status = 'dispatch_failed_exhausted' order by updated_at desc`), or wakeupWithDispatchRetry could not persist its safety-net row at all — the latter leaves NO row and is visible only in the logs ('dropping without a durable record' / 'failed to persist durable wake-dispatch-failed record') and on the counter arm of this rule, never on the gauge arm. Break down by the `reason` label to see which event type is failing. Read alongside the received/queued/retried states of the same counter: a rising `retried` with no dead-letters is dispatch flakiness absorbed by the retry chain, not loss."
        - alert: PaperclipGithubReviewRequestSuppressionOutage
          # BLO-18859 review follow-up: dead_lettered is not the only terminal
          # state. `suppressed` is also terminal (no reconciler pass re-arms a
          # skipped or superseded row) but it is NOT uniformly a fault, so it
          # cannot be alerted on as a whole: an inactive company, a cooldown, a
          # blocked budget and wake-on-demand-off are the fleet correctly
          # declining, and paging on those would force the rule off entirely --
          # leaving a stuck global scheduling-suppression flag free to eat every
          # @ally review while the dead-letter alert above stays green.
          #
          # So this keys on the cause breakdown counter and selects only the
          # outage-like causes. `other` is in the default set on purpose: it is
          # the bucket for a skip reason not yet in the server's allow-list, and
          # an untriaged cause has not been shown to be an expected decline.
          # Widen/narrow via githubDeliverySuppressionOutageCauses rather than
          # editing this expr, and remember Prometheus fully anchors =~ (so the
          # unescaped dots here can only over-match within a listed name).
          expr: sum(increase(paperclip_github_review_request_suppression_total{cause=~{{ .Values.prometheusRule.githubDeliverySuppressionOutageCauses | quote }}}[{{ .Values.prometheusRule.githubDeliverySuppressionWindow }}])) > 0
          for: {{ .Values.prometheusRule.githubDeliverySuppressionFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip GitHub review-request wakes suppressed by an outage-like cause (reviews are being dropped)"
            description: "At least one GitHub review-request reviewer wake was terminally suppressed in the last {{ .Values.prometheusRule.githubDeliverySuppressionWindow }} with an outage-like cause ({{ .Values.prometheusRule.githubDeliverySuppressionOutageCauses }}) (BLO-18859). Suppressed means the wake was declined rather than dispatched: no run exists and nothing will re-arm it, so the PR has a posted trigger and no review — the same user-visible outcome as a dead-letter. Check the `cause` label first. `heartbeat.scheduling_suppressed` means the fleet-wide scheduling-suppression flag is on: if that is not a deliberate maintenance window, clear it (this is the mode that silently strands every review). `dispatch_rejected` means the dispatch path threw a business-rule HttpError with no durable skipped row — an unresolvable agent or responsible user; waiting will not fix it. `other` means the server emitted a skip reason missing from KNOWN_GITHUB_SUPPRESSION_CAUSES in services/metrics.ts: find it with `select reason, count(*) from agent_wakeup_requests where status = 'skipped' and created_at > now() - interval '1 hour' group by 1 order by 2 desc`, then either add it to the allow-list as an expected decline or fix the cause. Expected declines (company.inactive, heartbeat.cooldown.active, heartbeat.disabled, heartbeat.wakeOnDemand.disabled, budget.blocked, agent.not_invokable, heartbeat.worktree_execution_cutoff, issue_tree_hold_active) are excluded from this selector by default and are visible on the same counter for context."
    - name: paperclip-wake-terminal-failed
      rules:
        - alert: PaperclipPrReviewWakeTerminalFailed
          # BLO-20255. A DIFFERENT terminal state from the dead-letter alert
          # above, and the two do not overlap: `dispatch_failed_exhausted`
          # means the dispatch chain burned its retry budget, whereas `failed`
          # means the wake dispatched fine and the RUN died — a
          # force-terminated Job, a failed Job, an adapter that threw.
          # `reconcileFailedWakeDispatches` only ever selects `dispatch_failed`,
          # so nothing re-drives a `failed` row and, before this rule, nothing
          # surfaced one either.
          #
          # Gauge-only (no counter arm). Unlike the dead-letter case there is no
          # process-local counter to OR against — every path that reaches this
          # state leaves a durable row, so the re-derived gauge is complete on
          # its own. It is recomputed from committed rows on every
          # wake-dispatch reconcile pass, so it survives a restart and a pod
          # replacement mid-`for`.
          #
          # Scoped to pr_review because that is the user-visible loss: the PR
          # sits with a posted review trigger and no review, and no human is
          # watching the wake table. Non-pr_review terminal failures are still
          # published on the same gauge (scope="other") for the dashboard, but
          # they are usually re-driven by the issue's own lifecycle and paging
          # on them would train the operator to ignore this.
          #
          # Why this cannot page a retried row (BLO-18030 / PR #900): the gauge
          # drops any row that has a successor wake for the same taskKey — a
          # retry run carrying the same context_task_key, or a fresh webhook
          # wake carrying the same payload taskKey. Both successor rows are
          # written inside the SCHEDULING transaction, not when the retry
          # fires: it inserts an agent_wakeup_requests row at status="queued"
          # and a heartbeat_runs row at status="scheduled_retry" carrying the
          # retry context snapshot. So a row that is going to be retried leaves
          # this series the moment the retry is scheduled, and the guarantee
          # holds for EVERY step of
          # BOUNDED_TRANSIENT_HEARTBEAT_RETRY_DELAYS_MS ([2m, 10m, 30m, 2h]) —
          # including the two that are longer than this `for`. Do not re-derive
          # the threshold from those delays; they are unrelated.
          #
          # A successor that itself ended terminal `failed` is deliberately NOT
          # counted as coverage — that is a second failure, not a re-drive, and
          # a repeatedly-failing review chain is the most page-worthy shape
          # here. More generally the successor check is a POSITIVE status
          # allowlist (active or succeeded), not "anything but failed": a
          # successor written `skipped` by a policy gate, or a queued retry that
          # later went `cancelled` / `dispatch_failed_exhausted` /
          # `dispatch_superseded`, never ran a review and must not silence this.
          #
          # Why this thresholds an AGE gauge instead of counting rows under a
          # long `for:`. Prometheus `for:` measures how long the EXPRESSION has
          # been continuously true, not how long any one row has been failed,
          # and the natural count expression sums rows together. With
          # `sum(..._unresolved{scope="pr_review"}) > 0` and `for: 30m`, two
          # different short failures overlapping by one scrape keep the sum
          # non-zero across the whole window: A holds it up for 29 minutes, B
          # arrives as A clears, the expression never goes false, and B pages
          # about a minute old while the annotation claims 30. Splitting by
          # `error_code` does not help — the expression sums that label away.
          # `paperclip_agent_wakeup_terminal_failed_oldest_age_seconds` carries
          # the server-computed `now - finishedAt` of the oldest row that
          # survived the successor exclusion, so the ageing is real data and
          # `for:` is left doing only what it is good at: riding out a flapping
          # scrape. The gauge is reset to 0 for a scope with no unresolved rows,
          # which is what lets the alert resolve.
          expr: max(paperclip_agent_wakeup_terminal_failed_oldest_age_seconds{scope="pr_review"}) > {{ .Values.prometheusRule.wakeTerminalFailedAgeSeconds }}
          for: {{ .Values.prometheusRule.wakeTerminalFailedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip PR-review wake is terminally failed and will never be retried"
            description: "A pr_review-scoped agent_wakeup_requests row has been sitting at status='failed' for more than {{ .Values.prometheusRule.wakeTerminalFailedAgeSeconds }}s with no successor wake for the same taskKey (BLO-20255). The age is the server-computed age of the oldest such row, published as paperclip_agent_wakeup_terminal_failed_oldest_age_seconds; the companion count series paperclip_agent_wakeup_terminal_failed_unresolved{scope=\"pr_review\"} breaks the population down by error_code. This state is TERMINAL: reconcileFailedWakeDispatches only selects dispatch_failed, so nothing re-drives it, and the BLO-18030 bounded retry deliberately declines three cases so it can never double-post a review (the GitHub probe found an existing review, the probe threw or there was no PR context, or the run was not a pr_review context). The PR has a posted review trigger and no review. Break down by the `error_code` label on the count series to decide: it is joined from heartbeat_runs.error_code via agent_wakeup_requests.run_id, because the wake table has no error_code column of its own. `external_lifecycle_stale_killed` means the reviewer Job went silent past the 45m hard-stale window and was force-terminated. `job_failed` means the Job itself exited non-zero. `none` means there was no run row or no code recorded. `other` means a code missing from KNOWN_TERMINAL_FAILED_WAKE_ERROR_CODES in services/metrics.ts — triage it into that list. Query the rows with `select w.id, w.agent_id, w.reason, w.error, w.payload ->> 'taskKey' as task_key, r.error_code from agent_wakeup_requests w left join heartbeat_runs r on r.id = w.run_id where w.status = 'failed' and w.finished_at > now() - interval '24 hours' order by w.finished_at desc`. See the runbook for the re-review-vs-accept decision."
            runbook_url: {{ .Values.prometheusRule.wakeTerminalFailedRunbookUrl | quote }}
    - name: paperclip-queued-run-stranded
      rules:
        - alert: PaperclipQueuedRunStranded
          # A queued heartbeat run is already accepted for dispatch. The age
          # gauge is rebuilt from durable queue-entry timestamps on every
          # scrape, so `for` only smooths scrape flapping rather than standing
          # in for the row's age.
          expr: max(paperclip_queued_run_oldest_age_seconds) by (agent_id) > {{ .Values.prometheusRule.queuedRunStrandedAgeSeconds }}
          for: {{ .Values.prometheusRule.queuedRunStrandedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent {{`{{ $labels.agent_id }}`}} has an undispatched queued run"
            description: "Agent {{`{{ $labels.agent_id }}`}}'s oldest queued heartbeat run has waited {{`{{ $value }}`}}s (BLO-21116). Determine whether the agent is saturated or has a free dispatch slot. Query `select id, agent_id, status, coalesce(queued_at, created_at) as queued_since, now() - coalesce(queued_at, created_at) as age, context_snapshot ->> 'issueId' as issue_id from heartbeat_runs where status = 'queued' and agent_id = '{{`{{ $labels.agent_id }}`}}' order by coalesce(queued_at, created_at) asc limit 10` to inspect the same queue-entry time as the gauge. See the runbook before requeueing work."
            runbook_url: {{ .Values.prometheusRule.queuedRunStrandedRunbookUrl | quote }}
    {{- with .Values.prometheusRule.additionalGroups }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
