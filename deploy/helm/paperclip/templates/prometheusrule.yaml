{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "paperclip.fullname" . }}-runtime-alerts
  {{- with .Values.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: paperclip-runtime
      rules:
        - alert: PaperclipAgentZeroTokenRunStreak
          expr: max by (agent_id, adapter) (paperclip_agent_zero_token_completed_run_streak) >= {{ .Values.prometheusRule.zeroTokenStreakThreshold }}
          for: {{ .Values.prometheusRule.zeroTokenFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent has {{ .Values.prometheusRule.zeroTokenStreakThreshold }}+ consecutive zero-token runs"
            description: "Agent {{`{{ $labels.agent_id }}`}} on adapter {{`{{ $labels.adapter }}`}} has completed {{ .Values.prometheusRule.zeroTokenStreakThreshold }} or more consecutive terminal runs with zero token usage. This catches poisoned-session/pre-model throttle loops like BLO-10866 within minutes."
        # BLO-23413: PaperclipAgentJobBackoffLimitExceeded REMOVED. Verified
        # against LIVE series on the Blockcast cluster, not the expression
        # alone: kube_job_status_failed DOES carry reason="BackoffLimitExceeded"
        # at failure time (disproving this alert's own original diagnosis),
        # but every per-Job series carries exactly ONE post-failure scrape
        # sample before kube-state-metrics stops reporting the Job, and
        # rate()/increase() need >=2 samples to compute anything -- so this
        # alert has never been able to fire and cannot be repaired by tuning
        # the expression. A permanently-inert rule is worse than none.
        # Superseded by PaperclipAgentHeartbeatStale below, an OUTCOME-side
        # alert that does not depend on any K8s Job/pod signal surviving.
        # See BLO-23413 and Blockcast/onprem-k8s#2380 for the full writeup
        # (this chart copy renders nowhere live, see the file header).
        - alert: PaperclipAgentHeartbeatStale
          # BLO-23413 review fix -- two separate defects, both proven against a
          # live Prometheus rather than by reading the expression:
          #
          # 1. PARSE. This was written `age > N * on (agent_id) interval`, which
          #    binds the `on (agent_id)` modifier to the `*`, whose LEFT operand
          #    is the scalar N. PromQL allows vector matching only between two
          #    instant vectors, so the rule failed to parse and evaluated to a
          #    query error -- i.e. it could never fire, the same
          #    silently-inert-rule failure this alert exists to replace.
          #    Control: `up > 3 * on (instance) up` -> HTTP 400 on a metric that
          #    definitely exists, so the 400 is the shape, not a missing series.
          #
          # 2. DUPLICATE MATCH. Simply moving the parens is NOT sufficient here.
          #    These gauges are published from the reconcileFailedWakeDispatches
          #    pass, and every control-plane pod that runs it exports its own
          #    copy: paperclip_agent_wakeup_terminal_failed_unresolved (same
          #    pass, same registry) is live on 3 pods x 16 agents = 48 series.
          #    With 3 series per agent_id on both sides, `on (agent_id)` is a
          #    many-to-many match and errors at RUNTIME:
          #      wakeup_terminal_failed_unresolved
          #        > on (agent_id) (3 * wakeup_terminal_failed_unresolved)
          #    -> HTTP 422 "found duplicate series for the match group".
          #    `max by (agent_id)` collapses each side to one series per agent
          #    BEFORE the join, giving a 1:1 match, exactly one alert per dark
          #    agent, and an alert identity that survives a pod restart (no
          #    instance/pod label churn). Verified on that same 3-pod metric:
          #    the aggregated form returns 200, and with the multiplier dropped
          #    to 0.5 it returns a real series -- so it is genuinely matching,
          #    not vacuously empty.
          expr: max by (agent_id) (paperclip_agent_heartbeat_age_seconds) > on (agent_id) ({{ .Values.prometheusRule.agentHeartbeatStaleMultiplier }} * max by (agent_id) (paperclip_agent_heartbeat_interval_seconds))
          for: {{ .Values.prometheusRule.agentHeartbeatStaleFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent {{`{{ $labels.agent_id }}`}} has not heartbeated in {{ .Values.prometheusRule.agentHeartbeatStaleMultiplier }}x its configured interval"
            description: "Agent {{`{{ $labels.agent_id }}`}}'s lastHeartbeatAt is {{`{{ $value | printf \"%.0f\" }}`}}s old, more than {{ .Values.prometheusRule.agentHeartbeatStaleMultiplier }}x its own configured heartbeat.intervalSec (BLO-23413). This is an OUTCOME-side signal: it does not read any K8s Job/pod evidence, so it still fires after the Job that last ran the agent has been reaped. status='error' does NOT block dispatch, so a stuck agent needs a live-execution-path fix, not a status clear."
        - alert: PaperclipAgentPodUnschedulable
          # BLO-16224: keys on kube_pod_status_scheduled{condition="false"} (PodScheduled=False
          # -- the scheduler has not placed the pod) rather than kube_pod_status_unschedulable,
          # which many kube-state-metrics builds/allowlists do NOT expose (confirmed absent on
          # the Blockcast cluster's KSM, 2026-07-15). scheduled{condition="false"} is a core,
          # always-emitted KSM series; with the `for` window it captures sustained node-pool
          # starvation while ignoring pods still mid-scheduling. Post-scheduling waits
          # (image pull, PVC bind) keep PodScheduled=True, so they do not false-fire this.
          expr: count(kube_pod_status_scheduled{condition="false",pod=~{{ .Values.prometheusRule.agentJobNameRegex | quote }}} == 1) > {{ .Values.prometheusRule.unschedulablePodThreshold }}
          for: {{ .Values.prometheusRule.unschedulableFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent pods stuck Unschedulable (node-pool scheduling starvation)"
            description: "More than {{ .Values.prometheusRule.unschedulablePodThreshold }} ac-* agent pod(s) have had PodScheduled=false (unschedulable) for {{ .Values.prometheusRule.unschedulableFor }} (BLO-16224). Agent-Job pods request 1 CPU each and affinity-pin to the shared arc-runner-host pool, which bin-packs on requests, so sustained unschedulable means the pool is requests-saturated (not usage-saturated). Remediate by adding pool capacity or right-sizing the agent-Job CPU request (observed usage runs well under the 1-core request). Transient blips self-resolve; this fires only on sustained starvation. Requires kube-state-metrics (kube_pod_status_scheduled)."
    - name: paperclip-process-lost
      rules:
        - alert: PaperclipProcessLostElevated
          expr: sum(increase(paperclip_process_lost_total[1d])) > {{ .Values.prometheusRule.processLostWarnPerDay }}
          for: {{ .Values.prometheusRule.processLostElevatedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip process_lost reaps elevated (>{{ .Values.prometheusRule.processLostWarnPerDay }}/day)"
            description: "More than {{ .Values.prometheusRule.processLostWarnPerDay }} heartbeat runs were reaped as process_lost over the last 24h (BLO-12292 fleet instability). Break the numerator down by (adapter, error_bucket, classification) on paperclip_process_lost_total. Before trusting a low/zero reading, cross-check the two denominators: paperclip_external_lifecycle_running_runs (run volume) and the PaperclipProcessLostSignalBlind alert (kube-null blindness)."
        - alert: PaperclipProcessLostSustained
          expr: sum(increase(paperclip_process_lost_total[1d])) > {{ .Values.prometheusRule.processLostPagePerDay }}
          for: {{ .Values.prometheusRule.processLostPageFor }}
          labels:
            severity: critical
          annotations:
            summary: "Paperclip process_lost reaps sustained-high (>{{ .Values.prometheusRule.processLostPagePerDay }}/day for {{ .Values.prometheusRule.processLostPageFor }})"
            description: "process_lost reaps exceeded {{ .Values.prometheusRule.processLostPagePerDay }}/day sustained for {{ .Values.prometheusRule.processLostPageFor }} (BLO-12292). If PaperclipProcessLostSignalBlind is also firing, the spike may be kube-API-outage-driven staleness reaping rather than genuine loss — check kube API / paperclip-0 health and recent deploys/restarts."
        - alert: PaperclipProcessLostSignalBlind
          expr: sum(increase(paperclip_process_lost_liveness_null_total[15m])) > {{ .Values.prometheusRule.processLostLivenessNullWindowCount }}
          for: {{ .Values.prometheusRule.processLostSignalBlindFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip reaper is blind to kube Job liveness"
            description: "The reaper hit more than {{ .Values.prometheusRule.processLostLivenessNullWindowCount }} null kube Job-status lists in 15m, so it is falling back to the staleness heuristic while blind (BLO-16184 denominator guard). Any concurrent LOW process_lost count is UNRELIABLE — a 0 means 'could not see', not 'healthy'; a spike may be kube-outage-driven. Check the K8s API and the paperclip ServiceAccount RBAC."
    - name: paperclip-github-delivery
      rules:
        - alert: PaperclipGithubReviewRequestDeadLettered
          # BLO-18859: keys on the dead_lettered state of the delivery funnel
          # counter, which is zero-initialized at process start — so an absent
          # series means a broken scrape, not a healthy fleet, and a 0 here is a
          # real 0. increase() over the window catches a single dead-letter
          # (threshold > 0) because one lost @ally review request is already a
          # user-visible failure: the PR sits with a posted trigger and no
          # review, which is the BLO-18847 symptom. Deliberately NOT rate()-per-
          # second — that rounds a lone event toward zero on a wide window.
          #
          # BLO-18859 review follow-up: the counter arm alone has two blind
          # spots, both of which hide a REAL terminal loss:
          #   1. First scrape. increase() needs two samples in the window. A
          #      dead letter recorded before the process is first scraped has no
          #      pre-increment baseline, so its step is never measured.
          #   2. Pod replacement. sum() aggregates the instance label away, but
          #      the underlying per-pod series still retires when the pod goes.
          #      Once the old series falls out of the lookback it contributes
          #      nothing, and the replacement starts at 0 — so a dead letter can
          #      vanish from the range before this rule's `for` has elapsed.
          # The gauge arm closes both: it is recomputed from committed
          # agent_wakeup_requests rows on every wake-dispatch reconcile pass, so
          # it is republished by whatever process is alive and does not depend on
          # a delta between two samples. It is an OR rather than a replacement
          # because the gauge cannot see the one dead-letter path that leaves no
          # row at all (the durable safety-net insert itself failing) — that path
          # is counter-only, and it is the more alarming of the two.
          expr: >-
            (sum(increase(paperclip_github_review_request_delivery_total{state="dead_lettered"}[{{ .Values.prometheusRule.githubDeliveryDeadLetterWindow }}])) > 0)
            or (sum(paperclip_github_review_request_dead_letter_unresolved) > 0)
          for: {{ .Values.prometheusRule.githubDeliveryDeadLetterFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip GitHub review-request delivery dead-lettered (an @ally review will never run)"
            dashboard: "{{ .Values.prometheusRule.githubDeliveryDashboardUrl }}"
            description: "At least one GitHub review-request reviewer wake was dead-lettered in the last {{ .Values.prometheusRule.githubDeliveryDeadLetterWindow }}, or is still sitting unresolved in the durable dispatch_failed_exhausted state (BLO-18859). Start at the delivery-funnel dashboard: {{ .Values.prometheusRule.githubDeliveryDashboardUrl }} (BLO-20171) — the `Unresolved dead-letters` stat tells you which arm of this rule fired. Dead-lettered is TERMINAL — the reconciler never re-arms it, so the affected PR has a posted review trigger and will never get a review until someone re-triggers it. Two paths reach this state: a durable agent_wakeup_requests row exhausted DISPATCH_RETRY_MAX_ATTEMPTS (query `select id, agent_id, reason, error from agent_wakeup_requests where status = 'dispatch_failed_exhausted' order by updated_at desc`), or wakeupWithDispatchRetry could not persist its safety-net row at all — the latter leaves NO row and is visible only in the logs ('dropping without a durable record' / 'failed to persist durable wake-dispatch-failed record') and on the counter arm of this rule, never on the gauge arm. Break down by the `reason` label to see which event type is failing. Read alongside the received/queued/retried states of the same counter: a rising `retried` with no dead-letters is dispatch flakiness absorbed by the retry chain, not loss."
        - alert: PaperclipGithubReviewRequestSuppressionOutage
          # BLO-18859 review follow-up: dead_lettered is not the only terminal
          # state. `suppressed` is also terminal (no reconciler pass re-arms a
          # skipped or superseded row) but it is NOT uniformly a fault, so it
          # cannot be alerted on as a whole: an inactive company, a cooldown, a
          # blocked budget and wake-on-demand-off are the fleet correctly
          # declining, and paging on those would force the rule off entirely --
          # leaving a stuck global scheduling-suppression flag free to eat every
          # @ally review while the dead-letter alert above stays green.
          #
          # So this keys on the cause breakdown counter and selects only the
          # outage-like causes. `other` is in the default set on purpose: it is
          # the bucket for a skip reason not yet in the server's allow-list, and
          # an untriaged cause has not been shown to be an expected decline.
          # Widen/narrow via githubDeliverySuppressionOutageCauses rather than
          # editing this expr, and remember Prometheus fully anchors =~ (so the
          # unescaped dots here can only over-match within a listed name).
          expr: sum(increase(paperclip_github_review_request_suppression_total{cause=~{{ .Values.prometheusRule.githubDeliverySuppressionOutageCauses | quote }}}[{{ .Values.prometheusRule.githubDeliverySuppressionWindow }}])) > 0
          for: {{ .Values.prometheusRule.githubDeliverySuppressionFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip GitHub review-request wakes suppressed by an outage-like cause (reviews are being dropped)"
            description: "At least one GitHub review-request reviewer wake was terminally suppressed in the last {{ .Values.prometheusRule.githubDeliverySuppressionWindow }} with an outage-like cause ({{ .Values.prometheusRule.githubDeliverySuppressionOutageCauses }}) (BLO-18859). Suppressed means the wake was declined rather than dispatched: no run exists and nothing will re-arm it, so the PR has a posted trigger and no review — the same user-visible outcome as a dead-letter. Check the `cause` label first. `heartbeat.scheduling_suppressed` means the fleet-wide scheduling-suppression flag is on: if that is not a deliberate maintenance window, clear it (this is the mode that silently strands every review). `dispatch_rejected` means the dispatch path threw a business-rule HttpError with no durable skipped row — an unresolvable agent or responsible user; waiting will not fix it. `other` means the server emitted a skip reason missing from KNOWN_GITHUB_SUPPRESSION_CAUSES in services/metrics.ts: find it with `select reason, count(*) from agent_wakeup_requests where status = 'skipped' and created_at > now() - interval '1 hour' group by 1 order by 2 desc`, then either add it to the allow-list as an expected decline or fix the cause. Expected declines (company.inactive, heartbeat.cooldown.active, heartbeat.disabled, heartbeat.wakeOnDemand.disabled, budget.blocked, agent.not_invokable, heartbeat.worktree_execution_cutoff, issue_tree_hold_active) are excluded from this selector by default and are visible on the same counter for context."
        # BLO-21078: mirrors the authoritative copy in
        # Blockcast/onprem-k8s monitoring/prometheus-configmap.yaml (key
        # paperclip-runtime-alerts.rules.yml) and its CRD copy
        # paperclip/paperclip-runtime-alerts-prometheusrule.yaml — see those
        # files for the full incident writeup and threshold-tuning caveat.
        # This chart copy renders nowhere live (prometheusRule.enabled is
        # false on Blockcast, see the file header); kept only for coherence.
        # The `supersession="none"` selector is load-bearing, not a
        # refinement: pr.yml sets concurrency.cancel-in-progress, so an
        # ordinary force-push yields conclusion="cancelled" too. Measured
        # over 196 pr.yml runs (2026-08-02T11:27Z..2026-08-03T18:09Z), 82 of
        # 121 cancellations were that benign case. Without the selector this
        # rule fires continuously through ~19h of demonstrably healthy CI,
        # and raising the threshold does not help because benign
        # cancellations scale with agent push rate — the noise floor rises
        # with the signal.
        - alert: PaperclipGithubWorkflowRunMassCancellation
          expr: |
            sum(increase(paperclip_github_workflow_run_conclusion_total{conclusion="cancelled",supersession="none"}[15m])) >= 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "GitHub Actions is mass-cancelling workflow runs (3+ non-superseded cancellations in 15m)"
            description: "At least 3 workflow_run webhook deliveries concluded `cancelled` without being superseded by a newer run on the same branch in the last 15m (BLO-21078) — i.e. not explained by concurrency cancel-in-progress. See the onprem-k8s authoritative copy of this rule for the full runbook."
            runbook_url: "/BLO/issues/BLO-21078"
    - name: paperclip-wake-terminal-failed
      rules:
        - alert: PaperclipPrReviewWakeTerminalFailed
          # BLO-20255. A DIFFERENT terminal state from the dead-letter alert
          # above, and the two do not overlap: `dispatch_failed_exhausted`
          # means the dispatch chain burned its retry budget, whereas `failed`
          # means the wake dispatched fine and the RUN died — a
          # force-terminated Job, a failed Job, an adapter that threw.
          # `reconcileFailedWakeDispatches` only ever selects `dispatch_failed`,
          # so nothing re-drives a `failed` row and, before this rule, nothing
          # surfaced one either.
          #
          # Gauge-only (no counter arm). Unlike the dead-letter case there is no
          # process-local counter to OR against — every path that reaches this
          # state leaves a durable row, so the re-derived gauge is complete on
          # its own. It is recomputed from committed rows on every
          # wake-dispatch reconcile pass, so it survives a restart and a pod
          # replacement mid-`for`.
          #
          # Scoped to pr_review because that is the user-visible loss: the PR
          # sits with a posted review trigger and no review, and no human is
          # watching the wake table. Non-pr_review terminal failures are still
          # published on the same gauge (scope="other") for the dashboard, but
          # they are usually re-driven by the issue's own lifecycle and paging
          # on them would train the operator to ignore this.
          #
          # Why this cannot page a retried row (BLO-18030 / PR #900): the gauge
          # drops any row that has a successor wake for the same taskKey — a
          # retry run carrying the same context_task_key, or a fresh webhook
          # wake carrying the same payload taskKey. Both successor rows are
          # written inside the SCHEDULING transaction, not when the retry
          # fires: it inserts an agent_wakeup_requests row at status="queued"
          # and a heartbeat_runs row at status="scheduled_retry" carrying the
          # retry context snapshot. So a row that is going to be retried leaves
          # this series the moment the retry is scheduled, and the guarantee
          # holds for EVERY step of
          # BOUNDED_TRANSIENT_HEARTBEAT_RETRY_DELAYS_MS ([2m, 10m, 30m, 2h]) —
          # including the two that are longer than this `for`. Do not re-derive
          # the threshold from those delays; they are unrelated.
          #
          # A successor that itself ended terminal `failed` is deliberately NOT
          # counted as coverage — that is a second failure, not a re-drive, and
          # a repeatedly-failing review chain is the most page-worthy shape
          # here. More generally the successor check is a POSITIVE status
          # allowlist (active or succeeded), not "anything but failed": a
          # successor written `skipped` by a policy gate, or a queued retry that
          # later went `cancelled` / `dispatch_failed_exhausted` /
          # `dispatch_superseded`, never ran a review and must not silence this.
          #
          # Why this thresholds an AGE gauge instead of counting rows under a
          # long `for:`. Prometheus `for:` measures how long the EXPRESSION has
          # been continuously true, not how long any one row has been failed,
          # and the natural count expression sums rows together. With
          # `sum(..._unresolved{scope="pr_review"}) > 0` and `for: 30m`, two
          # different short failures overlapping by one scrape keep the sum
          # non-zero across the whole window: A holds it up for 29 minutes, B
          # arrives as A clears, the expression never goes false, and B pages
          # about a minute old while the annotation claims 30. Splitting by
          # `error_code` does not help — the expression sums that label away.
          # `paperclip_agent_wakeup_terminal_failed_oldest_age_seconds` carries
          # the server-computed `now - finishedAt` of the oldest row that
          # survived the successor exclusion, so the ageing is real data and
          # `for:` is left doing only what it is good at: riding out a flapping
          # scrape. The gauge is reset to 0 for a scope with no unresolved rows,
          # which is what lets the alert resolve.
          expr: max(paperclip_agent_wakeup_terminal_failed_oldest_age_seconds{scope="pr_review"}) > {{ .Values.prometheusRule.wakeTerminalFailedAgeSeconds }}
          for: {{ .Values.prometheusRule.wakeTerminalFailedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip PR-review wake is terminally failed and will never be retried"
            description: "A pr_review-scoped agent_wakeup_requests row has been sitting at status='failed' for more than {{ .Values.prometheusRule.wakeTerminalFailedAgeSeconds }}s with no successor wake for the same taskKey (BLO-20255). The age is the server-computed age of the oldest such row, published as paperclip_agent_wakeup_terminal_failed_oldest_age_seconds; the companion count series paperclip_agent_wakeup_terminal_failed_unresolved{scope=\"pr_review\"} breaks the population down by error_code. This state is TERMINAL: reconcileFailedWakeDispatches only selects dispatch_failed, so nothing re-drives it, and the BLO-18030 bounded retry deliberately declines three cases so it can never double-post a review (the GitHub probe found an existing review, the probe threw or there was no PR context, or the run was not a pr_review context). The PR has a posted review trigger and no review. Break down by the `error_code` label on the count series to decide: it is joined from heartbeat_runs.error_code via agent_wakeup_requests.run_id, because the wake table has no error_code column of its own. `external_lifecycle_stale_killed` means the reviewer Job went silent past the 45m hard-stale window and was force-terminated. `job_failed` means the Job itself exited non-zero. `none` means there was no run row or no code recorded. `other` means a code missing from KNOWN_TERMINAL_FAILED_WAKE_ERROR_CODES in services/metrics.ts — triage it into that list. Query the rows with `select w.id, w.agent_id, w.reason, w.error, w.payload ->> 'taskKey' as task_key, r.error_code from agent_wakeup_requests w left join heartbeat_runs r on r.id = w.run_id where w.status = 'failed' and w.finished_at > now() - interval '24 hours' order by w.finished_at desc`. See the runbook for the re-review-vs-accept decision."
            runbook_url: {{ .Values.prometheusRule.wakeTerminalFailedRunbookUrl | quote }}
    - name: paperclip-queued-run-stranded
      rules:
        - alert: PaperclipQueuedRunStranded
          # BLO-21116. A `heartbeat_runs` row sitting at status='queued' for a
          # long time means an issue looks `in_progress`/assigned with an
          # active run, but nothing is executing and nothing else pages on it
          # -- the exact "invisible strand" this issue reports. It is a
          # distinct failure shape from PaperclipPrReviewWakeTerminalFailed
          # above: that alert covers a wake that reached a terminal `failed`
          # state with nothing left to retry it; this one covers a run that IS
          # still schedulable (queued, not failed) but has not been dispatched
          # -- concurrency starvation, a scheduler-tick gap, or a scheduled
          # retry that promoted to `queued` and then stalled behind other work.
          #
          # Gauge, not a summed count under `for:`, for the same reason as the
          # wake-terminal-failed rule: `for:` measures how long the EXPRESSION
          # has been true, and a summed count lets one short strand clearing
          # exactly as a fresh one appears keep the expression true
          # indefinitely while each individual row is young. This gauge
          # carries the server-computed age of the oldest queued row PER
          # AGENT (refreshed on every /metrics scrape from a live
          # MIN(coalesce(queued_at, created_at)) aggregate), so `for:` here is only riding out
          # scrape flapping, not standing in for the real age.
          # The freshness gate is load-bearing: a failed database refresh
          # leaves the previous gauge value in memory, so stale data must not
          # qualify a strand alert. Gate each API replica against its own
          # refresh result before taking the fleet-wide per-agent max; an
          # `on()` join would let one healthy replica bless another replica's
          # stale age snapshot.
          expr: max by (agent_id) (paperclip_queued_run_oldest_age_seconds and on(instance) (paperclip_queued_run_age_metrics_refresh_success == 1)) > {{ .Values.prometheusRule.queuedRunStrandedAgeSeconds }}
          for: {{ .Values.prometheusRule.queuedRunStrandedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent {{`{{ $labels.agent_id }}`}} has a queued run stranded for longer than {{ .Values.prometheusRule.queuedRunStrandedAgeSeconds }}s"
            description: "Agent {{`{{ $labels.agent_id }}`}}'s oldest `queued` heartbeat run has been waiting for {{`{{ $value }}`}}s since queue entry (BLO-21116). The age is only trusted while paperclip_queued_run_age_metrics_refresh_success is 1. The issue it targets looks `in_progress`/assigned with an active run, but nothing is executing. Query coalesce(queued_at, created_at), not created_at alone: retries promoted from scheduled_retry intentionally reset their dispatch-wait clock. See the runbook for saturation-versus-dispatch triage."
            runbook_url: {{ .Values.prometheusRule.queuedRunStrandedRunbookUrl | quote }}
        - alert: PaperclipQueuedRunAgeMetricsRefreshFailed
          # This is deliberately separate from the strand alert. A failed
          # refresh means the age gauge is not fresh, not that the queue is
          # empty; page on it so the freshness gate cannot hide a real strand.
          expr: paperclip_queued_run_age_metrics_refresh_success == 0
          for: {{ .Values.prometheusRule.queuedRunAgeMetricsRefreshFailureFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip queued-run age metric refresh is failing"
            description: "The most recent /metrics queued-run-age database refresh failed (BLO-21116), so queued-run ages may be stale and PaperclipQueuedRunStranded is intentionally gated off. Check Paperclip logs and database connectivity; do not interpret a stale zero as an empty queue."
            runbook_url: {{ .Values.prometheusRule.queuedRunStrandedRunbookUrl | quote }}
    - name: paperclip-overdue-scheduled-retry
      rules:
        - alert: PaperclipOverdueScheduledRetry
          # BLO-22094. PaperclipQueuedRunStranded above deliberately excludes
          # `status='scheduled_retry'` rows -- refreshQueuedRunAgeMetrics only
          # aggregates status='queued' (Ally review, onprem-k8s#2013: without
          # that exclusion, a retry promoted after hours of backoff would
          # instantly report that whole backoff as queued-dispatch wait). The
          # consequence is that a retry which is parked and never promoted was
          # invisible to any gauge, forever -- a dead/wedged promotion sweep
          # had nothing to page on. This alert covers exactly that gap: the
          # server-computed age, past DUE TIME, of the oldest agent row still
          # sitting at status='scheduled_retry' with scheduled_retry_at < now
          # (paperclip_overdue_scheduled_retry_oldest_age_seconds, reset to 0
          # per agent on every /metrics scrape). A run still backing off
          # toward a future due time contributes nothing -- this only fires on
          # overshoot past when the promotion sweep should have already acted.
          #
          # Threshold derived from the observed park-to-promotion lag
          # distribution over the 7 days preceding this alert's authorship
          # (2026-07-31..2026-08-07, n=5253 promotions, queried from
          # heartbeat_run_events "Scheduled retry became due and was promoted
          # to the queued run pool"): p50=21.5s, p90=83.7s, p95=131.9s,
          # p99=1594.8s, max=3567.5s. Zero of the 5253 samples exceeded 3600s.
          # NOT fitted to the BLO-16366 5-sample table in this issue (those
          # samples measured due-to-EXECUTION-START lag, which also includes
          # the separate `queued` dispatch wait PaperclipQueuedRunStranded
          # already covers -- a different quantity from this alert's
          # due-to-PROMOTION lag). Set to 5400s (90m), ~50% margin over the
          # worst observed day's max (3567s) rather than the aggregate p99, so
          # a bad ccrotate_capacity-contention day (that reason's own p99 was
          # 2528s) cannot false-page; `for:` below only rides out scrape
          # flapping on top of that.
          #
          # Gated on the companion freshness gauge, exactly as
          # PaperclipQueuedRunStranded is above, and load-bearing for a
          # sharper reason here: refreshOverdueScheduledRetryAgeMetrics only
          # reset-then-sets on its success path, so a failed refresh freezes
          # the previous per-agent values while /metrics still returns 200.
          # The frozen value is almost always 0 -- the HEALTHY reading -- so
          # an ungated alert would sit silently green on top of a dead
          # detector, which is the invisible-failure mode this whole alert
          # exists to eliminate. The gate must live inside the `max by
          # (agent_id)` because `on(instance)` needs the instance label the
          # aggregation strips. PaperclipOverdueScheduledRetryAgeMetricsRefreshFailed
          # below is what pages when the gate closes.
          expr: max by (agent_id) (paperclip_overdue_scheduled_retry_oldest_age_seconds and on(instance) (paperclip_overdue_scheduled_retry_age_metrics_refresh_success == 1)) > {{ .Values.prometheusRule.overdueScheduledRetryAgeSeconds }}
          for: {{ .Values.prometheusRule.overdueScheduledRetryFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip agent {{`{{ $labels.agent_id }}`}} has a scheduled_retry row overdue past its due time for longer than {{ .Values.prometheusRule.overdueScheduledRetryAgeSeconds }}s"
            description: "Agent {{`{{ $labels.agent_id }}`}}'s oldest overdue `scheduled_retry` heartbeat run has been sitting past its due time for {{`{{ $value }}`}}s (BLO-22094). The age is only trusted while paperclip_overdue_scheduled_retry_age_metrics_refresh_success is 1. This row is still parked, not dispatched -- it has never even reached the `queued` state PaperclipQueuedRunStranded covers, so the promotion sweep (promoteScheduledRetryRun) either never ran for it or is systematically wedged. Query `select id, agent_id, scheduled_retry_reason, scheduled_retry_attempt, scheduled_retry_at, now() - scheduled_retry_at as overdue_by, context_snapshot ->> 'issueId' as issue_id from heartbeat_runs where status = 'scheduled_retry' and scheduled_retry_at < now() and agent_id = '{{`{{ $labels.agent_id }}`}}' order by scheduled_retry_at asc limit 10` to find the specific rows. See the runbook to distinguish a wedged promotion sweep from a gate legitimately re-deferring the row (e.g. issue_dependencies_blocked re-defer, which re-arms scheduled_retry_at further out rather than promoting -- that is designed backoff, not a strand)."
            runbook_url: {{ .Values.prometheusRule.overdueScheduledRetryRunbookUrl | quote }}
        - alert: PaperclipOverdueScheduledRetryAgeMetricsRefreshFailed
          # Separate from the overdue alert above for the same reason
          # PaperclipQueuedRunAgeMetricsRefreshFailed is separate from the
          # strand alert: a failed refresh means the age gauge is not fresh,
          # NOT that no row is overdue. Without this, closing the freshness
          # gate would silently disable the detector.
          #
          # Also separate from the sibling's refresh-failed alert rather than
          # sharing one signal: the two refreshes run different aggregates
          # behind different indexes (0217 for status='queued', 0224 for the
          # overdue-parked predicate), so a statement timeout or plan
          # regression can hit this one alone -- leaving
          # paperclip_queued_run_age_metrics_refresh_success at 1 while this
          # gauge is frozen.
          expr: paperclip_overdue_scheduled_retry_age_metrics_refresh_success == 0
          for: {{ .Values.prometheusRule.overdueScheduledRetryAgeMetricsRefreshFailureFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip overdue-scheduled_retry age metric refresh is failing"
            description: "The most recent /metrics overdue-scheduled_retry-age database refresh failed (BLO-22094), so overdue-parked ages may be stale and PaperclipOverdueScheduledRetry is intentionally gated off. Note this can fail independently of the sibling queued-run-age refresh -- a healthy paperclip_queued_run_age_metrics_refresh_success does not vouch for this one. Check Paperclip logs and database connectivity; do not interpret a stale zero as an empty park queue."
            runbook_url: {{ .Values.prometheusRule.overdueScheduledRetryRunbookUrl | quote }}
    - name: paperclip-plugin-lifecycle
      rules:
        - alert: PaperclipPluginCriticalErrored
          # BLO-21092/BLO-20410: paperclip_plugin_error is a boolean-valued
          # gauge already labeled by plugin_id/plugin_key, re-derived from the
          # plugins table on every worker-tier collector tick (~30s). Unlike
          # the wake-terminal-failed alert above, `for:` is safe to use
          # directly here -- Prometheus tracks alert continuity per resulting
          # series, and this series is already keyed per plugin, so it cannot
          # collapse two different plugins' downtime into one continuously-true
          # expression the way summing an unlabeled count would.
          #
          # Split into two alerts on the SAME expr shape rather than one alert
          # with a templated severity label, so severity is visible directly
          # in the rule file rather than hidden behind Go-template
          # conditionals evaluated per-series at fire time. Critical: plugins
          # matching pluginErrorCriticalKeyRegex (lucitra.plugin-secrets, the
          # exact plugin BLO-20410 found dead for 9+ hours, and
          # paperclip-plugin-alertmanager, whose failure suppresses the very
          # notification reporting it -- see PEN-2590 and the two-naming-
          # convention hazard documented at the value). Everything else pages
          # warning below.
          expr: paperclip_plugin_error{plugin_key=~{{ .Values.prometheusRule.pluginErrorCriticalKeyRegex | quote }}} == 1
          for: {{ .Values.prometheusRule.pluginErrorFor }}
          labels:
            severity: critical
          annotations:
            summary: "Paperclip critical plugin {{`{{ $labels.plugin_key }}`}} has been in status='error' for {{ .Values.prometheusRule.pluginErrorFor }}+"
            description: "Plugin {{`{{ $labels.plugin_key }}`}} (id {{`{{ $labels.plugin_id }}`}}) has sat at status='error' for at least {{ .Values.prometheusRule.pluginErrorFor }} (BLO-21092) and matches the critical plugin allow-list (pluginErrorCriticalKeyRegex), so it pages out-of-band rather than filing through Paperclip. The keys on that list are there for different reasons: losing lucitra.plugin-secrets is not merely a missing feature -- BLO-20410 found it dead in this exact state for 9+ hours with the pod 1/1 Running and nothing alerting -- while paperclip-plugin-alertmanager is the transport for every non-critical alert, so at warning its own failure would suppress the notification reporting it (PEN-2590/PEN-2581). status='error' is distinct from status='disabled': an operator-disabled plugin never sets this gauge and never pages. Check `select id, plugin_key, status, last_error, updated_at from plugins where plugin_key = '{{`{{ $labels.plugin_key }}`}}'` for the failure reason, then see the runbook."
            runbook_url: {{ .Values.prometheusRule.pluginErrorRunbookUrl | quote }}
        - alert: PaperclipPluginErrored
          expr: paperclip_plugin_error{plugin_key!~{{ .Values.prometheusRule.pluginErrorCriticalKeyRegex | quote }}} == 1
          for: {{ .Values.prometheusRule.pluginErrorFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip plugin {{`{{ $labels.plugin_key }}`}} has been in status='error' for {{ .Values.prometheusRule.pluginErrorFor }}+"
            description: "Plugin {{`{{ $labels.plugin_key }}`}} (id {{`{{ $labels.plugin_id }}`}}) has sat at status='error' for at least {{ .Values.prometheusRule.pluginErrorFor }} (BLO-21092/BLO-20410 -- the detection gap that let 4 of 11 plugins, including the secrets subsystem, sit dead for 9+ hours with nothing alerting). status='error' is distinct from status='disabled': an operator-disabled plugin never sets this gauge and never pages. Check `select id, plugin_key, status, last_error, updated_at from plugins where plugin_key = '{{`{{ $labels.plugin_key }}`}}'` for the failure reason, then see the runbook."
            runbook_url: {{ .Values.prometheusRule.pluginErrorRunbookUrl | quote }}
        - alert: PaperclipPluginStatusCollectorStale
          # Review follow-up on BLO-21092: the two alerts above are silent by
          # construction if the collector itself is dead -- a listInstalled()
          # rejection on the FIRST tick means paperclip_plugin_error never gets
          # a single series, and a rejection on any LATER tick just keeps
          # re-serving the last-known snapshot forever, hiding both a new
          # error and a recovery. This alert watches the collector's own
          # heartbeat instead of the plugin data it produces. The gauge is
          # labeled by a constant role="worker" and only ever .set() by
          # startPluginStatusCollector itself, right before its first tick --
          # NOT zero-initialized by ensureRegistry, which runs on every tier.
          # A bare (zero-label) gauge would auto-publish at 0 the instant
          # ensureRegistry constructs it, with no .set() call required, so the
          # label is load-bearing: production scrapes both the `paperclip`
          # (API) and `paperclip-workers` Services, and the API tier never
          # starts this collector (app.ts gates plugin lifecycle to
          # paperclipNodeRole !== "api"), so without the label this series
          # would render frozen at 0 forever on the API target and
          # permanently satisfy this expr there. With the label, the series
          # is simply absent on an API-tier scrape -- `time() - <absent>`
          # never evaluates -- until the worker tier's first successful tick.
          expr: (time() - paperclip_plugin_status_collector_last_success_timestamp_seconds{role="worker"}) > {{ .Values.prometheusRule.pluginStatusCollectorStaleSeconds }}
          for: {{ .Values.prometheusRule.pluginStatusCollectorStaleFor }}
          labels:
            severity: warning
          annotations:
            summary: "Paperclip plugin-status collector has not ticked successfully in over {{ .Values.prometheusRule.pluginStatusCollectorStaleSeconds }}s"
            description: "paperclip_plugin_status_collector_last_success_timestamp_seconds has not advanced in over {{ .Values.prometheusRule.pluginStatusCollectorStaleSeconds }}s (BLO-21092 review follow-up). While this collector is stuck, PaperclipPluginCriticalErrored/PaperclipPluginErrored are silently unreliable: a plugin that just crashed will not be reflected, and a plugin that just recovered will keep paging. Check worker-tier logs for 'plugin-status-metrics: collector tick failed' to find the listInstalled() failure (most likely a DB connectivity issue on the worker pod), then see the runbook."
            runbook_url: {{ .Values.prometheusRule.pluginErrorRunbookUrl | quote }}
        - alert: PaperclipPluginStatusCollectorAbsent
          # BLO-21092 Ally review. PaperclipPluginStatusCollectorStale above is
          # structurally unable to catch the MOST severe variant of the gap it
          # was added to close, so it needs this companion rather than a
          # threshold tweak.
          #
          # That alert is `(time() - <gauge>) > 300` with `for: 5m`. It works
          # for a collector that is stuck while its pod is still alive and
          # scraped: the series persists at a frozen value, the difference
          # grows past 300s, and it fires ~10m later. It CANNOT work when the
          # worker pod is down, crashlooping, or never scraped. There the last
          # sample was written at ~= time() when scraping stopped, so the
          # difference is ~= 0 at that instant and only crosses 300s at
          # t ~= 300s -- which is exactly when Prometheus's 5m lookback delta
          # drops the series from instant queries. The condition is true for
          # ~0 seconds, so a 5m `for:` window can never be satisfied. Same
          # outcome, even more directly, if the collector never started at
          # all (PAPERCLIP_NODE_ROLE misconfigured on the worker StatefulSet,
          # or the -workers Service falling out of scrape scope): the series
          # never exists, and `time() - <absent>` returns an empty vector
          # rather than a large number.
          #
          # absent_over_time() is the correct primitive because it is TRUE on
          # an empty range -- unlike the subtraction above, it does not need
          # the series to still be queryable in order to report on it. The
          # window is deliberately wider than the lookback delta so a single
          # missed scrape or a rolling worker restart cannot trip it; only a
          # genuinely gone series does.
          #
          # Severity is critical rather than warning: a stuck collector still
          # leaves the last-known plugin snapshot visible, but an absent one
          # means paperclip_plugin_error does not exist at all, which is
          # indistinguishable at the dashboard from "all plugins healthy" --
          # the precise invisible-failure mode BLO-20410 was.
          expr: absent_over_time(paperclip_plugin_status_collector_last_success_timestamp_seconds{role="worker"}[{{ .Values.prometheusRule.pluginStatusCollectorAbsentFor }}])
          labels:
            severity: critical
          annotations:
            summary: "Paperclip plugin-status collector has reported no successful tick for {{ .Values.prometheusRule.pluginStatusCollectorAbsentFor }} (series absent)"
            description: "paperclip_plugin_status_collector_last_success_timestamp_seconds{role=\"worker\"} has been entirely absent for {{ .Values.prometheusRule.pluginStatusCollectorAbsentFor }} (BLO-21092 Ally review). This is the worker-down / collector-never-started case that PaperclipPluginStatusCollectorStale cannot detect: with no series, `time() - <gauge>` yields an empty vector instead of a growing number, so the staleness rule stays silent forever. While this fires, paperclip_plugin_error is absent too -- which on a dashboard looks identical to every plugin being healthy, exactly the invisible failure BLO-20410 was. Check that a worker-tier pod is Running with PAPERCLIP_NODE_ROLE != 'api', that it is a live Prometheus scrape target (the `paperclip-workers` Service must stay within the ServiceMonitor selector), and grep worker logs for 'plugin-status-metrics'."
            runbook_url: {{ .Values.prometheusRule.pluginErrorRunbookUrl | quote }}
    {{- with .Values.prometheusRule.additionalGroups }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
