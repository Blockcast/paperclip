{{- if .Values.rbac.create }}
# Namespace-scoped Role for the paperclip pod's k8s-Job adapters
# (paperclip-adapter-claude-k8s + paperclip-adapter-opencode-k8s).
#
# Verb set is the runtime-observed superset of:
#   - claude-k8s v0.2.1: dist/server/test.js (SSAR self-test) + execute.js
#     runtime calls (jobs:patch at execute.js:779, secrets:patch at :884).
#   - opencode-k8s v0.1.38: dist/server/test.js + execute.js runtime calls
#     (pods:get at :311 / :552 for log preflight, secrets:patch at :1052).
#
# The upstream adapters' SSAR test arrays are incomplete — they probe a
# subset of what runtime actually exercises, so install-time looks green
# while individual job runs would 403 mid-execution. Verbs added here
# beyond the SSAR list are flagged inline.
#
# Cluster-scoped SSAR check is granted via the companion ClusterRoleBinding
# (clusterrole.yaml + clusterrolebinding.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "paperclip.fullname" . }}-k8s-adapters
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
rules:
  # K8s Jobs — adapter creates one Job per agent run, then deletes it.
  # `patch` (NOT in SSAR self-test) is used at claude-k8s execute.js:779
  # to update Job state mid-run.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # Pods — adapter lists Pods owned by its Jobs to find the active one,
  # and reads individual Pod state for log-streaming preflight
  # (opencode-k8s execute.js:311 + :552). `get` is NOT in opencode-k8s's
  # SSAR self-test.
  #
  # `delete` (BLO-16850, added by the paperclip server — not the adapters):
  # the server-side cleanupOrphanedManagedPods reaper (reapOrphanedRuns in
  # server/src/services/heartbeat.ts) force-deletes an orphaned Running pod
  # left behind after its run finalized. The owning Job's Background-propagation
  # cascade does NOT force-kill a wedged container, so the lingering pod must be
  # deleted directly (gracePeriodSeconds 0). Verified in prod: the reaper 403'd
  # on `delete pods` until this grant, so the sweep detected orphans but could
  # not reap them.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # Pod logs — adapter streams stdout/stderr back to the paperclip UI.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Pod metrics (BLO-20251) — the hard-stale reaper in
  # server/src/services/heartbeat.ts reads pod CPU to tell a run blocked on a
  # long silent subprocess (pnpm install, test suite, docker build) apart from a
  # genuinely wedged pod. Without this, both look identical (the agent CLI emits
  # nothing between tool_use and tool_result) and live work gets force-killed.
  #
  # Served by metrics-server, which is an OPTIONAL cluster add-on. Every read
  # degrades to "unknown" and the reaper falls back to its pre-BLO-20251
  # output-silence behaviour, so this grant failing (or metrics-server being
  # absent) is safe — it costs sensitivity, not correctness.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Secrets — both adapters create a transient Secret per Job for prompts
  # above LARGE_PROMPT_THRESHOLD_BYTES (256 KiB; below that, the prompt
  # rides as an env var on the init container). Both also patch the Secret
  # mid-run (claude-k8s execute.js:884, opencode-k8s execute.js:1052) —
  # `patch` is NOT in either adapter's SSAR self-test.
  #
  # `update` WAS granted here (BLO-31665 / PEN-3041) and is RETIRED as of
  # BLO-34510. Recording why it existed, because the measurement is the reason
  # it can be dropped safely rather than merely tidily.
  #
  # The RBAC authorizer maps a PUT (`replaceNamespacedSecret`) to `update`, not
  # to the `patch` granted above, so a Secret-adoption path that re-derives the
  # whole object needs it. It was added for createOrAdoptRunSecret in the
  # claude-k8s adapter, which 403ed on every collision: the #1678 fix for the
  # intermittent (~1 in 40 runs) Secret collision was present but inert,
  # converting an AlreadyExists failure into a Forbidden one. Measured in prod
  # 2026-09-13 — 7 runs across 4 agents in one 7h window, all on
  # `cannot update resource "secrets"`.
  #
  # BLO-32424 (#1873, merged 2026-10-06) converted that call site to a merge
  # PATCH, and `patch` was already granted — so the verb lost its only
  # in-release-namespace consumer. Enumerated at master 73231dec, every
  # candidate that runs under this service account in this namespace:
  #
  #   claude-k8s createOrAdoptRunSecret — patchNamespacedSecret, a merge PATCH.
  #     No PUT. (Cited by symbol: a line number here drifts every time that
  #     file is edited.)
  #   claude-k8s SSAR self-test, checkRbac — probes secrets create/delete/get.
  #     Never probes update, so it cannot fail on the verb's absence.
  #   opencode-k8s at the pinned ref (ARG OPENCODE_K8S_REF, Dockerfile) — zero
  #     `replaceNamespaced*` and zero PUT in non-test src/; its own checkRbac
  #     probes secrets create/delete/get. HOLDS ONLY AT THAT PIN, which is why
  #     scripts/check-opencode-k8s-pin-reachable.mjs now also fails a pin whose
  #     source reintroduces a Secret PUT. Retirement without that guard would
  #     be a latent break on the next pin advance.
  #   in-tree sweep of server/, packages/, scripts/ for a Secret PUT — exactly
  #     one hit, the tenant-namespace one below.
  #
  # That remaining in-tree `replaceNamespacedSecret` does NOT justify a grant
  # here, because it never runs in this namespace: it is inside
  # createPerRunSecret (packages/plugins/sandbox-providers/kubernetes/src/
  # secret-manager.ts), whose sole call site is in the plugin's acquireLease,
  # which binds `namespace` to deriveTenantNamespace() unconditionally — no
  # release-namespace branch, and no rebinding between that bind and the call.
  # So the PUT targets the tenant namespace `{namespacePrefix}{companySlug}`
  # (default prefix `paperclip-`, from the namespacePrefix field of the
  # provider config schema in that plugin's types.ts). This Role is
  # namespace-scoped to the release namespace and authorizes nothing there.
  # Measured, not inferred: SSAR for this service account reads allowed on
  # every secrets verb in ns `paperclip` and denied on all of them in every
  # `paperclip-*` namespace (BLO-34298). Those four citations are by symbol
  # rather than by line on purpose — nothing about editing that plugin prompts
  # anyone to open a Helm template, so a line number here rots silently and
  # lands on whoever next re-checks this decision.
  #
  # `replace` in that plugin is deliberate, not an oversight to paper over with
  # `patch`: it re-derives the full Secret body, so a shrinking key set is
  # actually removed. A merge patch leaves stale keys from the prior attempt —
  # which matters for that plugin because it consumes the Secret whole. (That is
  # in-tree Blockcast code under packages/, not vendored upstream, so it is a
  # design choice open to revisiting, not an external constraint.) It does NOT
  # cost the optimistic-concurrency guard: a merge patch carries
  # `resourceVersion` in the body just as a PUT does — the adapter's does, see
  # the patchNamespacedSecret body in createOrAdoptRunSecret.
  #
  # If a future adopt path needs a PUT again, re-add `update` with the call site
  # named — do not reach for delete-then-create, which is reachable with the
  # verbs below but races any pod already mounting the Secret.
  #
  # `list` (BLO-21857) — required by the orphan-Secret sweep in
  # vendor/paperclip-adapter-claude-k8s/src/server/secret-sweep.ts, whose first
  # call is listNamespacedSecret with a label selector. This IS a real
  # widening — but a narrower one than an earlier revision of this
  # comment claimed. It said the SA could now read every Secret's values
  # "rather than only those it can name for a `get`", implying `get` was
  # name-restricted. It is not: this file carries ZERO `resourceNames` clauses,
  # so the SA could already read any Secret in this namespace whose name it
  # could produce. What `list` adds is ENUMERATION of names it could not have
  # guessed, plus bulk retrieval of `data` in one call instead of N. Still a
  # genuine widening; just a smaller delta, and the precision matters because
  # an auditor lands on this comment first and can check `get` in one grep.
  # The sweep reads nothing but `metadata` — the verb does not know that, and
  # the grant is what gets audited, not the caller. Approved as written in
  # BLO-36688: `list` on secrets, namespaced Role only. NOT `watch`, NOT
  # `deletecollection`, and NOT the ClusterRole — each of those is a fresh ask.
  #
  # Without it the sweep 403s on its first call, createSweepGate swallows that
  # as non-fatal, and the feature is inert in a way no dashboard can show: a
  # sweep that 403s and a sweep that finds zero orphans look identical. Same
  # class as the pods:delete case recorded above, which 403'd in prod until the
  # grant landed.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # PVCs — adapter looks up the shared PVC claim name (paperclip-data) to mount
  # at /paperclip in agent Job pods. opencode-k8s additionally creates/deletes
  # per-agent PVCs by default — `agentDbMode` defaults to `dedicated_pvc`
  # (execute.js:766); set `adapter_config.agentDbMode: ephemeral` to opt out
  # of per-agent PVC creation.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get"]
{{- end }}
