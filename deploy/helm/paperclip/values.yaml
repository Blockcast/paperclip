# Default values for paperclip.
# Every value is annotated for helm-docs. If you add or rename a value, run
# `pre-commit run helm-docs` (or the chart-lint CI will fail).

# -- Container image settings.
image:
  # -- Image repository. Upstream publishes to `ghcr.io/paperclipai/paperclip` on every master push and stable tag.
  repository: ghcr.io/paperclipai/paperclip
  # -- Image tag. Override to a specific stable release (e.g. `v2026.416.0`) or pin to a `sha-<commit>` tag.
  tag: "latest"
  # -- Image manifest digest. When set, this takes precedence over `tag` and pins the deployed artifact immutably.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets. Only needed if the GHCR package is private.
# Example: `[{name: ghcr-pull}]`.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full name used as the prefix for every resource.
fullnameOverride: ""

# -- Persistent volume settings for `/paperclip`.
persistence:
  # -- Whether to create a PVC for `/paperclip`. Required for any real use — disabling loses all state on pod restart.
  enabled: true
  # -- StorageClass for the PVC. `local-path` on the Talos cluster; set to empty string to use the cluster default.
  storageClassName: local-path
  # -- Access mode for the PVC. ReadWriteOnce is correct for the single-replica StatefulSet.
  accessMode: ReadWriteOnce
  # -- PVC size. Sized for live state + ~30 days of hourly pg_dumps.
  size: 20Gi
  # -- Mount path inside the container. Paperclip's `PAPERCLIP_HOME` defaults to `/paperclip`; keep these aligned.
  mountPath: /paperclip
  # -- Use a pre-created PVC by name instead of `volumeClaimTemplates`. Required for ReadWriteMany migrations
  # where the StatefulSet's immutable volumeClaimTemplates lock-in must be avoided. When set, `storageClassName`,
  # `accessMode`, and `size` are ignored — the PVC must already exist in the release namespace.
  existingClaim: ""

# -- Pod-local cache storage for regenerable build/package/browser downloads.
# Keep durable identity/config state on `persistence.mountPath`; this emptyDir is
# safe to discard on pod restart.
# Rollback: set `enabled: false`, run a Helm upgrade, and restart affected
# Paperclip pods/jobs so they fall back to image/default cache paths.
runtimeCache:
  # -- Mount an emptyDir cache volume and point common cache env vars at it.
  enabled: true
  # -- Mount path for the cache emptyDir.
  mountPath: /runtime-cache
  # -- Optional emptyDir size limit. Set to empty string for no explicit limit.
  sizeLimit: 20Gi

# -- Pod-local XDG config storage for browser profile/config directories such as
# `google-chrome*`. Durable Paperclip identity/config remains on
# `persistence.mountPath`; this volume is intentionally ephemeral now that
# browser session source-of-truth is owned by authbot.
# Rollback: set `enabled: false`, run a Helm upgrade, and restart affected
# Paperclip pods/jobs so XDG_CONFIG_HOME falls back to the process default.
runtimeConfig:
  # -- Mount an emptyDir config volume and point XDG_CONFIG_HOME at it.
  enabled: true
  # -- Mount path for the config emptyDir.
  mountPath: /runtime-config
  # -- Optional emptyDir size limit. Set to empty string for no explicit limit.
  sizeLimit: 10Gi

# -- HA API tier — splits the single-pod StatefulSet into a multi-replica
# HTTP API Deployment plus a singleton worker StatefulSet. When enabled,
# the workers tier owns the heartbeat scheduler + plugin workers + Linear
# tunnel + database backup; the API tier serves HTTP traffic only with
# `PAPERCLIP_NODE_ROLE=api` (so plugin operations 503 cleanly on it).
# See server/src/services/plugin-worker-manager-stub.ts.
api:
  # -- Enable the API/worker split. When `false` (default) the chart behaves
  # like the single-replica StatefulSet that ships with upstream paperclip —
  # no migration impact for existing deploys.
  enabled: false
  # -- Number of API tier replicas. 2+ is the point of the split. Each replica
  # runs `PAPERCLIP_NODE_ROLE=api`, no plugin workers, no scheduler.
  replicas: 2
  # -- Rolling update budget for the API Deployment. `maxSurge: 1` +
  # `maxUnavailable: 0` gives zero-downtime rolls for HTTP traffic.
  maxSurge: 1
  maxUnavailable: 0
  # -- Spread API replicas across nodes: a hard `topologySpreadConstraints`
  # (maxSkew 1, minDomains 2, whenUnsatisfiable DoNotSchedule) plus a soft
  # podAntiAffinity preference. The hard constraint requires at least 2 Ready
  # nodes matching `nodeSelector`; with only one, a second replica sits
  # `Pending` rather than co-locating with the first (BLO-20901 — a `false`
  # setting here, or a `nodeSelector`/`nodeAffinity` narrowed to fewer than 2
  # eligible nodes, reintroduces the single-node-outage blast radius this
  # exists to prevent).
  spreadAcrossNodes: true
  # -- Approval plan marker (BLO-20733), stamped onto the API pod template as
  # `paperclip.blockcast.net/approval-plan-sha256`. 64 lowercase hex, or empty
  # to render no annotation (the default -- local and non-Blockcast deploys do
  # not go through the admission approval channel).
  #
  # Set ONLY by the release job, and never by hand: the value is the SHA-256 of
  # the canonical rendered Deployment with this annotation removed, so it can
  # only be obtained by rendering the chart unstamped first. A hand-set value
  # makes `approve-paperclip-api-digest.sh` refuse the plan.
  approvalPlanSha256: ""
  # -- Exact Git commit SHA deployed by the release job (BLO-22032), stamped
  # onto the API pod template as `paperclip.blockcast.net/deployed-commit`.
  # 40 lowercase hex, or empty to render no annotation.
  deployedCommit: ""

# -- Singleton worker tier (the `paperclip` StatefulSet). This tier runs
# `PAPERCLIP_NODE_ROLE=worker`: it drives heartbeat dispatch and hosts the
# plugin workers. It is NOT optional the way `api` is — the StatefulSet always
# renders; this block only carries release-job metadata for it.
worker:
  # -- Exact Git commit SHA deployed by the release job (BLO-29008), stamped
  # onto the WORKER pod template as `paperclip.blockcast.net/deployed-commit`.
  # 40 lowercase hex, or empty to render no annotation.
  #
  # Mirrors `api.deployedCommit` and is set from the same `${COMMIT}` in the
  # same `helm upgrade`, so the two cannot diverge by construction. The deploy
  # job additionally asserts the LIVE objects agree, which is the check that
  # actually holds: before BLO-29008 the worker carried no stamp at all, so a
  # deploy that rolled the api and left the worker on older code reported
  # `success` and every tier-level signal read green (BLO-28920).
  deployedCommit: ""

# -- Kubernetes Service exposing the HTTP UI/API.
service:
  # -- Service type. Keep `ClusterIP`; cloudflared or Ingress handle external exposure.
  type: ClusterIP
  # -- Service port. Must match `env.port`.
  port: 3100

# -- Optional Ingress. Leave disabled if fronting via cloudflared only.
ingress:
  # -- Enable an Ingress resource.
  enabled: false
  # -- Ingress class name. `nginx` matches the cluster's ingress-nginx install.
  className: nginx
  # -- Annotations on the Ingress (e.g. cert-manager, rate limits).
  annotations: {}
  # -- Hosts and paths served by the Ingress.
  # @default -- single host at `paperclip.example.com` serving `/`.
  hosts:
    - host: paperclip.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration. Leave empty to serve HTTP only.
  # Example: `[{hosts: [paperclip.example.com], secretName: paperclip-tls}]`.
  tls: []

# -- Paperclip runtime environment.
env:
  # -- Bind address.
  host: "0.0.0.0"
  # -- HTTP port inside the container (must match `service.port`).
  port: 3100
  # -- Serve the bundled web UI alongside the API.
  serveUi: true
  # -- Paperclip instance identifier. Directory under `/paperclip/instances/` is named after this.
  instanceId: default
  # -- PATH for the runtime containers. Leave empty to derive the chart default:
  # the seeded GitHub egress wrappers (`persistence.mountPath` + `/.local/bin`
  # and `/bin`) ahead of the system bin directories. Those wrappers are what
  # scrubs credential-shaped material out of agent-authored GitHub content
  # (PEN-2527); if they do not precede `/usr/bin`, agent `gh` resolves to the
  # unscrubbed image CLI and the scrubber is off the traffic path entirely.
  # An override must keep both wrapper directories ahead of `/usr/bin` — the
  # chart fails the render rather than shipping an agent that publishes
  # unscrubbed. Set this rather than a `PATH` entry in `env.extra`, which the
  # chart rejects because a duplicate env var would silently win over it.
  path: ""
  # -- Extra environment variables merged verbatim into the container spec.
  # Example: `[{name: NODE_OPTIONS, value: --max-old-space-size=3072}]`.
  extra: []
  # Deployment requirement, not a default this chart can safely set:
  # the bundled `claude_k8s` adapter resolves its Job pod ServiceAccount from
  # the per-agent `serviceAccountName` config field, then from
  # PAPERCLIP_DEFAULT_SERVICE_ACCOUNT_NAME, and then *refuses to build the Job
  # manifest* rather than falling through to the namespace `default`
  # ServiceAccount, which has no cluster-scoped read (BLO-21499/BLO-21812).
  # So if you run `claude_k8s` agents that have no per-agent value, add to
  # `env.extra` above:
  #   - name: PAPERCLIP_DEFAULT_SERVICE_ACCOUNT_NAME
  #     value: <a ServiceAccount that exists in the release namespace>
  # Left unset here deliberately: the correct account name is cluster-specific
  # and a wrong-but-present default would fail at pod admission instead of at
  # Job build, which is the harder failure to read. See
  # values.blockcast.yaml for the Blockcast overlay that sets it.

# -- Additional pod-level volumes. Used to mount Secrets/ConfigMaps that
# plugins or runtime helpers read from disk (for example Authbot service keys).
# Example:
#   extraVolumes:
#     - name: plugin-service-key
#       secret:
#         secretName: plugin-service-keys
#         defaultMode: 0444
extraVolumes: []

# -- Additional volumeMounts for the main `paperclip` container. Pair with
# `extraVolumes`; each entry must reference a name declared there.
# Example:
#   extraVolumeMounts:
#     - name: plugin-service-key
#       mountPath: /var/run/plugin-service-keys
#       readOnly: true
extraVolumeMounts: []

# -- Secret containing `agentJwtSecret` and optional `masterKey` seed.
secret:
  # -- Name of a pre-existing Secret to read credentials from. Leave empty to let the chart render a Secret with an auto-generated `agentJwtSecret` on first install. **Set this under GitOps** — the templated Secret uses `randAlphaNum`, which re-rolls on every render, keeping the app perpetually OutOfSync and thrashing pods under `selfHeal`. Create the Secret with `kubectl create secret generic <name> --from-literal=agentJwtSecret=$(openssl rand -hex 32)` and point `existingSecret` at it.
  existingSecret: ""
  # -- JWT secret for the Paperclip agent. Only used when `existingSecret` is empty — avoid under GitOps (non-deterministic render).
  agentJwtSecret: ""
  # -- Base64-encoded master key to seed `/paperclip/instances/<instanceId>/secrets/master.key` on first boot. Ignored if the file already exists on the PVC. Only used when `existingSecret` is empty. Leave empty to let Paperclip generate its own on first run.
  masterKey: ""

# -- GitHub App creds for server-side installation-token minting. Lets the API
# authoritatively verify (via the GitHub API) that a PR-review run actually left
# a review/comment before completing it (BLO-10448). Deployments that run the PR
# reviewer must enable this; missing credentials warn at API startup and fail
# review completion closed.
# Disabled by default for deployments that do not use the reviewer workflow.
githubApp:
  # -- Mount the GitHub App creds into the API env and enable GitHub-verified PR-review evidence.
  enabled: false
  # -- Name of the pre-existing Secret holding the App creds.
  secretName: paperclip-github-app-creds
  # -- Secret keys (override only if your secret uses different key names).
  appIdKey: app_id
  installationIdKey: installation_id
  privateKeyKey: private_key.pem
  # -- GitHub App login used to filter reviews/comments. Must be `<slug>[bot]` or `app/<slug>`; bare user logins are rejected. Empty -> server default ("allyblockcast[bot]").
  reviewerBotLogin: ""
  # -- Durably capture signed review-gate webhooks without processing them. Roll this out to every API replica before enabling authority.
  reviewGateCaptureEnabled: false
  # -- Process captured review-gate deliveries and dispatch reconciliation. Requires capture; the Blockcast release workflow also proves the live capture rollout completed before promotion.
  reviewGateEnabled: false
  # -- Repositories whose signed webhook deliveries drive review-gate revocation and reconciliation.
  reviewGateRepositories: []
  # -- GitHub App identity allowed to produce the protected review-gate status.
  reviewGateExpectedAppId: ""
  # -- Installation identity allowed to produce the protected review-gate status.
  reviewGateExpectedInstallationId: ""
  # -- Commit-status context to FAIL when a PR-review run exhausts its automatic
  # retries (e.g. "review/ally-complete"). A required status that is never posted
  # reads as "Expected — waiting for status" forever, so an exhausted reviewer
  # chain silently wedges the PR. Empty (default) -> the server posts no status.
  # Requires the App to hold `statuses: write` on the target repos.
  prReviewGateStatusContext: ""
  # -- Commit-status context for Ally's comment-shaped consolidated reviews.
  # Empty (default) leaves this fully inert. When set, mark the same context
  # required in branch protection so Critical/Important comment findings block
  # the head they explicitly attest to. Requires `statuses: write`.
  prCommentReviewGateStatusContext: ""
  # -- Contexts this gate previously published to. Commit statuses cannot be
  # deleted, so a rename strands the old context on every head that already
  # carries it. Each name listed here is overwritten with a pointer to the live
  # context on every evaluation, which supersedes the stale row and keeps a repo
  # that still requires the old name satisfied. Comma-separated.
  prCommentReviewGateRetiredStatusContexts: ""

# -- Pod spec knobs.
pod:
  # -- Share the process namespace so tini (pid 1) reaps orphaned child processes spawned by Claude agents.
  shareProcessNamespace: true
  # -- Pod-level security context.
  # @default -- `{fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch}`.
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  # -- Container-level security context.
  # @default -- `{runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}`.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  # -- Seconds the kubelet waits between SIGTERM and SIGKILL. Must cover the
  # preStop sleep (5s) plus the server's full graceful-drain sequence: SSE
  # drain (bounded 25s), server.close, telemetry/OTel flushes, and Linear
  # tunnel teardown. The k8s default of 30s truncated that drain on every
  # rollout (BLO-12563).
  terminationGracePeriodSeconds: 120
  # -- Extra annotations on the pod template.
  annotations: {}
  # -- Extra labels on the pod template.
  labels: {}

# -- Container resource requests/limits.
# @default -- requests `500m/1Gi`, limits `2/4Gi`.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# -- Health probe configuration. `httpGet` to `/healthz` with an explicit
# `Host: 127.0.0.1:3100` header — Paperclip's hostname allowlist always accepts
# loopback (see server/src/middleware/private-hostname-guard.ts), while the
# pod-IP Host header kubelet would otherwise send is rejected.
probes:
  # -- Liveness probe. Paperclip serves HTTP on the configured port once the embedded Postgres is up.
  # timeoutSeconds=5 (k8s default is 1) — under load /healthz can spike past
  # 1s when the event loop is briefly busy (e.g. during a fs-write batch
  # under contention with ccrotate-auth-bot's pool sweep). Observed
  # 2026-05-09 ~04:55Z: kubelet flagged "Killing — failed liveness probe"
  # but the process recovered before the kill landed. 5s is a generous
  # ceiling that absorbs those spikes without hiding a real wedge.
  liveness:
    httpGet:
      path: /healthz
      port: http
      httpHeaders:
        - name: Host
          value: 127.0.0.1:3100
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe. Shorter cadence pulls the pod out of rotation quickly on transient failures.
  readiness:
    httpGet:
      path: /healthz
      port: http
      httpHeaders:
        - name: Host
          value: 127.0.0.1:3100
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Startup probe. Long timeout tolerates first-run DB init + 45 migrations.
  startup:
    httpGet:
      path: /healthz
      port: http
      httpHeaders:
        - name: Host
          value: 127.0.0.1:3100
    periodSeconds: 10
    failureThreshold: 30

# -- Worker StatefulSet probe configuration. The worker serves the same
# `/healthz` endpoint as the API tier; probing HTTP prevents Kubernetes from
# routing API-to-worker requests before the worker is actually listening.
workerProbes:
  # -- Worker liveness probe.
  #
  # BLO-19722 — why this is deliberately laxer than `probes.liveness` above.
  #
  # What `/healthz` actually measures: nothing declares this route. No handler
  # in `server/src` matches `/healthz` (the only one in the repo belongs to the
  # MCP gateway), so the request falls through to the SPA catch-all at
  # `server/src/app.ts:777-787`, which synchronously returns 200 + static HTML.
  # It therefore probes exactly one thing — "is the event loop able to service
  # a request right now" — and says nothing about database or heartbeat health.
  #
  # At the previous `timeoutSeconds: 5 / periodSeconds: 30 / failureThreshold: 3`
  # a ~90s event-loop stall was enough for kubelet to kill the pod. That is not
  # theoretical: on 2026-07-31 `Liveness probe failed: context deadline
  # exceeded` on `paperclip-0` was followed ~5s later by every active
  # `agent-opencode-*` pod dying with it. A busy heartbeat pass is not a wedged
  # process, but this probe could not tell them apart.
  #
  # The asymmetry with the API tier is the point. An API replica is stateless
  # and horizontally scaled, so killing one early is cheap. The worker is a
  # singleton supervising every in-flight agent run, so a false kill orphans
  # all of them — the exact failure this issue exists to stop. We therefore buy
  # stall tolerance at the cost of slower detection of a true wedge:
  # 6 × 30s ≈ 180s before a kill, versus ~90s previously.
  #
  # Not fixed here: making `/healthz` un-blockable. Node runs our request
  # handling on one thread, so any in-process endpoint is blocked by whatever
  # blocks the loop; a genuinely independent health responder needs a worker
  # thread (or a sidecar) and is a larger change than this issue should carry.
  # Widening with the rationale recorded is the other branch this issue allows.
  #
  # Latent landmine while we are here: because `/healthz` resolves via the SPA
  # catch-all, a build serving no `ui-dist` (`app.ts:788-790` warns and skips
  # the catch-all) would 404 every probe and CrashLoop the worker for a reason
  # that has nothing to do with its health.
  liveness:
    httpGet:
      path: /healthz
      port: http
      httpHeaders:
        - name: Host
          value: 127.0.0.1:3100
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6
  # -- Worker readiness probe.
  #
  # BLO-31945 — why this is no longer tuned "tighter than liveness".
  #
  # The rationale here used to read: "Keep it tighter than liveness so API
  # callers stop routing to a worker whose event loop is not answering
  # promptly." That holds for a horizontally-scaled tier, where readiness
  # sheds traffic to healthy peers. This StatefulSet runs `replicas: 1`, so
  # there is no peer to shed to: removing the only endpoint does not redirect
  # plugin traffic, it 502s it. Every API-to-worker call then fails in the
  # `catch` at `server/src/routes/worker-tier-proxy.ts` with "Worker tier
  # unreachable", which is how a `/healthz` latency blip became a total
  # plugin-tier outage — Alertmanager webhook delivery included. Alertmanager
  # then retries each delivery 4x into the worker that just failed its probe.
  #
  # Measured on `paperclip-0` over the 24h to 2026-09-05T20:30Z from the
  # kubelet `prober_probe_*` metrics — same endpoint, same pod, same window,
  # with the per-probe timeout as the only material difference: readiness at a
  # 5s timeout failed 100.2 of 8559 probes (1.171%), while liveness at a 10s
  # timeout failed 13.1 of 2838 (0.462%).
  #
  # Readiness failed at 2.53x the liveness rate against the identical
  # `/healthz`. The tail latency confirms the cause: p99.9 of *successful*
  # liveness probes is 8.59s, i.e. `/healthz` legitimately takes longer than
  # the old 5s readiness timeout. A timeout set below the endpoint's own tail
  # is a false-positive generator, not a sensitivity knob.
  #
  # Trap when re-deriving this: `prober_probe_duration_seconds` is a
  # SUCCESS-ONLY histogram — its `_count` matches
  # `prober_probe_total{result="successful"}`, not the total. Timed-out probes
  # are censored out of it, so the bucket distribution on its own reads as
  # "almost nothing exceeds 5s" and will invert this diagnosis if used without
  # the failure counter.
  #
  # timeoutSeconds now matches liveness (10s), above the measured tail, and
  # periodSeconds moves to 15 so a probe cannot outlast its own period.
  # Worst-case endpoint removal, stated derivably rather than as `3 x period`:
  # probes start at t=0/15/30 and each times out 10s in, so the third
  # consecutive failure is only observed at t=40s, and endpoint propagation
  # adds more on top. That is ~40s+ versus ~20s+ under the old 10s/5s
  # settings. The slower detection costs nothing real at `replicas: 1`,
  # because endpoint removal has no upside here in the first place.
  #
  # Decision, recorded explicitly rather than left implicit: readiness is
  # KEPT, not retired. It still gates the endpoint during rollout, and
  # deleting it would make a genuine wedge hang API callers until TCP timeout
  # instead of failing fast. What is retired is tuning it as though it could
  # shed load. This is mitigation, not a cure: at the liveness failure rate
  # the probe still drops the endpoint occasionally, and the durable fix is a
  # second replica (BLO-29307 / BLO-29004) or a `/healthz` that cannot be
  # blocked by the event loop. Until one of those lands, this probe must be
  # tolerant rather than tight.
  #
  # `failureThreshold: 3` is load-bearing, not incidental, and it is the knob
  # a future reader will reach for once told not to touch the timeout. At the
  # 0.462% per-probe failure rate this endpoint actually exhibits, requiring
  # three *consecutive* failures puts an endpoint drop at roughly one per
  # several years; `failureThreshold: 1` would drop the only endpoint on any
  # single tail-latency blip, i.e. tens of times a day, reopening exactly the
  # outage this change closes. `tests/probes.test.mjs` enforces both this
  # floor and the timeout relationship while the tier is single-replica.
  readiness:
    httpGet:
      path: /healthz
      port: http
      httpHeaders:
        - name: Host
          value: 127.0.0.1:3100
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
  # -- Worker startup probe.
  #
  # Deliberately left at `timeoutSeconds: 5`, below the 8.59s `/healthz` tail
  # measured above, and that exemption is intentional rather than an
  # oversight: `failureThreshold: 30` at a 10s period gives a ~300s budget, so
  # an individual timed-out probe is absorbed instead of being fatal. The
  # readiness defect was that three false timeouts were *sufficient* to remove
  # the endpoint; here they are not close to sufficient, so tail sensitivity
  # carries no cost. Re-tighten `failureThreshold` here and that stops being
  # true.
  startup:
    httpGet:
      path: /healthz
      port: http
      httpHeaders:
        - name: Host
          value: 127.0.0.1:3100
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
# -- Priority class name.
priorityClassName: ""

# -- PodDisruptionBudget. Uses `maxUnavailable` rather than `minAvailable` so node drains and cluster upgrades remain possible on the single-replica StatefulSet (a `minAvailable: 1` budget would block every voluntary eviction).
pdb:
  # -- Create a PodDisruptionBudget.
  enabled: true
  # -- Maximum number of pods that may be unavailable during voluntary disruptions. `1` lets a single-replica StatefulSet be drained.
  maxUnavailable: 1

# -- Ingress NetworkPolicy restricting which namespaces may reach the pod.
networkPolicy:
  # -- Create a NetworkPolicy. Defaults to allowing from `ingress-nginx` and `cloudflare` namespaces only — **same-namespace pods (sidecars, scrapers, `kubectl debug` pods) are also blocked**, so extend `allowFromNamespaces` or disable the policy for any in-cluster tooling that needs to reach the service.
  enabled: true
  # -- Namespaces whose pods may reach the Paperclip service port. Add an entry for the release namespace if you need same-namespace traffic (e.g. Prometheus scrape, debug pods).
  # @default -- `ingress-nginx` and `cloudflare` namespaces.
  allowFromNamespaces:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare

# -- Prometheus Operator ServiceMonitor for scraping the control-plane
# `/metrics` endpoint (BLO-8328). Requires the `monitoring.coreos.com/v1` CRDs
# (Prometheus Operator / kube-prometheus-stack). Disabled by default so the
# chart still installs on clusters without the operator. Enabling this also
# opens the NetworkPolicy scrape path when `scrapeAllowFromNamespaces` is set.
serviceMonitor:
  # -- Create a ServiceMonitor. Leave false on clusters without the Prometheus Operator CRDs.
  enabled: false
  # -- Namespace for the ServiceMonitor. Empty renders it into the release namespace.
  namespace: ""
  # -- Extra labels so a Prometheus `serviceMonitorSelector` can adopt it (e.g. `{release: kube-prometheus-stack}`).
  labels: {}
  # -- Scrape path. Matches the control-plane `/metrics` route.
  path: /metrics
  # -- Scrape interval.
  interval: 30s
  # -- Per-scrape timeout. Must be `<=` `interval`.
  scrapeTimeout: 10s
  # -- Namespaces of the Prometheus pods that scrape this Service. Appended to
  # the NetworkPolicy ingress `from` (when `networkPolicy.enabled`) so scrapes
  # are not blocked. Same shape as `networkPolicy.allowFromNamespaces`.
  # Example: `[{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]`.
  scrapeAllowFromNamespaces: []

# Grafana dashboards shipped as sidecar-adopted ConfigMaps (BLO-20171).
#
# Unlike `prometheusRule` below, this is safe to enable on Blockcast: the
# paperclip-ci-deploy ServiceAccount holds ClusterRole/admin in the release
# namespace, which covers core `configmaps` but not the monitoring.coreos.com
# CRDs. See templates/grafana-dashboard.yaml for the full reasoning.
grafanaDashboard:
  # -- Render Grafana dashboard ConfigMaps for a `grafana_dashboard`-watching sidecar.
  enabled: false
  # -- Label the Grafana dashboard sidecar watches for.
  sidecarLabel: grafana_dashboard
  # -- Value that label must carry. Quoted on render because sidecars compare strings.
  sidecarLabelValue: "1"
  # -- Grafana datasource **uid** the dashboard panels query. Must be a Prometheus that scrapes the paperclip control plane; `thanos` and `prometheus-monitoring` do not.
  datasourceUid: cluster
  # -- Grafana folder to file the dashboard under, via the `grafana_folder` annotation. Empty leaves it in the sidecar's default folder.
  folder: ""
  # -- Extra labels to merge onto the dashboard ConfigMaps.
  extraLabels: {}

# -- Prometheus Operator rules for Paperclip runtime health. Requires the
# `monitoring.coreos.com/v1` CRDs and the ServiceMonitor scrape above. Disabled
# by default so the chart still installs on clusters without the operator.
prometheusRule:
  # -- Create a PrometheusRule with Paperclip runtime alerts.
  enabled: false
  # -- Namespace for the PrometheusRule. Empty renders it into the release namespace.
  namespace: ""
  # -- Extra labels so a Prometheus `ruleSelector` can adopt it (e.g. `{release: kube-prometheus-stack}`).
  labels: {}
  # -- Alert when an agent has at least this many consecutive terminal runs with zero token usage.
  zeroTokenStreakThreshold: 3
  # -- How long the zero-token streak condition must persist before firing.
  zeroTokenFor: 2m
  # -- Regex for Kubernetes Job names owned by Paperclip agents.
  agentJobNameRegex: "ac-.*"
  # -- Fire PaperclipAgentHeartbeatStale when an agent's lastHeartbeatAt age exceeds this multiple of its own configured heartbeat.intervalSec (BLO-23413).
  agentHeartbeatStaleMultiplier: 3
  # -- How long the stale-heartbeat condition must persist before firing (scrape-flap tolerance only; the ageing lives in the multiplier threshold).
  agentHeartbeatStaleFor: 2m
  # -- Warn when process_lost reaps exceed this many per rolling 24h (BLO-16184 numerator).
  processLostWarnPerDay: 20
  # -- How long the elevated process_lost daily count must persist before warning.
  processLostElevatedFor: 10m
  # -- Page when process_lost reaps exceed this many per rolling 24h.
  processLostPagePerDay: 40
  # -- How long the high process_lost daily count must be sustained before paging.
  processLostPageFor: 2h
  # -- Warn when the reaper gets more than this many null kube Job-status lists in 15m (blind-to-kube denominator guard: a low process_lost count is untrustworthy while this fires).
  processLostLivenessNullWindowCount: 5
  # -- How long the reaper-blind-to-kube condition must persist before warning.
  processLostSignalBlindFor: 15m
  # -- Warn when more than this many ac-* agent pods are Unschedulable for unschedulableFor (node-pool scheduling starvation, BLO-16224). Reuses agentJobNameRegex to match agent pods.
  unschedulablePodThreshold: 0
  # -- How long agent pods must stay Unschedulable before warning (transient blips self-resolve; this catches sustained starvation).
  unschedulableFor: 15m
  # -- Rolling window for the GitHub review-request dead-letter rate (BLO-18859). Any dead-lettered delivery in this window fires; the counter is flat at zero in steady state.
  githubDeliveryDeadLetterWindow: 30m
  # -- How long a non-zero dead-letter rate must persist before firing. Kept short: a dead-lettered delivery is already terminal, so there is nothing to self-resolve.
  githubDeliveryDeadLetterFor: 5m
  # -- Grafana URL for the review-request delivery funnel dashboard, surfaced on the dead-letter alert so the page carries its own panel link (BLO-20171). Must match the `uid` in dashboards/github-review-request-funnel.json.
  githubDeliveryDashboardUrl: "https://stats.orc8r.blockcast.net/d/paperclip-review-request-funnel"
  # -- Rolling window for outage-like terminal suppression of GitHub review-request wakes (BLO-18859).
  githubDeliverySuppressionWindow: 30m
  # -- How long outage-like suppression must persist before firing. Same reasoning as the dead-letter alert: suppression is terminal, nothing self-resolves.
  githubDeliverySuppressionFor: 5m
  # -- How long a pr_review-scoped agent_wakeup_requests row may sit in terminal status='failed' before firing (BLO-20255). Expressed in SECONDS and compared against paperclip_agent_wakeup_terminal_failed_oldest_age_seconds, which carries the real per-row age. It is deliberately NOT a Prometheus `for:` duration: `for:` measures how long the alert EXPRESSION has been continuously true, so with a summed count two short failures overlapping by one scrape keep the expression true and page for a row seconds old. Retry safety does NOT depend on this value: a scheduled retry writes its successor wake ("queued") and successor run ("scheduled_retry") inside the scheduling transaction, so a row the BLO-18030 bounded retry re-queues clears the gauge immediately via the successor exclusion — at every step of BOUNDED_TRANSIENT_HEARTBEAT_RETRY_DELAYS_MS, including the 30m and 2h ones. Set past the 45m HARD_STALE window purely so the alert cannot fire on a row still inside its natural lifecycle.
  wakeTerminalFailedAgeSeconds: 1800
  # -- Scrape-flap tolerance only (BLO-20255). The ageing lives in wakeTerminalFailedAgeSeconds above; this just requires the threshold to hold across a couple of scrapes so a single bad scrape cannot page.
  wakeTerminalFailedFor: 5m
  # -- Runbook for the terminal-failed wake alert, linked from its annotation.
  wakeTerminalFailedRunbookUrl: "https://github.com/Blockcast/paperclip/blob/master/runbooks/agent-wakeup-terminal-failed.md"
  # -- How long an agent's oldest `queued` heartbeat_runs row may sit before firing (BLO-21116). Expressed in SECONDS and compared against paperclip_queued_run_oldest_age_seconds, which carries the real per-agent age -- see wakeTerminalFailedAgeSeconds above for why this is a threshold on an age gauge rather than a `for:` duration over a count. Matches this issue's own AC ("alert firing before the age exceeds ~30m"). Set to 1440 (24m), not 1800 (30m): `for:` below stacks its 5m hold on top of the threshold, so a bare 1800 would not fire until 2100s (35m) of real age -- past the AC. 1440 + 300 = 1740s (29m), same headroom as the matching `Blockcast/onprem-k8s#2013` fix for the rule that actually deploys.
  queuedRunStrandedAgeSeconds: 1440
  # -- Scrape-flap tolerance only (BLO-21116). The ageing lives in queuedRunStrandedAgeSeconds above; it stacks on top of that threshold rather than testing independently, which is why the threshold is 1440 and not 1800.
  queuedRunStrandedFor: 5m
  # -- Alert only after sustained failed refreshes; a one-off failed scrape is logged and retried on the next scrape.
  queuedRunAgeMetricsRefreshFailureFor: 5m
  # -- Runbook for the queued-run-stranded and metric-freshness alerts, linked from their annotations.
  queuedRunStrandedRunbookUrl: "https://github.com/Blockcast/paperclip/blob/master/runbooks/queued-run-stranded.md"
  # -- How long an agent's oldest overdue `scheduled_retry` heartbeat_runs row (scheduled_retry_at < now(), never promoted) may sit before firing (BLO-22094). Expressed in SECONDS and compared against paperclip_overdue_scheduled_retry_oldest_age_seconds. Derived from the observed park-to-promotion lag distribution over the 7 days preceding this alert's authorship (2026-07-31..2026-08-07, n=5253 promotions from heartbeat_run_events "Scheduled retry became due and was promoted to the queued run pool"): p50=21.5s, p90=83.7s, p95=131.9s, p99=1594.8s, max=3567.5s -- zero of the 5253 samples exceeded 3600s. NOT fitted to the BLO-16366 5-sample table in the originating issue: that table measured due-to-execution-start lag (due time until the run actually started, which folds in the separate `queued` dispatch wait queuedRunStrandedAgeSeconds above already covers), a different quantity from this alert's due-to-promotion lag. Set to 5400 (90m) -- roughly 50% margin over the worst observed day's max (3567s) rather than over the aggregate p99, because the by-reason breakdown shows ccrotate_capacity alone has its own p99 of 2528s on contention days, and margining off the whole-population p99 would leave that reason's bad days too close to the threshold.
  overdueScheduledRetryAgeSeconds: 5400
  # -- Scrape-flap tolerance only (BLO-22094). The ageing lives in overdueScheduledRetryAgeSeconds above; it stacks on top of that threshold rather than testing independently, same reasoning as queuedRunStrandedFor.
  overdueScheduledRetryFor: 5m
  # -- Alert only after sustained failed refreshes of the overdue-scheduled_retry age gauge (BLO-22094); a one-off failed scrape is logged and retried on the next scrape. Separate from queuedRunAgeMetricsRefreshFailureFor because the two refreshes query different aggregates behind different indexes and can fail independently.
  overdueScheduledRetryAgeMetricsRefreshFailureFor: 5m
  # -- Runbook for the overdue-scheduled-retry alert, linked from its annotation.
  overdueScheduledRetryRunbookUrl: "https://github.com/Blockcast/paperclip/blob/master/runbooks/queued-run-stranded.md#overdue-scheduled-retry-blo-22094"
  # -- Maximum booked interval from heartbeat_runs.updated_at (the moment the due time is chosen) to scheduled_retry_at before a future-due park is considered implausible (BLO-25036; subtrahend corrected from created_at in BLO-31174, which made the reading accumulate across re-parks instead of measuring one booking). Derived as a conservative bound from the observed seven-day park-to-promotion lag population: n=5253, p50=21.5s, p90=83.7s, p95=131.9s, p99=1594.8s, max=3567.5s -- that lag is a different quantity from a booked horizon, so treat these percentiles as a proxy for scale rather than as park-horizon percentiles.
  scheduledRetryParkHorizonSeconds: 5400
  # -- Scrape-flap tolerance only (BLO-25036); the horizon age lives in scheduledRetryParkHorizonSeconds.
  scheduledRetryParkHorizonFor: 5m
  # -- Alert after sustained failed refreshes of the scheduled-retry park-horizon gauge (BLO-25036).
  scheduledRetryParkHorizonRefreshFailureFor: 5m
  # -- Runbook for the scheduled-retry park-horizon and freshness alerts.
  scheduledRetryParkHorizonRunbookUrl: "https://github.com/Blockcast/paperclip/blob/master/runbooks/queued-run-stranded.md#scheduled-retry-park-horizon-blo-25036"
  # -- How long a STRANDED external-runtime reservation may sit before firing (BLO-28865). Compared against paperclip_external_runtime_reservation_stranded_oldest_age_seconds, which the server publishes only for reservations whose run is terminal or silent past the 45m hard-stale floor -- the strand condition is evaluated in SQL, so this is a plain age threshold and NOT the naive "oldest reservation age > 45m" rule the issue explicitly rules out. Set to 900 (15m): the pre-fix wedge resolved incidentally at the 45m hard-stale boundary, so a useful page must land well inside that. `for:` below stacks on top, so real fire time is 900 + 300 = 1200s (20m), still comfortably ahead of 45m.
  externalRuntimeReservationStrandedAgeSeconds: 900
  # -- Scrape-flap tolerance only (BLO-28865). The ageing lives in externalRuntimeReservationStrandedAgeSeconds above; it stacks on top of that threshold rather than testing independently.
  externalRuntimeReservationStrandedFor: 5m
  # -- Alert only after sustained failed refreshes; a one-off failed scrape is logged and retried on the next scrape.
  externalRuntimeReservationStrandMetricsRefreshFailureFor: 5m
  # -- Runbook for the stranded-reservation and metric-freshness alerts, linked from their annotations.
  externalRuntimeReservationStrandedRunbookUrl: "https://github.com/Blockcast/paperclip/blob/master/runbooks/external-runtime-reservation-stranded.md"
  # -- Rolling window and hold time for PR-review queue-wait saturation.
  prReviewQueueWaitWindow: 6h
  prReviewQueueWaitFor: 10m
  prReviewQueueWaitThresholdSeconds: 3600
  prReviewQueueWaitRunbookUrl: "https://github.com/Blockcast/paperclip/blob/master/runbooks/pr-review-queue-wait.md"
  # -- Prometheus regex of suppression causes that mean an outage rather than a deliberate decline (BLO-18859). Expected policy declines (company.inactive, heartbeat.cooldown.active, heartbeat.disabled, heartbeat.wakeOnDemand.disabled, budget.blocked, agent.not_invokable, heartbeat.worktree_execution_cutoff, issue_tree_hold_active) are excluded so they never page. `other` is included: it is the bucket for a skip reason missing from KNOWN_GITHUB_SUPPRESSION_CAUSES, and an untriaged cause is not a known-good decline.
  githubDeliverySuppressionOutageCauses: "heartbeat.scheduling_suppressed|dispatch_rejected|other"
  # -- How long an installed plugin may sit at status='error' before firing (BLO-21092/BLO-20410). Long enough to ride out a deploy's brief activation retries (BLO-978 makes activation timeouts retry rather than latch), short enough that a genuinely dead plugin -- a bad manifest, an expired credential in `initialize` -- pages within the hour. Unlike the wake-terminal-failed alert above, a plain `for:` is safe here: paperclip_plugin_error already carries plugin_id/plugin_key labels, so Prometheus tracks continuity per plugin series rather than summing plugins together.
  pluginErrorFor: 10m
  # -- Prometheus regex (matched against the plugin_key label) for plugins whose downtime pages critical rather than warning. Alternation, fully anchored by Prometheus, so a substring or suffixed key is NOT selected. Two members today. `lucitra.plugin-secrets`: BLO-20410 found the secrets subsystem dead for 9+ hours with nothing alerting. `paperclip-plugin-alertmanager` (PEN-2590): critical for a *routing* reason rather than an importance one -- warning's only route is the `paperclip` webhook catch-all, whose endpoint is gated on this very plugin's readiness, so at warning the alert reporting it broken is delivered into the receiver that is broken because it is broken (PEN-2581 measured ~96% of notifications destroyed over 4 days). critical fans out to slack-relay, which is independent of Paperclip's DB and plugins.
  # ⚠️ HAZARD when adding a key: plugin_key is `manifest.id` verbatim (server/src/services/plugin-registry.ts does no transformation), and the two conventions in use here are BOTH correct. Externally published plugins carry a dotted namespace (`lucitra.plugin-secrets`, from @lucitra/paperclip-plugin-secrets); local workspace plugins have a bare hyphenated id (`paperclip-plugin-alertmanager`). A regex written on the assumption of one convention silently selects nothing for the other -- and a selector that matches nothing is a permanently-inert rule, not a visible failure (that is the PEN-2579 class). Escape dots; hyphens are regex-literal. Verify a new key against the manifest id, never infer it from the package name.
  # ⚠️ This Helm value is NOT the live control surface. The cluster runs a vanilla Prometheus with no prometheus-operator, loading rules from monitoring/prometheus-configmap.yaml in Blockcast/onprem-k8s; the rendered PrometheusRule here is an inert review mirror. Editing this value alone changes nothing that pages. Both must move together.
  pluginErrorCriticalKeyRegex: "lucitra\\.plugin-secrets|paperclip-plugin-alertmanager"
  # -- Runbook for the plugin-error alert, linked from its annotation.
  pluginErrorRunbookUrl: "https://github.com/Blockcast/paperclip/blob/master/runbooks/plugin-error.md"
  # -- Seconds since the plugin-status collector's last successful tick before it counts as stale (BLO-21092 review follow-up). 300s = 10x the collector's ~30s poll interval, well past what a single transient DB hiccup should cost; below this the collector is just between scrapes, not broken.
  pluginStatusCollectorStaleSeconds: 300
  # -- How long the staleness condition above must hold before paging. Combined with pluginStatusCollectorStaleSeconds this pages at roughly the same ~10m scale as pluginErrorFor, so a dead collector is not treated as more urgent than the plugin outages it exists to detect.
  pluginStatusCollectorStaleFor: 5m
  # -- Lookback window for the companion ABSENCE guard (BLO-21092 Ally review). pluginStatusCollectorStaleSeconds above can only catch a collector that is stuck while still being scraped; it is structurally unable to catch a worker that is down, crashlooping, or never started the collector at all, because `time() - <gauge>` needs the gauge to still be queryable and Prometheus drops it from instant queries at the 5m lookback -- the same instant the difference would first exceed 300s. This window must therefore exceed Prometheus's lookback-delta (5m default) so the absence is unambiguous rather than a scrape-gap artifact.
  pluginStatusCollectorAbsentFor: 10m
  # -- Additional PrometheusRule groups appended verbatim.
  additionalGroups: []

# -- Dedicated ServiceAccount for the pod.
serviceAccount:
  # -- Create a dedicated ServiceAccount.
  create: true
  # -- Name override. Defaults to the full release name when empty.
  name: ""
  # -- Annotations on the ServiceAccount.
  annotations: {}
  # -- Mount the SA token into the pod. Required when `rbac.create` is true so the k8s-Job adapters (paperclip-adapter-claude-k8s / -opencode-k8s) can authenticate to the K8s API. Default false to preserve the legacy posture.
  automountToken: false

# -- Namespace-scoped RBAC for the k8s-Job adapters.
# When `rbac.create: true`, the chart renders a Role + RoleBinding granting
# the SA permission to manage Jobs/Pods/Secrets/PVCs in this namespace, plus
# a ClusterRole + ClusterRoleBinding for SelfSubjectAccessReview (used by
# both adapters' install-time self-test). Only enable in tandem with
# `serviceAccount.automountToken: true`.
rbac:
  # -- Render Role/RoleBinding/ClusterRole/ClusterRoleBinding for the k8s-Job adapters.
  create: false
