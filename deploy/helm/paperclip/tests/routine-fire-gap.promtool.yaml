# BLO-32638 — replay the measured incident against PaperclipRoutineFireGap.
#
# The issue's binding verifying signal: take the alert-delivery bridge
# watchdog's actual fire history (BLO-31881 — 11 gaps > 12h, largest 47.5h,
# and one 30.7h window during which a real bridge outage destroyed 22 of 42
# alerts undetected) and confirm the rule lights up in the blind window and
# stays silent across the healthy intervals in that same history. A rule that
# does not fire on the 30.7h window is not the rule this row asked for; one
# that fires on normal cadence is a noise generator.
#
# Run:  promtool test rules deploy/helm/paperclip/tests/routine-fire-gap.promtool.yaml
# (the rule_files path is the rendered chart output; see the mjs harness that
# renders it next to this file).
# PEN-4647 added four cases, one replaying a 48h window at this file's 1m
# step. Measured locally on promtool 3.2.1: 293s before, 322s after (+10%) --
# the bulk of that is the pre-existing 30.7h ramp, not the addition. This
# whole harness SKIPS when promtool is absent, which is the case in the job
# that runs the chart's other tests, so the cost is borne by local runs only.
# The authoritative copy of this replay is in Blockcast/onprem-k8s
# (monitoring/paperclip-routine-fire-gap/prometheus-rule_test.yml), which
# tests the rules Prometheus ACTUALLY loads and runs at a 10m step in 27s.
#
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # ── The incident. 1h-cadence watchdog, silent for 30.7h. ──────────────────
  - interval: 1m
    name: "30.7h blind window on a 1h-cadence routine fires"
    input_series:
      # Age climbing from 0 across the whole window, one sample per minute.
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", company_id="tenant-a", instance="pod-a", job="paperclip-control-plane"}'
        values: "0+60x1842"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", company_id="tenant-a", instance="pod-a", job="paperclip-control-plane"}'
        values: "3600+0x1842"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x1842"
    alert_rule_test:
      # 30.7h in. 2 * 3600 = 7200s is crossed at 2h, so by 30.7h the alert has
      # long been firing -- the window that hid a real outage is 15x the bar.
      - eval_time: 30h42m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: bridge-watchdog
              company_id: tenant-a
            exp_annotations:
              summary: "Paperclip routine bridge-watchdog has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine bridge-watchdog last fired, or last completed a fire, 110520s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"
      # The smallest of the 11 measured gaps, 12h, also fires -- so the rule
      # covers the whole measured cohort and not just its worst member.
      - eval_time: 12h
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: bridge-watchdog
              company_id: tenant-a
            exp_annotations:
              summary: "Paperclip routine bridge-watchdog has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine bridge-watchdog last fired, or last completed a fire, 43200s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"

  # ── Negative control: the healthy intervals in that same history. ─────────
  # The sawtooth a working 1h routine actually produces: age climbs to ~1h,
  # a fire lands, it resets. If the rule fires anywhere in here it is a noise
  # generator and -- per the platform charter -- should not exist.
  - interval: 1m
    name: "healthy 1h cadence never fires (negative control)"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "0+60x59 0+60x59 0+60x59 0+60x59 0+60x59 0+60x59"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "3600+0x359"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x359"
    alert_rule_test:
      - eval_time: 55m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []
      - eval_time: 3h30m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []
      - eval_time: 5h59m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []

  # ── One late-but-delivered fire must not page. ────────────────────────────
  # This is why the multiplier is 2 and not 1: a fire's own dispatch horizon
  # is already interval-minus-jitter, so ordinary lateness lands inside 1x.
  - interval: 1m
    name: "a single late fire at 1.5x cadence stays silent"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "0+60x90"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "3600+0x90"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 90m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []

  # ── Relative, not absolute: a DAILY routine at 30.7h must stay silent. ────
  # The same age that is a 15x emergency above is normal lateness here. This
  # is the whole reason the threshold is a multiple of the routine's own
  # cadence rather than a seconds value.
  - interval: 1m
    name: "a daily routine is not paged by an age that pages an hourly one"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="daily-report", instance="pod-a", job="paperclip-control-plane"}'
        values: "0+60x1842"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="daily-report", instance="pod-a", job="paperclip-control-plane"}'
        values: "86400+0x1842"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x1842"
    alert_rule_test:
      - eval_time: 30h42m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []

  # ── Irregular cron: a weekday routine's weekend is not an outage. ────────
  # Ally on #2352. `0 15 * * 1-5` is live in this fleet (routine 55bad102).
  # Its gauge publishes the LONGEST gap the cron schedules, Fri 15:00 -> Mon
  # 15:00 = 259200s. The age below is that exact healthy history: Friday's
  # fire lands at t=0, nothing until Monday's at 72h, then a normal 24h day.
  #
  # Mutation control: set the interval series to 86400 -- what the gauge
  # published when it took the SHORTEST gap -- and the Sun and Mon eval_times
  # below go red (age crosses 2 x 86400 at Sun 15:00, firing after `for: 10m`).
  # That is the ~24h weekly false page this scenario exists to keep out.
  - interval: 1m
    name: "a weekday cron's healthy Fri->Mon gap stays silent"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="weekday-triage", instance="pod-a", job="paperclip-control-plane"}'
        values: "0+60x4319 0+60x1439"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="weekday-triage", instance="pod-a", job="paperclip-control-plane"}'
        values: "259200+0x5759"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x5759"
    alert_rule_test:
      # Sun 15:15 -- where the shortest-gap denominator was already firing.
      - eval_time: 48h15m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []
      # Mon 14:59, the very end of the legitimate gap.
      - eval_time: 71h59m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []
      # Tue 14:59, an ordinary weekday after Monday's fire.
      - eval_time: 95h59m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []

  # ── The price of the longest-gap denominator, pinned. ─────────────────────
  # A weekday routine that genuinely died still pages -- after 2 x 72h = 144h
  # (+ `for: 10m`), not after 2 x 24h. Pinned in both directions so the trade
  # cannot silently move: silent at 143h, firing at 145h.
  - interval: 1m
    name: "a dead weekday routine pages past 2x its longest gap, not before"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="weekday-triage", instance="pod-a", job="paperclip-control-plane"}'
        values: "0+60x8760"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="weekday-triage", instance="pod-a", job="paperclip-control-plane"}'
        values: "259200+0x8760"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x8760"
    alert_rule_test:
      - eval_time: 143h
        alertname: PaperclipRoutineFireGap
        exp_alerts: []
      - eval_time: 145h
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: weekday-triage
            exp_annotations:
              summary: "Paperclip routine weekday-triage has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine weekday-triage last fired, or last completed a fire, 522000s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"

  # ── A paused / webhook-only routine has no interval and cannot page. ──────
  # Not a special case in the rule: with no right-hand side the vector match
  # drops it. Pinned because the day someone "helpfully" adds an `or vector(0)`
  # default to the interval side, every paused routine pages forever.
  - interval: 1m
    name: "an age with no interval series cannot fire"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="paused-thing", instance="pod-a", job="paperclip-control-plane"}'
        values: "0+60x1842"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x1842"
    alert_rule_test:
      - eval_time: 30h42m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []

  # ── A stale snapshot must not page, and must page its own alert instead. ──
  - interval: 1m
    name: "a failed refresh gates the gap alert off and fires the freshness alert"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "110520+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []
      - eval_time: 30m
        alertname: PaperclipRoutineFireGapMetricsRefreshFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: pod-a
              job: paperclip-control-plane
            exp_annotations:
              summary: "Paperclip routine fire-gap metric refresh is failing"
              description: "The most recent routine-fire-gap database refresh failed (BLO-32638), so routine fire ages may be stale and PaperclipRoutineFireGap is intentionally gated off. The refresh deliberately leaves the previous snapshot in place rather than publishing zeros -- a 0 age reads as `fired just now`, the healthy state -- so do not interpret the retained values as current. Check Paperclip logs and database connectivity."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"

  # ── Multi-replica. BLO-23413's second defect, which fails at RUNTIME only. ─
  # Three replicas each export both gauges. A bare `on(routine_id)` join is
  # many-to-many here and errors with HTTP 422 rather than firing. One alert,
  # not three, and no `instance` label on it.
  - interval: 1m
    name: "three replicas produce exactly one alert, not one per replica"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "110520+0x60"
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-b", job="paperclip-control-plane"}'
        values: "110520+0x60"
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-c", job="paperclip-control-plane"}'
        values: "110520+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-b", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-c", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-b", job="paperclip-control-plane"}'
        values: "1+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-c", job="paperclip-control-plane"}'
        values: "1+0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: bridge-watchdog
            exp_annotations:
              summary: "Paperclip routine bridge-watchdog has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine bridge-watchdog last fired, or last completed a fire, 110520s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"

  # ── One replica's stale snapshot must not bless or suppress the others. ───
  # pod-b's refresh has failed, so its (stale, low) age is excluded from the
  # max rather than dragging the aggregate down. The gate is INSIDE each
  # aggregate for exactly this reason.
  #
  # ⚠ This scenario alone does NOT pin the age-side gate: with the gate
  # removed, max(110520, 60) is still 110520 and it still fires. Mutation
  # testing caught that. The scenario below is the one that binds it.
  - interval: 1m
    name: "a stale replica is excluded rather than suppressing a live gap"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "110520+0x60"
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-b", job="paperclip-control-plane"}'
        values: "60+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-b", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-b", job="paperclip-control-plane"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: bridge-watchdog
            exp_annotations:
              summary: "Paperclip routine bridge-watchdog has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine bridge-watchdog last fired, or last completed a fire, 110520s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"

  # ── The age-side gate, pinned. A stale replica must not MANUFACTURE a page. ─
  # pod-a is live and the routine is healthy (60s into a 1h cadence). pod-b's
  # refresh died an hour ago holding a frozen 110520s age. With the gate
  # inside `max by`, pod-b is excluded and the max is pod-a's healthy 60s --
  # silent. Without it, max(60, 110520) pages for a routine that is fine.
  #
  # This is the scenario the sibling test above was supposed to be and was
  # not: there, removing the gate left the answer unchanged, so the test
  # passed against broken code. Found by reverting the gate and watching the
  # suite stay green.
  #
  # Note the interval side must stay reachable for the alert to be
  # *evaluable* at all -- pod-a supplies it. A scenario where every replica
  # is stale proves nothing about the age-side gate, because the empty
  # right-hand side suppresses the alert on its own.
  - interval: 1m
    name: "a stale replica cannot manufacture a page against a healthy routine"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "60+0x60"
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="bridge-watchdog", instance="pod-b", job="paperclip-control-plane"}'
        values: "110520+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-a", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="bridge-watchdog", instance="pod-b", job="paperclip-control-plane"}'
        values: "3600+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x60"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-b", job="paperclip-control-plane"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PaperclipRoutineFireGap
        exp_alerts: []

  # ── PEN-4647: a late completion must NOT resolve the alert. ───────────────
  #
  # THE REGRESSION THIS FIXTURE EXISTS TO HOLD. Until PEN-4647 the rule read
  # paperclip_routine_last_done_fire_age_seconds ALONE -- time since a fire
  # reached `done`, not time since one STARTED. A wedged long-open execution
  # row eats the fires behind it (`skip_if_active` + `skip_missed`), and when
  # that row finally completes the completion age resets to ~0 and the alert
  # RESOLVES with no fire having occurred. It failed OPEN, mid-outage.
  #
  # Replay of the measured window on routine b3ba3b33 ("CI pipeline health
  # check", `0 9 * * 1-5`). t=0 is 2026-10-19T09:30:00Z. Both gauge values at
  # t=0 and both reset magnitudes are what Prometheus actually recorded; the
  # +60/step ramps between them are not interpolation but what an age gauge
  # does by construction -- it advances with wall-clock.
  #
  #   t=0         2026-10-19T09:30Z  completion age 278.34h (1002037s), firing
  #   t=26m10s    2026-10-19T09:56Z  PEN-3866 reaches `done`, 11 days open
  #   t=30m       2026-10-19T10:00Z  completion age RESETS to 222s
  #   t=24h3m19s  2026-10-20T09:33Z  PEN-3178 reaches `done`, 36 days open
  #   t=24h10m    2026-10-20T09:40Z  completion age RESETS again, to 401s
  #   t=47h30m30s 2026-10-21T09:00Z  PEN-4461, the first GENUINE firing since
  #                                  PEN-3866 was created 2026-10-07T09:00:34Z
  #
  # 1038566s at t=0 is exactly 2026-10-19T09:30Z minus that creation instant,
  # and the firing series reaches 1209600s (14d) at 2026-10-21T09:00Z. Nine
  # weekday firings were lost in the window (2026-10-08..10-20 inclusive),
  # enumerated from all 80 of the routine's execution rows.
  #
  # Threshold is 2 x 259200s (the Fri->Mon gap `0 9 * * 1-5` schedules). The
  # completion arm falls ~1000x below it at both resets; the firing arm never
  # does.
  - interval: 1m
    name: "PEN-4647: two late completions do not resolve the alert"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "1002037+60x29 222+60x1449 401+60x1400"
      - series: 'paperclip_routine_last_fire_start_age_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "1038566+60x2880"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "259200+0x2880"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x2880"
    promql_expr_test:
      # THE CONTROL. Without it the case below could pass for the wrong reason
      # -- a rule that never resolves anything also "stays firing". This is the
      # OLD expression's left-hand side 40m in, i.e. 10m after the first late
      # completion and past `for: 10m`. 822s against a 518400s threshold: the
      # pre-PEN-4647 rule did not dip, it went green by three orders of
      # magnitude, and stayed green across the 10-20 firing too.
      - expr: 'max by (routine_id, company_id) (paperclip_routine_last_done_fire_age_seconds and on(instance) (paperclip_routine_fire_gap_metrics_refresh_success == 1))'
        eval_time: 40m
        exp_samples:
          - labels: '{routine_id="ci-pipeline-health-check", company_id="penstock"}'
            value: 822
      # And the arm that replaces it, at the same instant.
      - expr: 'max by (routine_id, company_id) ({__name__=~"paperclip_routine_last_(done_fire|fire_start)_age_seconds"} and on(instance) (paperclip_routine_fire_gap_metrics_refresh_success == 1))'
        eval_time: 40m
        exp_samples:
          - labels: '{routine_id="ci-pipeline-health-check", company_id="penstock"}'
            value: 1040966
    alert_rule_test:
      # Mid-outage, before either late completion, past `for: 10m`. Firing.
      # (t=0 is deliberately not asserted: the alert is PENDING there.)
      - eval_time: 20m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: ci-pipeline-health-check
              company_id: penstock
            exp_annotations:
              summary: "Paperclip routine ci-pipeline-health-check has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine ci-pipeline-health-check last fired, or last completed a fire, 1.039766e+06s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"
      # 10m after PEN-3866 completed. The OLD rule is green here; this is the
      # assertion PEN-4647 turns on.
      - eval_time: 40m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: ci-pipeline-health-check
              company_id: penstock
            exp_annotations:
              summary: "Paperclip routine ci-pipeline-health-check has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine ci-pipeline-health-check last fired, or last completed a fire, 1.040966e+06s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"
      # 10m after the SECOND late completion (PEN-3178). Still firing.
      - eval_time: 24h20m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: ci-pipeline-health-check
              company_id: penstock
            exp_annotations:
              summary: "Paperclip routine ci-pipeline-health-check has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine ci-pipeline-health-check last fired, or last completed a fire, 1.126166e+06s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"
      # Minutes before PEN-4461, the first genuine firing in 14 days.
      - eval_time: 47h20m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: ci-pipeline-health-check
              company_id: penstock
            exp_annotations:
              summary: "Paperclip routine ci-pipeline-health-check has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine ci-pipeline-health-check last fired, or last completed a fire, 1.208966e+06s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"

  # ── The alert must still be able to CLEAR. ────────────────────────────────
  # A check whose red has never been shown to go green is not a check. Once a
  # genuine fire lands AND completes, both ages reset and this resolves.
  - interval: 1m
    name: "PEN-4647: a genuine fire that completes does resolve it"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "1002037+60x29 222+60x90"
      - series: 'paperclip_routine_last_fire_start_age_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "1038566+60x29 180+60x90"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "259200+0x120"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: ci-pipeline-health-check
              company_id: penstock
            exp_annotations:
              summary: "Paperclip routine ci-pipeline-health-check has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine ci-pipeline-health-check last fired, or last completed a fire, 1.039766e+06s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"
      # Both arms reset together -- a real fire that completed. Clear.
      - eval_time: 1h
        alertname: PaperclipRoutineFireGap
        exp_alerts: []

  # ── Back-compat: the legacy metric ALONE behaves exactly as before. ───────
  # The ordering proof. This chart copy never deploys (prometheusRule.enabled
  # is false here for the RBAC reason in its header) but the onprem-k8s copy
  # it mirrors does, and those two repos ship on different cadences. While the
  # control plane has not yet shipped the firing gauge, the regex matches ONE
  # series and the expression reduces to the pre-PEN-4647 rule -- no blind
  # window, nothing to clean up later. Asserted rather than assumed: `or`
  # would NOT have this property in the other direction, because the
  # set-operator signature ignores __name__, so `a or b` keeps a and drops b
  # when both are present.
  - interval: 1m
    name: "PEN-4647: legacy metric alone still fires, unchanged"
    input_series:
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "600000+60x30"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "259200+0x30"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: ci-pipeline-health-check
              company_id: penstock
            exp_annotations:
              summary: "Paperclip routine ci-pipeline-health-check has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine ci-pipeline-health-check last fired, or last completed a fire, 601200s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"

  # ── The completion arm is NOT redundant and must not be "simplified" away. ─
  # The opposite fault to PEN-4647: fires dispatch on cadence and then die
  # before the execution issue reaches `done`. Firing age stays LOW throughout,
  # so a rule reading firing age alone -- the literal reading of PEN-4647's
  # candidate fix #1 -- goes silent on it. That is the original BLO-32638
  # condition, and taking the max is what keeps both covered.
  - interval: 1m
    name: "PEN-4647: fires that dispatch but never complete still page"
    input_series:
      - series: 'paperclip_routine_last_fire_start_age_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "300+60x30"
      - series: 'paperclip_routine_last_done_fire_age_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "600000+60x30"
      - series: 'paperclip_routine_fire_interval_seconds{routine_id="ci-pipeline-health-check", company_id="penstock", instance="pod-a", job="paperclip-control-plane"}'
        values: "259200+0x30"
      - series: 'paperclip_routine_fire_gap_metrics_refresh_success{instance="pod-a", job="paperclip-control-plane"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: PaperclipRoutineFireGap
        exp_alerts:
          - exp_labels:
              severity: warning
              routine_id: ci-pipeline-health-check
              company_id: penstock
            exp_annotations:
              summary: "Paperclip routine ci-pipeline-health-check has not fired, or not completed a fire, in 2x its own cadence"
              description: "Routine ci-pipeline-health-check last fired, or last completed a fire, 601200s ago -- more than 2x the longest gap its own cron schedules (BLO-32638, PEN-4647). That value is the WORSE of two ages; read both before triaging.\n\nThe two are paperclip_routine_last_fire_start_age_seconds and paperclip_routine_last_done_fire_age_seconds, both keyed on this routine_id. FIRING age high (both high) means it has STOPPED DISPATCHING -- check paperclip_routine_dispatch_total and the trigger's nextRunAt. FIRING age low but COMPLETION age high means it dispatches fine and the work then dies or wedges before the execution issue reaches `done`: find the open row with originKind=routine_execution and originId equal to this routine_id and CLOSE IT, rather than re-creating the routine. The ages are only trusted while paperclip_routine_fire_gap_metrics_refresh_success is 1. The routine is still `active` with an enabled schedule trigger, so this is not a deliberate pause. A routine that has never fired reports its age from creation, so a large value on a young routine means it has never worked at all rather than that it stopped."
              runbook_url: "https://github.com/Blockcast/paperclip/blob/master/runbooks/routine-fire-gap.md"
