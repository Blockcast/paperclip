# =============================================================================
# paperclip-mcp-gateway
# =============================================================================
# Path-prefix reverse-proxy in front of the cluster's stateful HTTP MCP
# servers. Catches "Session not found" 404s, replays the cached
# `initialize` request to mint a fresh upstream session, and retries
# the original call — Claude Code's MCP client doesn't auto-retry on
# this and surfaces the failure to the user otherwise.
#
# Routes incoming requests by path prefix to upstream MCP servers. Upstream
# metadata comes from penstock state, scoped by the gateway state token's
# principal/tenant identity. Credential values do not enter penstock state:
# the state payload names env vars. This deployment sources values for house
# servers from Kubernetes Secrets; tenant_node entries are relayed through the
# existing tenant channel and never resolve credentials in this pod.
#
# Agents should target one logical MCP endpoint at /mcp. The gateway aggregates
# upstream tools, rewrites names as <prefix>__<tool>, and routes tools/call back
# to the owning upstream. If penstock state is temporarily unavailable, the
# gateway falls back to the last-known-good cache on /cache instead of dropping
# all MCP routes. Session mappings are persisted on the shared /cache PVC so
# replica restarts do not drop client sessions.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip-mcp-gateway
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip-mcp-gateway
    app.kubernetes.io/managed-by: paperclip-mcp
    app.kubernetes.io/part-of: paperclip
spec:
  # Session recovery is serialized in-process. Keep one replica until the
  # lifecycle lock and session store are coordinated across processes.
  replicas: 1
  strategy:
    # Recreate prevents old and new pods from concurrently owning the same
    # connection-scoped upstream lifecycle during a rollout.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip-mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip-mcp-gateway
        app.kubernetes.io/managed-by: paperclip-mcp
        app.kubernetes.io/part-of: paperclip
    spec:
      nodeSelector:
        workload: paperclip
      tolerations:
        - key: dedicated
          operator: Equal
          value: paperclip
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: gateway
          # Pin to a specific build. Bump after `kubectl apply -f ...` +
          # `kubectl set image` proves the new image healthy across all
          # routes. Latest verified rollout: 2026-06-10 (sha-6de713e
          # adds BLO-9659 unknown-session guard — bootstraps a fresh
          # upstream session for non-initialize calls arriving before
          # any session is established, eliminating the
          # `method invalid during initialization` race on k8s MCP).
          image: harbor.blockcast.net/paperclip-mcp-gateway/paperclip-mcp-gateway:sha-6de713e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: PAPERCLIP_MCP_UPSTREAMS_STATE_URL
              value: https://api.penstock.run/v1/mcp/upstreams
            # tenant_node targets are canonical paths beneath this authenticated
            # public relay origin; registry responses cannot provide URLs.
            - name: PAPERCLIP_MCP_TENANT_RELAY_ORIGIN
              value: https://api.penstock.run
            - name: PAPERCLIP_MCP_UPSTREAMS_CACHE_FILE
              value: /cache/upstreams-lkg.json
            - name: PAPERCLIP_MCP_UPSTREAM_CREDENTIAL_ENVS
              value: CCROTATE_SERVE_TOKEN
            - name: PAPERCLIP_MCP_SESSION_STORE_FILE
              value: /cache/sessions.json
            - name: PAPERCLIP_MCP_UPSTREAMS_STATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperclip-mcp-gateway-state
                  key: token
            - name: NODE_ENV
              value: production
          envFrom:
            # Contains only house-server credential values. Penstock state
            # stores matching env-var names (for example CCROTATE_SERVE_TOKEN),
            # never values. Tenant tool credentials must not be added here.
            - secretRef:
                name: paperclip-mcp-upstream-credentials
          volumeMounts:
            - name: cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: paperclip-mcp-gateway-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-mcp-gateway-cache
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip-mcp-gateway
    app.kubernetes.io/managed-by: paperclip-mcp
    app.kubernetes.io/part-of: paperclip
spec:
  # Target cluster default is cephfs today, but pin it so a future default
  # StorageClass drift to RWO (for example local-path/RBD) cannot strand the
  # HA rollout with an unbound RWX claim.
  storageClassName: cephfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip-mcp-gateway
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip-mcp-gateway
    app.kubernetes.io/managed-by: paperclip-mcp
    app.kubernetes.io/part-of: paperclip
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperclip-mcp-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
